# Exceptions to scripts/check_connector_parity.py's two rules, each with the
# reason the rule does not fit. `connector` and `name` each take a string or a
# list; an entry stands for every (connector, name) pair they make, and a pair
# has one entry. A function of a public module the connectors share is named
# by its path (`icons::to_image_source`). The script's docstring states the
# rules; an entry that no longer matches what it excepts is stale and fails
# the check.
#
#   kind = "name"       a one-field function the naming rule does not fit:
#                       it returns something other than the leaf's value
#   kind = "undecided"  a function the script cannot classify: it passes the
#                       theme on whole
#   kind = "absent"     the connector has no function that a sibling has
#   kind = "unlike"     the connector has a function of that name that is not
#                       the sibling's: another signature or meaning
#
# Paths without a crate are the connector's own (`src/...`), a sibling's are
# written from the repository root; upstream code is cited at the version the
# workspace builds against. "The egui spec" is
# docs/archive/todo_v0.6.0_egui-connector-spec.md, whose §4.7 *Sibling parity*
# table gives egui's counterpart of each sibling item, or the reason there is
# none.

