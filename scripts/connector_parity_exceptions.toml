# ── iced: fonts ─────────────────────────────────────────────────────────────

[[exception]]
connector = ["gpui", "egui"]
name = "font"
kind = "absent"
reason = "iced's styles carry no font, so a widget's stated font reaches the widget only as an iced `Font` the application sets (the Step 6 ruling on iced's `font`, docs/todo_code-review-findings.md:11136). gpui's `geometry` builders set each stated font's family, weight and style on the element (connectors/native-theme-gpui/src/lib.rs, *Theme Field Coverage*); egui installs one face per family in the atlas's `FontDefinitions`, and a call site takes a role's weight and slant through `role_font_weight` and `role_font_is_italic` (the egui spec §4.9)"

[[exception]]
connector = "gpui"
name = "system_font_family"
kind = "absent"
reason = "iced draws through its own font database, so the family it is given must be the one fontdb filed the face under (connectors/native-theme-iced/src/lib.rs, `system_font_family`'s doc); gpui's is `font_family(&Arc<str>)`, which turns a family into the name gpui is asked to draw"

[[exception]]
connector = "egui"
name = "system_font_family"
kind = "absent"
reason = "iced draws through its own font database, so the family it is given must be the one fontdb filed the face under (connectors/native-theme-iced/src/lib.rs, `system_font_family`'s doc); egui draws no family by name: the atlas installs the face's bytes under `FontFamily::Proportional` or `Monospace`, through `fonts::FontPlan::from_system` (the egui spec §4.9)"

[[exception]]
connector = "gpui"
name = "to_iced_weight"
kind = "absent"
reason = "iced's `Weight` is an enum of the nine standard weights, so a CSS weight is rounded into it (connectors/native-theme-iced/src/lib.rs, `to_iced_weight`'s doc); gpui's `FontWeight` takes any CSS weight as it is, `FontWeight(f32::from(weight))`, which the `geometry` builders set (src/geometry.rs, `weight_of`), and `font_weight` returns the CSS weight"

[[exception]]
connector = "egui"
name = "to_iced_weight"
kind = "absent"
reason = "egui takes a weight as a `wght` variation coordinate, not an enum: `fonts::weight_coords` (the egui spec §4.7, `to_iced_weight`; §4.9)"

[[exception]]
