# ── installing a theme, and watching the OS ─────────────────────────────────

[[exception]]
connector = ["iced", "egui"]
name = ["apply", "apply_system_theme"]
kind = "absent"
reason = "gpui-component draws every widget from one global `Theme`, which `apply` writes with the native base-layer overrides and keeps installed across upstream rebuilds (connectors/native-theme-gpui/src/lib.rs, `apply`'s doc). iced has no theme global: its application hands iced the `Theme` value `to_theme` and `from_system` return. egui installs an atlas with `ThemeAtlas::install(ctx)`, and the OS theme with `sys.to_egui_atlas().install(ctx)`, two calls (the egui spec §4.7, `apply` and `apply_system_theme`)"

[[exception]]
connector = "iced"
name = "apply_accessibility"
kind = "absent"
reason = "an iced `Theme` is a palette with no text size, so a change of the preferences changes nothing in it (src/lib.rs, *Accessibility*, and docs/archive/todo_closed.md, the item `to_theme` takes no `AccessibilityPreferences`): the application scales its own text sizes through `scaled_text_size`, which takes the preferences on each call"

[[exception]]
connector = "egui"
name = "apply_accessibility"
kind = "absent"
reason = "the atlas's role styles are immutable `Arc`s, so the preferences are a build input, not an in-place rescale: the application rebuilds with `Builder::accessibility` and installs (the egui spec §4.7, `apply_accessibility`; §3.4)"

[[exception]]
connector = ["gpui", "egui"]
name = "theme_changes"
kind = "absent"
reason = "each connector delivers the OS theme's changes in its toolkit's idiom: iced's is a `Subscription`, the application's own channel for an outside event (ruling M5-03, docs/todo_code-review-findings.md:9212); gpui's is `on_theme_change`, a channel drained by a task on gpui's foreground (the M6 ruling, :9637); egui's is `ThemeWatcher`, which rebuilds the atlas off the UI thread and wakes egui with `request_repaint` (the egui spec §10.2)"

[[exception]]
connector = ["iced", "egui"]
name = "on_theme_change"
kind = "absent"
reason = "each connector delivers the OS theme's changes in its toolkit's idiom: gpui's is a channel drained by a task on gpui's foreground, with `&mut Window` and `&mut App` (the M6 ruling, docs/todo_code-review-findings.md:9637); iced's is `theme_changes`, a `Subscription` (ruling M5-03, :9212); egui's is `ThemeWatcher`, which rebuilds the atlas off the UI thread (the egui spec §10.2)"

# ── building a theme ────────────────────────────────────────────────────────

[[exception]]
connector = "gpui"
name = "to_theme"
kind = "unlike"
reason = "gpui-component's `Theme` carries the mode and the font sizes: `to_theme` takes `is_dark` for its `mode` (the Step 6 ruling on the mode-taking builder, docs/todo_code-review-findings.md:11131, keeps it: a `ColorMode` in its place is a break outside the 2026-10-16 answers, and buys nothing while `Loaded` carries `mode`) and the preferences, since it writes `font_size`, the window rem, scaled by the text-scaling factor (src/lib.rs, *What each flag does*). iced's `Theme` is a palette with no text size, and egui's `to_theme` builds with `AccessibilityPreferences::default()`, any other input going through `ThemeAtlas::builder` (connectors/native-theme-egui/src/ext.rs, `to_theme`'s doc)"

[[exception]]
