name = "from_preset"
kind = "unlike"
reason = "it takes no `AccessibilityPreferences`: an iced `Theme` is a palette with no text size, so the preferences have nothing in it to act on (src/lib.rs, *Accessibility*; docs/archive/todo_closed.md, the item `to_theme` takes no `AccessibilityPreferences`); gpui's scales the theme's font sizes and egui's the atlas's text styles"

[[exception]]
connector = ["gpui", "egui"]
name = "to_theme_in"
kind = "absent"
reason = "the public mode-taking builder is iced's alone (the Step 6 ruling on the mode-taking builder, docs/todo_code-review-findings.md:11131): iced's `to_theme` leaves the light/dark flag to iced's lightness guess, and `to_theme_in` takes the mode instead. gpui's `to_theme` already takes the mode as `is_dark`, and egui needs nothing: its builder holds both variants and the OS mode (`Builder::os_mode`)"

[[exception]]
connector = ["iced", "egui"]
name = "is_dark_resolved"
kind = "absent"
reason = "a `< 0.5` lightness guess for a caller of gpui's `to_theme` that has no dark-mode flag to pass as `is_dark` (connectors/native-theme-gpui/src/lib.rs, `is_dark_resolved`'s doc). iced's `to_theme` needs no flag (iced makes the guess itself) and `to_theme_in` takes the mode; egui uses `sys.mode.is_dark()` (the egui spec §4.7, `is_dark_resolved`; §4.6)"

