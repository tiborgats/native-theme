kind = "absent"
reason = "gpui animates an element itself: this wraps an `Svg` in gpui's animation, spinning over `duration_ms` (connectors/native-theme-gpui/src/icons.rs, its doc). iced's application rotates an `Svg` by the angle `spin_rotation_radians` gives, and egui's an `Image` by `spin_angle`'s (the egui spec §4.7, mod `icons`; §9.4)"

[[exception]]
