name = ["icons::spin_angle", "icons::animated_frame_index"]
kind = "absent"
reason = "egui repaints on demand, so these read the `Context`'s clock and schedule the next repaint at the next frame or every frame (the egui spec §9.4; connectors/native-theme-egui/src/icons.rs, both docs). iced's application keeps the time with a subscription and indexes the frames `animated_frames_to_svg_handles` built, or rotates by `spin_rotation_radians` (connectors/native-theme-iced/src/icons.rs, their docs); gpui's spins with `with_spin_animation` and indexes the frames `animated_frames_to_image_sources` built"
