# The load budget (the 0.8.0 plan's *The load budget*; ADD-A147; the reasoning in
# docs/todo_v0.7.1_model-completeness-d6-load.md, 2.4), which scripts/check_cost_budget.py
# applies to the probe's figures (native-theme/tests/timings.rs, native-theme/tests/cost_bytes.rs).
# Changed only by a deliberate act with its ledger row: a line's number by the maintainer, a
# record or a named miss by the acts *Who makes records* lists. No run of the step writes it.
#
# Every number is a judgment, applying until the maintainer changes it (D6's veto list items 9 to
# 23). A case is `<line>.<preset>.<route>[.<what>]`, as the probe names it; it states one of:
#   record = <figure in the line's unit>, tolerance = <fraction>, row = "<ledger row>"  (armed)
#   first_measured_by = "<the named task that makes its first record>"
#   not_binding = "<reason>", row = "<ledger row that shows it>"
# A named miss, keyed by one case, its cause(s) a task or a section of the D6 load design:
#   [[misses]]
#   case = "<case>"
#   causes = ["<task or section>"]
#   row = "<ledger row>"

[step]
# Rule 2: a pass counts where the mean runnable count over it is at most this, the step's own
# threads included.
load_limit = 10
# Rule 2: the release run starts no sweep later than this many minutes after the build's end.
bound_minutes = 30
# Rule 3: a measured figure's tolerance is at least this fraction (and at most 20 %).
tolerance_floor = 0.05

[lines]
1 = { what = "Theme::from_preset, a preset's first load in the process", budget = 16, unit = "ms" }
2 = { what = "peak memory during that load, above the level before it", budget = 16, unit = "MiB" }
3 = { what = "memory kept: the theme and one window's resolution", budget = 8, unit = "MiB" }
4 = { what = "a change every application makes: a reader's re-read accepted, pick, set_flavor, set_contrast, set_accent, a bundled palette applied or removed, set_preset to a preset a live theme holds", budget = 0.5, unit = "ms" }
5 = { what = "Theme::resolve, something changed", budget = 1, unit = "ms" }
6 = { what = "Theme::resolve, nothing changed", budget = 10, unit = "us" }
7 = { what = "a styled query, computed", budget = 50, unit = "us" }
8 = { what = "a styled query, repeated in one resolution", budget = 2, unit = "us" }
9 = { what = "bytes a preset adds to a binary (256 KiB), counted exactly", budget = 262144, unit = "bytes", exact = true }
10 = { what = "Theme::from_system, the theme's own part (the read of the preset and the acceptance of the reading)", budget = 16, unit = "ms" }
11 = { what = "peak memory during Theme::resolve, above the level before it", budget = 8, unit = "MiB" }
12 = { what = "the cost of adding an application layer that states structure: reported, no line", unit = "ms" }

# Every case the probe can measure (rule 4), and the cases later tasks' probe changes bring, each
# "first measured by" its task until then (named in the printout, not asked for: the design's
# situation 13): the plain route's cases of the four presets whose [pending] table M2's task 0
# empties, and load task 4b's line 10 (`Theme::from_system`'s own part, the first reading) and
# line 4's re-reads (of an identical reading, of another accent, of the other scheme, of another
# font size), per reader over its own preset (`system`). Line 4's case of a bundled palette
# applied or removed is "first measured by" M2's fourth task, which bundles the palettes and
# decides which presets each serves; no case can be keyed by its preset before that, so its cases
# enter with that task. Lines 1 to 3 are `read` on every preset (the read alone, a lower bound);
# the synthetic route's cases and the `read` of a preset leave the file as the plan says once its
# table is empty and load task 1 has merged.
[cases]
