[package]
name = "native-theme-preset-check"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Dev-only tool that loads a preset file or a generator draft as a bundled preset loads and lists every problem by class"

[[bin]]
name = "preset-check"
path = "src/main.rs"

[dependencies]
native-theme = { workspace = true }
