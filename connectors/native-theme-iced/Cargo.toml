[package]
name = "native-theme-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["theme", "iced", "gui", "native", "colors"]
categories = ["gui", "config"]
readme = "README.md"
description = "iced toolkit connector for native-theme"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[features]
default = ["widgets", "material-icons", "lucide-icons", "system-icons", "svg-rasterize"]

# Which iced crates this connector covers. Additive, never subtractive.
widgets = ["dep:iced_widget"]            # enables `styles`
iced_aw = ["widgets", "dep:iced_aw"]     # enables `styles::aw`

material-icons = ["native-theme/material-icons"]
lucide-icons = ["native-theme/lucide-icons"]
system-icons = ["native-theme/system-icons"]
svg-rasterize = ["native-theme/svg-rasterize"]

[dependencies]
native-theme.workspace = true
iced_core = "0.14"
iced_widget = { version = "0.14", optional = true }
iced_aw = { version = "0.14", optional = true, default-features = false, features = [
    "card",
    "menu",
    "context_menu",
    "tab_bar",
    "tabs",
    "sidebar",
    "spinner",
    "selection_list",
] }

# The showcase calls `styles::*`, which `widgets` gates. `widgets` is a default
# feature, so `cargo test -p native-theme-iced` and the screenshot scripts build
# the example as before; `--no-default-features` skips it, and the `iced_aw`
# sections inside it are `#[cfg(feature = "iced_aw")]`.
[[example]]
name = "showcase-iced"
required-features = ["widgets"]

[dev-dependencies]
iced = { version = "0.14", features = [
    "svg",
    "image",
    "tokio",
    "canvas",
    "markdown",
    "qr_code",
] }
iced_aw = { version = "0.14", default-features = false, features = [
    "card",
    "menu",
    "context_menu",
    "tab_bar",
    "tabs",
    "sidebar",
    "spinner",
    "selection_list",
] }
native-theme = { workspace = true, features = [
    "material-icons",
    "lucide-icons",
    "watch",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
native-theme = { workspace = true, features = ["system-icons", "linux"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.4"
native-theme = { workspace = true, features = ["system-icons", "macos"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
native-theme = { workspace = true, features = ["system-icons", "windows"] }
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
