[leaves."defaults.muted_color"]
named = "UNREAD_COLOURS"
entry = "defaults.muted_color"
kind = "ruled"
why = "iced's secondary text, `text::secondary`, paints `extended.secondary.base.color` (`iced_core-0.14.0/src/widget/text.rs:452-456`), and the connector fills that slot from `input.placeholder_color` (`src/extended.rs:99-100`) on purpose: the slot is also `button::secondary`'s fill, and the contract counts the labels `readable()` substitutes on it (`SECONDARY_LABEL_SUBSTITUTED`). The muted colour reaches iced through the leaves that inherit it, `input.placeholder_color` among them (`docs/inheritance-rules.toml:174`, `:205`, `:206`, `:210`, `:216`). Ruling T12a C3"

