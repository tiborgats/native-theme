[package]
name = "native-theme-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
# NOT inherited: the gpui-pre closure declares a higher floor than the
# workspace. Set to the lowest toolchain that compiles the library; measured
# 2026-10-12 on the 0.7.3 closure: 1.95.0 builds; 1.94.0 fails on
# std::hint::cold_path in gpui-pre (src/profiler.rs:473, measured on 0.3.8,
# the line unchanged in 0.3.9).
rust-version = "1.95.0"
repository.workspace = true
homepage.workspace = true
keywords = ["theme", "gpui", "gui", "native", "colors"]
categories = ["gui", "config"]
readme = "README.md"
description = "gpui toolkit connector for native-theme"

[package.metadata.docs.rs]
# No `targets` list (spec §4.1, D40): every platform-gated public item of this
# crate is Linux-gated and appears on docs.rs's default target; the other two
# targets would render the same page minus those items at the cost of the
# first-ever cross-target docs build of gpui-pre's macOS and Windows platform
# crates.
# Every feature but `gpui-fast` (`all-features` would turn it on): the page
# documents the crate on its default core, gpui-pre. src/compat.rs holds the
# list to the [features] table.
features = ["widgets", "material-icons", "lucide-icons", "system-icons", "svg-rasterize", "system-fonts", "native", "watch"]

[features]
default = ["widgets", "material-icons", "lucide-icons", "system-icons", "svg-rasterize", "system-fonts"]
# `widgets`: the theme-drawn checkbox, radio, switch, slider, progress bar,
# spinner, tab bar and separator (docs/archive/todo_gpui-widgets-spec.md), for the
# parts gpui-component draws from literals of its own.
widgets = []
material-icons = ["native-theme/material-icons"]
lucide-icons = ["native-theme/lucide-icons"]
system-icons = ["native-theme/system-icons"]
svg-rasterize = ["native-theme/svg-rasterize"]
# `system-fonts`: a theme font family the system lacks is drawn in the family
# the platform substitutes for it (`native_theme::fonts::substitute_family`,
# fontconfig on Linux), not in gpui's own fallback list.
system-fonts = ["native-theme/system-fonts"]
# `gpui-fast`: build on GPUI Kit's GPUI Fast backend instead of gpui-pre.
# gpui-kit's own `gpui-fast` turns on gpui-base's; it reaches gpui-component's
# only weakly (`gpui-component?/gpui-fast`), with gpui-kit's `component`
# feature, which this crate leaves off, so it is named here.
gpui-fast = ["gpui-kit/gpui-fast", "gpui-component/gpui-fast"]
# The OS readers, off by default as in native-theme: without one,
# `from_system()` is the platform preset on Linux and an error on macOS and
# Windows. native-theme's finer `kde`, `portal`, `macos` and `windows` pick one.
native = ["native-theme/native"]
watch = ["native-theme/watch", "dep:futures"]  # enables `on_theme_change`

[dependencies]
# GPUI under the package name gpui-component uses, so both edges unify.
# gpui-component 0.7.3 depends on `gpui-pre = "=0.3.9"` (an exact pin), so
# 0.3.9 is the only version that resolves with it. gpui-component does not
# re-export gpui. The crate roots name GPUI through gpui-kit (below); this
# dependency stays for the doctests, each a crate of its own that names
# `gpui`. Caret: an exact pin in a library would conflict with any consumer
# whose other dependencies want a later snapshot.
gpui = { package = "gpui-pre", version = "0.3.9" }
# A hard floor: 0.7.1 added IconName::Mic and IconName::Square, which the
# icon tables name.
gpui-component = "0.7.3"
# For gpui_base::Theme, ScrollbarTheme, ResizableTheme and
# apply_system_reduce_motion (not re-exported), and the headless primitives
# the `widgets` feature builds on (Tabs, the slider and progress parts).
gpui-base = "0.7.3"
# The crate roots name GPUI through gpui-kit (`extern crate gpui_kit as gpui;`),
# which re-exports whichever core it is built on, so the connector follows an
# application that turns on `gpui-kit/gpui-fast`. No default features: the
# library needs neither gpui-kit's component layer nor its assets.
gpui-kit = { version = "0.7.3", default-features = false }
# `gpui::RenderImage::new` takes `image::Frame`s, so an icon can be handed to
# gpui already decoded instead of as bytes gpui decodes again in the
# background. Pinned to the version both GPUI backends resolve (gpui-pre
# 0.3.9 and gpui-fast 0.1.7/0.1.8 each ask for `image` 0.25.1 and up, which resolves
# to 0.25.10), because the connector's `image` and GPUI's have to be the same
# for the `Frame` type to match; no default features, since the connector
# encodes and decodes nothing itself.
image = { version = "0.25.10", default-features = false }
native-theme = { workspace = true }
# `on_theme_change`'s channel from the watcher's thread to the task that runs
# on gpui's foreground. Already in Cargo.lock as gpui-pre's dependency
# (`futures = "0.3.34"`); `std` holds the `mpsc` channel.
futures = { version = "0.3.34", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
# The showcase uses the facade an application would: application(), init(),
# open_window(), and the Lucide assets under gpui_kit::assets.
# tree-sitter-rust: the grammar for the showcase's code editor section.
# test-support: `#[gpui::test]` and TestAppContext through the alias.
gpui-kit = { version = "0.7.3", features = ["tree-sitter-rust", "test-support"] }
# The OS readers and the watcher, so the showcase, tests/seams.rs and every
# test build read the OS theme without the `native` feature named.
native-theme = { workspace = true, features = ["native", "watch"] }
# Field-by-field completeness check of ThemeColor via its Serialize impl,
# and the showcase's layout dump (`--dump-layout`).
serde_json = "1.0.151"
# The showcase reads docs/showcase-elements.toml, the elements the three
# showcases share. Already in Cargo.lock as native-theme's dependency.
toml = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# `png`: the showcase reads back the size of the PNG `screencapture` wrote.
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.4"

[target.'cfg(target_os = "windows")'.dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "showcase-gpui"
path = "examples/showcase-gpui/main.rs"
# The showcase's own `#[cfg(test)]` module (spec §6.1) then runs under a plain
# `cargo test`, so CI and the dependency canary pick it up unchanged.
test = true
