# The upstream functions that panic on their input, for the connector, its
# tests and its showcase (clippy reads the clippy.toml nearest the package's
# manifest). Each entry is a public function of gpui-pre, gpui-fast or
# gpui-base that panics on an argument's value; each reason cites the doc line
# that states it, or the line that panics where no doc line does. The list
# comes from a sweep of every comment line that mentions a panic in the src/
# of gpui-pre, gpui-fast, gpui-base, gpui-component, gpui-kit and the gpui-pre
# and gpui-fast sub-crates (docs/archive/todo_v0.7.0_gpui-kit-0.8.1-spec.md §5),
# redone for GPUI Kit 0.9.1 (gpui-pre 0.3.12, gpui-fast 0.1.14) together with
# the explicit panics (panic!, assert!, unreachable!, expect, unwrap) the
# upgrade added to public function bodies, and from the review of what the
# listed text functions reach. A `gpui::` path resolves in both cores' `gpui`
# crate, so one entry covers gpui-pre and GPUI Fast.
# At each GPUI Kit upgrade the sweep and the planted-function count (one
# temporary call per entry, one disallowed_methods error each, in the
# gpui-pre, GPUI Fast and no-default-features clippy runs) are redone; the
# sweep also reads the public functions' bodies for explicit panics on their
# arguments (panic!, assert!, indexing, slicing), which no doc line may state,
# as StyledText::with_runs and the text system's run slicing showed.
disallowed-methods = [
    { path = "gpui::KeyBinding::new", reason = "panics on a parse error (gpui-pre 0.3.12 src/keymap/binding.rs:32, gpui-fast 0.1.14 :32); use KeyBinding::load" },
    { path = "gpui::TextSystem::resolve_font", reason = "panics if the font and none of the fallbacks can be resolved (gpui-pre 0.3.12 src/text_system.rs:350, gpui-fast 0.1.14 :352)" },
    { path = "gpui::WindowTextSystem::shape_line", reason = "panics if the text contains newlines, a debug_assert! (gpui-pre 0.3.12 src/text_system.rs:669-671, gpui-fast 0.1.14 :666-668); through layout_line, it also panics on a run that splits a character or runs past the text, which no doc line states (gpui-pre-wgpu 0.3.12 and gpui-fast-wgpu 0.1.14 src/cosmic_text_system.rs:1074, for a run whose font has fallbacks)" },
    { path = "gpui::WindowTextSystem::shape_text", reason = "panics on a run that splits a character: the text system slices the text by the runs' lengths, which no doc line states (gpui-pre-wgpu 0.3.12 and gpui-fast-wgpu 0.1.14 src/cosmic_text_system.rs:1074, for a run whose font has fallbacks)" },
    { path = "gpui::WindowTextSystem::layout_line", reason = "panics on a run that splits a character or runs past the text: the text system slices the text by the runs' lengths, which no doc line states (gpui-pre-wgpu 0.3.12 and gpui-fast-wgpu 0.1.14 src/cosmic_text_system.rs:1074, for a run whose font has fallbacks)" },
    { path = "gpui::PlatformTextSystem::layout_line", reason = "the Linux text system's implementation panics on a run that splits a character or runs past the text, which no doc line states (the trait method at gpui-pre 0.3.12 src/platform.rs:1575, gpui-fast 0.1.14 :1593; gpui-pre-wgpu 0.3.12 and gpui-fast-wgpu 0.1.14 src/cosmic_text_system.rs:273, :1074, for a run whose font has fallbacks)" },
    { path = "gpui::StyledText::with_highlights", reason = "checks that each range starts and ends on a char boundary only with debug_assert! (gpui-pre 0.3.12 src/elements/text.rs:445-446, gpui-fast 0.1.14 :446-447); in a release build a range off a boundary becomes a run that splits a character, which shaping the text panics on (gpui-pre-wgpu 0.3.12 and gpui-fast-wgpu 0.1.14 src/cosmic_text_system.rs:1074)" },
    { path = "gpui::StyledText::with_runs", reason = "panics if a run ends inside a character or past the text, or the runs do not cover the whole text (gpui-pre 0.3.12 src/elements/text.rs:526-536, gpui-fast 0.1.14 :527-537)" },
    { path = "gpui::StyledText::with_default_highlights", reason = "hands the runs it builds from the highlights to with_runs, which panics if a run ends inside a character or past the text, or the runs do not cover the whole text (gpui-pre 0.3.12 src/elements/text.rs:418-429 and :526-536, gpui-fast 0.1.14 :419-430 and :527-537)" },
    { path = "gpui::ShapedLineCursor::take_until", reason = "panics if the boundary precedes the previous one, exceeds the line's length, or falls inside a UTF-8 character (gpui-pre 0.3.12 src/text_system/line.rs:279-280, gpui-fast 0.1.14 :281-282)" },
    { path = "gpui::Window::paint_image", reason = "panics if the frame_index is not valid (gpui-pre 0.3.12 src/window.rs:5296, gpui-fast 0.1.14 :5346)" },
    { path = "gpui::PriorityQueueSender::send", reason = "panics if priority is Priority::RealtimeAudio and a receiver still exists (gpui-pre 0.3.12 src/queue.rs:161, gpui-fast 0.1.14 :161)" },
    { path = "gpui::PriorityQueueSender::spin_send", reason = "panics if priority is Priority::RealtimeAudio and a receiver still exists (gpui-pre 0.3.12 src/queue.rs:175, gpui-fast 0.1.14 :175)" },
    { path = "gpui_base::Spring::with_damping", reason = "panics when ratio is negative or non-finite (gpui-base 0.9.1 src/motion.rs:626); use Spring::try_with_damping" },
    { path = "gpui_base::Spring::with_epsilon", reason = "panics when epsilon is zero, negative, or non-finite (gpui-base 0.9.1 src/motion.rs:670); use Spring::try_with_epsilon" },
    { path = "gpui_base::ScrollBounceMotion::with_tracking", reason = "panics when tracking is not finite or not positive (gpui-base 0.9.1 src/scroll_bounce.rs:65)" },
    { path = "gpui_base::ScrollBounceMotion::with_max_stretch", reason = "panics when max_stretch is not finite or not positive (gpui-base 0.9.1 src/scroll_bounce.rs:93)" },
    { path = "gpui_base::input::RopeExt::replace", reason = "panics if the range is not on a char boundary or is out of bounds (gpui-base 0.9.1 src/input/base/rope_ext.rs:171-174)" },
    { path = "gpui_base::input::RopeExt::char_at", reason = "panics if the offset is in the middle of a multi-byte character (gpui-base 0.9.1 src/input/base/rope_ext.rs:186)" },
]
