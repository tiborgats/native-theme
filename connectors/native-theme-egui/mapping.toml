upstream = "egui: a text colour per role (§14 item 40)"

["defaults.line_height"]
verdict = "derived"
homes = ["typography.line_height_multiplier"]
sinks   = [
  { path = "spacing.extra_text_line_spacing", when = "the theme's line box is taller than epaint's row, §6.15" },
  { path = "spacing.button_padding.y", scope = "menu", when = "a one-line label and the padding overrun the stated menu.row_height at a text scale of 1 or less, which narrows the padding (roles::fit_row_padding); a label alone taller than the stated height is drawn whole, its padding 0 and the row its height, since egui takes the stated height as the row's least (egui/src/widgets/button.rs:306-309)" },
  { path = "spacing.button_padding.y", scope = "list", when = "a one-line label and the padding overrun the stated list.row_height at a text scale of 1 or less, which narrows the padding (roles::fit_row_padding); a label alone taller than the stated height is drawn whole, its padding 0 and the row its height, since egui takes the stated height as the row's least (egui/src/widgets/button.rs:306-309)" },
  { path = "spacing.button_padding.y", scope = "expander", when = "a one-line title and the padding overrun the stated expander.header_height at a text scale of 1 or less, which narrows the padding (roles::fit_row_padding); a title alone taller than the stated height is drawn whole, its padding 0 and the header its height, since egui takes the stated height as the header's least (egui/src/containers/collapsing_header.rs:531-532)" },
]

