# connectors/native-theme-egui/mapping.toml — one row per native leaf (spec §5, §13.1).
# Key: the leaf path serde_json produces for ResolvedTheme, or `layout.<field>`.
# verdict ∈ direct | scoped | derived | unmappable (spec §2).
# sinks: one inline table per field the leaf is written into —
#   { path, scope?, variant?, surface?, when? }: `path` is the Style field chain with the
#   `Style.` prefix dropped, as style_diff emits it (`visuals.widgets.hovered.weak_bg_fill`,
#   `spacing.button_padding.x`, `text_styles[Body].size`); no scope and no surface = the base
#   style; `scope = "<Role::key()>"` = that role's cell, `variant = "selected" | "disabled"`
#   beside it for a Selected or Disabled cell (absent = normal); `surface = "<Surface::key()>"`
#   = that surface's egui::Frame, the path then spelled against Frame (`fill`, `stroke.color`,
#   `inner_margin.left`, `corner_radius`, `shadow.blur`); `when` = the condition, in words, under
#   which another input of the formula can hold the sink still.
# tested_by: in place of sinks, the §13 clause that checks a route with no Style/Frame field.
# probe: a literal T2 splices when no bundled preset pair differentiates the leaf.
# exceptions: [[preset, reason], ..] on which T10 may find the sink different.
# sub_tag + upstream: required exactly on an unmappable row.
# [unwritten]: sink path → why egui's own value stands there (T10b).

# ---- §5.1 Foundation — defaults, text_scale, layout

["defaults.font.family"]
verdict   = "derived"
tested_by = "T6(d)"

["defaults.font.size"]
verdict = "direct"
sinks   = [
  { path = "text_styles[Body].size" },
  { path = "spacing.extra_text_line_spacing", when = "the theme's line box is taller than epaint's row, §6.15" },
  { path = "visuals.widgets.noninteractive.expansion", scope = "slider", when = "Body row > 1.25 · thumb_diameter, §6.6" },
  { path = "visuals.widgets.inactive.expansion", scope = "slider", when = "Body row > 1.25 · thumb_diameter, §6.6" },
  { path = "visuals.widgets.hovered.expansion", scope = "slider", when = "Body row > 1.25 · thumb_diameter, §6.6" },
  { path = "visuals.widgets.active.expansion", scope = "slider", when = "Body row > 1.25 · thumb_diameter, §6.6" },
  { path = "visuals.widgets.open.expansion", scope = "slider", when = "Body row > 1.25 · thumb_diameter, §6.6" },
]

["defaults.font.defined_size"]
verdict  = "unmappable"
