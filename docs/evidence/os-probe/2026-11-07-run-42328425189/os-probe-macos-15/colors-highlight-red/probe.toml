[os]
platform = "macOS"
version = "15.8.2"
major = 15
minor = 8
patch = 2
operatingSystemVersionString = "Version 15.8.2 (Build 24H232)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos15"
runner_image_version = "20261104.0514.1"

[macos.environment]
effectiveAppearance = "NSAppearanceNameAqua"

[macos.environment.mainScreen]
backingScaleFactor = 1.0
frame_xywh = [0.0, 0.0, 1024.0, 768.0]

[macos.environment.accessibility]
accessibilityDisplayShouldIncreaseContrast = false
accessibilityDisplayShouldReduceTransparency = true
accessibilityDisplayShouldReduceMotion = true
accessibilityDisplayShouldDifferentiateWithoutColor = false

[macos.colors.user_defaults]
AppleHighlightColor = "1.000000 0.733333 0.721569 Red"
AppleAccentColor = "absent (objectForKey: is nil)"
AppleAquaColorVariant = "absent (objectForKey: is nil)"

[macos.colors.colors]
format = "#rrggbbaa in sRGB (colorUsingColorSpace: sRGBColorSpace), resolved inside NSAppearance performAsCurrentDrawingAppearance:; each selector checked with respondsToSelector: first"

