[os]
platform = "macOS"
version = "15.8.2"
major = 15
minor = 8
patch = 2
operatingSystemVersionString = "Version 15.8.2 (Build 24H232)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos15"
runner_image_version = "20261104.0514.1"

[macos.environment]
effectiveAppearance = "NSAppearanceNameAqua"

[macos.environment.mainScreen]
backingScaleFactor = 1.0
frame_xywh = [0.0, 0.0, 1024.0, 768.0]

[macos.environment.accessibility]
accessibilityDisplayShouldIncreaseContrast = false
accessibilityDisplayShouldReduceTransparency = true
accessibilityDisplayShouldReduceMotion = false
accessibilityDisplayShouldDifferentiateWithoutColor = false

[macos.button_pass]
mode = "motion"
mode_method = "no sheet is captured; a window of its own made key, the application active, and scripted screen recordings of its controls (motion)"
method = "activation policy set to Regular, finishLaunching and activation as in the key-window section; each sheet is a titled NSWindow (closable, miniaturizable, resizable, empty title) holding a backdrop (an NSBox, custom, no border, no title, over the whole content view, hidden for the window's own background) and a grid of controls, each given setControlSize: and the systemFontOfSize: of systemFontSizeForControlSize: and sized to fit, centred in its row on whole points; the window is made key with makeKeyAndOrderFront: and makeFirstResponder: nil, the run loop pumped until isKeyWindow, then the mode's condition is set (mode_method); per appearance the window's appearance is set and the run loop pumped 10 steps of 50 ms, then each state is set (states) and per backdrop the window displayed, the run loop pumped 10 steps (20 after a cursor move) and the window captured with screencapture -x -o -l <windowNumber> to <appearance>/[<sheet>/]<state>[-<button>][-over-<backdrop>].png (the push sheet's captures in <appearance>/, as spike M wrote them); isKeyWindow and NSApp isActive are read just before and just after each capture (key_at_capture: both reads of isKeyWindow are true); each capture over the window's background is compared with the same appearance's normal one inside each button's frame grown by 6 pt (diff_from_normal: the pixels whose bytes differ and the largest difference of one byte); the cursor is parked 100 pt right of the push sheet's frame before the normal capture and after the hovered and clicked ones"
backdrops = "every state but hovered and clicked is captured four times: over the window's own background (window: the capture's file is <state>.png, its keys beside these), and with the backdrop box filled with colorWithSRGBRed:green:blue:alpha: of the bytes 0 (over_black), 255 (over_white) and 128 (over_grey) in each channel; backdrop_raw is the capture's pixel at the middle of the content view's left margin (10 pt in, half the content's height up), as #rrggbbaa; in the key mode the normal state is captured once more with the backdrop box filled with colorWithPatternImage: of a 8 x 8 px image (one pixel a point at the runner's backing scale 1), a checkerboard of black (0) and white (255) squares 4 px on a side, the top-left square black, tiled as AppKit tiles a pattern colour (normal.over_pattern, normal-over-pattern.png); and in the key mode the normal, pressed and disabled states are also drawn offscreen, the backdrop hidden: the content view with cacheDisplayInRect:toBitmapImageRep: into 8-bit RGBA bitmaps of its bounds at 1 and 2 pixels a point (<state>.renders, <state>-render-<1x|2x>.png; content_from_top_left_xywh places the content view in the window frame's points from its top left), so the buttons are drawn over transparency at a backing scale of 2 the runner's screen lacks; what an offscreen draw leaves out of a control (a layer AppKit composites only on screen) the 1x render's comparison with the capture's layer shows"
layer_method = "layer: per pixel, from the over_black and over_white captures and their backdrop_raw bytes B, alpha a = 1 - (C_white - C_black) / (B_white - B_black) per channel, averaged over r, g, b (alpha_channel_spread_max_bytes: the largest difference of the three, times 255) and clamped to 0..1, and the premultiplied colour P = C_black - (1 - a) B_black clamped to 0..a; the layer is written as a PNG of straight (not premultiplied) colour and alpha, tagged sRGB, to <stem>-layer.png (a focused button's: its region only); check_grey and check_window composite the layer over the over_grey and window captures' backdrop_raw and compare it with those captures' opaque pixels (max_byte_delta, pixels_over_2; not_opaque_pixels, the window's rounded corners, are not compared), for the whole file and per button; per button (buttons), in the frame and the frame grown by 6 pt (region): alpha_max; body_alpha, the median alpha of the frame's middle row's pixels of alpha >= 8/255; fill_mode, the most frequent straight colour and alpha among the frame's pixels whose alpha is within 8/255 of body_alpha; bezel, the bounds of the region's pixels of alpha >= half body_alpha; fill, the straight colour and alpha at fill_point_px_xy, on the bezel's middle row two pixels inside the first pixel from its left edge whose alpha reaches 0.98 of the row's median (clear of the corner and the label; a gradient bezel's colour on that row); corner_top_left and corner_top_right, per row from the bezel's top the missing coverage (1 - alpha / the row's median alpha of its pixels of alpha >= 8/255, clamped to 0..1) summed from the bezel's edge inward to the first pixel at 0.98 coverage, up to two rows under 0.02, half the bezel's height or 40 rows, and the radius of the circle whose insets fit those rows best (least squares, 0.25 px steps; fit_rms_px says how well a circle fits); ink, the bezel's pixels of alpha >= half body_alpha whose straight colour or alpha differs from the fill's by more than 48 of 255 in a channel, their bounds and the one farthest from the fill (farthest_from_fill: the label's colour where a glyph covers a whole pixel); outside_frame, the region's pixels outside the frame with alpha >= 8/255, their bounds and the one of the largest alpha; diff_from_unfocused (focus mode), the region's pixels whose premultiplied colour or alpha differs from the unfocused layer's by more than 2 of 255, their bounds and the straight colour where the alpha grew most"
activationPolicy_regular_set = true
CGPreflightPostEventAccess = true
isFullKeyboardAccessEnabled = true
all_captures_key = true
any_capture_key = false

[macos.button_pass.states]
normal = "nothing set; on the push sheet the cursor parked outside the window"
pressed = "-[NSButton highlight:] YES on every NSButton (an NSComboButton has no highlight:), as NSButtonCell's mouse tracking does, then the run loop pumped; the cells' isHighlighted read back (cells_highlighted)"
disabled = "setEnabled: NO on every control"
disabled_pressed = "setEnabled: NO on every control and -[NSButton highlight:] YES on every NSButton, as pressed; the cells' isHighlighted read back (cells_highlighted); diff_from_disabled compares it with the disabled capture as diff_from_normal does with the normal one"
hovered = "push sheet and the three style sheets (styles_a to styles_c), key mode, over the window's background: per button the cursor warped to the button's centre (CGWarpMouseCursorPosition) and a mouse-moved CGEvent posted there at the HID tap, then the run loop pumped; the mouse events AppKit dispatched meanwhile are counted (cursor.events)"
clicked = "push sheet and the style sheets' NSComboButtons, key mode, over the window's background: per plain and default push button and per combo button at the regular size the cursor moved there as for hovered, a left mouse-down CGEvent posted at the HID tap, and from a second thread the window captured after the delay and a mouse-up posted after the capture, while the main thread's run loop runs NSButtonCell's tracking; the window's key status is read before the mouse-down and after the mouse-up"
focused = "focus mode: per button makeFirstResponder: with the button, captured over every backdrop, then makeFirstResponder: nil after the sheet's buttons"

[macos.button_pass.activation]
activateIgnoringOtherApps_isActive = false
activateIgnoringOtherApps_steps = 20
activate_available = true
activate_steps = 20
activate_isActive = false
activated_by = "none"

[macos.button_pass.motion]
method = """a titled window (empty title, content [0, 0, 520, 300] (x, y, width, height) from [200, 200] (x, y)) holding, in its content view (bottom-left origin): a regular push button (NSButton, momentaryPushIn, bezelStyle push, title "Button", system font of the regular size, sized to fit) from [20, 250] (x, y); on macOS 26 the same with bezelStyle glass from [160, 250] (x, y); two radio buttons (buttonType radio, titles "One" and "Two", state off, both with the action updateWindows at NSApp, so they form one group) from [20, 200] (x, y) and [120, 200] (x, y); an NSSearchField [20, 150, 180, 22] (x, y, width, height); three NSTextViews: editable "Ag" with the insertion point at its end [20, 90, 80, 30] (x, y, width, height), editable "abc אבג" (a left-to-right run, a space and three Hebrew letters) with the insertion point at UTF-16 index 4 (between the space and the first Hebrew letter) [140, 90, 120, 30] (x, y, width, height), and a selectable, non-editable "Ag" with the insertion point at index 1 [300, 90, 80, 30] (x, y, width, height); and a ticker (an NSBox, custom, no border) [504, 284, 8, 8] (x, y, width, height); a second titled window [860, 200, 200, 100] (x, y, width, height) for focus-deactivate. The window presented as the key mode presents (made key, the application active), the cursor parked 100 pt right of it. Per appearance (the window's appearance set, the run loop pumped 10 steps), each recording: makeFirstResponder: nil, then `screencapture -x -v -V<seconds> <appearance>/<name>.mov` (the whole main display) while a worker thread posts CGEvents (mouse moved, left mouse down, up, dragged; key down and up) at the HID event tap at its planned times and the main thread runs its actions at theirs, pumping the run loop in steps of 5 ms between; a repeating NSTimer in the run loop's common modes (so it fires inside AppKit's mouse tracking too) flips the ticker black and white every 5 ms and, where the recording names a view, reads its alphaValue and the presentation layers of its layer tree (3 levels, at most 16 layers: path, class, opacity, bounds size, affine transform, the 3D transform's m33, m34 and m43; the model layer where none is presented), keeping each reading that differs from the one before as a sample, its time counted from starting screencapture; <name>.crop holds ffmpeg's crop=w:h:x:y in pixels for the subject's screen frame grown by 12 pt. After each recording the search field is emptied, the caret text view's text and insertion point restored, both radios set off and the window made key again. The recordings: press-push and press-glass (move in at 2 s; a press held 1 s from 3 s; clicks released 80, 150 and 250 ms after their mouse-down at 5, 6 and 7 s; move away at 8 s, in again at 8.5 s, a press 100 ms later held 600 ms; away at 10 s; 12 s; the button sampled); radio (clicks of 100 ms on One at 3 s, Two at 5 s, One at 7 s; 9 s; One sampled); search-cancel (the field made first responder at 2.5 s, a and s typed at 3 and 3.2 s, Escape at 5 s, d at 6.5 s, the program empties it at 8 s; 10 s); focus-interrupt (the push button made first responder at 3, 4.5 and 6 s and resigned 70, 120 and 170 ms later; made first responder at 7.5 s, the window's appearance set to the other one at 7.6 s and back at 9 s, resigned at 10 s; 12 s; the button sampled); focus-deactivate (the push button first responder at 3 s, the second window made key at 3.1 s, this window key again at 5 s, the second ordered out at 5.1 s, resigned at 7 s; 9 s); caret-long (the editable text view first responder at 2 s, a, s, d typed from 30 s 150 ms apart, resigned at 38 s; 40 s); caret-mixed and caret-read-only (first responder at 2 s, resigned at 7 s; 8 s). Each key is typed as a key-down and a key-up 40 ms later (virtual key codes 0, 1, 2 and 53 of HIToolbox's Events.h); each click as a mouse-down and a mouse-up at the view's centre"""
glass = "not probed: NSBezelStyleGlass needs macOS 26"
makeFirstResponder_nil = true
key_wait_steps = 1
isKeyWindow_presented = true
isKeyWindow = true
isMainWindow = true
NSApp_isActive = true
mainScreen_backingScaleFactor = 1.0
window_frame_xywh = [200.0, 200.0, 520.0, 328.0]

