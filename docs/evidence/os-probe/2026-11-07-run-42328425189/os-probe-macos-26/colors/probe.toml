[macos.colors.color_space]
method = "a titled window (empty title, content [0, 0, 520, 140] (x, y, width, height) from [200, 300] (x, y)): its content view's top half an NSBox filled sRGB black, its bottom half one filled sRGB white (custom, no border), and over both an NSView hosting a CALayer (setLayer: then setWantsLayer:); per column, in the hosting layer, one 20 pt square layer over black (y 95) and one over white (y 25), the columns 30 pt apart from x 20: each square a CALayer whose backgroundColor is the case's to colour, its speed 0 and timeOffset the fraction times 1 s, holding a CABasicAnimation of backgroundColor from the case's from colour to its to colour (CGColorCreateSRGB), duration 1 s, the linear timing function, beginTime 1e-6 s (in the layer's local time, which a speed of 0 holds at the time offset), fillMode both, not removed on completion: the layer shows the animation paused at the fraction (less a microsecond); the cases at the fractions [0.0, 0.5, 1.0], then the references, static squares (their from and to the same colour); the window made key, the application activated, and per appearance (the window's appearance set, display, the run loop pumped 10 steps) captured with screencapture -x -o -l to color_space/<appearance>.png; squares_from_window_top_left gives each square's rect in the capture's points from the window frame's top left (the title bar included)"
squares_from_window_top_left = ["red_to_blue at 0 over_black: from #ff0000ff to #0000ffff, x 20 y 57 w 20 h 20", "red_to_blue at 0 over_white: from #ff0000ff to #0000ffff, x 20 y 127 w 20 h 20", "red_to_blue at 0.5 over_black: from #ff0000ff to #0000ffff, x 50 y 57 w 20 h 20", "red_to_blue at 0.5 over_white: from #ff0000ff to #0000ffff, x 50 y 127 w 20 h 20", "red_to_blue at 1 over_black: from #ff0000ff to #0000ffff, x 80 y 57 w 20 h 20", "red_to_blue at 1 over_white: from #ff0000ff to #0000ffff, x 80 y 127 w 20 h 20", "red_to_blue_alpha_0.2 at 0 over_black: from #ff0000ff to #0000ff33, x 110 y 57 w 20 h 20", "red_to_blue_alpha_0.2 at 0 over_white: from #ff0000ff to #0000ff33, x 110 y 127 w 20 h 20", "red_to_blue_alpha_0.2 at 0.5 over_black: from #ff0000ff to #0000ff33, x 140 y 57 w 20 h 20", "red_to_blue_alpha_0.2 at 0.5 over_white: from #ff0000ff to #0000ff33, x 140 y 127 w 20 h 20", "red_to_blue_alpha_0.2 at 1 over_black: from #ff0000ff to #0000ff33, x 170 y 57 w 20 h 20", "red_to_blue_alpha_0.2 at 1 over_white: from #ff0000ff to #0000ff33, x 170 y 127 w 20 h 20", "clear_to_green at 0 over_black: from #00000000 to #00ff00ff, x 200 y 57 w 20 h 20", "clear_to_green at 0 over_white: from #00000000 to #00ff00ff, x 200 y 127 w 20 h 20", "clear_to_green at 0.5 over_black: from #00000000 to #00ff00ff, x 230 y 57 w 20 h 20", "clear_to_green at 0.5 over_white: from #00000000 to #00ff00ff, x 230 y 127 w 20 h 20", "clear_to_green at 1 over_black: from #00000000 to #00ff00ff, x 260 y 57 w 20 h 20", "clear_to_green at 1 over_white: from #00000000 to #00ff00ff, x 260 y 127 w 20 h 20", "red_to_clear at 0 over_black: from #ff0000ff to #00000000, x 290 y 57 w 20 h 20", "red_to_clear at 0 over_white: from #ff0000ff to #00000000, x 290 y 127 w 20 h 20", "red_to_clear at 0.5 over_black: from #ff0000ff to #00000000, x 320 y 57 w 20 h 20", "red_to_clear at 0.5 over_white: from #ff0000ff to #00000000, x 320 y 127 w 20 h 20", "red_to_clear at 1 over_black: from #ff0000ff to #00000000, x 350 y 57 w 20 h 20", "red_to_clear at 1 over_white: from #ff0000ff to #00000000, x 350 y 127 w 20 h 20", "reference purple_0.5_opaque over_black: from #800080ff to #800080ff, x 380 y 57 w 20 h 20", "reference purple_0.5_opaque over_white: from #800080ff to #800080ff, x 380 y 127 w 20 h 20", "reference grey_0.5_opaque over_black: from #808080ff to #808080ff, x 410 y 57 w 20 h 20", "reference grey_0.5_opaque over_white: from #808080ff to #808080ff, x 410 y 127 w 20 h 20", "reference red_alpha_0.5 over_black: from #ff000080 to #ff000080, x 440 y 57 w 20 h 20", "reference red_alpha_0.5 over_white: from #ff000080 to #ff000080, x 440 y 127 w 20 h 20", "reference purple_0.5_alpha_0.6 over_black: from #80008099 to #80008099, x 470 y 57 w 20 h 20", "reference purple_0.5_alpha_0.6 over_white: from #80008099 to #80008099, x 470 y 127 w 20 h 20"]
key_wait_steps = 100
window_frame_xywh = [200.0, 300.0, 520.0, 172.0]

