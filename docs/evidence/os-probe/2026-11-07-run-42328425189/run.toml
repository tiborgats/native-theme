# The image folders of run 42328425189 the facts cite (spec S17 *`evidence`*). Each pass ran as a job of its own, so
# the macOS 26 passes ran on two runner image versions: each folder's probe.toml `[os]` and `[probe]`
# (runner_image_version) names its own. This run ran no key-mode button pass, so it holds no environment.txt: the
# same runner image versions built the probe with Xcode 26.6 (17F113) against the macOS 26.5 SDK (25F70) on macos26
# 20261102.0473.1 (run 42272240639's run.toml) and with Xcode 26.6 (17F113) on macos26 20261026.0455.2 (run
# 41651803413's), and with Xcode 16.4 (16F6) against the macOS 15.5 SDK (24F74) on macos15 20261104.0514.1 (run
# 42272240639's).

[images.os-probe-macos-26]
preset = "macos-tahoe"
source = "xcode@26.6"
os = "macOS 26.7.2 (25G332), runner image macos26 20261102.0473.1: colors/, button-pass-motion-reduce-motion-off/; macOS 26.6.2 (25G83), runner image macos26 20261026.0455.2: colors-highlight-red/, button-pass-events/, button-pass-motion/"
toolkit = "AppKit of the folder's macOS; the probe built with the image's selected Xcode, 26.6 (17F113) on both runner image versions"

[images.os-probe-macos-15]
preset = "macos-monterey"
source = "xcode@16.4"
os = "macOS 15.8.2 (24H232), runner image macos15 20261104.0514.1"
toolkit = "AppKit of macOS 15.8.2; the probe built with Xcode 16.4 (16F6) against the macOS 15.5 SDK (24F74)"
