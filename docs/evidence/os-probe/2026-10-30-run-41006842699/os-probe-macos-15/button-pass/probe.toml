[os]
platform = "macOS"
version = "15.7.9"
major = 15
minor = 7
patch = 9
operatingSystemVersionString = "Version 15.7.9 (Build 24G830)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos15"
runner_image_version = "20260907.0337.1"

[macos.environment]
effectiveAppearance = "NSAppearanceNameAqua"

[macos.environment.mainScreen]
backingScaleFactor = 1.0
frame_xywh = [0.0, 0.0, 1024.0, 768.0]

[macos.environment.accessibility]
accessibilityDisplayShouldIncreaseContrast = false
accessibilityDisplayShouldReduceTransparency = true
accessibilityDisplayShouldReduceMotion = true
accessibilityDisplayShouldDifferentiateWithoutColor = false

[macos.button_pass]
mode = "key"
mode_method = "each sheet's window made key and main, the application active; the states normal, pressed and disabled over every backdrop, on the push sheet also hovered and clicked over the window's background; then the toolbar and the caret windows and the windowless geometry"
method = "activation policy set to Regular, finishLaunching and activation as in the key-window section; each sheet is a titled NSWindow (closable, miniaturizable, resizable, empty title) holding a backdrop (an NSBox, custom, no border, no title, over the whole content view, hidden for the window's own background) and a grid of controls, each given setControlSize: and the systemFontOfSize: of systemFontSizeForControlSize: and sized to fit, centred in its row on whole points; the window is made key with makeKeyAndOrderFront: and makeFirstResponder: nil, the run loop pumped until isKeyWindow, then the mode's condition is set (mode_method); per appearance the window's appearance is set and the run loop pumped 10 steps of 50 ms, then each state is set (states) and per backdrop the window displayed, the run loop pumped 10 steps (20 after a cursor move) and the window captured with screencapture -x -o -l <windowNumber> to <appearance>/[<sheet>/]<state>[-<button>][-over-<backdrop>].png (the push sheet's captures in <appearance>/, as spike M wrote them); isKeyWindow and NSApp isActive are read just before and just after each capture (key_at_capture: both reads of isKeyWindow are true); each capture over the window's background is compared with the same appearance's normal one inside each button's frame grown by 6 pt (diff_from_normal: the pixels whose bytes differ and the largest difference of one byte); the cursor is parked 100 pt right of the push sheet's frame before the normal capture and after the hovered and clicked ones"
backdrops = "every state but hovered and clicked is captured four times: over the window's own background (window: the capture's file is <state>.png, its keys beside these), and with the backdrop box filled with colorWithSRGBRed:green:blue:alpha: of the bytes 0 (over_black), 255 (over_white) and 128 (over_grey) in each channel; backdrop_raw is the capture's pixel at the middle of the content view's left margin (10 pt in, half the content's height up), as #rrggbbaa"
layer_method = "layer: per pixel, from the over_black and over_white captures and their backdrop_raw bytes B, alpha a = 1 - (C_white - C_black) / (B_white - B_black) per channel, averaged over r, g, b (alpha_channel_spread_max_bytes: the largest difference of the three, times 255) and clamped to 0..1, and the premultiplied colour P = C_black - (1 - a) B_black clamped to 0..a; the layer is written as a PNG of straight (not premultiplied) colour and alpha, tagged sRGB, to <stem>-layer.png (a focused button's: its region only); check_grey and check_window composite the layer over the over_grey and window captures' backdrop_raw and compare it with those captures' opaque pixels (max_byte_delta, pixels_over_2; not_opaque_pixels, the window's rounded corners, are not compared), for the whole file and per button; per button (buttons), in the frame and the frame grown by 6 pt (region): alpha_max; body_alpha, the median alpha of the frame's middle row's pixels of alpha >= 8/255; fill_mode, the most frequent straight colour and alpha among the frame's pixels whose alpha is within 8/255 of body_alpha; bezel, the bounds of the region's pixels of alpha >= half body_alpha; fill, the straight colour and alpha at fill_point_px_xy, on the bezel's middle row two pixels inside the first pixel from its left edge whose alpha reaches 0.98 of the row's median (clear of the corner and the label; a gradient bezel's colour on that row); corner_top_left and corner_top_right, per row from the bezel's top the missing coverage (1 - alpha / the row's median alpha of its pixels of alpha >= 8/255, clamped to 0..1) summed from the bezel's edge inward to the first pixel at 0.98 coverage, up to two rows under 0.02, half the bezel's height or 40 rows, and the radius of the circle whose insets fit those rows best (least squares, 0.25 px steps; fit_rms_px says how well a circle fits); ink, the bezel's pixels of alpha >= half body_alpha whose straight colour or alpha differs from the fill's by more than 48 of 255 in a channel, their bounds and the one farthest from the fill (farthest_from_fill: the label's colour where a glyph covers a whole pixel); outside_frame, the region's pixels outside the frame with alpha >= 8/255, their bounds and the one of the largest alpha; diff_from_unfocused (focus mode), the region's pixels whose premultiplied colour or alpha differs from the unfocused layer's by more than 2 of 255, their bounds and the straight colour where the alpha grew most"
activationPolicy_regular_set = true
CGPreflightPostEventAccess = true
isFullKeyboardAccessEnabled = false
all_captures_key = true
any_capture_key = true

[macos.button_pass.states]
normal = "nothing set; on the push sheet the cursor parked outside the window"
pressed = "-[NSButton highlight:] YES on every NSButton (an NSComboButton has no highlight:), as NSButtonCell's mouse tracking does, then the run loop pumped; the cells' isHighlighted read back (cells_highlighted)"
disabled = "setEnabled: NO on every control"
hovered = "push sheet, key mode, over the window's background: per button the cursor warped to the button's centre (CGWarpMouseCursorPosition) and a mouse-moved CGEvent posted there at the HID tap, then the run loop pumped; the mouse events AppKit dispatched meanwhile are counted (cursor.events)"
clicked = "push sheet, key mode, over the window's background: per plain and default button at the regular size the cursor moved there as for hovered, a left mouse-down CGEvent posted at the HID tap, and from a second thread the window captured after the delay and a mouse-up posted after the capture, while the main thread's run loop runs NSButtonCell's tracking; the window's key status is read before the mouse-down and after the mouse-up"
focused = "focus mode: per button makeFirstResponder: with the button, captured over every backdrop, then makeFirstResponder: nil after the sheet's buttons"

[macos.button_pass.activation]
activateIgnoringOtherApps_isActive = false
activateIgnoringOtherApps_steps = 20
activate_available = true
activate_steps = 20
activate_isActive = false
activated_by = "none"

[macos.button_pass.sheets.push]
extraLarge = "unavailable: extraLarge needs macOS 26"
layout = 'content 600 x 320 pt from [200, 200] (x, y); a row per control size (mini, small, regular, large, extraLarge) from the top, 56 pt apart, a column per variant (plain, default, toggle_off, toggle_on) every 140 pt from x 20; every NSButton bezelStyle push, title "Button"'
makeFirstResponder_nil = true
key_wait_steps = 1
isKeyWindow_presented = true
isKeyWindow = true
isMainWindow = true
NSApp_isActive = true
window_backingScaleFactor = 1.0
window_frame_xywh = [200.0, 200.0, 600.0, 348.0]
defaultButtonCell = "mini-default"
backdrop_point_xy = [10.0, 188.0]

