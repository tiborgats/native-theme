makeFirstResponder_nil = true
key_wait_steps = 1
isKeyWindow_presented = true
isKeyWindow = true
isMainWindow = true
NSApp_isActive = true
window_backingScaleFactor = 1.0
window_frame_xywh = [200.0, 200.0, 600.0, 352.0]
