[os]
platform = "macOS"
version = "26.6.2"
major = 26
minor = 6
patch = 2
operatingSystemVersionString = "Version 26.6.2 (Build 25G83)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos26"
runner_image_version = "20261021.0445.8"

[macos.fonts]
descriptor_method = "per font: symbolicTraits, the fontDescriptor's symbolic traits as an integer, symbolicTraits_set the NSFontDescriptor.h trait names whose bits it has, symbolicTraits_class its ClassMask bits shifted down by 28; traits, the fontDescriptor's NSFontTraitsAttribute dictionary whole, and NSFontSlantTrait and NSFontWidthTrait from it; italicAngle; fontAttributes, the fontDescriptor's fontAttributes whole, and NSFontVariationAttribute and NSFontFeatureSettingsAttribute from it; the font as a CTFont (toll-free bridged): CTFontCopyVariation, CTFontCopyVariationAxes, CTFontCopyFeatureSettings, CTFontCopyAttribute of kCTFontOpticalSizeAttribute and of kCTFontCSSWeightAttribute (the key looked up by name in the com.apple.CoreText bundle with CFBundleGetDataPointerForName, as the SDK does not declare it); at_second_size, fontWithDescriptor:size: of the fontDescriptor at twice the font's pointSize, its pointSize and CTFontCopyVariation; a dictionary is a table keyed by its keys' text (a number's stringValue), an NSNumber its doubleValue, an array an array; a value a method returns nil or a dictionary lacks is `unavailable`"

[macos.fonts.sizes]
systemFontSize = 13.0
smallSystemFontSize = 11.0
labelFontSize = 10.0

[macos.fonts.sizes.systemFontSizeForControlSize]
mini = 9.0
small = 11.0
regular = 13.0
large = 13.0

[macos.fonts.named]
arguments = "size 0.0 (the default size); the monospaced fonts at systemFontSize and NSFontWeightRegular; systemFontOfSize_smallSystemFontSize at smallSystemFontSize"

