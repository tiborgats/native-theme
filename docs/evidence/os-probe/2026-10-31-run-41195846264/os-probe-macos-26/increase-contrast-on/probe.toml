method = """activation policy set to Regular, finishLaunching, activateIgnoringOtherApps: YES, then -activate where the OS has it, each followed by a pump until NSApp isActive (up to 20 steps); a titled, closable, miniaturizable, resizable NSWindow (600 x 400 pt content, empty title) made key with makeKeyAndOrderFront: and makeFirstResponder: nil; the run loop pumped with nextEventMatchingMask:untilDate:inMode:dequeue: and sendEvent: in 50 ms steps, up to 100 steps until isKeyWindow, activateIgnoringOtherApps: YES again at each step NSApp is not active; content: an NSVisualEffectView, material sidebar, blending behindWindow, state active, at [0, 0, 180, 400] (x, y, width, height); an NSScrollView with an NSTableView of one 120 pt column titled "Column" and its header, at [200, 160, 380, 220] (x, y, width, height); an NSSegmentedControl of two 100 pt segments "One" "Two", segment 0 selected, sized to fit at [200, 60] (x, y); a calibration strip of 24 x 20 pt NSBox patches (custom, no border, no title) from [200, 20] (x, y) every 30 pt, filled with colorWithSRGBRed:green:blue:alpha: of the srgb_ patches' bytes and with the dynamic system colours; per appearance the window's appearance is set, the run loop pumped 10 steps, and the window captured with screencapture -x -o -l <windowNumber>; each sample is the capture's pixel at a point given in points from the window frame's top left (sample_points_xy): raw, the PNG's own bytes from bitmapData as #rrggbbaa (alpha ff where the rep has none), and colorAtXY_sRGB, colorAtX:y: converted with colorUsingColorSpace: sRGB"""
