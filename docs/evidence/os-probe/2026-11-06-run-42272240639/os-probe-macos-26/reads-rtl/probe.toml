[macos.reads.focus_view]
method = "a titled window (empty title, content [0, 0, 240, 120] (x, y, width, height) from [200, 300] (x, y)) holding at [40, 40, 120, 40] (x, y, width, height) an NSView subclass (NativeThemeOsProbeFocusView) that accepts first responder and whose drawFocusRingMask fills its bounds (NSBezierPath fillRect:) and focusRingMaskBounds is its bounds, focusRingType as made; made key with makeKeyAndOrderFront: and the run loop pumped until isKeyWindow (up to 100 steps); per appearance (the window's appearance set) the window captured with screencapture -x -o -l after makeFirstResponder: nil (unfocused) and with the view (focused), then noteFocusRingMaskChanged and setKeyboardFocusRingNeedsDisplayInRect: of its bounds, display, each after 10 steps, to focus_view/<appearance>-<unfocused|focused>.png; view_frame_from_top_left_xywh in the window frame's points from its top left"
isFullKeyboardAccessEnabled = false
focusRingType_raw = 0
key_wait_steps = 2
window_frame_xywh = [200.0, 300.0, 240.0, 152.0]
view_frame_from_top_left_xywh = [40.0, 72.0, 120.0, 40.0]

[macos.reads.focus_view.aqua.unfocused]
makeFirstResponder = true
isKeyWindow = true
firstResponder_is_view = false
capture = "focus_view/aqua-unfocused.png"

[macos.reads.focus_view.aqua.focused]
makeFirstResponder = true
isKeyWindow = true
firstResponder_is_view = true
capture = "focus_view/aqua-focused.png"

[macos.reads.focus_view.darkAqua.unfocused]
makeFirstResponder = true
isKeyWindow = true
firstResponder_is_view = false
capture = "focus_view/darkAqua-unfocused.png"

[macos.reads.focus_view.darkAqua.focused]
makeFirstResponder = true
isKeyWindow = true
firstResponder_is_view = true
capture = "focus_view/darkAqua-focused.png"

[macos.reads.text_rendering]
method = 'defaults: -[NSUserDefaults standardUserDefaults] objectForKey: of each key (absent: nil); renders: an NSTextField labelWithString: "Ag Hamburgefonstiv" in systemFontOfSize: 13, drawsBackground YES, backgroundColor white (sRGB 1, 1, 1), textColor black, sized to fit, in an offscreen borderless window under the aqua appearance, rendered with cacheDisplayInRect:toBitmapImageRep: at 1 and 2 pixels a point to text_rendering/text-<scale>.png; per render the pixels that are not white (ink_pixels), those whose largest and smallest of r, g, b differ by more than 2 (colored_pixels: subpixel antialiasing draws them, greyscale does not) and the distinct grey levels among the rest (grey_levels)'

[macos.reads.text_rendering.defaults]
AppleFontSmoothing = "absent"
CGFontRenderingFontSmoothingDisabled = "absent"
AppleAntiAliasingThreshold = 4.0

[macos.reads.text_rendering.renders.1x]
file = "text_rendering/text-1x.png"
ink_pixels = 703
colored_pixels = 0
grey_levels = 218

[macos.reads.text_rendering.renders.2x]
file = "text_rendering/text-2x.png"
ink_pixels = 2242
colored_pixels = 0
grey_levels = 250

