alignmentRect_xywh = [0.0, 5.0, 19.0, 9.0]
symbolConfiguration_description = "<NSImageSymbolConfiguration: 0xb05121180> pointSize: 0.00, weight: (default(=Regular)), scale: (default(=Medium)), rendering style: Automatic, colors: (null), prefers multicolor: NO, variable value mode: Automatic, color rendering mode: Automatic"
accessibilityDescription = "NativeThemeOsProbeSymbol"

