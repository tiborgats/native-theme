[os]
platform = "macOS"
version = "15.8.2"
major = 15
minor = 8
patch = 2
operatingSystemVersionString = "Version 15.8.2 (Build 24H232)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos15"
runner_image_version = "20261104.0514.1"

[macos.environment]
effectiveAppearance = "NSAppearanceNameAqua"

[macos.environment.mainScreen]
backingScaleFactor = 1.0
frame_xywh = [0.0, 0.0, 1024.0, 768.0]

[macos.environment.accessibility]
accessibilityDisplayShouldIncreaseContrast = false
accessibilityDisplayShouldReduceTransparency = true
accessibilityDisplayShouldReduceMotion = true
accessibilityDisplayShouldDifferentiateWithoutColor = false

[macos.symbols]
method = """symbol images from imageWithSystemSymbolName:accessibilityDescription: ("star" for the size, weight and scale; "cloud.sun.rain.fill" for the rendering mode), accessibility description "NativeThemeOsProbeSymbol"; reference_grid: per point size (6 pt in steps of 0.5, 69 sizes), NSFontWeight (the nine constants) and NSImageSymbolScale (small, medium, large), an NSImageView (imageScaling NSImageScaleNone) showing "star" with setSymbolConfiguration: configurationWithPointSize:weight:scale:, sized to frameForAlignmentRect: of its intrinsicContentSize (the image's full rect: the intrinsic size is its alignment rect's) rounded up plus 4 pt each side, in an offscreen borderless window under the aqua appearance, rendered with cacheDisplayInRect:toBitmapImageRep: into 8-bit RGBA bitmaps at 1 and 2 pixels a point; each place: the view AppKit draws the symbol in, rendered the same way with the symbol and again with a blank template NSImage of the symbol's size in its place (the view's frame kept), the glyph's coverage per pixel the largest change of a premultiplied channel or alpha between the two (alone the render's alpha where the two renders differ in size), cropped to the pixels above 0.005882353 and scaled to a largest value of 1; glyph: bbox_px_xywh (in the render, top-left origin), max_coverage (unscaled, 0..1) and ink (the scaled coverage's sum); best: the 6 references closest to the glyph at the same render scale among those whose glyph is within 2 px of its width and height, each [score, point_size, weight, scale], score = sum |g - r| / sum (g + r) over the two masks aligned at their top-left corners and shifted up to 1 px either way, the smallest over the shifts (0: the same pixels); colors: the 8 commonest colours of the render with the symbol among its pixels whose alpha is not 0, un-premultiplied, as [#rrggbbaa, pixels], and opaque_colors, how many distinct colours its pixels of alpha 255 have; places in the offscreen window are read per appearance (window appearance set, inside performAsCurrentDrawingAppearance:), the toolbar, status item and alert under the system's"""
activationPolicy_regular_set = true
offscreen_window_backingScaleFactor = 1.0

