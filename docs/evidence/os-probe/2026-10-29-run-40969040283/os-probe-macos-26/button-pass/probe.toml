[os]
platform = "macOS"
version = "26.6.2"
major = 26
minor = 6
patch = 2
operatingSystemVersionString = "Version 26.6.2 (Build 25G83)"

[probe]
tool = "native-theme-os-probe"
arch = "aarch64"
runner_image = "macos26"
runner_image_version = "20261013.0424.1"

[macos.environment]
effectiveAppearance = "NSAppearanceNameAqua"

[macos.environment.mainScreen]
backingScaleFactor = 1.0
frame_xywh = [0.0, 0.0, 1024.0, 768.0]

[macos.environment.accessibility]
accessibilityDisplayShouldIncreaseContrast = false
accessibilityDisplayShouldReduceTransparency = true
accessibilityDisplayShouldReduceMotion = true
accessibilityDisplayShouldDifferentiateWithoutColor = false

[macos.button_pass]
method = """activation policy set to Regular, finishLaunching and activation as in the key-window section; a titled NSWindow (600 x 320 pt content from [200, 200] (x, y), empty title) holding a grid of NSButtons, bezelStyle push, title "Button", each given setControlSize: and the systemFontOfSize: of systemFontSizeForControlSize: and sized to fit: a row per control size (mini, small, regular, large, extraLarge where the OS has it) from the top, 56 pt apart, each button centred in its row on whole points, and a column per variant (plain, default, toggle_off, toggle_on) every 140 pt from x 20; made key with makeKeyAndOrderFront: and makeFirstResponder: nil, the run loop pumped until isKeyWindow; per appearance the window's appearance is set and the run loop pumped 10 steps of 50 ms, then each state is set (states), the window displayed and the run loop pumped 10 steps (20 after a cursor move), and the window captured with screencapture -x -o -l <windowNumber> to <appearance>/<state>[-<button>].png; isKeyWindow and NSApp isActive are read just before and just after each capture (key_at_capture: both reads of isKeyWindow are true); each capture is compared with the same appearance's normal capture inside each button's frame grown by 6 pt (diff_from_normal: the pixels whose bytes differ and the largest difference of one byte); the cursor is parked 100 pt right of the window's frame before the normal capture and after the hovered and clicked ones"""
activationPolicy_regular_set = true
CGPreflightPostEventAccess = true
makeFirstResponder_nil = true
isKeyWindow = true
isMainWindow = true
NSApp_isActive = true
key_wait_steps = 1
window_backingScaleFactor = 1.0
window_frame_xywh = [200.0, 200.0, 600.0, 352.0]
defaultButtonCell = "mini-default"
cursor_away_screen_xy = [900.0, 376.0]
all_captures_key = true

[macos.button_pass.states]
normal = "nothing set; the cursor parked outside the window"
pressed = "-[NSButton highlight:] YES on every button, as NSButtonCell's mouse tracking does, then the run loop pumped; the cells' isHighlighted read back (cells_highlighted)"
disabled = "setEnabled: NO on every button"
hovered = "per button: the cursor warped to the button's centre (CGWarpMouseCursorPosition) and a mouse-moved CGEvent posted there at the HID tap, then the run loop pumped; the mouse events AppKit dispatched meanwhile are counted (cursor.events)"
clicked = "per plain and default button at the regular size: the cursor moved there as for hovered, a left mouse-down CGEvent posted at the HID tap, and from a second thread the window captured after the delay and a mouse-up posted after the capture, while the main thread's run loop runs NSButtonCell's tracking; the window's key status is read before the mouse-down and after the mouse-up"

[macos.button_pass.activation]
activateIgnoringOtherApps_isActive = false
activateIgnoringOtherApps_steps = 20
activate_available = true
activate_steps = 20
activate_isActive = false
activated_by = "none"

