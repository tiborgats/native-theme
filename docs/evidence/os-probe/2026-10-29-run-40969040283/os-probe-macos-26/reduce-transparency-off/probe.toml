[macos.controls]
method = "each control alone in an offscreen borderless NSWindow (buffered, never ordered front) whose appearance is set per run; NSControls get setControlSize: and the systemFontOfSize: of systemFontSizeForControlSize:; measured before and after sizeToFit; controls that stretch are widened to 160 pt after sizeToFit when narrower; cell rects are for the control's bounds after that"
keys = "_wh = [width, height]; _xywh = [x, y, width, height]; _tlbr = [top, left, bottom, right]; all in points"
method_disabled = "at the regular size the push button, checkbox, radio, switch and slider are also rendered disabled (setEnabled: NO), each at its enabled render's size: render_disabled (<kind>-regular-disabled, or -disabled-off for a control with a state) and render_disabled_on (-disabled-on)"
