[macos.key_window]
method = """activation policy set to Regular, finishLaunching, activateIgnoringOtherApps: YES, then -activate where the OS has it, each followed by a pump until NSApp isActive (up to 20 steps); a titled, closable, miniaturizable, resizable NSWindow (600 x 400 pt content, empty title) made key with makeKeyAndOrderFront: and makeFirstResponder: nil; the run loop pumped with nextEventMatchingMask:untilDate:inMode:dequeue: and sendEvent: in 50 ms steps, up to 100 steps until isKeyWindow, activateIgnoringOtherApps: YES again at each step NSApp is not active; content: an NSVisualEffectView, material sidebar, blending behindWindow, state active, at [0, 0, 180, 400] (x, y, width, height); an NSScrollView with an NSTableView of one 120 pt column titled "Column" and its header, at [200, 160, 380, 220] (x, y, width, height); an NSSegmentedControl of two 100 pt segments "One" "Two", segment 0 selected, sized to fit at [200, 60] (x, y); a calibration strip of 24 x 20 pt NSBox patches (custom, no border, no title) from [200, 20] (x, y) every 30 pt, filled with colorWithSRGBRed:green:blue:alpha: of the srgb_ patches' bytes and with the dynamic system colours; per appearance the window's appearance is set, the run loop pumped 10 steps, and the window captured with screencapture -x -o -l <windowNumber>; each sample is the capture's pixel at a point given in points from the window frame's top left (sample_points_xy): raw, the PNG's own bytes from bitmapData as #rrggbbaa (alpha ff where the rep has none), and colorAtXY_sRGB, colorAtX:y: converted with colorUsingColorSpace: sRGB"""
activationPolicy_regular_set = true
makeFirstResponder_nil = true
isKeyWindow = true
isMainWindow = true
NSApp_isActive = true
key_wait_steps = 1
key_wait_reactivations = 1
accessibilityDisplayShouldReduceTransparency = false
sidebar_state = "active"
window_backingScaleFactor = 1.0
window_frame_xywh = [200.0, 200.0, 600.0, 432.0]
titleBar_height = 32.0
headerView_height = 28.0
column_width = 120.0
segmentedControl_frame_xywh = [200.0, 60.0, 201.0, 24.0]
method_controls = "in the band between the segmented control and the table: a row of disabled controls (setEnabled: NO) with its bottom edge at y 96 and a row of the same controls enabled at y 128, from x 200, each control 8 pt right of the one before's fitted frame: an NSSwitch on and an NSSwitch off (both sized to fit) and an NSSlider, horizontal, 0..1 at 0.5, sized to fit in height and as wide as the row leaves up to x 380; a switch's track is sampled at 0.16666666666666666 of its width in from the end away from the knob, and its knob at a point inside the knob, half the frame's height in from the end it rests at (the right end when on; the knob's centre only where it is round), both at the frame's vertical centre; a slider's fill at 0.25 and its track at 0.75 of the bar's width (barRectFlipped: of its NSSliderCell, in the content view; the frame where the cell is not one), at the bar's vertical centre, and its knob at the centre of knobRectFlipped: (the bar's centre where the cell is not an NSSliderCell); where a disabled slider draws no value fill (macOS 14, 15 and 26 in run 40348854007), slider_disabled_fill samples the bar"
switch_on_disabled_frame_xywh = [200.0, 96.0, 54.0, 24.0]
switch_off_disabled_frame_xywh = [262.0, 96.0, 54.0, 24.0]
switch_on_frame_xywh = [200.0, 128.0, 54.0, 24.0]
switch_off_frame_xywh = [262.0, 128.0, 54.0, 24.0]
slider_disabled_frame_xywh = [324.0, 96.0, 56.0, 16.0]
slider_disabled_barRect_xywh = [324.0, 101.0, 56.0, 6.0]
slider_disabled_knobRect_xywh = [342.0, 96.0, 20.0, 16.0]
slider_frame_xywh = [324.0, 128.0, 56.0, 16.0]
slider_barRect_xywh = [324.0, 133.0, 56.0, 6.0]
slider_knobRect_xywh = [342.0, 128.0, 20.0, 16.0]

[macos.key_window.activation]
activateIgnoringOtherApps_isActive = false
activateIgnoringOtherApps_steps = 20
activate_available = true
activate_steps = 20
activate_isActive = false
activated_by = "none"

