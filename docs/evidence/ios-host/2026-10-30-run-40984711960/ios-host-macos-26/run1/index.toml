[environment]
simulator_runtime_version = "26.5"
simulator_runtime_build = "23F77"
simulator_device_name = "ios-host"
simulator_model_identifier = "iPhone18,1"
system_version = "26.5"
operating_system_version = "Version 26.5 (Build 23F77)"
xcode = "2660"
