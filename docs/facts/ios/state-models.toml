# State models (S17), ios-13 and ios-26: what the pinned SDK headers declare (the iphonesimulator SDK of Xcode 16.4
# and 26.6, as the iOS host's run 41020880059 copied them, its headers/README.txt) and what that run drew
# (docs/evidence/ios-host/2026-10-30-run-41020880059/README.md).
# - States: `pressed` (`isHighlighted`; a real touch draws the same, analysis.toml `press`), `disabled`, `checked` (a
#   toggle's selected state) combine (UIControl.State is a bit mask; no exclusive group); `hover` (iPad pointer) and
#   `focus_visible` (iPad focus) are drawn and unmeasured (pending U113, U112); the iPhone has no focus system (its
#   cells' `can_become_focused` is false, so `focused` is never set there; on the iPad the focus engine draws its effect
#   on the focused item, `focus_visible`); `@loading`, the flag `showsActivityIndicator` sets, is a state flag
#   (S7.2's `Widget(Key)`) the drawing distinguishes: the activity indicator in place of the image (UIButtonConfiguration.h),
#   the bezel and title as without it in every state at medium (analysis.toml `cells.<scheme>.<style>__activity_indicator_shown`).
# - Conditions: the schemes; the idiom (the iPhone's facts; the iPad's styles at medium and rest read alike in
#   focus1/index.toml, the rest pending U114); Increase Contrast, Bold Text and Button Shapes are not captured
#   (pending U116-U118).
# - Variants: one configuration style each (two exclusive groups on 26, so `primary` pairs with `glass` and `clear`
#   alone), or one of the forms that are no configuration (the system types, the bar items, the paste control, the
#   route picker); one corner style, content and pointer effect each. Collapsed, as UIKit draws them alike (each read
#   the same in every key, state and scheme the run drew): the roles destructive and cancel (as normal on a standalone
#   button, and the cancel bar item as a plain one), the indicator `none` (as automatic: no indicator), the corner style
#   dynamic on the non-glass styles (their default) and capsule on glass (its default). The role `primary` does draw
#   differently (its title semibold, weight trait 0.3, analysis.toml `cells.<scheme>.<style>__role_primary`), but the
#   catalogue has no variant for it (the typed `primary` is the filled style): not stated (the tie-break's report).
# - Variant sets (the products): each set is one UIKit draws differently from every set it contains: a style with any
#   corner style (the bezel's radius), content (the image), `toggle` (the checked state) and pointer effect (the hover
#   effect), and the menu buttons' sets (`menu` the trigger, `@indicator_popup` the indicator, `@menu_on_hold` the long
#   press; no `toggle`: a selection menu is a pop-up button, `combo_box`); `flat` takes a corner style only with
#   `toggle`, as plain draws a bezel only while checked (analysis.toml `cells.<scheme>.plain.<size>.selected`; no
#   bezel at rest, pressed, disabled or toggled off).
# - Context: a bar item or a back button is a `button` in `context toolbar.bar`.
# - Not declared (the lane's report): `default_size` (no reading of a configuration's default `buttonSize`: the host
#   sets it on every specimen and UIButtonConfiguration.h states no default; U129), `@padding_removed`, the system add
#   bar item, iOS 26's `prominent` bar item style beyond `primary`, and the legacy `UIButton(type: .system)` with no
#   configuration (drawn, analysis.toml `forms.<scheme>.system`, but the catalogue names no variant for it and does not
#   say what iOS's base is, so `requires_variants` keeps every element to a style or a form).
[[model]]
when = { conditions = ["preset:ios-13"] }
widget = "button"
available = true
variants = ["flat", "@gray", "tinted", "primary", "toggle", "@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill", "with_icon", "icon_only", "menu", "@indicator_popup", "@menu_on_hold", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route", "@pointer_highlight", "@pointer_lift", "@pointer_hover"]
sizes = ["mini", "small", "regular", "large"]
densities = []
flags = ["@loading"]
axes = { states = ["pressed", "disabled", "checked", "hover", "focus_visible", "@loading"], conditions = ["scheme:light", "scheme:dark", "idiom:phone", "idiom:pad", "contrast_increased", "bold_text", "button_shapes"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }] }
exclusive = []
exclusive_variants = [["flat", "@gray", "tinted", "primary", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route"], ["@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill"], ["with_icon", "icon_only"], ["@pointer_highlight", "@pointer_lift", "@pointer_hover"]]
requires_variants = ["flat", "@gray", "tinted", "primary", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route"]
variant_products = [
  [{ one = ["@gray", "tinted", "primary"] }, { any = ["@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill"] }, { any = ["with_icon", "icon_only"] }, { any = ["toggle"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
  [{ one = ["flat"] }, { any = ["with_icon", "icon_only"] }, { any = ["toggle"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
  [{ one = ["flat"] }, { one = ["@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill"] }, { one = ["toggle"] }, { any = ["with_icon", "icon_only"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
  [{ one = ["@gray", "tinted", "primary"] }, { one = ["menu"] }, { any = ["@indicator_popup"] }, { any = ["@menu_on_hold"] }, { any = ["@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill"] }, { any = ["with_icon", "icon_only"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
  [{ one = ["flat"] }, { one = ["menu"] }, { any = ["@indicator_popup"] }, { any = ["@menu_on_hold"] }, { any = ["with_icon", "icon_only"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
]
not_drawn = [{ states = ["checked"], not_variants = ["toggle"] }, { states = ["focus_visible"], conditions = ["idiom:phone"] }, { variants = ["back"], not_context = [{ scope = "any", widget = "toolbar", part = "bar" }] }, { variants = ["done"], not_context = [{ scope = "any", widget = "toolbar", part = "bar" }] }, { variants = ["@share"], not_context = [{ scope = "any", widget = "toolbar", part = "bar" }] }, { states = ["@loading"], not_variants = ["flat", "@gray", "tinted", "primary"] }]
rows = ["B-1", "B-3", "B-4", "B-7", "B-10", "B-11", "B-12", "B-17", "B-18†"]

# the four `buttonSize` values (medium is the model's `regular`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:21-26"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationSize) { UIButtonConfigurationSizeMedium, UIButtonConfigurationSizeSmall, UIButtonConfigurationSizeMini, UIButtonConfigurationSizeLarge, }"

# the configuration styles (borderless, bordered, borderedTinted and borderedProminent read as plain, gray, tinted and filled: `same.pairs` below)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:77-85"
quote = "+ (instancetype)plainButtonConfiguration; + (instancetype)tintedButtonConfiguration; + (instancetype)grayButtonConfiguration; + (instancetype)filledButtonConfiguration;"

# the corner styles, one per configuration (`@corner_fixed` … `@corner_large`, capsule `pill`; dynamic, the styles' default, draws as the base but on glass, whose default is capsule, so `pill` there is the base)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:39-52"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationCornerStyle) {"

# the menu indicator (`@indicator_popup`; automatic and none draw alike, no indicator: the base)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:65-72"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationIndicator) {"

# the activity indicator (the flag `@loading`, a configuration property: not drawn on the forms that are no configuration)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:115-116"
quote = "/// Shows an activity indicator in place of an image. Its placement is controlled by the imagePlacement property. @property (nonatomic, readwrite, assign) BOOL showsActivityIndicator;"

# the system button types (`@info` for detail disclosure and both info types, `@contact_add`, `close`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:21-35"
quote = "typedef NS_ENUM(NSInteger, UIButtonType) {"

# the roles: destructive and cancel draw as normal on a standalone button (no variant); primary makes the title semibold, which no catalogue variant names (the cells `<style>__role_*`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:37-42"
quote = "typedef NS_ENUM(NSInteger, UIButtonRole) { UIButtonRoleNormal, UIButtonRolePrimary, UIButtonRoleCancel, UIButtonRoleDestructive }"

# `done` and `@share` are bar button items' system items (and `back` a navigation bar's): drawn only in `context toolbar.bar`
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIBarButtonItem.h:28-55"
quote = "typedef NS_ENUM(NSInteger, UIBarButtonSystemItem) {"

# `hover`: a button tracks a pointer's hover
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:86"
quote = "@property (nonatomic, assign, readonly, getter = isHovered) BOOL hovered API_AVAILABLE(ios(15.0), tvos(15.0)) API_UNAVAILABLE(watchos);"

# the pointer effects (`@pointer_highlight`, `@pointer_lift`, `@pointer_hover`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:93-94"
quote = "/// Enables this button's built-in pointer interaction. @property (nonatomic, readwrite, assign, getter = isPointerInteractionEnabled) BOOL pointerInteractionEnabled API_AVAILABLE(ios(13.4)) API_UNAVAILABLE(watchos, tvos);"

# `menu` (`@menu_on_hold`: the menu on a long press, not as the primary action)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:105"
quote = "@property (nonatomic, readwrite, copy, nullable) UIMenu *menu API_AVAILABLE(ios(14.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

# `toggle`: `checked` is the selected state the primary action toggles; a button that is no toggle is not `checked`
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:110-113"
quote = "/// Indicates if the button changes selection as its primary action. /// This shows the menu as options for selection if a menu is populated and showsMenuAsPrimaryAction is enabled. /// If no menu is provided or it is not the primary action, UIControlStateSelected is toggled on and off for the primary action. @property (nonatomic, readwrite, assign) BOOL changesSelectionAsPrimaryAction API_AVAILABLE(ios(15.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

