# State models (S17), ios-13 and ios-26: what the pinned SDK headers declare (the iphonesimulator SDK of Xcode 16.4
# and 26.6, as the iOS host's run 41020880059 copied them, its headers/README.txt) and what that run drew
# (docs/evidence/ios-host/2026-10-30-run-41020880059/README.md).
# - States: `pressed` (`isHighlighted`; a real touch draws the same, analysis.toml `press`), `disabled`, `checked` (a
#   toggle's selected state) combine (UIControl.State is a bit mask; no exclusive group); `hover` (iPad pointer) and
#   `focus_visible` (iPad focus) are drawn and unmeasured (pending U113, U112); the iPhone has no focus system (its
#   cells' `can_become_focused` is false, so `focused` is never set there; on the iPad the focus engine draws its effect
#   on the focused item, `focus_visible`); `@loading`, the flag `showsActivityIndicator` sets, is a state flag
#   (S7.2's `Widget(Key)`) the drawing distinguishes: the activity indicator in place of the image (UIButtonConfiguration.h),
#   the bezel and title as without it in every state at medium (analysis.toml `cells.<scheme>.<style>__activity_indicator_shown`);
#   `open` (`isHeld`, while the button presents its menu) and `route_active` (the route picker's active tint) are
#   drawn and unmeasured (U686, U122). `focused` is not an axis: UIKit applies the focus effect whenever an item is
#   focused (UIView.h `focusEffect`, `token.behavior.focus_visible_when` `any_focus`), so `focused` holds exactly
#   where `focus_visible` does and draws nothing of its own (the tie-break of IO-C1).
# - Conditions: the schemes; the idiom (the iPhone's facts; the iPad's styles at medium and rest read alike in
#   focus1/index.toml, the rest pending U114); Increase Contrast, Bold Text and Button Shapes are not captured
#   (pending U116-U118); `tint_dimmed` (the dimmed tint behind a presented alert), read for the plain and the filled
#   title at rest and medium, the rest pending (U685; the tie-break of IO-C1).
# - The base (ADD-A125, the catalogue): an element with none of the styles and forms is `UIButton(type: .system)` with
#   no configuration (analysis.toml `forms.<scheme>.system`); no `requires_variants`. Every button a UIKit host draws
#   for itself is the base, or one of its forms or identities, in its host's context (`axes.contexts`, the contexts
#   the trace's rules select: an alert's and an action sheet's actions, the bar items, the toolbar editor's Done, the
#   bottom tab bar's sidebar toggle, the search field's and the text field's buttons, the calendar header's, the edit
#   menu's, the find bar's, AVKit's media controls', the ink toolbar's, the document launch view's, the status page's
#   and the teaching tip's). The search field's clear button is the chain `[search_field.body, input]` S17 allows
#   (the catalogue's; scripts/check_facts.py reads chains since ADD-A125's checkers), `clear_field` not drawn in the
#   search field outside it (the tie-break of IO-C1).
# - Variants: one configuration style each (two exclusive groups on 26, so `primary` pairs with `glass` and `clear`
#   alone), or one of the forms that are no configuration (the system types, the bar items with `add` the system add
#   item, the paste control, the route picker) or a host's identity (`clear_field`, `overflow`, `pane_toggle`,
#   `previous`, `next`, `tool`); one corner style, content and pointer effect each; one role (`UIButton.Role`):
#   `@role_primary` (the title's weight trait 0.3 in every style, analysis.toml `cells.<scheme>.<style>__role_primary`,
#   drawn with each configuration style), `@cancel` and `destructive` (drawn as normal on a standalone button, the
#   run's `<style>__role_cancel` and `__role_destructive` cells: variants only in the hosts that draw them, an alert's
#   or action sheet's actions and the search field's cancel button). Collapsed, as UIKit draws them alike (each read
#   the same in every key, state and scheme the run drew): the indicator `none` (as automatic: no indicator), the
#   corner style dynamic on the non-glass styles (their default) and capsule on glass (its default).
# - Variant sets (the products): each set is one UIKit draws differently from every set it contains: a style with any
#   corner style (the bezel's radius), content (the image), `toggle` (the checked state) and pointer effect (the hover
#   effect), and the menu buttons' sets (`menu` the trigger, `@indicator_popup` the indicator, `@menu_on_hold` the long
#   press; no `toggle`: a selection menu is a pop-up button, `combo_box`); `flat` takes a corner style only with
#   `toggle`, as plain draws a bezel only while checked (analysis.toml `cells.<scheme>.plain.<size>.selected`; no
#   bezel at rest, pressed, disabled or toggled off); `@role_primary` on each configuration style's sets, its corner
#   styles, image, toggle and menu among them (the run drew `<style>__role_primary`, the prominent glass ones on 26
#   too; `role` is UIButton's own, UIButton.h:91, beside the configuration, so the role takes every set its style
#   takes, the cleanup lane, ADD-A141); and the base's own sets (ADD-A141, *What the
#   axes and sets hold*: the system type with no configuration takes an image, `setImage:forState:`, a menu, `menu`
#   with `@menu_on_hold` its long press, and the selection toggle, `changesSelectionAsPrimaryAction`, UIButton's own
#   API, so it draws an image with a toggle, a menu with an image and a menu on hold, which the gate met only where a
#   fact's own `when` named them, the iOS facts lane's round 5, c8610c67; no toggle with a menu, as for the styles).
#   The button types `@info`, `@contact_add` and `close` take the same menu and toggle, UIButton's own on every type
#   (the host drew each type selected, analysis.toml `forms.<scheme>.<type>.selected`), so each draws with `toggle`,
#   with `menu` and with `menu` and `@menu_on_hold`; not with an image: the type draws its own glyph (UIButtonType),
#   and a system button has no title or image view (UIButton.h:147), so `with_icon` and `icon_only` would be the type
#   under another name, each pair in `not_drawn` (U704, ADD-A145; the cleanup lane).
#   The pointer style (the iOS facts lane's round 6, U703; ADD-A141, ADD-A144): `pointerInteractionEnabled` and
#   `pointerStyleProvider` are UIButton's own, as `role` is, so every UIButton form takes one: the base with each of
#   its sets, each configuration style with its sets and with `@role_primary`, and the button types `@info`,
#   `@contact_add` and `close`; no other form holds one (a bar item; UIKit's own items in the calendar header, the
#   edit menu, the find bar and the media controls; an alert's action). The style draws only under the
#   system pointer, iPadOS's (UIHoverGestureRecognizer.h): the pointer facts hold under `idiom:pad` (but the dimmed
#   tint's six beside `flat` and `primary`, U685), and on the iPhone a set holding a pointer style takes its other
#   variants' facts. No pass drew a pointer style (U114 alone, U703 beside another variant: button.toml's last
#   facts, per S17's *Sets not yet measured*).
# - Sizes (S10; ADD-A131): an element with no configuration style takes one size, `regular` (no `buttonSize`), so
#   `sizes = ["regular"]` and its default `regular`; each configuration style takes the four `buttonSize`s in its
#   `sizes_by_variant` entry, its default `regular` (U129 settled: run 42269041636 read a new configuration's
#   `buttonSize` as medium on every style, symbols_read.toml `defaults.<style>.default_size`; UIButtonConfiguration.h
#   states no default). On 26 a button in `toolbar.bar` is a
#   bar item, the prominent one `primary`: UIBarButtonItem and UIBarItem declare no size (their whole definitions at
#   xcode@26.6, the SDK header pass, U310), so the bar's entry gives it one, `regular` (ADD-A131's `sizes_by_context`).
# - Not drawn: the configuration-only variants without a style (the corner styles, `@role_primary`,
#   `@indicator_popup`; `@corner_dynamic` only with the glass styles and `pill` only with the others on 26, each the
#   style's default under another name elsewhere); `@menu_on_hold` without `menu`; each host-only form or identity
#   outside its hosts, `@cancel` and `destructive` outside theirs (and `@cancel` in the text field, the search field's
#   clear button's host, `destructive` in the search field); the configuration styles in the hosts whose buttons are
#   UIKit's own items (an application's configured button placed in a bar is a custom view, no bar item), but
#   `primary` in `toolbar.bar` on 26 (the prominent item, and the done style); `primary` in a bar on 13
#   (`UIBarButtonItemStyleProminent` is iOS 26's); the base in the hosts whose rows name no plain button (the text
#   field, the search field, the bottom tab bar, the ink toolbar, the toolbar editor); in an alert's or action
#   sheet's actions every variant a UIAlertAction cannot hold (an image, a menu, a toggle, a pointer style, a button
#   type); in `toolbar.bar` the forms that are no bar item (`@info`, `@contact_add`, `@paste_control`, `route`), and
#   on 26 the configuration's corner styles, role, indicator and activity indicator beside the prominent item (the
#   tie-break of IO-C1, from the verifier's model); a pointer style in `toolbar.bar` (UIBarButtonItem and UIBarItem
#   hold none) and in the hosts whose buttons are UIKit's own items, as the configuration styles there (the iOS
#   facts lane's round 6).
# - Not declared (the lane's report): the states the host rows name beside the button's (`default` in an alert, DL-5
#   and DL-7; `selected` on a bar item, P3-3†, which the facts state as `checked` with `toggle`, the run's toggle;
#   `dragged`, P4-10†): their rows' facts are the host units'.
# - `drop_target` (ledger queue #159, P3-11†): UIButton adopts spring loading (UIButton.h:184), and UIKit's default
#   spring-loading effect highlights the view while a drag hovers it (UISpringLoadedInteraction.h:20); its look is
#   pending (U475, button.toml's last facts).
[[model]]
when = { conditions = ["preset:ios-13"] }
widget = "button"
available = true
variants = ["flat", "@gray", "tinted", "primary", "toggle", "@corner_fixed", "@corner_small", "@corner_medium", "@corner_large", "pill", "with_icon", "icon_only", "menu", "@indicator_popup", "@menu_on_hold", "@info", "@contact_add", "close", "back", "done", "add", "@share", "@paste_control", "route", "clear_field", "overflow", "pane_toggle", "previous", "next", "tool", "@cancel", "@role_primary", "destructive", "@pointer_highlight", "@pointer_lift", "@pointer_hover"]
sizes = ["regular"]
default_size = "regular"
sizes_by_variant = [
  { variant = "flat", sizes = ["mini", "small", "regular", "large"], default_size = "regular" },
  { variant = "@gray", sizes = ["mini", "small", "regular", "large"], default_size = "regular" },
  { variant = "tinted", sizes = ["mini", "small", "regular", "large"], default_size = "regular" },
  { variant = "primary", sizes = ["mini", "small", "regular", "large"], default_size = "regular" },
]
densities = []
flags = ["@loading", "route_active"]
axes = { states = ["pressed", "disabled", "checked", "hover", "focus_visible", "@loading", "drop_target", "open", "route_active"], conditions = ["scheme:light", "scheme:dark", "idiom:phone", "idiom:pad", "contrast_increased", "bold_text", "button_shapes", "tint_dimmed"], contexts = [{ scope = "any", widget = "dialog", part = "action_area", variants = ["alert"] }, { scope = "any", widget = "dialog", part = "action_area", variants = ["@action_sheet"] }, { scope = "any", widget = "toolbar", part = "bar" }, { scope = "any", widget = "toolbar_editor" }, { scope = "any", widget = "bottom_tab_bar", part = "bar" }, { scope = "any", widget = "search_field" }, { scope = "any", widget = "input" }, { scope = "any", widget = "calendar", part = "header" }, { scope = "any", widget = "edit_menu" }, { scope = "any", widget = "find_bar" }, { scope = "any", widget = "media_controls", part = "bar" }, { scope = "any", widget = "ink_toolbar" }, { scope = "any", widget = "component.document_launch_view" }, { scope = "any", widget = "status_page", part = "action_area" }, { scope = "any", widget = "teaching_tip", part = "action_area" }, [{ scope = "any", widget = "search_field", part = "body" }, { scope = "any", widget = "input" }]] }
