# the roles (one exclusive group): `@role_primary` the heavier title in every style (the cells `<style>__role_primary`); cancel and destructive draw as normal on a standalone button (the cells `<style>__role_cancel`, `__role_destructive`), so `@cancel` and `destructive` are drawn only in the hosts that draw them otherwise
