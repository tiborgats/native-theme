# State models (S17), ios-13 and ios-26: what the pinned SDK headers declare (the iphonesimulator SDK of Xcode 16.4
# and 26.6, as the iOS host's run 41020880059 copied them, its headers/README.txt) and what that run drew
# (docs/evidence/ios-host/2026-10-30-run-41020880059/README.md).
# - States: `pressed` (`isHighlighted`; a real touch draws the same, analysis.toml `press`), `disabled`, `checked` (a
#   toggle's selected state) combine (UIControl.State is a bit mask; no exclusive group); `hover` (iPad pointer) and
#   `focus_visible` (iPad focus) are drawn and unmeasured (pending U113, U112); the iPhone has no focus system.
# - Conditions: the schemes; the idiom (the iPhone's facts; the iPad pending U114); Increase Contrast, Bold Text and
#   Button Shapes change colours, fonts and the plain shape and are not captured (pending U116-U118).
# - Variants: one configuration style each (two exclusive groups on 26, so `primary` pairs with `glass` and `clear`
#   alone), or one of the forms that are no configuration (the system types, the bar items, the paste control, the
#   route picker: captured, not analysed, pending U122); the role, corner style, content, menu indicator and pointer
#   effect one each. The products give every set of a style with any role, corner style, content, `toggle` and pointer
#   effect, and the menu buttons' sets (no `toggle`: a selection menu is a pop-up button, `combo_box`).
# - Context: a bar item is a `button` in `context toolbar.bar` (captured, not analysed, pending U123).
# - Not declared: `default_size` (no reading of a configuration's default `buttonSize`), `@padding_removed` (the bar
#   items' further looks, unanalysed), the role primary (draws as normal).

[[model]]
when = { conditions = ["preset:ios-13"] }
widget = "button"
available = true
variants = ["flat", "@gray", "tinted", "primary", "toggle", "destructive", "@cancel", "@corner_fixed", "@corner_dynamic", "@corner_small", "@corner_medium", "@corner_large", "pill", "with_icon", "icon_only", "menu", "@indicator_none", "@indicator_popup", "@menu_on_hold", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route", "@pointer_highlight", "@pointer_lift", "@pointer_hover"]
sizes = ["mini", "small", "regular", "large"]
densities = []
flags = ["@loading"]
axes = { states = ["pressed", "disabled", "checked", "hover", "focus_visible"], conditions = ["scheme:light", "scheme:dark", "idiom:phone", "idiom:pad", "contrast_increased", "bold_text", "button_shapes"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }] }
exclusive = []
exclusive_variants = [["flat", "@gray", "tinted", "primary", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route"], ["@corner_fixed", "@corner_dynamic", "@corner_small", "@corner_medium", "@corner_large", "pill"], ["destructive", "@cancel"], ["with_icon", "icon_only"], ["@indicator_none", "@indicator_popup"], ["@pointer_highlight", "@pointer_lift", "@pointer_hover"]]
requires_variants = ["flat", "@gray", "tinted", "primary", "@info", "@contact_add", "close", "back", "done", "@share", "@paste_control", "route"]
variant_products = [
  [{ one = ["flat", "@gray", "tinted", "primary"] }, { any = ["destructive", "@cancel"] }, { any = ["@corner_fixed", "@corner_dynamic", "@corner_small", "@corner_medium", "@corner_large", "pill"] }, { any = ["with_icon", "icon_only"] }, { any = ["toggle"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
  [{ one = ["flat", "@gray", "tinted", "primary"] }, { one = ["menu"] }, { any = ["@indicator_none", "@indicator_popup"] }, { any = ["@menu_on_hold"] }, { any = ["destructive", "@cancel"] }, { any = ["@corner_fixed", "@corner_dynamic", "@corner_small", "@corner_medium", "@corner_large", "pill"] }, { any = ["with_icon", "icon_only"] }, { any = ["@pointer_highlight", "@pointer_lift", "@pointer_hover"] }],
]
not_drawn = [{ states = ["checked"], not_variants = ["toggle"] }, { states = ["focus_visible"], conditions = ["idiom:phone"] }]
rows = ["B-1", "B-3", "B-4", "B-7", "B-10", "B-11", "B-12", "B-17", "B-18†"]

# the four `buttonSize` values (medium is the model's `regular`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:21-26"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationSize) { UIButtonConfigurationSizeMedium, UIButtonConfigurationSizeSmall, UIButtonConfigurationSizeMini, UIButtonConfigurationSizeLarge, }"

# the configuration styles (borderless, bordered, borderedTinted and borderedProminent read as plain, gray, tinted and filled: `same.pairs` below)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:77-85"
quote = "+ (instancetype)plainButtonConfiguration; + (instancetype)tintedButtonConfiguration; + (instancetype)grayButtonConfiguration; + (instancetype)filledButtonConfiguration;"

# the corner styles, one per configuration (`@corner_fixed` … `@corner_large`, capsule `pill`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:39-52"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationCornerStyle) {"

# the menu indicator (`@indicator_none`, `@indicator_popup`; automatic is the base)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:65-72"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationIndicator) {"

# the activity indicator (the flag `@loading`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:115-116"
quote = "/// Shows an activity indicator in place of an image. Its placement is controlled by the imagePlacement property. @property (nonatomic, readwrite, assign) BOOL showsActivityIndicator;"

# the system button types (`@info` for detail disclosure and both info types, `@contact_add`, `close`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:21-35"
quote = "typedef NS_ENUM(NSInteger, UIButtonType) {"

# the roles, one per button (`destructive`, `@cancel`; normal is the base; primary draws as normal, `same.roles`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:37-42"
quote = "typedef NS_ENUM(NSInteger, UIButtonRole) { UIButtonRoleNormal, UIButtonRolePrimary, UIButtonRoleCancel, UIButtonRoleDestructive }"

# `hover`: a button tracks a pointer's hover
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:86"
quote = "@property (nonatomic, assign, readonly, getter = isHovered) BOOL hovered API_AVAILABLE(ios(15.0), tvos(15.0)) API_UNAVAILABLE(watchos);"

# the pointer effects (`@pointer_highlight`, `@pointer_lift`, `@pointer_hover`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:93-94"
quote = "/// Enables this button's built-in pointer interaction. @property (nonatomic, readwrite, assign, getter = isPointerInteractionEnabled) BOOL pointerInteractionEnabled API_AVAILABLE(ios(13.4)) API_UNAVAILABLE(watchos, tvos);"

# `menu` (`@menu_on_hold`: the menu on a long press, not as the primary action)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:105"
quote = "@property (nonatomic, readwrite, copy, nullable) UIMenu *menu API_AVAILABLE(ios(14.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

# `toggle`: `checked` is the selected state the primary action toggles; a button that is no toggle is not `checked`
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:110-113"
quote = "/// Indicates if the button changes selection as its primary action. /// This shows the menu as options for selection if a menu is populated and showsMenuAsPrimaryAction is enabled. /// If no menu is provided or it is not the primary action, UIControlStateSelected is toggled on and off for the primary action. @property (nonatomic, readwrite, assign) BOOL changesSelectionAsPrimaryAction API_AVAILABLE(ios(15.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

