# State models (S17), ios-13 and ios-26. Each `button` entry states what the SDK header declares (the styles and the
# sizes, quoted from the pinned Xcode's iphonesimulator SDK as spike I's run 40984711960 printed them, grep -n, in its
# environment.txt) and what that run's iOS host drew: the eight (18) or twelve (26) UIButton.Configuration styles, at
# each `buttonSize`, at rest, `isHighlighted` (`pressed`), disabled, and as a toggle (`changesSelectionAsPrimaryAction`)
# off and on (`checked`), under the light and the dark appearance. The states, conditions, variants and contexts the
# run did not exercise (focus, hover and the pointer effects, the window and scene conditions, Increase Contrast,
# Button Shapes, the corner styles, the roles, the system button types, the menu and bar-item variants, the loading
# flag, the contexts) are not in it yet: the lane's report lists them as unmeasured. `exclusive` and `not_drawn` are
# empty because the run combined no two states; whether UIKit draws every combination is unmeasured.

[[model]]
widget = "button"
when = { conditions = ["preset:ios-13"] }
available = true
variants = ["flat", "@gray", "tinted", "primary", "@borderless", "@bordered", "toggle"]
sizes = ["mini", "small", "regular", "large"]
densities = []
axes = { states = ["pressed", "disabled", "checked"], conditions = ["scheme:light", "scheme:dark"], contexts = [] }
exclusive = []
not_drawn = []
rows = ["B-1", "B-3"]

# the four `buttonSize` values (medium is the model's `regular`)
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:22-25"
quote = "UIButtonConfigurationSizeMedium, UIButtonConfigurationSizeSmall, UIButtonConfigurationSizeMini, UIButtonConfigurationSizeLarge,"

# the configuration styles
[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:77-80"
quote = "+ (instancetype)plainButtonConfiguration; + (instancetype)tintedButtonConfiguration; + (instancetype)grayButtonConfiguration; + (instancetype)filledButtonConfiguration;"

[[model.cite]]
kind = "published"
source = "xcode@16.4 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:82-85"
quote = "+ (instancetype)borderlessButtonConfiguration; + (instancetype)borderedButtonConfiguration; + (instancetype)borderedTintedButtonConfiguration; + (instancetype)borderedProminentButtonConfiguration;"

