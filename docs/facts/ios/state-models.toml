# the four `buttonSize` values (medium is the model's `regular`)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:22-27"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationSize) { UIButtonConfigurationSizeMedium, UIButtonConfigurationSizeSmall, UIButtonConfigurationSizeMini, UIButtonConfigurationSizeLarge, }"

# the configuration styles (borderless, bordered, borderedTinted and borderedProminent read as plain, gray, tinted and filled: `same.pairs` below)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:78-86"
quote = "+ (instancetype)plainButtonConfiguration; + (instancetype)tintedButtonConfiguration; + (instancetype)grayButtonConfiguration; + (instancetype)filledButtonConfiguration;"

# iOS 26's glass styles: `glass`, `clear`, the prominent ones with `primary`
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:88-91"
quote = "+ (instancetype)glassButtonConfiguration API_AVAILABLE(ios(26.0), tvos(26.0)) API_UNAVAILABLE(watchos, visionos); + (instancetype)prominentGlassButtonConfiguration API_AVAILABLE(ios(26.0), tvos(26.0)) API_UNAVAILABLE(watchos, visionos); + (instancetype)clearGlassButtonConfiguration API_AVAILABLE(ios(26.0), tvos(26.0)) API_UNAVAILABLE(watchos, visionos); + (instancetype)prominentClearGlassButtonConfiguration API_AVAILABLE(ios(26.0), tvos(26.0)) API_UNAVAILABLE(watchos, visionos);"

# the corner styles, one per configuration (`@corner_fixed` … `@corner_large`, capsule `pill`; dynamic, the styles' default, draws as the base but on glass, whose default is capsule, so `pill` there is the base)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:40-53"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationCornerStyle) {"

# the menu indicator (`@indicator_popup`; automatic and none draw alike, no indicator: the base)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:66-73"
quote = "typedef NS_ENUM(NSInteger, UIButtonConfigurationIndicator) {"

# the activity indicator (the flag `@loading`, a configuration property: not drawn on the forms that are no configuration)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h:125-126"
quote = "/// Shows an activity indicator in place of an image. Its placement is controlled by the imagePlacement property. @property (nonatomic, readwrite, assign) BOOL showsActivityIndicator;"

# the system button types (`@info` for detail disclosure and both info types, `@contact_add`, `close`)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:21-35"
quote = "typedef NS_ENUM(NSInteger, UIButtonType) {"

# the roles: destructive and cancel draw as normal on a standalone button (no variant); primary makes the title semibold, which no catalogue variant names (the cells `<style>__role_*`)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:37-42"
quote = "typedef NS_ENUM(NSInteger, UIButtonRole) { UIButtonRoleNormal, UIButtonRolePrimary, UIButtonRoleCancel, UIButtonRoleDestructive }"

# `done` and `@share` are bar button items' system items (and `back` a navigation bar's): drawn only in `context toolbar.bar`
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIBarButtonItem.h:37-64"
quote = "typedef NS_ENUM(NSInteger, UIBarButtonSystemItem) {"

# `hover`: a button tracks a pointer's hover
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:86"
quote = "@property (nonatomic, assign, readonly, getter = isHovered) BOOL hovered API_AVAILABLE(ios(15.0), tvos(15.0)) API_UNAVAILABLE(watchos);"

# the pointer effects (`@pointer_highlight`, `@pointer_lift`, `@pointer_hover`)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:93-94"
quote = "/// Enables this button's built-in pointer interaction. @property (nonatomic, readwrite, assign, getter = isPointerInteractionEnabled) BOOL pointerInteractionEnabled API_AVAILABLE(ios(13.4)) API_UNAVAILABLE(watchos, tvos);"

# `menu` (`@menu_on_hold`: the menu on a long press, not as the primary action)
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:105"
quote = "@property (nonatomic, readwrite, copy, nullable) UIMenu *menu API_AVAILABLE(ios(14.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

# `toggle`: `checked` is the selected state the primary action toggles; a button that is no toggle is not `checked`
[[model.cite]]
kind = "published"
source = "xcode@26.6 iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButton.h:110-113"
quote = "/// Indicates if the button changes selection as its primary action. /// This shows the menu as options for selection if a menu is populated and showsMenuAsPrimaryAction is enabled. /// If no menu is provided or it is not the primary action, UIControlStateSelected is toggled on and off for the primary action. @property (nonatomic, readwrite, assign) BOOL changesSelectionAsPrimaryAction API_AVAILABLE(ios(15.0), tvos(17.0)) API_UNAVAILABLE(watchos);"

