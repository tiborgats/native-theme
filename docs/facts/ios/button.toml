# button (ios-13, ios-26): UIButton.Configuration's styles as UIKit draws them in the iOS host of spike I, run
# 40984711960 (docs/evidence/ios-host/2026-10-30-run-40984711960/README.md): iOS 18.6 on the iPhone 16 Pro simulator
# (ios-13) and iOS 26.5 on the iPhone 17 Pro simulator (ios-26), the title "Button", no image, the default tint and
# the default content size category (L), measured from the simulator's screenshots by analysis/measure_buttons.py.
#
# Only colours the capture proves opaque are stated: a capture is the colour composited over what lies beneath it
# (the systemBackground cell, #ffffff light and #000000 dark, or the bezel), so a colour is stated only where some
# channel reaches 0 or 255 while the colour beneath does not, which only an opaque colour can (the analysis's
# `text_opaque`, `bezel_opaque`). Every other fill (the gray and tinted bezels, the pressed light-scheme colours, the
# disabled look) is a composite: the lane's report lists it as needing a capture over a second background.
#
# The tint-coloured values (#007aff and #0a84ff on 18, #0088ff and #0091ff on 26) are literals: UIKit takes them from
# the button's tintColor, but no pass varied the tint, so no measured derivation (S17) can state that yet.
#
# Mapping: plain `flat`, borderless `@borderless`, gray `@gray`, bordered `@bordered`, tinted `tinted`, filled
# `primary`, borderedTinted `@bordered` with `tinted`, borderedProminent `@bordered` with `primary` (the catalogue's
# ios-* variants); `isHighlighted = true` (no touch) is `pressed`; `changesSelectionAsPrimaryAction` is the variant
# `toggle`, `isSelected` its `checked`. No fact names a size: each holds at every size, cited at mini, small, medium
# (`regular`) and large. The two-variant styles' facts follow the one-variant ones, so the last matching fact is
# theirs; a fact names the states it was not measured in as `not_states`, so it never answers for them. The order is
# the harness's (style, then state), there being no platform source order for measured values.

[[fact]]
# UIButton.Configuration.plain(), at rest (and the toggle off); opaque: some channel reaches 0 or 255 where the bezel's capture does not (analysis.toml `text_opaque`)
key = "button.label.text.fill"
when = { conditions = ["preset:ios-13", "scheme:light"], variants = ["flat"], not_states = ["pressed", "disabled", "checked"] }
value = "#007aff"
rows = ["B-1"]

[[fact.cite]]
kind = "measured"
evidence = "docs/evidence/ios-host/2026-10-30-run-40984711960/ios-host-macos-15/analysis.toml#light.plain.mini.normal.text"
