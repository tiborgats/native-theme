# Tokens (ios-13, ios-26): what the iOS host's run 41020880059 read from UIKit
# (docs/evidence/ios-host/2026-10-30-run-41020880059/README.md), each image's run1/index.toml: the eleven text styles'
# fonts (`preferredFont(forTextStyle:compatibleWith:)`) at the default content size category (L), regular and bold
# legibility weight alike in family and size (the weight differs; not stated: the lane's report); each text-role slot
# references its keyed style, the style UIKit names for it (UIFontDescriptor.h's `UIFontTextStyle` constants);
# each style's weight (its weight trait through S17's `ns_font_weight`), its line height (ascender less descender
# plus leading, analysis.toml `[text_styles]`) and its `scaling_role` (its own slot: each is a Dynamic Type text style);
# `token.text.scaling` Dynamic Type (UIFont.h); the motion durations the run reads, named by S4.1's rule;
# `UILongPressGestureRecognizer`'s default minimum duration; the caret's width (`caretRect(for:)` of a UITextView and a
# UITextField in every font the host tried). Each fact holds for both presets: the two runtimes read the same.
# Sizes and line heights are logical px (S1's `Px`): UIFont's metrics are in UIKit points, UIKit's logical unit (see
# button.toml's header).

