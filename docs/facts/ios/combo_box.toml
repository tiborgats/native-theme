# combo_box (ios-13, ios-26): the content row of iOS's pop-up button (CB-1, ADD-A127), the `UIButton` menu
# configuration with the `.popup` indicator, which the iOS host's run 41020880059 drew as each style with a menu as
# its primary action and the pop-up indicator (`cells.<scheme>.<style>__menu_primary_action__indicator_popup`, the
# facts' `button @ variants {menu,@indicator_popup}`) at `medium` (the model's `regular`) only (the other sizes U120's): its content insets
# (the body's padding), the gap from the title's frame to the indicator's (`label_arrow_gap`) and the indicator's start
# and end margins (analysis/read_buttons.py's docstring is the method). Each preset states its own facts from its own
# image. Unmeasured, pending: the indicator's top and bottom margins (U121), the title's own padding inside the row
# (U257), whether the width follows the selected title and its slack (U173), where a wider pop-up puts the spare
# width (U174, no key: the catalogue's rule) and how a long title is cut (U175).

# ---- ios-13 ----

