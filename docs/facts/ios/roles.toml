# Colour roles (ios-13, ios-26): the UIColor class colours as the iOS host's run 41020880059 resolved them
# (`resolvedColor(with:)` per appearance, contrast and user-interface level; each image's run1/index.toml `[[color]]`,
# sRGB), mapped to the roles the iOS trace names for them (X-CO-2, D-9 to D-14): the label colours to `window.foreground`,
# `window.foreground_inactive`, `@label_tertiary`, `@label_quaternary`; the separators to `window.border` and
# `@separator_opaque`; the backgrounds, fills and system colours to their keyed roles. Increase Contrast is
# `contrast_increased` (the high contrast trait), the elevated level `elevated` (D-14: the whole window elevated) and,
# for the backgrounds, the keyed elevated twins (D-14). A fact names a scheme or condition only where the colour
# differs; the last that holds applies.

[[fact]]
key = "role.window.foreground"
when = { conditions = ["preset:ios-13", "scheme:light"] }
value = "#000000"
rows = ["X-CO-2", "X-CO-5"]

