[[fact]]
# the ring growing in from `offset + 4px` (`_drawing.scss:15`) is not expressible: reported. The mixin states the
# transition on the unfocused selector alone and no state rule restates it, and GTK times a change by the style
# after it, the new base style, not the previous one (`gtkcssanimatedstyle.c:818-820`, `:1034`), so the ring's transition is the same from every state: `from` none
