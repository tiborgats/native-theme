# GTK's CSS `min-width` and `min-height` bound the content box: GTK adds the border and padding (and the margin)
# to them, so the box's minimum is the CSS minimum plus the part's own padding, which holds the border (a button
# draws none), and a variant's padding carries through (S2.11, ADD-A125)
[[fact]]
