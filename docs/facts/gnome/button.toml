# `.card`'s three-layer shadow (0,1,0), and its high-contrast outline, over the plain button's none and inset ring
# (its layers bottom first, CSS's list reversed, as a `box-shadow` list paints its first shadow on top: S2.5's *Layer
# order*, ADD-A141)
[[fact]]
key = "button.body.shadow"
when = { variants = ["@card"] }
value = { layers = [{ x_px = 0, y_px = 2, blur_px = 6, spread_px = 2, color = "srgb(0, 0, 0.0235294, 0.03)", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = 1, blur_px = 3, spread_px = 1, color = "srgb(0, 0, 0.0235294, 0.07)", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = 0, blur_px = 0, spread_px = 1, color = "srgb(0, 0, 0.0235294, 0.03)", inset = false, falloff = "gaussian" }] }
