# adwaita's `button` (the catalogue's entry, S5): libadwaita 1.10.0 `src/stylesheet/widgets/_buttons.scss`, its
# `_toolbars.scss` and `_linked.scss` rules, and GTK 4.24.1's defaults where libadwaita states nothing. Facts in the
# stylesheet's order, arranged so that the last matching fact is the CSS cascade's winner (specificity included).
# The CSS `color` a variant sets is a binding of the current foreground (`surface.foreground`), so the label, the
# icon and every `currentColor` layer follow it. Written by the GNOME facts lane.

# the plain button sets no colour of its own: its text and icons take the inherited colour (CSS `color`)
[[fact]]
key = "button.body.bindings"
value = []
rows = []

[[fact.cite]]
kind = "published"
source = "libadwaita@1.10.0 src/stylesheet/widgets/_buttons.scss:19-27"
quote = "@at-root %button_basic, & {"
absent = ["color", "--accent-bg-color", "--accent-color"]

# `.card` (_misc.scss:201-208) on the node classed `.card`, the button itself or a menu button's outer node: its
# `color` rebinds the foreground; (0,1,0), it outranks only the plain `button` rules
[[fact]]
key = "button.body.bindings"
when = { variants = ["@card"] }
value = [{ role = { role = { surface = "foreground" }, value = "= role.card.foreground" } }]
rows = []

