# the linked box's 1 px overlap: each child's own negative margin toward its previous sibling, none on the first.
# Physical left in either direction (CSS `margin-left`); a margin is a `Sides` value, stated for the left-to-right
# layout and mirrored by the query, so the right-to-left child's physical left is stated as its `right`
[[fact]]
key = "button.body.margin"
when = { context = [{ scope = "any", widget = "layout", variants = ["@linked"], not_variants = ["vertical"] }], position = { among = "any", first = false }, direction = "ltr" }
