# adwaita's state models (S17): the combinations libadwaita 1.10.0 and GTK 4.24.1 draw. Written by the GNOME facts
# lane. States combine (no exclusive group: libadwaita's CSS selects each pseudo-class on its own).

[[model]]
widget = "button"
available = true
variants = ["primary", "destructive", "flat", "pill", "circular", "toggle", "menu", "icon_only", "with_icon", "close", "back", "previous", "next", "add", "clear_field", "reveal", "play", "volume", "pane_toggle", "@raised", "@osd", "@opaque", "@card", "@with_arrow", "@arrow_up", "@arrow_start", "@arrow_end", "@arrow_none", "@tab_button", "@custom_child", "@image_text_box"]
sizes = []
densities = []
axes = { states = ["hover", "pressed", "focused", "focus_visible", "disabled", "checked", "open", "drop_target"], conditions = ["scheme:light", "scheme:dark", "contrast_high"], contexts = [{ scope = { nearest = ["toolbar", "window", "popover"] }, widget = "toolbar", part = "bar" }, { scope = { nearest = ["toolbar", "window", "popover"] }, widget = "window", part = "title_bar" }, { scope = { nearest = ["toolbar", "window", "popover"] }, widget = "popover" }, { scope = "any", widget = "layout", variants = ["@linked"] }, { scope = "any", widget = "layout", variants = ["@linked", "vertical"] }] }
exclusive = []
exclusive_variants = [["icon_only", "with_icon", "@custom_child"], ["@arrow_up", "@arrow_start", "@arrow_end", "@arrow_none"]]
variant_sets = [["menu", "icon_only"], ["menu", "with_icon"], ["menu", "@custom_child"], ["menu", "@with_arrow"], ["menu", "icon_only", "@with_arrow"], ["menu", "with_icon", "@with_arrow"], ["menu", "@custom_child", "@with_arrow"], ["menu", "@arrow_up"], ["menu", "@arrow_start"], ["menu", "@arrow_end"], ["menu", "@arrow_none"], ["menu", "primary"], ["menu", "destructive"], ["menu", "flat"], ["menu", "@opaque"], ["menu", "@osd"], ["menu", "@card"], ["menu", "circular"], ["menu", "pill"], ["back", "icon_only"], ["with_icon", "@image_text_box"]]
not_drawn = [{ states = ["disabled", "hover"] }, { states = ["disabled", "focused"] }, { states = ["disabled", "focus_visible"] }, { states = ["checked"], not_variants = ["toggle"] }, { states = ["open"], not_variants = ["menu", "back"] }, { variants = ["@with_arrow"], not_variants = ["menu"] }, { variants = ["@arrow_up"], not_variants = ["menu"] }, { variants = ["@arrow_start"], not_variants = ["menu"] }, { variants = ["@arrow_end"], not_variants = ["menu"] }, { variants = ["@arrow_none"], not_variants = ["menu"] }, { variants = ["@image_text_box"], not_variants = ["with_icon"] }]
rows = ["GN-1.26", "GN-3.11"]

