# the variant sets: a plain button's content (an icon, AdwButtonContent, a custom child, an application's
# icon-and-label box, or the label, the base), at most one shape (`.pill`, `.circular`), at most one colour style
# (the stylesheet's alternatives: `:not(.raised):not(.suggested-action):not(.destructive-action):not(.opaque)`,
# `_toolbars.scss:2`) and toggle or not; a menu button's content forms with their arrow (a label always shows it
# unless its direction is `none`; an icon, AdwButtonContent or a custom child only with `always-show-arrow` and a
# direction other than `none`; the arrow alone in any direction, `.image-button`), with the shape and style classes
# its `menubutton` node passes to the inner button; AdwBackButton's inner button is a private icon button, which no
# style class reaches. The arrow alone (`@arrow_only`: GtkMenuButton's `has_only_arrow`, the arrow the button's child,
# as `gtk_menu_button_init` makes it until a label, an icon or a child is set) shows in every direction; a label with
# direction `none` hides it, so a label menu button without `@with_arrow` is drawn only with `@arrow_none` (the
# `menu` alone, a label, its arrow down and hidden, is not drawn)
[[model.cite]]
kind = "published"
source = "gtk@4.24.1 gtk/gtkmenubutton.c:631"
quote = "gboolean has_only_arrow = menu_button->arrow_widget == gtk_button_get_child (GTK_BUTTON (menu_button->button));"

