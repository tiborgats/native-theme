# adwaita's state models (S17): the combinations libadwaita 1.10.0 and GTK 4.24.1 draw. Written by the GNOME facts
# lane. States combine (no exclusive group: libadwaita's CSS selects each pseudo-class on its own).

[[model]]
widget = "button"
available = true
variants = ["primary", "destructive", "flat", "pill", "circular", "toggle", "menu", "icon_only", "with_icon", "close", "back", "previous", "next", "add", "clear_field", "reveal", "play", "volume", "pane_toggle", "@raised", "@osd", "@opaque", "@card", "@with_arrow", "@arrow_only", "@arrow_up", "@arrow_start", "@arrow_end", "@arrow_none", "@tab_button", "@custom_child", "@image_text_box"]
sizes = []
densities = []
axes = { states = ["hover", "pressed", "focused", "focus_visible", "disabled", "checked", "open", "drop_target"], conditions = ["scheme:light", "scheme:dark", "contrast_high"], contexts = [{ scope = { nearest = ["toolbar", "window", "popover"] }, widget = "toolbar", part = "bar" }, { scope = { nearest = ["toolbar", "window", "popover"] }, widget = "window", part = "title_bar" }, { scope = { nearest = ["toolbar", "window", "popover"] }, widget = "popover" }, { scope = "any", widget = "layout", variants = ["@linked"] }, { scope = "any", widget = "layout", variants = ["@linked", "vertical"] }] }
exclusive = []
exclusive_variants = [["icon_only", "with_icon", "@custom_child"], ["@arrow_up", "@arrow_start", "@arrow_end", "@arrow_none"], ["@with_arrow", "@arrow_only"]]
variant_sets = [["back", "icon_only"]]
variant_products = [
  # a plain button: its content (an icon, AdwButtonContent, a custom child; the label the base), its shape, its colour
  # style, toggle or not
  [{ any = ["icon_only", "with_icon", "@custom_child"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] },
   { any = ["toggle"] }],
  # an application's own icon-and-label box (`.image-text-button`)
  [{ one = ["with_icon"] }, { one = ["@image_text_box"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] },
   { any = ["toggle"] }],
  # a menu button showing its arrow beside its content (`.arrow-button`): a label in any direction but `none`, an
  # icon, AdwButtonContent or a custom child with `always-show-arrow`
  [{ one = ["menu"] },
   { any = ["icon_only", "with_icon", "@custom_child"] },
   { one = ["@with_arrow"] },
   { any = ["@arrow_up", "@arrow_start", "@arrow_end"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] }],
  # a menu button whose only child is its arrow (`.image-button`), in any direction
  [{ one = ["menu"] }, { one = ["icon_only"] }, { one = ["@arrow_only"] },
   { any = ["@arrow_up", "@arrow_start", "@arrow_end", "@arrow_none"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] }],
  # a menu button whose arrow GTK hides: an icon, AdwButtonContent or a custom child without `always-show-arrow`
  [{ one = ["menu"] }, { one = ["icon_only", "with_icon", "@custom_child"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] }],
  # and a label with direction `none`
  [{ one = ["menu"] }, { one = ["@arrow_none"] },
   { any = ["pill", "circular"] },
   { any = ["primary", "destructive", "flat", "@raised", "@opaque", "@osd", "@card"] }],
]
not_drawn = [{ states = ["disabled", "hover"] }, { states = ["disabled", "focused"] }, { states = ["disabled", "focus_visible"] }, { states = ["checked"], not_variants = ["toggle"] }, { states = ["open"], not_variants = ["menu", "back"] }, { variants = ["@with_arrow"], not_variants = ["menu"] }, { variants = ["@arrow_only"], not_variants = ["menu"] }, { variants = ["@arrow_only"], not_variants = ["icon_only"] }, { variants = ["menu"], not_variants = ["icon_only", "with_icon", "@custom_child", "@with_arrow", "@arrow_none"] }, { variants = ["@arrow_up"], not_variants = ["menu"] }, { variants = ["@arrow_start"], not_variants = ["menu"] }, { variants = ["@arrow_end"], not_variants = ["menu"] }, { variants = ["@arrow_none"], not_variants = ["menu"] }, { variants = ["@image_text_box"], not_variants = ["with_icon"] }, { variants = ["back"], not_variants = ["icon_only"] }]
rows = ["GN-1.26", "GN-3.11"]

