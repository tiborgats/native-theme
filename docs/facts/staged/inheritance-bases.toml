# S19.2's staged inheritance bases, from inheritance-rules.toml@fc6109d1 ([uniform], [per_platform]): per preset, each field today's
# preset leaves to a rule, as the S2.2 reference that rule implies over the new model's paths (the widget
# catalogue's *Today's fields*). Input to each unit's preset step, which the gate checks; not facts. Written by
# scripts/convert_inheritance_rules.py, whose docstring states the rules; removed at the 0.8.0 plan's M4.

[[base]]
preset = "adwaita"
field = "window.background_color"
schemes = [
    "light",
    "dark",
]
rule = "[uniform] window.background_color = defaults.background_color"
source = "inheritance-rules.toml@fc6109d1:157"
target = "window.content.fill"
value = "= role.window.background"
mapping = [
    "spec-widgets.md:625 `background_color` → `content.fill`",
    "spec-widgets.md:8582 `defaults.background_color` -> `role.window.background`",
]

