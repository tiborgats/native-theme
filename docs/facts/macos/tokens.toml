# Tokens (macos-tahoe): the text ramp's keyed styles as NSFont reports them on macOS 26.6.2 (os-probe run
# 40969040283, `[macos.fonts]`): `preferredFontForTextStyle:` per text style (MAC-TS01) and the named fonts at their
# default size (MAC-TS02), each's point size, which the probe reads the same in the main pass, with Reduce
# Transparency off and with Increase Contrast on; each style's family the same passes report (a text value, ADD-A120).
# Then the behaviour, pointer-repeat and caret tokens of run 41006842699 (NSEvent's and NSButton's reads in the main
# pass's `[macos.tokens]`; the caret from the button pass's text view, analysis.toml `caret`).
# The weights (ADD-A123, as macos-monterey's below): each style's `weightTrait` by S17's `ns_font_weight` (the plain
# styles' and the named fonts' from run 40969040283's three passes, the emphasized styles' from run 41006842699's main
# and accent-red passes, which read them the same), stated where it agrees with the weight its face names (`.SFNS-Regular` 400,
# `-Semibold` 600, `-Bold` 700, the plain `.AppleSystemUIFont` 400); where they disagree (caption 2's `.SFNS-Medium`
# at trait 0, caption 1 emphasized's `.SFNS-Medium` at 0.3, title 3 emphasized's `.SFNS-Semibold` and headline
# emphasized's `.SFNS-Heavy` at 0.4, the readings macOS 15 gives too) the weight is pending (U146).

