# Tokens (macos-tahoe): the text ramp's keyed styles as NSFont reports them on macOS 26.6.2 (os-probe run
# 40969040283, `[macos.fonts]`): `preferredFontForTextStyle:` per text style (MAC-TS01) and the named fonts at their
# default size (MAC-TS02), each's point size, which the probe reads the same in the main pass, with Reduce
# Transparency off and with Increase Contrast on; each style's family the same passes report (a text value, ADD-A120).
# Then the behaviour, pointer-repeat and caret tokens of run 41006842699 (NSEvent's and NSButton's reads in the main
# pass's `[macos.tokens]`; the caret from the button pass's text view, analysis.toml `caret`).

