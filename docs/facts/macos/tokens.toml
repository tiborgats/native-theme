# Tokens (macos-tahoe): the text ramp's keyed styles as NSFont reports them on macOS 26.6.2 (os-probe run
# 40969040283, `[macos.fonts]`): `preferredFontForTextStyle:` per text style (MAC-TS01) and the named fonts at their
# default size (MAC-TS02), each's point size, which the probe reads the same in the main pass, with Reduce
# Transparency off and with Increase Contrast on. The family names it reports (`.AppleSystemUIFont`) are not stated:
# S11 spells no free string value (the lane's report).

[[fact]]
key = "token.text.keyed.large_title.font.size"
when = { conditions = ["preset:macos-tahoe"] }
value = "26pt"
rows = ["MAC-TS01"]

[[fact.cite]]
kind = "measured"
evidence = "docs/evidence/os-probe/2026-10-29-run-40969040283/os-probe-macos-26/probe.toml#macos.fonts.preferredFontForTextStyle.largeTitle.pointSize"
tolerance = 0

