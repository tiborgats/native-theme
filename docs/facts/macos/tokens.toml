# macos-tahoe fill (preset gaps, pass 1): the text styles' leaves AppKit's text style has no counterpart for. A
# style is an NSFont (preferredFontForTextStyle:options:, the named fonts), whose class, categories and
# descriptor (NSFont.h:24-131, :167-182, :184-187; NSFontDescriptor.h:61-99 and the descriptor attributes
# :101-115, Xcode 26.6) carry no decoration, kerning, word spacing or case transform: those are attributed-string
# attributes the drawing code sets (NSUnderlineStyleAttributeName, NSKernAttributeName), so the style states
# none (decoration, letter and word spacing absent, S6.3's marks; case mixed, its no-transform value). macOS
# uses no mnemonics (NSButtonCell.h:177, NSButton.h:185), so mnemonic_decoration is absent too.

