# ---------------------------------------------------------------------------------------------------------------------
# Tokens (macos-monterey), mirroring macos-tahoe's above: the text styles' sizes (logical points, a point a px, S17)
# and families, NSEvent's intervals, NSButton's periodic delay and NSAnimationContext's duration from the main pass of
# run 41006842699's macos-15 job (with the Reduce Transparency off and Increase Contrast passes where they read the
# same); the caret's width from the one capture that shows it (the accent-red pass, light: the key pass's and the
# dark captures show no caret in either of their two captures, caret.toml), and its colour, the accent, from
# textInsertionPointColor under both accents (tiebreak-derivations.toml), the colour NSTextInsertionIndicator
# draws by default.
# The weights (the tie-break of the monterey slice): each style's `weightTrait` by S17's `ns_font_weight`, stated
# where it agrees with the weight its face names (`.SFNS-Regular` 400, `-Semibold` 600, `-Bold` 700, the plain
# `.AppleSystemUIFont` 400); where they disagree (caption 2's `.SFNS-Medium` at trait 0, caption 1 emphasized's
# `.SFNS-Medium` at 0.3, title 3 emphasized's `.SFNS-Semibold` and headline emphasized's `.SFNS-Heavy` at 0.4) the
# weight is pending (U144).

