# Colour roles and inputs (macos-tahoe): NSColor values as macOS 26.6.2 resolves them per appearance (sRGB,
# `[macos.colors.<appearance>]` of the os-probe, run 40969040283), with no accent colour set. Each fact cites the
# main pass (Reduce Transparency on, the image's setting) and the pass with it off, which read every colour the same,
# and the Increase Contrast pass where that pass reads the same colour; where it reads another, a fact under
# `contrast_increased` follows. The accent-dependent NSColors (among those the accent-red pass of run
# 41006842699's macos-26 job changes: controlAccentColor, selectedContentBackgroundColor, alternateSelectedControlColor,
# selectedTextBackgroundColor, selectedControlColor, keyboardFocusIndicatorColor, textInsertionPointColor): those
# S9.1 names accent inputs (ADD-A123), `input.accent` (controlAccentColor), `input.highlight`
# (selectedTextBackgroundColor, the Highlight colour setting), `input.selected_content_background`,
# `input.keyboard_focus_indicator` and `input.selected_control`, are stated as their measured values, and the roles that take them
# (`role.global.accent`, `role.global.selection_text_background`, `role.selection.background`,
# `role.window.decoration_focus`, `role.@selected_control`) as references to them by the SDK's declarations (`read`);
# highlightColor is `role.@highlight`, a literal per scheme, which the red accent leaves unchanged (no input).

