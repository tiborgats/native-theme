# ---------------------------------------------------------------------------------------------------------------------
# Colour roles and inputs (macos-monterey): NSColor values as macOS 15.7.9 resolves them per appearance (sRGB,
# `[macos.colors.<appearance>]` of the os-probe, run 41006842699's macos-15 job), with no accent colour set, mirroring
# macos-tahoe's facts above key for key. Each fact cites the main pass (Reduce Transparency on, the image's setting),
# the pass with it off where it reads the same colour (every colour does), and the Increase Contrast pass where that
# pass reads the same colour; where it reads another, a fact under `contrast_increased` follows. The references to
# inputs and other roles cite the macOS 15.5 SDK's declarations (xcode@16.4).
# The accent inputs S9.1 names (ADD-A123; the tie-break of the monterey slice): selectedContentBackgroundColor,
# selectedControlColor and keyboardFocusIndicatorColor are stated as `input.selected_content_background`,
# `input.selected_control` and `input.keyboard_focus_indicator` (their measured values, which the red accent changes),
# and the roles that take them (`role.selection.background`, `role.@selected_control`, `role.window.decoration_focus`)
# as references to them (`read`), as `input.accent` and `input.highlight` are; highlightColor is `role.@highlight`, a
# literal per scheme, which the red accent leaves unchanged, as macos-tahoe's above.

