# Colour roles and inputs (macos-tahoe): NSColor values as macOS 26.6.2 resolves them per appearance (sRGB,
# `[macos.colors.<appearance>]` of the os-probe, run 40969040283), with no accent colour set. Each fact cites the
# main pass (Reduce Transparency on, the image's setting) and the pass with it off, which read every colour the same,
# and the Increase Contrast pass where that pass reads the same colour; where it reads another, a fact under
# `contrast_increased` follows. The accent-dependent NSColors (those the run's accent-red pass changes:
# controlAccentColor, selectedContentBackgroundColor, alternateSelectedControlColor, selectedTextBackgroundColor,
# selectedControlColor, keyboardFocusIndicatorColor, textInsertionPointColor) are inputs (S9.1): of them only
# `input.accent` is stated here, as a value; the roles that follow them are not stated (no input names, no read
# citation yet).

