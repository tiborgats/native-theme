# State models (S17). macos-tahoe's `button` entry states what the os-probe button passes measured: spike M's run
# 40969040283 (hover draws nothing, `highlight:` is a real press, Reduce Transparency changes no push-button pixel) and
# run 41006842699 (every bezel style, border shape, tint, image button and size, in a key window, another window key,
# the application inactive, Increase Contrast on, the accent red, and the focus ring under Full Keyboard Access). The
# variants AppKit draws that no fact states yet are not declared (the lane's report lists them for the pending form):
# `@small_square`, `@shadowless_square` (their fill is not one colour), `glass` (not one linear overlay, with a
# shadow), `menu` (NSComboButton: drawn dimmed in every state the pass set), and the nested identities.

[[model]]
# sizes: NSControl.ControlSize's five values, read back from each sheet's button; the default a new button's
# (`buttonWithTitle:`, controlSize 0, regular). `hover` is not an axis (spike M); `pressed` is `highlight:`.
# `focus_visible`: the focus ring, drawn with Full Keyboard Access on. Conditions: `window_inactive` with `not_main`
# (another window key), and `app_inactive`, under which the window is neither key nor main (the inactive pass reads
# both false), so `app_inactive` without the other two is not drawn. exclusive_variants: one bezel style (push the
# base; `flat` is bordered NO, which no bezel style draws), one border shape, one tint prominence, one image position.
widget = "button"
when = { conditions = ["preset:macos-tahoe"] }
available = true
variants = ["toggle", "@flexible_push", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "flat", "primary", "tinted", "destructive", "pill", "@rounded_rectangle", "icon_only", "with_icon"]
sizes = ["mini", "small", "regular", "large", "extra_large"]
default_size = "regular"
densities = []
axes = { states = ["pressed", "disabled", "default", "checked", "focus_visible"], conditions = ["scheme:light", "scheme:dark", "window_inactive", "not_main", "app_inactive", "contrast_increased"], contexts = [] }
exclusive = []
exclusive_variants = [["@flexible_push", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "flat"], ["pill", "@rounded_rectangle", "circular"], ["primary", "tinted"], ["icon_only", "with_icon"]]
not_drawn = [{ conditions = ["app_inactive"], not_conditions = ["window_inactive"] }, { conditions = ["app_inactive"], not_conditions = ["not_main"] }]
rows = ["MAC-B01", "MAC-B02", "MAC-B07", "MAC-B08", "MAC-B10", "MAC-X16", "MAC-X17"]

