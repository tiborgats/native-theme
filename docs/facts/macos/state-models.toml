# State models (S17). macos-tahoe's `button` entry states what the os-probe button passes measured: spike M's run
# 40969040283 (hover draws nothing, `highlight:` is a real press, Reduce Transparency changes no push-button pixel) and
# run 41006842699 (every bezel style, border shape, tint, image button and size, in a key window, another window key,
# the application inactive, Increase Contrast on, the accent red, and the focus ring under Full Keyboard Access).
# Every variant AppKit draws is declared, so none falls through to the push bezel's facts: where no pass measured a
# look (NSComboButton's states, the non-uniform square bezels, glass's shadow, a toolbar's buttons) the facts are
# pending (button.toml's pending section; the register rows U90-U100).

[[model]]
# sizes: NSControl.ControlSize's five values, read back from each sheet's button; the default a new button's
# (`buttonWithTitle:`, controlSize 0, regular). `hover` is not an axis (spike M); `pressed` is `highlight:`.
# `focus_visible`: the focus ring, drawn on the first responder with Full Keyboard Access on; Full Keyboard Access by
# itself changes no pixel (the focus pass's unfocused layers are byte-identical with the key pass's), so it is no
# condition, and `focused` without the ring draws nothing. Conditions: `window_inactive` with `not_main` (another window
# key), and `app_inactive`, under which the window is neither key nor main (the inactive pass reads both false), so
# `app_inactive` without the other two is not drawn; a window key but not main, or main but not key, is drawn and
# was not captured (pending U93). `checked` is the on state of a `toggle` (pushOnPushOff); a momentary button has no
# on state to draw. One bezel style per button (`bezelStyle` holds one raw value; the SDK's old names `recessed`,
# `roundRect`, `inline` and `texturedRounded` are the raw values 13, 12, 15 and 11, `NSButtonCell.h:74-78`, so they
# are `@accessory_bar`, `@accessory_bar_action`, `@badge` and `tool`, no variants of their own; `flat` is bordered NO,
# which draws no bezel; `menu` is NSComboButton in its `.unified` style, another control, whose default `.split`
# style is the `split_button` widget, ADD-A123: the probe's `combo_unified` buttons, `combo_split` being no button),
# one border shape, one tint prominence, one image position. The context: a button in a toolbar (`NSToolbarItem`,
# the probe's toolbar window, which gives its item views control size extra_large, `view_*_controlSize_raw` 4: their
# min_height and font are stated, the rest pending U94). Each variant was measured alone; the sets AppKit draws are
# the products below (the tie-break of MC-C1), their looks pending but for the image sheets' sets (below).
# The output-route button (MAC-P3-9†, the facts lane t16b): `route` is AVKit's AVRoutePickerView, an NSView
# (AVRoutePickerView.h:31, :83), not an NSButton bezel, so it holds none of the bezel variants; its four button states
# (:62-67) are rest, pressed (highlighted), `route_active` (AirPlay active) and both, so it draws no `disabled`
# and no `default` (the class declares no enabled state, key equivalent or control size: it takes no size), and
# `route_active` only on it; `@bordered` is `routePickerButtonBordered` (:118-121, default YES), only on it.
# The tie-break of MC-C1 (the blind verifier, its model compared): `indeterminate` (a toggle in the mixed state: an
# NSButton holds one NSControlStateValue, so never with `checked`, and only a stateful type shows it; `exclusive`'s
# group `[indeterminate, checked]`, ADD-A141 in place of a `not_drawn` pair: the button's one `state` property is
# mixed, off or on, the mixed state a value of its own in place of on, so a connector reporting both is answered with
# the mixed state, NSButton.h's `state` and NSCell.h's three values below), `selected` (the
# item NSToolbar's `selectedItemIdentifier` names, highlighted, in a toolbar only; MAC-TL11†) and `@menu_on_hold` (an
# NSComboButton with an action, its menu on a click and hold, the catalogue's) are drawn, their looks pending (U693,
# U694; `menu_trigger` stated); NSComboButton is no NSButton and declares no key equivalent, and the window's default
# button is an NSButtonCell, so `menu` draws no `default`. One NSButton holds a bezel style (or none), a border shape,
# a tint prominence, a button type, a destructive action and an image position at once, and an NSComboButton a title,
# an image or both: `variant_products` states those sets (AppKit draws each; run 42272240639's image sheets measured
# a bezel, border shape, tint or destructive button with the image, [style, with_icon], and [circular, icon_only],
# the image-only circular button's, in the key window: their facts in button.toml; no pass measured another set:
# U695's pending facts there), trimmed by `exclusive_variants`.
widget = "button"
when = { conditions = ["preset:macos-tahoe"] }
available = true
variants = ["toggle", "@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "glass", "flat", "primary", "tinted", "destructive", "pill", "@rounded_rectangle", "menu", "icon_only", "with_icon", "route", "@bordered", "@menu_on_hold"]
sizes = ["mini", "small", "regular", "large", "extra_large"]
default_size = "regular"
sizes_by_variant = [{ variant = "route", sizes = [] }]
densities = []
axes = { states = ["pressed", "disabled", "default", "checked", "indeterminate", "focus_visible", "selected", "route_active"], conditions = ["scheme:light", "scheme:dark", "window_inactive", "not_main", "app_inactive", "contrast_increased"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }] }
exclusive = [["indeterminate", "checked"]]
variant_sets = [["route", "@bordered"]]
exclusive_variants = [["@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "glass", "flat", "menu", "route"], ["pill", "@rounded_rectangle", "circular"], ["primary", "tinted"], ["icon_only", "with_icon"]]
variant_products = [[{ any = ["@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "glass", "flat"] }, { any = ["pill", "@rounded_rectangle"] }, { any = ["primary", "tinted"] }, { any = ["toggle"] }, { any = ["destructive"] }, { any = ["icon_only", "with_icon"] }], [{ one = ["menu"] }, { any = ["@menu_on_hold"] }, { any = ["icon_only", "with_icon"] }]]
not_drawn = [{ conditions = ["app_inactive"], not_conditions = ["window_inactive"] }, { conditions = ["app_inactive"], not_conditions = ["not_main"] }, { states = ["checked"], not_variants = ["toggle"] }, { states = ["route_active"], not_variants = ["route"] }, { variants = ["@bordered"], not_variants = ["route"] }, { states = ["disabled"], variants = ["route"] }, { states = ["default"], variants = ["route"] }, { states = ["indeterminate"], not_variants = ["toggle"] }, { states = ["selected"], not_context = [{ scope = "any", widget = "toolbar", part = "bar" }] }, { variants = ["@menu_on_hold"], not_variants = ["menu"] }, { states = ["default"], variants = ["menu"] }]
rows = ["MAC-B01", "MAC-B02", "MAC-B07", "MAC-B08", "MAC-B10", "MAC-X16", "MAC-X17", "MAC-P3-9†", "MAC-TL11†", "MAC-N29†"]

