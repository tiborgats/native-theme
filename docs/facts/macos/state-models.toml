[[model]]
# macos-monterey (macOS 15.7.9, run 41006842699's macos-15 job, the probe built with Xcode 16.4 against the macOS
# 15.5 SDK). sizes: NSControlSize's four values in the macOS 15.5 SDK (no NSControlSizeExtraLarge, which the 26.5 SDK
# adds for macOS 26; the probe drew no extraLarge: "unavailable: extraLarge needs macOS 26"), read back from each
# sheet's button; the default a new button's (controlSize 0, regular). As on macOS 26: hover draws nothing (every
# hovered push button differs from its normal capture in 0 pixels), a click draws as `highlight:` (the clicked
# capture differs from the pressed one in 0 pixels), Full Keyboard Access by itself changes no pixel (the focus pass's
# unfocused layers are byte-identical with the key pass's), `checked` is pushOnPushOff's on state, and the window
# conditions are those of macos-tahoe's entry (another window key: `window_inactive`, `not_main`; the application
# inactive: `app_inactive` with both). The variants are tahoe's less what macOS 15 does not draw: no `glass`
# (NSBezelStyle has no glass member in the 15.5 SDK), no tint prominence (`primary`, `tinted`: NSButton declares no
# tintProminence) and no border shapes (`pill`, `@rounded_rectangle`: no NSControlBorderShape), so the shape group
# of tahoe's exclusive_variants is gone and `circular` is the bezel style alone. Reduce Transparency is on in every
# pass (the runner image's setting); no macOS 15 pass draws the buttons with it off. The toolbar context draws
# otherwise: the toolbar bezel in a toolbar is 22 px high, on the sheet 20 px (the item view's and the sheet button's
# intrinsic height, the last two citations; the tie-break of the monterey slice).
# The tie-break of MC-C1 (the blind verifier, its model compared): `indeterminate` (a toggle in the mixed state: an
# NSButton holds one NSControlStateValue, so never with `checked`, and only a stateful type shows it; `exclusive`'s
# group `[indeterminate, checked]`, ADD-A141 in place of a `not_drawn` pair: the button's one `state` property is
# mixed, off or on, the mixed state a value of its own in place of on, so a connector reporting both is answered with
# the mixed state, NSButton.h's `state` and NSCell.h's three values below), `selected` (the
# item NSToolbar's `selectedItemIdentifier` names, highlighted, in a toolbar only; MAC-TL11†) and `@menu_on_hold` (an
# NSComboButton with an action, its menu on a click and hold, the catalogue's) are drawn, their looks pending (U693,
# U694; `menu_trigger` stated); NSComboButton is no NSButton and declares no key equivalent, and the window's default
# button is an NSButtonCell, so `menu` draws no `default`. One NSButton holds a bezel style (or none), a border shape,
# a tint prominence, a button type, a destructive action and an image position at once, and an NSComboButton a title,
# an image or both: `variant_products` states those sets (AppKit draws each; run 42272240639's image sheets measured
# a bezel or destructive button with the image, [style, with_icon], and [circular, icon_only], the image-only
# circular button's, in the key window: their facts in button.toml; no pass measured another set: U695's pending
# facts there), trimmed by `exclusive_variants`.
# As on macos-tahoe, the output-route button: AVRoutePickerView is in the 15.5 SDK (macos(10.15)), with its four
# button states, its border (default YES) and no enabled state, key equivalent or control size, so `route`, `@bordered`
# and `route_active` are declared as there, every look pending on macOS 15 (U692: no macOS 15 pass reads the view).
widget = "button"
when = { conditions = ["preset:macos-monterey"] }
available = true
variants = ["toggle", "@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "flat", "destructive", "menu", "icon_only", "with_icon", "route", "@bordered", "@menu_on_hold"]
sizes = ["mini", "small", "regular", "large"]
default_size = "regular"
sizes_by_variant = [{ variant = "route", sizes = [] }]
densities = []
axes = { states = ["pressed", "disabled", "default", "checked", "indeterminate", "focus_visible", "selected", "route_active"], conditions = ["scheme:light", "scheme:dark", "window_inactive", "not_main", "app_inactive", "contrast_increased"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }] }
exclusive = [["indeterminate", "checked"]]
variant_sets = [["route", "@bordered"]]
exclusive_variants = [["@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "flat", "menu", "route"], ["icon_only", "with_icon"]]
variant_products = [[{ any = ["@flexible_push", "@small_square", "@shadowless_square", "@accessory_bar", "@accessory_bar_action", "@badge", "circular", "help", "tool", "flat"] }, { any = ["toggle"] }, { any = ["destructive"] }, { any = ["icon_only", "with_icon"] }], [{ one = ["menu"] }, { any = ["@menu_on_hold"] }, { any = ["icon_only", "with_icon"] }]]
not_drawn = [{ conditions = ["app_inactive"], not_conditions = ["window_inactive"] }, { conditions = ["app_inactive"], not_conditions = ["not_main"] }, { states = ["checked"], not_variants = ["toggle"] }, { states = ["route_active"], not_variants = ["route"] }, { variants = ["@bordered"], not_variants = ["route"] }, { states = ["disabled"], variants = ["route"] }, { states = ["default"], variants = ["route"] }, { states = ["indeterminate"], not_variants = ["toggle"] }, { states = ["selected"], not_context = [{ scope = "any", widget = "toolbar", part = "bar" }] }, { variants = ["@menu_on_hold"], not_variants = ["menu"] }, { states = ["default"], variants = ["menu"] }]
rows = ["MAC-B01", "MAC-B02", "MAC-B08", "MAC-B10", "MAC-X16", "MAC-X17", "MAC-P3-9†", "MAC-TL11†", "MAC-N29†"]

