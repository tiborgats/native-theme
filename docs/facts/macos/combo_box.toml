# Facts of `combo_box` on macos-tahoe and macos-monterey ahead of its unit (the 0.8.0 plan enables it later; until then
# the gate and generate_preset.py skip these facts, spec S17 *While 0.8.0 is built*). Only what the spec batches
# ADD-A126 and ADD-A127 ask of the macOS lane is stated here: the content row (MAC-CB01, ADD-A127). The widget's state model and its other
# facts are its unit's lane's.

# macos-tahoe: the bordered pop-up's `body.padding` start, top and bottom per control size, the distance from
# the alignment rect to the cell's title rect (run 41195846264's controls pass, analysis/read_controls.py), as
# the button's padding is read; the label's own padding is not separated from it (the button's is not either).
# The rest of the row is unread: the gap to the rendering's arrow (U167), an item image (U168), the arrow area
# and the end padding (U169), the width's basis and slack (U170), the cut (U171), NSComboBox's arrow button
# and row (U172), and on macos-monterey its large form (U176). macos-monterey's bordered pop-up's start, top and
# bottom padding are run 42215651196's controls pass on macOS 15 (analysis/read_controls.py), read as macos-tahoe's.

