# button (macos-tahoe): the push button (`bezelStyle` push) as AppKit draws it on macOS 26.6.2, measured in the
# os-probe button pass of run 40969040283 (docs/evidence/os-probe/2026-10-29-run-40969040283/README.md): a key, main
# window of the active application, Reduce Transparency on (the runner image's setting; the offscreen push-button
# renders are pixel for pixel the same with it off, button-pass/analysis.toml `*.offscreen.*`), Increase Contrast
# off, no accent colour set (controlAccentColor #007aff). A fill is the capture's pixel: the bezel composited over the
# window background (windowBackgroundColor, #ffffff and #1e1e1e), not the layer's own colour and alpha. Each fill
# fact cites every control size it was read at (mini to extraLarge), which all draw the same colour. The state model
# is state-models.toml's: hover draws nothing (no fact states it), `default` is the Return key equivalent,
# `checked` the `pushOnPushOff` button's on state (variant `toggle`). Facts are in the order: the base, the states,
# `default` with its states, the checked toggle with its states.

