# button (macos-tahoe): AppKit's NSButton as macOS 26.6.2 draws it, measured in the os-probe button pass of run
# 41006842699 (docs/evidence/os-probe/2026-10-30-run-41006842699/README.md). Each colour is the button's own layer,
# its straight colour and alpha solved per pixel from captures over black and white backdrops (not the composite over
# the window background), read by analysis/measure_button_layers.py (its docstring is the method), which also states
# each corner, the label's and icon's colour solved over the fill, what is drawn outside the frame and the focus ring.
# Passes: a key, main window of the active application (no condition); another window key (`window_inactive`,
# `not_main`), and the application deactivated, which draws the same (so one fact holds for both, citing both);
# Increase Contrast on (`contrast_increased`: fill, label and icon only, read where the layer composited over grey
# matches the capture over grey within 2 levels; its 1 px edge line is not one linear overlay and is not stated, nor
# its corners); the accent set to red (the measured derivations `= input.accent`). Reduce Transparency is on in every
# pass (the runner image's setting; spike M found the push button the same with it off).
# The variants: the bezel styles `@flexible_push` (2), `@accessory_bar` (13, the SDK's old `recessed`),
# `@accessory_bar_action` (12, old `roundRect`), `@badge` (15, old `inline`), `circular` (7, and the 26 border shape
# circle, which draws the same), `help` (9), `tool` (11, old `texturedRounded`); `flat` (bordered NO); `primary` and
# `tinted` (tintProminence primary, secondary); `destructive`; `pill` (border shape capsule), `@rounded_rectangle`;
# `icon_only`, `with_icon` (the symbol "star"); `toggle` (pushOnPushOff, `checked` its on state); `default` is the
# Return key equivalent. Facts are ordered from the least to the most specific combination: for a key and a
# combination the last that holds applies (S17). A value read the same in several variants, sizes or schemes is one
# fact citing up to eight of its readings (one per variant, scheme and state first); a fact names a scheme or size
# only where the readings differ.

[[fact]]
key = "button.body.corners.bottom_left"
when = { conditions = ["preset:macos-tahoe"], sizes = ["extra_large"] }
value = { full = { maximum_px = "absent" } }
rows = ["MAC-B08"]

