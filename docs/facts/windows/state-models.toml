# windows-11's state models (S17): the combinations WinUI 2.5.1's control templates and their C++ draw.
# Written by the Windows facts lane.
# Variants (ADD-A121): each is one control class or one style (WinUI's `Style` holds one), so an element holds one of
# them; the sets of two are the app-bar toggle (AppBarToggleButton, a ToggleButton), `toggle` with `tool`, and the
# app-bar button with a Flyout (its HasFlyout chevron), `menu` with `tool`.
# Contexts (ADD-A125, ledger queue #86): a dialog's action area and a command bar (`toolbar.bar`, W1-099, W1-102).
# The command bar inside the tabbed command bar, whose items are CommandBars placing their labels beside the icons,
# is the ordered chain `[{ widget = "component.tabbed_command_bar" }, { widget = "toolbar", part = "bar" }]`
# (W-RV-3†, W1-102), which check_facts.py does not read yet ("axes.contexts[2] is not a table"): added with it.
# The buttons WinUI draws only inside another control (S17's *What the axes and sets hold*, ADD-A141, the WN-C1
# tie-break): AutoSuggestBox's query button (`@query`, W2-15), the date and time picker flyouts' accept and dismiss
# buttons (`@accept`, `@dismiss`, W2-04), PagerControl's first-page, last-page and number buttons (`@first`, `@last`,
# `@page_number`, W2-21) and SemanticZoom's zoom-out button (`@zoom_out`, W2-34), each a style of its own, declared
# with its host's context and not drawn outside it; the gate skips their combinations until the hosts' units are
# enabled, and their facts and the states only those hosts draw (the number button's `selected`) come with them.


[[model]]
widget = "button"
available = true
variants = ["primary", "flat", "toggle", "menu", "tool", "@repeat", "@query", "@accept", "@dismiss", "@first", "@last", "@page_number", "@zoom_out"]
sizes = []
densities = []
axes = { states = ["hover", "pressed", "disabled", "focus_visible", "checked", "indeterminate", "default"], conditions = ["scheme:light", "scheme:dark", "contrast_high", "window_inactive"], contexts = [{ widget = "dialog", part = "action_area" }, { widget = "toolbar", part = "bar" }, { widget = "search_field", part = "body" }, { widget = "date_picker", part = "popup" }, { widget = "time_picker", part = "popup" }, { widget = "page_indicator", part = "body" }, { widget = "component.semantic_zoom" }] }
exclusive = [["disabled", "pressed", "hover"], ["indeterminate", "checked"]]
exclusive_variants = [["primary", "flat", "toggle", "menu", "@repeat", "@query", "@accept", "@dismiss", "@first", "@last", "@page_number", "@zoom_out"], ["primary", "flat", "tool", "@repeat", "@query", "@accept", "@dismiss", "@first", "@last", "@page_number", "@zoom_out"]]
variant_sets = [["toggle", "tool"], ["menu", "tool"]]
not_drawn = [{ states = ["checked"], not_variants = ["toggle"] }, { states = ["indeterminate"], not_variants = ["toggle"] }, { states = ["indeterminate"], variants = ["tool"] }, { states = ["disabled", "focus_visible"] }, { states = ["default"], not_context = [{ widget = "dialog", part = "action_area" }] }, { states = ["focus_visible"], conditions = ["window_inactive"] }, { variants = ["@query"], not_context = [{ widget = "search_field", part = "body" }] }, { variants = ["@accept"], not_context = [{ widget = "date_picker", part = "popup" }, { widget = "time_picker", part = "popup" }] }, { variants = ["@dismiss"], not_context = [{ widget = "date_picker", part = "popup" }, { widget = "time_picker", part = "popup" }] }, { variants = ["@first"], not_context = [{ widget = "page_indicator", part = "body" }] }, { variants = ["@last"], not_context = [{ widget = "page_indicator", part = "body" }] }, { variants = ["@page_number"], not_context = [{ widget = "page_indicator", part = "body" }] }, { variants = ["@zoom_out"], not_context = [{ widget = "component.semantic_zoom" }] }]
rows = ["W1-018", "W1-019", "W1-020", "W1-022", "W1-099", "W1-102"]

