# The scroll into view (W-P4-3†): a TextBox below a ScrollViewer's view focused by keyboard moves the view to its
# final offset in one step, with no inertial change (the WinUI host, read_host.py's [scroll_into_view]): a measured
# zero. A motion in no time runs no curve, so it has its duration and no keyed timing (S4.1's *A motion in no time*,
# ADD-A141): no `token.motion.timings.scroll_into_view` fact or key.
[[fact]]
key = "token.motion.durations.scroll_into_view"
value = "0ms"
rows = ["W-P4-3†"]

