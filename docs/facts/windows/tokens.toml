# The ring's inner corners (S2.10, ADD-A122): WinUI takes the focus target's CornerRadius less the mean of the two
# margins at each corner for the outer ring, and that less the outer thickness for the inner border (the outer
# ring's inner edge), each at least 0 and a square corner kept square: follow_part where the part's corner is
# rounded and its offsets equal; a part with a square corner states Px(0). Each corner is one arc whose two
# extents are that one radius (geometry.cpp:986-993, :1148-1159): circular.
