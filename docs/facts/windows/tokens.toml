# The caret (S4.2): WinUI's TextBoxView draws it. Its blink is a storyboard of two discrete key frames over a
# period of twice GetCaretBlinkTime (TextBoxHelpers.cpp:55-89): opacity 0 from half the period, back at its end,
# so the caret is on for one blink time and off for one, switching at once (hard).
[[fact]]
key = "token.caret.blink_style"
value = "hard"
rows = ["W3-24"]

[[fact.cite]]
kind = "published"
source = "microsoft-ui-xaml@2.5.1 src/dxaml/xcp/core/text/TextBox/TextBoxHelpers.cpp:178-192"
quote = "// Make the ramps durations 0, but add their original durations to the plateaus."

[[fact.cite]]
kind = "published"
source = "microsoft-ui-xaml@2.5.1 src/dxaml/xcp/core/text/TextBox/TextBoxHelpers.cpp:26-28"
quote = "//      <DiscreteDoubleKeyFrame Value=\"rValue\" KeyTime=\"{rEndTime}\"/>"

# The blink time is the system's GetCaretBlinkTime (TextBoxHelpers.cpp:55-89; WinUI falls back to 500ms only where
# it reads 0), which the WinUI host read as 530 on the runner image (register U505, measured): on for one blink
# time, off for one. The blink stops after the whole periods that fit in TextSelectionSettings' 5s, three periods
# where none fits (CheckCaretBlinkTimeout, TextBoxView.cpp:2742-2763), in S2.2's arithmetic as S4.2 writes it
# (ADD-A134): `p` the period, add(blink_on, blink_off), `n` floor(div(5000ms, p)), the timeout
# mul(p, add(n, mul(3, sub(1, min(n, 1))))), which stays pending (U505) until scripts/check_fact_citations.py
