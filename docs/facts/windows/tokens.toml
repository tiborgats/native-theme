# The colour space (`token.motion.color_space`, S2.7, ADD-A125): the composition path's, which the brush transitions
# take (a `ColorKeyFrameAnimation` interpolating in `CompositionColorSpace_Rgb`,
# microsoft-ui-xaml@2.5.1 src/dxaml/xcp/components/comptree/SharedTransitionAnimations.cpp:111), whose arithmetic the
# compositor holds, not the cache: measured (U157). The WinUI host's brush transitions between colours of different
# alpha over white draw straight interpolation (each channel and the alpha apart, unpremultiplied) within a level,
# premultiplied and Oklab off by 16 to 51 levels (read_host.py's [color_space]), which names the model's
# `straight_srgb8`. ADD-A141 (S2.7) names `straight_srgb` instead, the refit with and without the 8-bit truncation
# showing the compositor does not truncate; the fact keeps the committed analysis's member until read_host.py's next
# revision (U701) commits that refit and states its method (the t grid, the error measure, the composite rounded to whole
# levels or not), as S2.7 requires before the fact names the member.
[[fact]]
key = "token.motion.color_space"
value = "straight_srgb8"
rows = ["W1-023"]

[[fact.cite]]
kind = "measured"
evidence = "docs/evidence/winui-host/2026-11-06-run-42308526155/winui-host-windows-11-arm/analysis.toml#color_space.space"
