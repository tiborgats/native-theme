# Behaviour: the system defaults the Win32 reference states (the reader reads the user's).

[[fact]]
key = "token.behavior.double_click_time"
value = "500ms"
rows = ["W3-41"]

[[fact.cite]]
kind = "published"
source = "sdk-api@656e9656 sdk-api-src/content/winuser/nf-winuser-setdoubleclicktime.md:62"
quote = "The number of milliseconds that may occur between the first and second clicks of a double-click. If this parameter is set to 0, the system uses the default double-click time of 500 milliseconds. If this parameter value is greater than 5000 milliseconds, the system sets the value to 5000 milliseconds."

[[fact]]
key = "token.behavior.scroll_lines_per_step"
value = 3
rows = ["W3-41"]

[[fact.cite]]
kind = "published"
source = "sdk-api@656e9656 sdk-api-src/content/winuser/nf-winuser-systemparametersinfoa.md:1294"
quote = "Retrieves the number of lines to scroll when the vertical mouse wheel is moved. The <i>pvParam</i> parameter must point to a <b>UINT</b> variable that receives the number of lines. The default value is 3."


