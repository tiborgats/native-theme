quote = "void AdjustCornerRadius(XCORNERRADIUS& cornerRadius, XTHICKNESS& adjustment) { if (cornerRadius.topLeft != 0) { cornerRadius.topLeft -= (adjustment.top + adjustment.left) * 0.5f; if (cornerRadius.topLeft < 0) cornerRadius.topLeft = 0; }"

[[fact.cite]]
