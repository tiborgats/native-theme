# windows-11's colour roles (S3) and inputs (S9.1): microsoft-ui-xaml at winui3/release/2.5.1 (the Windows App SDK
# 2.5.1 release set), `controls/dev/CommonStyles/Common_themeresources_any.xaml` and the resources that use it.
# Written by the Windows facts lane.
#
# WinUI's theme dictionaries: `Default` is the dark theme, `Light` the light one, `HighContrast` replaces both while
# a contrast theme is on (so its facts come last for each key: the last fact whose `when` holds applies, S17).
# Keyed roles: one per brush (or colour) the file defines, named by WinUI's resource name in snake_case with `Brush`
# and the word `Color` left out (`ControlFillColorDefaultBrush` -> `role.@control_fill_default`). The record and
# global roles, and every part, refer to them, as WinUI's controls refer to the brushes.


# Keyed roles. The light and dark values are the `Color` literals (or the brush's own); the accent brushes are
# the brush's accent step at the brush's opacity; under high contrast each brush names one of the eight system
# colours, which the reader reads (role.@system_*, W3-35), or WinUI's placeholder where the dictionary holds only the
# `Color`.

