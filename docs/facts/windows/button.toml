# The accent style (`primary`, and the dialog's default button, which takes it) sets no Padding or BorderThickness;
# the WinUI host read DefaultButtonStyle's reaching it (register U1, measured): Padding 11,5,11,6 and
# BorderThickness 1 on an AccentButtonStyle button and on a ContentDialog's default PrimaryButton, which the facts
# state as the shared facts do, the padding plus the border's width (read_host.py's [button.*]). The app-bar styles
# are their types' own (TargetType AppBarButton, AppBarToggleButton): the AppBarButton's BorderThickness is the
# framework's default 0 and the AppBarToggleButton's 1; neither template binds Padding (the content sits by its own
# margins: the host read Padding 0 and the parts' margins). `tool`'s padding is S2.11's *A template laid out by
# margins* (ADD-A141, U1), in the FullSize view state (the label below): across, the content stretched and centred,
# the label's margin 2 less the inner border's 2 on each side; down, the auto rows stacked from the top, the icon's
# top margin 16 less the inner border's 6, and at the bottom what the icon (16), the facing margins (2 and 0) and the
# label's line leave of the 52 px box (ContentRoot's MinHeight 64 less the margins 6 and 6). Checked against the
# WinUI host's `standalone` pass (frames.toml [[part]]): the inner border 2,6,64,52, the icon 26,16 and the label's
