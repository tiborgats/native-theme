# open one in FullSize (the label below), which the context does not tell apart, and whether the label shows there is
# `label_position`'s (U517): the bar's padding, bottom margin and minimum height stay U1's until the model states which
# view state `context toolbar.bar` draws (Compact by S2.11: 10 above and below, across the Viewbox's margin 0 less the
# inner border's 2, a negative result being zero, S1). The tabbed command bar's items set
# DefaultLabelPosition Right (TabbedCommandBarItem.xaml:69), so its app-bar buttons take LabelOnRight: the icon and the
# label in row 0 (columns 0 and 1), from the start edge, the control's Width NaN (its width storyboard), ContentRoot's
# MinHeight 48; S2.11: the near sides the margin differences, the end the label's end margin less the inner
