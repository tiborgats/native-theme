# The drop-down chevron's AnimatedIcon states (S2.7's `WinUiAnimatedIcon`, ADD-A126): each visual state sets only
# the icon's State, the player running the segment between the two states' markers of AnimatedChevronDownSmall,
# timed by the visual (duration and timing absent), with no delay. A `Keyed` transition of group `Glyph`, the part
# drawing a glyph; its colour changes at once (a DiscreteObjectKeyFrame). The visual's entry is
# `token.icons.animated_visuals.chevron_down_small` (tokens.toml). An app-bar button's chevron (`menu` with
# `tool`) is a FontIcon with no Transitions, and outside `menu` no indicator is drawn: the base states none and the
# drop-down button's transitions hold where it is drawn (S6.1 merges a rule's transitions by key, so an empty list
