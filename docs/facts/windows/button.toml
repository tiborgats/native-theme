# The app-bar toggle button's fill (AppBarToggleButton, `tool` with `toggle`): its Background per visual state, the
# Light and Default dictionaries alike, set on AppBarToggleButtonInnerBorder (Background="{TemplateBinding
# Background}", :469) at rest and by the CommonStates setters otherwise. Its colours of label, icon and stroke are
# stated above; its fill was not. The app-bar button's fill facts above (`variants = ["tool"]`) hold for it too and
# these, after them and after their high-contrast ones, replace them (the high-contrast ones last), so the fill's
# facts at rest are one under `tool` and one under its complement, which give the preset its base (S11).

[[fact]]
key = "button.body.fill"
when = { variants = ["tool", "toggle"] }
value = "= role.@subtle_fill_transparent"
rows = []

