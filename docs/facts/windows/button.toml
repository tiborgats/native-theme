# windows-11's `button` (the catalogue's entry, S5): microsoft-ui-xaml at winui3/release/2.5.1,
# `controls/dev/CommonStyles/{Button,ToggleButton,RepeatButton,AppBarButton,AppBarToggleButton}_themeresources.xaml` and
# `controls/dev/DropDownButton/`, with the framework's C++ defaults where the XAML states nothing. Facts in the
# visual-state order of the templates (Normal, PointerOver, Pressed, Disabled; the toggle's Checked* and
# Indeterminate*), variants after the base, and every high-contrast fact after the light and dark ones, so the last
# matching fact is the one WinUI's VisualStateManager and theme dictionaries pick. Colours refer to the keyed roles of
# roles.toml (one per WinUI brush). Written by the Windows facts lane.


# Geometry and text the plain, subtle, toggle, drop-down and repeat buttons' styles set alike. The accent
# style (`primary`) sets none of them, and the app-bar button (`tool`) its own: both are left out here (see the lane's
# unmeasured list).

