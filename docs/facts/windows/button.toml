# The tabbed command bar's label-beside-icon position (InlineTop, ADD-A123, W1-102): each TabbedCommandBarItem sets
# DefaultLabelPosition Right, so its app-bar buttons take LabelOnRight, which moves the label to row 0 column 1 with
# the margin 8,16,12,10 and the chevron to the margin -7,20,12,0. The chevron sits in the content's row after the
# label, top-aligned, in its Auto column sized to the glyph and those margins, so its box is the glyph's (min_width
# and min_height auto). The gap is the label's end margin (12) and the start margin the chevron's (-7), the row
# margins of S2.11; the top and end margins are from body's content box: ContentRoot's 20 and 12, less the inner
# border's inset (6, 2) and body's padding (pending for `tool`, U1). The bottom margin is the written 0.
[[fact]]
key = "button.values.menu_indicator_anchor"
when = { variants = ["menu", "tool"], context = [{ widget = "toolbar", part = "bar" }, { widget = "component.tabbed_command_bar" }] }
value = "inline_top"
rows = ["W1-102"]

