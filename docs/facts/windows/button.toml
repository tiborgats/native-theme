# Pending (S17, ADD-A122; register U1): the accent style (`primary`, and the dialog's default button, which takes
# it) sets no Padding or BorderThickness; whether DefaultButtonStyle's setters reach it is the WinUI host's
# measurement. The app-bar styles are their types' own (TargetType AppBarButton, AppBarToggleButton): the
# AppBarButton's BorderThickness is the framework's default 0 and the AppBarToggleButton's 1; neither template
# binds Padding (the content sits by its own margins), so `tool`'s padding stays pending.
