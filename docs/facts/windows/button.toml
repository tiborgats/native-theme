# The app-bar button's chevron: a FontIcon (U+E974 of SymbolThemeFontFamily) at font size 8, mirrored in
# right-to-left, no size of its own. Under the default and icon-only label positions (W1-102, ADD-A122) it lies over
# the top-end corner (TopEnd): its zero-width Auto column is arranged to the column less the margins -23 and 12, so
# its box is 11 px wide (min_width), the glyph centred in it, 20 px below ContentRoot's top and 12 px in from its end;
# body is the drawn AppBarButtonInnerBorder, inset 2,6,2,6 from ContentRoot, so the margin from body is 14 and 10.
# The rule holds in a command bar (`context toolbar.bar`, W1-102): its overflow menu shows OverflowSubItemChevron
# instead (:275-278). The tabbed command bar's label-beside-icon position (LabelOnRight, margin -7,20,12,0) is
# InlineTop (ADD-A123), stated after this rule. The glyph's source is U+E974 (the XAML character reference
# `&#xE974;`) in Segoe Fluent Icons, its fallback Segoe MDL2 Assets through token.text.fallbacks.per_family
# (tokens.toml), stated under both positions.
