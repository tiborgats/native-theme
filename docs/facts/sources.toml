# The pinned platform sources of the 0.8.0 model (plan D1, specification S17).
#
# One [[source]] per platform source and generation (a page snapshot: one per page, keyed by its id), frozen until
# 0.8.0 unless the ledger records a re-pin. A fact
# cites a source as `source = "<id> <path>:<lines>"`, the id being `<name>@<version>`: the release's version as its
# project names it (`breeze@6.8.2` for the tag v6.8.2), or the commit's first eight hex digits where the project has
# no tag for the release (`tag = "commit"`, the reason in `note`).
#
# Fields:
#   kind          "git": a repository fetched at `commit` by scripts/update_sources.sh into <cache>/<id>/;
#                 "sdk": an SDK on a CI runner image (Apple's headers exist only on macOS runners), not fetched;
#                 "distribution": a dated package snapshot the KDE and GNOME harnesses install, not fetched.
#   project       the name scripts/citations.py gives the project's citations (absent where none cites it).
#   repository    the canonical repository; tag, its tag ("commit" where none); commit, the full SHA (an annotated
#                 tag's peeled commit; tag_object, its tag object).
#   release       the release the pin belongs to; generations, the preset ids it serves.
#   researched    the date the pin was read; proof, how (every SHA comes from git ls-remote or the GitHub API);
#                 arch, the package and release in archlinux@2026-10-29 where the snapshot carries it.
#   sparse        large repositories: the folders the documents cite, fetched alone (cone mode).
#   site          documentation repositories: the site whose pages they are the source of.
#
# The release set (docs/todo_v0.7.1_model-completeness-ledger.md, *Release set*): the newest stable release of each
# platform at M0 (2026-10-29), coherent. KDE and GNOME: what the Arch Linux Archive snapshot of 2026-10-29 carries
# (Plasma 6.8.2, KDE Frameworks 6.31.0, KDE Gear 26.08.2, Qt 6.12.0, GNOME 51); the other cited projects of those
# platforms at the snapshot's version, which is each one's newest stable (git ls-remote of its tags). Material:
# material-web v2.5.0, Compose Material 3 1.4.0 (androidx), material-color-utilities by commit, Android 17's AOSP
# tag. The Android emulator's system image (API 37.0 rev 8, 4 KB pages, or API 37.1 rev 9, 16 KB pages only) is
# decided by spike A and recorded here then. Windows: the Windows App SDK 2.5.1 pair, the Community Toolkit
# 8.2.251219, Microsoft Learn's public source repositories at a commit. Apple (D12): the GitHub runner images
# `macos-15` and `macos-26` with their default Xcode.
#
# Checked by scripts/check_sources.py (form, and every project the documents cite is pinned, a listed site or
# [[not_pinned]]); fetched and verified by scripts/update_sources.sh.

# KDE (Plasma 6.8.2, KDE Frameworks 6.31.0, KDE Gear 26.08.2, Qt 6.12.0: archlinux@2026-10-29)

