# Breeze's widget state engine fades the frame while enabled: the fill from the pressed colour (its focus animation,
# which follows `down`) and the pen from the highlight colour (its hover animation, which follows hover, visual focus
# and `down`). Entering a state is instant: the brush is already the pressed or highlight colour that the animation
# mixes it with; only leaving one fades, the animation running backward, its opacity floor(x * 10) / 10 of a falling
# x, so the progress toward the new colour, S2.7's forward reading, jumps at the start of each tenth (steps(10,
# jump-start), not the forward-run `animations` timing); no delay: the state change starts the animation at once.
# So the fill fades only from {pressed} and the pen only from {hover, focus_visible, pressed}, into whatever state
# follows (checked included), while checked, default and window-activation changes are instant (Transition.from,
# S2.7, ADD-A124): one list for every state, the state rules stating none of their own. After the two fades, zero
# ones from {disabled}: Qt keeps State_MouseOver on a disabled widget (Enter reaches it), and a hovered button
# enabled again draws the highlight pen mixed with the highlight, so it changes at once. A zero duration's timing
# (`linear`) never runs: the new value is taken in the frame of the change. The flat button's pen keeps its width
# while its colour fades (S2.7: an edge whose paint alone becomes absent keeps its width)

[[fact]]
key = "button.body.transitions"
value = [{ properties = ["fill"], kind = "interpolate", duration_ms = "= token.motion.durations.animations", delay_ms = 0, timing = { steps = { count = 10, jump = "jump_start" } }, suspended_by_theme_change = false, from = ["pressed"] }, { properties = ["stroke"], kind = "interpolate", duration_ms = "= token.motion.durations.animations", delay_ms = 0, timing = { steps = { count = 10, jump = "jump_start" } }, suspended_by_theme_change = false, from = ["hover", "focus_visible", "pressed"] }, { properties = ["fill"], kind = "interpolate", duration_ms = 0, delay_ms = 0, timing = "linear", suspended_by_theme_change = false, from = ["disabled"] }, { properties = ["stroke"], kind = "interpolate", duration_ms = 0, delay_ms = 0, timing = "linear", suspended_by_theme_change = false, from = ["disabled"] }]
