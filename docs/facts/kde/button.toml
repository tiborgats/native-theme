# Breeze draws an arrow only on a push button with a menu and on a tool button's inline small and large
# menu styles (K1.27, K1.155; the split style is `split_button`); flavour kirigami declares no inline style, so
# there it is the menu alone (the state models)

# Kirigami's ToolButton with a menu (Accessible.ButtonMenu) and a label: the style item sets HasMenu alone, so Breeze
# draws the inline large arrow (`@inline_large`) with the style item's palette, the Kirigami colour set's text and
# background in every text and background role: the arrow shade's mix of the two, the text colour itself where the
# item passes focus (visual focus, a pressed non-flat button, `highlighted`); a flat one's arrow takes the shade alone

[[fact]]
key = "button.menu_indicator.glyph.stroke.paint"
when = { conditions = ["flavor:kirigami"], variants = ["tool", "@inline_large"] }
value = "= kcu_mix(surface.foreground, surface.background, 0.15)"
rows = ["K1.155"]

