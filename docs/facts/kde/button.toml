# a rectangle behind the button, 1 px lower, black at 0.15: a plain Rectangle, not Kirigami's ShadowedRectangle, so
# its edge is sharp, `gaussian` at zero blur (S2.5), not `kirigami_smoothstep`

[[fact]]
key = "button.body.shadow"
when = { conditions = ["flavor:kirigami"], variants = ["circular"] }
value = { layers = [{ x_px = 0, y_px = 1, blur_px = 0, spread_px = 0, color = "srgb(0, 0, 0, 0.15)", inset = false, falloff = "gaussian" }] }
rows = ["Q2.7"]

[[fact.cite]]
kind = "published"
source = "qqc2-desktop-style@6.31.0 org.kde.desktop/RoundButton.qml:107-118"
quote = "visible: !controlRoot.down && !controlRoot.checked && !controlRoot.flat anchors { topMargin: 1 bottomMargin: -1 fill: parent } color: Qt.rgba(0, 0, 0, 0.15)"
