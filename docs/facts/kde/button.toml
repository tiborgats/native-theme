# an equal one; while it is (a copy of) the application font the item draws with QToolButton's, the toolbar font, and
# Qt Quick's own default for a ToolButton is the platform's ToolButtonFont, the same toolbar font, so the label
# takes token.text.keyed.toolbar as the Qt Widgets tool button's does

