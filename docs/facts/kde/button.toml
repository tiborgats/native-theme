# the button takes clicks in its own rect only: no hit area beyond it, a zero on each side, S17's zero by omission
# (ADD-A141; `Absent` would mean a platform without the value). Qt Widgets' QAbstractButton::hitButton tests the
# widget's rect alone, and neither override reaches further: QToolButton's calls it, and QPushButton's tests the
# style's SE_PushButtonBevel rect, for which neither Breeze's subElementRect nor KStyle has a case, so
# QCommonStyle's, the option's whole rect. A Qt Quick button (Kirigami's, qqc2's) is hit where QQuickItem::contains
# holds, the item's mask where one is set (Qt Quick's name for it: `containmentMask`) and its bounding box
# otherwise, and no button template sets one: qqc2-desktop-style's Button, ToolButton and RoundButton are each
# cited whole (qtdeclarative's quicktemplates and Kirigami's button QML name none either). The overrides and the
# templates' absence by name are the second verification round's citation-form finding on KD-C1
