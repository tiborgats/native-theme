# Breeze's widget state engine fades the frame while enabled: the fill from the pressed colour (its focus animation,
# which follows `down`) and the pen from the highlight colour (its hover animation, which follows hover, visual focus
# and `down`). Each runs under its engine's own test, quoted from its updateState call (engine Breeze, S2.7,
# ADD-A126): the fill's `down && enabled`, any [pressed] none [disabled]; the pen's `(hovered || visualFocus || down)
# && enabled`, any [hover, focus_visible, pressed] none [disabled]. Entering a state is instant: the brush is already
# the pressed or highlight colour that the animation mixes it with; only leaving one fades, a re-entry mid-fade
# turning the run where it is. Its opacity is Breeze's quantisation, floor(x * 10) / 10, in both directions, S2.7's
# `Steps` with `jump_end` (ADD-A126, queue #136); no delay: the state change starts the animation at once.
# So the fill fades only from {pressed} and the pen only from {hover, focus_visible, pressed}, into whatever state
# follows (checked included), while checked, default and window-activation changes are instant (Transition.from,
# S2.7, ADD-A124): one list for every state, the state rules stating none of their own. After the two fades, zero
# ones from {disabled}, engine Breeze with its test empty: Qt keeps State_MouseOver on a disabled widget (Enter
# reaches it), and a hovered button enabled again draws the highlight pen mixed with the highlight, so it changes at
# once. A stated zero's timing is absent (S2.7, ADD-A125). The flat button's pen keeps its width while its colour
# fades (S2.7: an edge whose paint alone becomes absent keeps its width)
[[fact]]
key = "button.body.transitions"
value = [{ properties = ["fill"], kind = "interpolate", duration_ms = "= token.motion.durations.animations", delay_ms = 0, timing = { steps = { count = 10, jump = "jump_end" } }, engine = { breeze = { any = ["pressed"], none = ["disabled"], conditions = [] } }, from = ["pressed"] }, { properties = ["stroke"], kind = "interpolate", duration_ms = "= token.motion.durations.animations", delay_ms = 0, timing = { steps = { count = 10, jump = "jump_end" } }, engine = { breeze = { any = ["hover", "focus_visible", "pressed"], none = ["disabled"], conditions = [] } }, from = ["hover", "focus_visible", "pressed"] }, { properties = ["fill"], kind = "interpolate", duration_ms = 0, delay_ms = 0, timing = "absent", engine = { breeze = { any = [], none = [], conditions = [] } }, from = ["disabled"] }, { properties = ["stroke"], kind = "interpolate", duration_ms = 0, delay_ms = 0, timing = "absent", engine = { breeze = { any = [], none = [], conditions = [] } }, from = ["disabled"] }]
rows = ["K1.30"]

