# the push button's arrow (`Inline`, its margin a margin in the row, S2.11, ADD-A123): Breeze sizes the button with
# the arrow and its spacing inside Button_MarginWidth, but draws the arrow at the end of the label's contents rect
# (the widget rect less Frame_FrameWidth), past that margin, and vertically centred in it. So the start margin
# Button_MarginWidth and the end margin its negative move the arrow's box that far toward the end and leave the
# row's size alone; top and bottom are zero, the arrow centred on the row as `Inline` centres it. The same label code
