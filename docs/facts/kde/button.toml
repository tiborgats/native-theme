# the fill under the stroke (S2.4's `fill_clip`): Breeze sets the brush and the pen on one painter and draws one
# rounded rect, frameRect, the body box inset by half the pen width (breezehelper.cpp:670-671, :1747-1757, :736-739),
# so its fill reaches the pen's centre line: half of the `inside` stroke, neither `box` (all of it) nor `inner_edge`
# (none of it); the difference shows where the pen is translucent (a flat button's hover fade, :714-725). FillClip
# has no member for it: register U680. Kirigami's controls Breeze draws (qqc2-desktop-style's StyleItem) likewise.
[[fact]]
key = "button.body.stroke.fill_clip"
when = { not_conditions = ["flavor:kirigami"] }
pending = "U680"
rows = ["K1.20"]

[[fact]]
key = "button.body.stroke.fill_clip"
when = { conditions = ["flavor:kirigami"], not_variants = ["circular"] }
pending = "U680"
rows = ["K1.20"]

# RoundButton's background is a QML Rectangle (RoundButton.qml:76-95): Qt Quick's rectangle node fills only its
# inner vertices, whose corners are the radii less the border width, the border drawn between them and the outer
# ones, so the fill stops at the border's inner edge
[[fact]]
key = "button.body.stroke.fill_clip"
when = { conditions = ["flavor:kirigami"], variants = ["circular"] }
value = "inner_edge"
rows = ["Q2.5"]

