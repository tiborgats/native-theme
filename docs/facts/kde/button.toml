# the keyboard focus frame (QFocusFrame) of push and tool buttons: Breeze's token ring (its inner corners
# Frame_FrameRadius, its width the margin), its inner edge 1 px inside the widget's rect; the body box is that rect
# inset by the margin above (PenWidth::Shadow), so the offset from the body box to the ring's inner edge (S2.10) is
# the margin less that 1 px: 0.001 px outward
