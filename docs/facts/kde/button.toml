# the QWidget round button (_kde_round_button): Breeze passes drawRoundedRect a radius of half the larger side of
# the button's rect, which Qt's paint engine clamps per axis to half each side of the frame rect it draws (the path
# fallback likewise): the frame rect's inscribed ellipse, a circle where it is square, so `ellipse` on all four
# corners (S2.4, ADD-A124), the curve the base's `circular`. Kirigami's RoundButton is `full` (below, Q2.4)

