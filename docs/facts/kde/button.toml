# kde-breeze's `button` (the catalogue's entry, S5): Breeze 6.8.2's Helper::renderButtonFrame (breezehelper.cpp:647-740),
# its Style's push and tool button code, Qt 6.12's defaults where Breeze states nothing; flavour `kirigami`
# (qqc2-desktop-style 6.31.0, which paints Button and ToolButton through Breeze's QStyle) only where it differs.
# A fact on a variant flavour kirigami does not declare (`warning`, `@command_link`, `@inline_small`,
# `@inline_large`; the state models) holds outside it, `not_conditions = ["flavor:kirigami"]`.
# renderButtonFrame decides by an if / else-if chain (down, checked, default, rest; then the highlighted pen), so
# the facts run from the weakest branch to the strongest: the last matching fact is the chain's winner.
# Colours: QPalette's Button/ButtonText are the Button set, Highlight the Selection set, WindowText the Window set
# (kcolorscheme.cpp:670-681); Breeze takes Highlight from the Active group even in an inactive window, so
# `active(role.selection.background)` (breezehelper.cpp:672-673); a disabled button paints from the Disabled group.
# Geometry: the frame is drawn in the widget's rect inset by PenWidth::Shadow (1.001 px, the shadow's room), so the
# body box is that inset rect and `margin` the inset. Written by the KDE facts lane.

