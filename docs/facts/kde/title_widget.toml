# the four drawn-text leaves (S2.8's *Styles and drawn text*, ADD-A130): the style sheet's colour, the palette's
# WindowText; a QLabel elides nothing, sets no line limit, and wraps only under wordWrap, which KTitleWidget
# sets on its comment alone (its selectable text's document takes ManualWrap then)
