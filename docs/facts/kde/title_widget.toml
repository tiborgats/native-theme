# the size: QFont::pointSize() rounds the application font's point size to a whole number, then the factor, the
# style sheet's size in points; the rounding is in whole points, S2.2's `round_pt` (ADD-A131), whatever unit the
# field holds (the KDE reader states it in px, S9.4)
[[fact]]
key = "component.title_widget.title.text.font.size"
value = "= mul(round_pt(token.text.roles.body.font.size), 1.35)"
