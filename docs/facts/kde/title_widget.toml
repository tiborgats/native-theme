# kde-breeze's KTitleWidget title (component.title_widget, Qt Widgets only; K1.270, K2.15; ledger queue #130,
# ADD-A125): KTitleWidget's own level styles, not Kirigami's heading_<n>. The title is a QLabel whose style sheet sets
# only its size, the application font's whole point size times the level's factor (1.35, 1.20, 1.15, 1.10; level 1 by
# default), and its colour, the palette's WindowText; every other font attribute is the label's inherited one, the
# application font, `token.text.roles.body`, its weight included. Written by the KDE facts lane.

[[fact]]
