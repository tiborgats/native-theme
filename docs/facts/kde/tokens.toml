# token.elevation (S2.5, R8): Breeze's two shadow tables, each entry one breezerc [Common] ShadowSize step: the
# decoration's window shadows (`window_*`, K3.1) and the style's popup shadows (`popup_*`, menus, tooltips, docks
# and floating toolbars, K3.2). Each step is two box shadows and a composite offset: a layer's offset is the
# composite offset plus its own (the texture's padding moves the box by the composite offset, the renderer each
# shadow by its own); its box is the surface shrunk by Shadow_Overlap on every side (the padding's overlap term),
# so the spread is minus the overlap; its blur the renderer's radius, CSS's blur radius (standard deviation half
# of it, calculateBlurStdDev: falloff `gaussian`); its colour breezerc's ShadowColor (role.global.shadow_reference) with the alpha set (QColor::setAlphaF,
# with_alpha) to the layer's opacity times ShadowStrength / 255 (token.params.shadow.strength, below, the reader's
# breezerc [Common] ShadowStrength). Each layer is rendered around a box of its own radius, which the spread leaves:
# S2.5's `corner_radius` (ADD-A136), which the model's ShadowLayer does not hold yet (its code follow-up), so the
# layers state none until it does, the reader refusing the key meanwhile. Its values then: a window's layer the
# decoration's scaled radius plus half a pixel, `= add(mul(2.5px, 2), 0.5px)` (breezedecoration.cpp:829, :872-875;
# Frame_FrameRadius 2.5 times the decoration's smallSpacing, kdecoration/breeze.h:27-29, which Breeze's comments give
# as 2 on Wayland, while kdecoration's DecorationSettings derives it from the title font, a quarter of its 'M'
# height rounded up to even, at least 2, kdecoration@6.8.2 src/decorationsettings.cpp:18-31: the comments' 2 holds
# while that height is at most 10 px, a reading for the KDE host to confirm); a popup's the style's frame radius,
# 5 (breezeshadowhelper.cpp:205-208, breezehelper.h:345-348, breezemetrics.h:31, :42).
# The layers are listed bottom first (S2.5, ADD-A141): BoxShadowRenderer::render() paints its shadows in addShadow()'s
# order, each drawn onto the canvas with the painter's default SourceOver (breezeboxshadowrenderer.cpp:322-325, :283;
# its own SourceIn, :275, tints the shadow's image alone), so shadow1, added first (breezedecoration.cpp:833,
# breezeshadowhelper.cpp:211), lies beneath shadow2: checked on all twelve two-layer entries (round 7).
