# kde-breeze's tokens (S4.1, S4.2, S4.4, S4.5, S4.6, the focus indicator): Plasma 6.8.2's defaults (no
# kdeglobals key set), Breeze 6.8.2's style, KDE Frameworks 6.31.0 (Kirigami, qqc2-desktop-style's Plasma
# integration, KIconThemes) and Qt 6.12.0 where KDE sets nothing. Flavour `widgets` (Qt Widgets with Breeze) is the
# default; facts under `flavor:kirigami` hold where Kirigami differs. Written by the KDE facts lane (tokens half).
# 
# S4.1 motion: kdeglobals [KDE] AnimationDurationFactor is the speed factor (1 unset, 0 off).

[[fact]]
key = "token.motion.speed_factor"
value = 1
rows = ["K3.30", "K3.90"]

[[fact.cite]]
kind = "published"
source = "kwin@6.8.2 src/kwin.kcfg:313-317"
