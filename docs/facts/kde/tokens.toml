# Kirigami's sizeForLabels: roundedIconSize of the default font's height stepped down to 16, 22, 32 or 48
# (units.cpp:297-327). Kirigami keeps the application font's metrics as a QFontMetricsF (units.cpp:35, :53, :275),
# so the height is QFontMetricsF::height(), a qreal, which roundedIconSize(int) receives truncated: Noto Sans 10 at
# 96 DPI is 17.6875 px high (the KDE render host's QFontMetricsF, Noto Sans Regular at 13 px), so the input is 17
# (not QFontMetrics::height()'s 18, which Kirigami does not read), which steps down to 16, and Kirigami answered 16
# (U400, measured; read_icon_sizes.py)
