# The accent run's facts (specification S17, *The accent run*): what Plasma's applyScheme() wrote into kdeglobals
# for each scheme file and accent, read back as the KDE reader reads kdeglobals (KColorScheme: a key a group
# lacks from its defaults, Header's from [Colors:Window], kcolorscheme.cpp:330-333; a set's Inactive input from its
# [Inactive] group where it has one, else its active values, :344-352). Run 41158393408, the evidence README.
# Per pair: every colour role of the seven sets (all are accent-dependent where token.kde.tint_factor can be Some,
# S9.1), every inactive input role, then the four [WM] keyed roles, in applyScheme()'s order
# (colorsapplicator.cpp:157-176, :291-296).

# light-e5a50a: breeze@6.8.2 colors/BreezeLight.colors, accent #e5a50a, under scheme:light

[[fact]]
key = "role.view.background"
when = { conditions = ["scheme:light"] }
value = "#ffffff"
rows = ["K3.54"]
scheme_file = "breeze@6.8.2 colors/BreezeLight.colors"
accent = "#e5a50a"

