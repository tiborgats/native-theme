# Kirigami (qqc2-desktop-style's Button, ToolButton and RoundButton, Kirigami's and kirigami-addons' buttons): the
# style item paints with no widget, so its window is always active for the default look (breezestyle.cpp:4563); a
# disabled item loses the active focus (qquickitem.cpp:6835-6838). Button and ToolButton pass `highlighted` to the
# style as focus, and Breeze draws that focus's pen only under State_KeyboardFocusChange, which the style item sets
# from the control's last focus reason, in or out: the flag `@keyboard_focus_change` (Q1.8, Q1.9); a deactivating
# window takes the focus flags (S7.2, ADD-A126: the window's content item gives up its focus)
# No `@recording` state (the ledger's queue #79): kirigami-addons' KeySequenceItem's main button is checkable and
# records while it is checked (KeySequenceItem.qml:121-122, :148-157), so it draws the `checked` state of a `toggle`
# button, focused; recording changes only its text ("Input", then " ... ", :126-140)
# `@keyboard_focus_change` is a state the drawing distinguishes, so it is among the axes' states as well as declared;
# a ToolButton with a menu and a label draws Breeze's inline large arrow (`@inline_large`, one menu style at a time,
# as the widgets'); transient touch input (`input:touch`) widens kirigami-addons' floating button's padding; the
# search field's, input's and chip's buttons are the contexts the icon sizes name
[[model]]
widget = "button"
when = { conditions = ["flavor:kirigami"] }
available = true
variants = ["flat", "circular", "toggle", "menu", "tool", "icon_only", "with_icon", "help", "@highlighted", "@inline_large", "@ka_floating", "@key_sequence", "@ka_download", "close", "back", "previous", "next", "overflow", "clear_field", "reveal", "remove", "play", "volume"]
sizes = []
densities = []
flags = ["@keyboard_focus_change"]
axes = { states = ["hover", "pressed", "focused", "focus_visible", "disabled", "checked", "default", "@keyboard_focus_change"], conditions = ["scheme:light", "scheme:dark", "window_inactive", "input:touch"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }, { scope = "any", widget = "search_field" }, { scope = "any", widget = "input" }, { scope = "any", widget = "chip" }] }
exclusive = []
exclusive_variants = [["icon_only", "with_icon"]]
variant_sets = [["flat", "toggle"], ["menu", "flat"], ["tool", "flat"], ["tool", "toggle"], ["tool", "flat", "toggle"], ["circular", "flat"], ["circular", "toggle"], ["circular", "flat", "toggle"], ["circular", "@highlighted"], ["circular", "flat", "@highlighted"], ["flat", "@highlighted"], ["tool", "@highlighted"], ["tool", "flat", "@highlighted"], ["tool", "@inline_large"], ["tool", "@inline_large", "flat"], ["tool", "@inline_large", "@highlighted"], ["toggle", "@key_sequence"]]
not_drawn = [{ states = ["checked"], not_variants = ["toggle"] }, { states = ["default"], variants = ["tool"] }, { states = ["disabled", "pressed"] }, { states = ["disabled", "focused"] }, { states = ["disabled", "focus_visible"] }, { states = ["focused"], conditions = ["window_inactive"] }, { states = ["focus_visible"], conditions = ["window_inactive"] }]
rows = ["Q1.8", "Q1.9", "Q2.4", "Q2.48", "K-KA-26†", "K-KA-43†"]

