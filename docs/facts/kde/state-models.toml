# kde-breeze's state models (S17): the combinations Breeze 6.8.2 and qqc2-desktop-style 6.31.0 draw. Written by the
# KDE facts lane. States combine (no exclusive group): renderButtonFrame reads each flag on its own and decides by
# branch order (down, checked, default, rest), which the facts' order carries, not a group (K1.29).
# Variants combine; `variant_products` gives the sets each kind of button draws, one product per kind, its groups the
# features its drawing reads on their own, and `variant_sets` the lane's tool-button menu forms written without `menu`
# (S17, ADD-A121, ADD-A122; round 6 added the products, from KD-C1's verifier, each group's source cited below).

# Qt Widgets (the default flavour): QPushButton and QToolButton through Breeze's QStyle. The variants are the
# catalogue's that Breeze and the KDE frameworks draw (the identities and keyed variants in their hosts' contexts:
# the trace's K1.46†, K1.124, K1.155, K1.157, K2.7, K2.10, K2.11, K-RL02†); a disabled button is never down
# (QAbstractButton releases it when it is disabled) nor focused (QWidget passes the focus on); a tool button is never
# round (only the push button panel reads _kde_round_button); a deactivating window takes the focus flags (S7.2,
# ADD-A126: Qt sets no focus widget while no window is active, and hasFocus() is being the focus widget)
# No `@recording` state (the ledger's queue #79): KKeySequenceWidget's key button changes only its text while it
# records ("Input" or the partial sequence, then " …"). Its click starts the recorder directly, and the private
# startRecording() that would hold it down (setDown(true), kkeysequencewidget.cpp:373-377) has no caller at the pin;
# so it draws the button's own states
[[model]]
widget = "button"
available = true
variants = ["flat", "warning", "circular", "toggle", "menu", "tool", "icon_only", "with_icon", "@inline_small", "@inline_large", "@command_link", "@key_sequence", "@float", "close", "previous", "next", "overflow", "clear_field", "reveal", "minimize", "maximize", "restore"]
sizes = []
densities = []
axes = { states = ["hover", "pressed", "focused", "focus_visible", "disabled", "checked", "default"], conditions = ["scheme:light", "scheme:dark", "window_inactive"], contexts = [{ scope = "any", widget = "toolbar", part = "bar" }, { scope = "any", widget = "toolbar", part = "bar", variants = ["top"] }] }
exclusive = []
exclusive_variants = [["icon_only", "with_icon"], ["@inline_small", "@inline_large"]]
variant_sets = [["tool", "@inline_small"], ["tool", "@inline_small", "flat"], ["tool", "@inline_large"], ["tool", "@inline_large", "flat"]]
variant_products = [
  # QPushButton: its content, the round property, flat, the neutral highlight, checkable and a menu, each read on its own
  [{ any = ["icon_only", "with_icon"] }, { any = ["circular"] }, { any = ["flat"] }, { any = ["warning"] }, { any = ["toggle"] }, { any = ["menu"] }],
  # QToolButton without a menu: auto-raise and the neutral highlight read on their own, never round
  [{ one = ["tool"] }, { any = ["icon_only", "with_icon"] }, { any = ["flat"] }, { any = ["warning"] }, { any = ["toggle"] }],
  # QToolButton with an instant popup menu and no text: no arrow (ToolButtonMenuArrowStyle::None)
  [{ one = ["tool"] }, { one = ["menu"] }, { one = ["icon_only"] }, { any = ["flat"] }, { any = ["warning"] }, { any = ["toggle"] }],
  # QToolButton with a delayed popup menu: the small inline arrow, with or without text
  [{ one = ["tool"] }, { one = ["menu"] }, { one = ["@inline_small"] }, { any = ["icon_only", "with_icon"] }, { any = ["flat"] }, { any = ["warning"] }, { any = ["toggle"] }],
  # QToolButton with an instant popup menu and text: the large inline arrow
  [{ one = ["tool"] }, { one = ["menu"] }, { one = ["@inline_large"] }, { any = ["with_icon"] }, { any = ["flat"] }, { any = ["warning"] }, { any = ["toggle"] }],
  # QCommandLinkButton: never flat, checkable, the neutral highlight read from the widget
  [{ one = ["@command_link"] }, { any = ["warning"] }, { any = ["toggle"] }],
  # KKeySequenceWidget's key button (the configure icon and the shortcut) and its clear button (a QToolButton)
  [{ one = ["@key_sequence"] }, { one = ["with_icon"] }, { any = ["warning"] }],
  [{ one = ["clear_field"] }, { one = ["tool"] }, { one = ["icon_only"] }],
  # QDockWidget's title buttons, auto-raise; QToolBarExtension, auto-raise and checkable
  [{ one = ["close", "@float"] }, { one = ["tool"] }, { one = ["flat"] }, { one = ["icon_only"] }],
  [{ one = ["overflow"] }, { one = ["tool"] }, { one = ["flat"] }, { one = ["icon_only"] }, { one = ["toggle"] }],
  # QLineEdit's icon buttons (its clear button, KPasswordLineEdit's visibility action); QMdiSubWindow's title buttons
  [{ one = ["clear_field", "reveal"] }, { one = ["icon_only"] }],
  [{ one = ["minimize", "maximize", "restore", "close"] }, { one = ["icon_only"] }],
]
not_drawn = [{ states = ["checked"], not_variants = ["toggle"] }, { states = ["default"], variants = ["tool"] }, { states = ["disabled", "pressed"] }, { states = ["disabled", "focused"] }, { states = ["disabled", "focus_visible"] }, { variants = ["circular", "tool"] }, { states = ["focused"], conditions = ["window_inactive"] }, { states = ["focus_visible"], conditions = ["window_inactive"] }]
rows = ["K1.20", "K1.21", "K1.22", "K1.24", "K1.25", "K1.26", "K1.29", "K1.152", "K-RL02†"]

