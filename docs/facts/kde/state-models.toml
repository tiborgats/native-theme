# KTitleWidget (component.title_widget, Qt Widgets only; K1.270, K2.15): its title's text level, one of four (level 1
# where none is set), and its comment's message type, one of four (Info where none is set); no state, condition or
# context: its style sheets hold one size and one colour, rebuilt on palette and font changes only. A QWidget, so the
# `kirigami` flavour has none (the catalogue's `available = false` there)
