# Kirigami (qqc2-desktop-style's Button, ToolButton and RoundButton, Kirigami's and kirigami-addons' buttons): the
# style item paints with no widget, so its window is always active for the default look (breezestyle.cpp:4563); a
# disabled item loses the active focus (qquickitem.cpp:6835-6838)
[[model]]
widget = "button"
when = { conditions = ["flavor:kirigami"] }
available = true
variants = ["flat", "circular", "toggle", "menu", "tool", "icon_only", "with_icon", "help", "@highlighted", "@ka_floating", "@key_sequence", "@ka_download", "close", "back", "previous", "next", "overflow", "clear_field", "reveal", "remove", "play", "volume"]
