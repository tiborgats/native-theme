# kde-breeze's inputs (S9.1): the scheme inputs `input.kde_scheme.*` from Breeze's scheme files as Plasma 6.8.2
# installs them (breeze@6.8.2 colors/, the same colour keys as kcolorscheme's embedded copies), the inactive input
# roles `input.inactive.*` as applyScheme() writes them on Plasma's default path (no AccentColor), and the accent
# input. Generated from the pinned files by the KDE facts lane (every literal read from its cited line).

# Plasma's default AccentColor is `transparent`, which applyScheme() takes for no accent ("Accent color from
# color scheme"): the preset's base path

[[fact]]
key = "input.accent"
value = "#00000000"
rows = ["K3.54"]

[[fact.cite]]
kind = "published"
source = "plasma-workspace@6.8.2 kcms/colors/colorssettings.kcfg:12-15"
quote = "<entry name=\"accentColor\" key=\"AccentColor\" type=\"Color\"> <label>Accent color</label> <default>transparent</default>"

[[fact.cite]]
kind = "published"
source = "plasma-workspace@6.8.2 kcms/colors/colorsapplicator.cpp:127-137"
quote = "if (accent == QColor(Qt::transparent)) { return false; }"

[[fact.cite]]
kind = "published"
source = "plasma-workspace@6.8.2 kcms/colors/ui/AccentColorUI.qml:39-40"
quote = "case 0: // colorScheme kcm.accentColor = \"transparent\";"

# A key a scheme file leaves unset (S9.1: the KDE reader's and a KDE port's scheme inputs). KColorScheme reads each
# key of a colour group with its set's default table beneath (loadSerializedColors, loadDecorationColors:
# kcolorscheme@6.31.0 src/kcolorscheme.cpp:251-278), and a key an [Inactive] group lacks from the same defaults
# (:344-357, cited on Header's inactive facts). So each scheme:light fact of a set's twelve keys cites, beside Breeze's
# value, the default KColorScheme reads for that key where the file leaves it unset: the set's table row (:122-216,
# "These numbers come from the default color scheme which is currently Breeze Light", :120-121; every row equals
# BreezeLight.colors but DecorationHover's 147,206,233, where Breeze states 61,174,233), the set's choice of table in
# initFromConfig (:289-342) and the key's read. Header's defaults are the file's [Colors:Window] values with Header's
# own table beneath (:330-333). On Plasma's default path applyScheme() copies a colour key into kdeglobals only where
# the file states it (plasma-workspace@6.8.2 kcms/colors/colorsapplicator.cpp:118-123, :225-226), so kdeglobals
# leaves the key unset too and KColorScheme reads the same default there.

