line = "platform-facts.md@fc6109d1:1057"
section = "2.1.3 Base Colors"
property = "shadow_color"
text = "**(Fluent)** two-layer per elevation (from [Fluent 2 spec](https://fluent2.microsoft.design/elevation)): low L=14%/14% D=28%/14%; high L=24%/20% D=28%/20% (note: FluentUI React web tokens use different opacities). The same page (read 2026-10-11): \"Windows uses strokes instead of key shadows to outline an object\", so Windows draws the second (ambient) layer: 14% low, 20% high, in both modes; its low-ramp examples include \"command dropdowns, and tooltips\" (shadow 8), its high-ramp ones \"pop-up dialogs\" (shadow 64). The model's one `shadow_color` serves both ❓"
