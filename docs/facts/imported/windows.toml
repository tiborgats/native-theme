section = "2.6 Menu"
property = "row_height"
text = "❓ — WinUI3 `MenuFlyoutItem` has no MinHeight (`MenuFlyoutThemeMinHeight` 32 is the presenter's, [MenuFlyout_themeresources.xaml:256, :284](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/MenuFlyout_themeresources.xaml#L256)). Its row is the padding, 4+5 when opened by mouse, pen or keyboard (`MenuFlyoutItemThemePaddingNarrow`) and 8+9 otherwise, touch included (`MenuFlyoutItemThemePadding`) ([:260-261, :363-370](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/MenuFlyout_themeresources.xaml#L260-L261)), plus the text's line box: a TextBlock at `ControlContentThemeFontSize` 14 (:304) with no Style and no LineHeight (:391), so the line spacing of `XamlAutoFontFamily` (Segoe UI Variable) at 14 px, a font-metric value no source states; the Fluent ramp's Body 20 px line height is not applied to it. Each item also carries `MenuFlyoutItemMargin` 2 above and 2 below, outside its background (:259, :313)"
