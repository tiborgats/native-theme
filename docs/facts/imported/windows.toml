section = "2.3 Button"
property = "hover_background"
text = "**(Fluent)** `ButtonBackgroundPointerOver` = `ControlFillColorSecondaryBrush` — L #80F9F9F9, D #15FFFFFF, a fill that replaces `ButtonBackground`, not an overlay ([Button_themeresources.xaml:129, :31](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/Button_themeresources.xaml#L129); [Common_themeresources_any.xaml:220, :16](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/Common_themeresources_any.xaml#L220)); over the window's base colour (`SolidBackgroundFillColorBase`, §2.1.3) it draws L #F6F6F6 (249 × 128/255 + 243 × 127/255 = 246.0), D #323232 (255 × 21/255 + 32 × 234/255 = 50.4): the preset states those, because the connectors composite `hover_background` over the rest fill ([todo.md](todo.md), *Hover fills: a layer or a replacement*). The pressed fill, which the model carries as `active_background` (its row below), replaces it the same way: `ButtonBackgroundPressed` = `ControlFillColorTertiaryBrush` — L #4DF9F9F9, D #08FFFFFF ([Button_themeresources.xaml:130, :32](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/Button_themeresources.xaml#L130); [Common_themeresources_any.xaml:221, :17](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/Common_themeresources_any.xaml#L221)), over `SolidBackgroundFillColorBase` L #F5F5F5 (249 × 77/255 + 243 × 178/255 = 244.8), D #272727 (255 × 8/255 + 32 × 247/255 = 39.0), the preset's `active_background`"
rows = [
    "W3-45†",
]
