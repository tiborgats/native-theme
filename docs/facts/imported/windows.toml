[[row]]
line = "platform-facts.md@fc6109d1:1366"
section = "2.11 Tab Bar"
property = "active_outward_corner_radius"
text = "**(Fluent)** 4 — the selected `TabViewItem` is filled with `SelectedBackgroundPath`, set 4 outside the tab on each side (`Margin=\"-4,0\"`, [TabView.xaml:551](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView.xaml#L551)), a geometry whose top corners take `OverlayCornerRadius` (`border.corner_radius`) and whose bottom corners curve out by 4 (\"Assumes 4px curving-out corners, which are hardcoded in the markup\", [TabViewItem.cpp:106](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabViewItem.cpp#L106), `UpdateTabGeometry` [:98-123](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabViewItem.cpp#L98-L123)). The selected tab's outline has no bottom edge (`TabViewSelectedItemBorderThickness` `1,1,1,0`, [TabView_themeresources.xaml:268](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L268)), lies 1 outside the path's sides (`TabViewSelectedItemHeaderMargin` `-1,0,-1,1`, [:269](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L269)), and is transparent over its sides' bottom 4 (`TabViewSelectedItemBorderBrush`, a gradient, [:72-80](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L72-L80), [:150-158](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L150-L158)), where two 4 × 4 arcs, 1 wide on the inner side of the curve, carry it on down the curves to the bar's 1px rule, in `TabViewBorderBrush` = `CardStrokeColorDefault`, `border.color`'s brush ([TabView.xaml:547-548](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView.xaml#L547-L548), shown in `Selected` [:338-339](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView.xaml#L338-L339); [TabView_themeresources.xaml:68](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L68), [:146](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView_themeresources.xaml#L146)). The 1px rule the bar draws in that brush under the other tabs (`BottomBorderLine`, [TabView.xaml:546](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView.xaml#L546), collapsed under the selected one, [:337](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/TabView/TabView.xaml#L337)) and the separator (`item_gap`) are not modelled"
rows = []
targets = []
note = "no gap-map row names this cell"

