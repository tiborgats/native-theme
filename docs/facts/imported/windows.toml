[[row]]
line = "platform-facts.md@fc6109d1:1253"
section = "2.6 Menu"
property = "background_color"
text = "`COLOR_MENU` — Windows 10+: not supported (§1.2.2); #f0f0f0 on the three Windows probe images ([probe.toml:343](evidence/os-probe/2026-10-11-run-38129819806/os-probe-windows-11-arm/probe.toml#L343)). WinUI3 `MenuFlyoutPresenterBackground` = `DesktopAcrylicTransparentBrush` ([MenuFlyout_themeresources.xaml:202, :40](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/MenuFlyout_themeresources.xaml#L202)); the flyout's `SystemBackdrop` is `MenuFlyoutSystemBackdrop` = `AcrylicBackgroundFillColorDefaultBackdrop` ([MenuFlyout_themeresources.xaml:264, :271](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/CommonStyles/MenuFlyout_themeresources.xaml#L264-L271)), a `DesktopAcrylicBackdrop`, and the presenter's brush is #00000000 over it ([AcrylicBrush_themeresources.xaml:105-106, :53-54](https://github.com/microsoft/microsoft-ui-xaml/blob/8463f45162149de0ec3ad7df752596893fe3e13e/controls/dev/Materials/Acrylic/AcrylicBrush_themeresources.xaml#L105-L106)). The backdrop's fallback colour is not published (`DesktopAcrylicController.FallbackColor`, [learn.microsoft.com](https://learn.microsoft.com/en-us/windows/windows-app-sdk/api/winrt/microsoft.ui.composition.systembackdrops.desktopacryliccontroller.fallbackcolor), updated 2026-07-28) ❓; the brush of its name, `AcrylicBackgroundFillColorDefaultBrush`, falls back to L #F9F9F9, D #2C2C2C (:95, :43), the preset's value"
evidence = [
    "docs/evidence/os-probe/2026-10-11-run-38129819806/os-probe-windows-11-arm/probe.toml#L343",
]
