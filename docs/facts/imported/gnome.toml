text = "**(Adwaita CSS)** 16 — AdwExpanderRow's arrow is a `GtkImage` of `adw-expander-arrow-symbolic` ([adw-expander-row.ui:61-67](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/adw-expander-row.ui#L61-L67)) drawn at `-gtk-icon-size`, initially 16px ([gtkcssstylepropertyimpl.c:1285-1290](https://gitlab.gnome.org/GNOME/gtk/-/blob/57f569a23cc23402eb122e337b69d57e4aeecd2b/gtk/gtkcssstylepropertyimpl.c#L1285-L1290)), which no row rule changes. This column follows AdwExpanderRow, as `header_height`, `arrow_side` and the rows below do; GtkExpander's `expander` is 16 too ([_expanders.scss:1-4](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/widgets/_expanders.scss#L1-L4))"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1677"
section = "2.27 Expander / Disclosure"
property = "border.padding_horizontal"
text = "**(Adwaita CSS)** `AdwExpanderRow` header: 14, a sum — the header is an `AdwActionRow` in the expander's `GtkListBox` ([adw-expander-row.ui:15-24](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/a5030fc692855c62a0014ea784d3a80ce30f926f/src/adw-expander-row.ui#L15-L24)), so `list > row { padding: 2px }` ([_lists.scss:16-17](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/a5030fc692855c62a0014ea784d3a80ce30f926f/src/stylesheet/widgets/_lists.scss#L16-L17)) plus `row > box.header { margin-left: 12px; margin-right: 12px }` (:129-131)"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1678"
section = "2.27 Expander / Disclosure"
property = "border.padding_vertical"
text = "**(Adwaita CSS)** `AdwExpanderRow` header: 8 to the title, a sum — the row's 2 (`list > row { padding: 2px }`, [_lists.scss:16-17](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/a5030fc692855c62a0014ea784d3a80ce30f926f/src/stylesheet/widgets/_lists.scss#L16-L17)) plus `box.title { margin-top: 6px; margin-bottom: 6px }` (:139-141); the header box's `min-height: 50px` (:133) centres shorter content"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1679"
section = "2.27 Expander / Disclosure"
property = "border.corner_radius"
text = "**(Adwaita CSS)** 12 at the list's outer corners: in a `list.boxed-list`, the first row's header takes `$card_radius` at its top corners and the last, collapsed one at its bottom corners ([_lists.scss:533-553](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/widgets/_lists.scss#L533-L553); [_common.scss:9](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/_common.scss#L9)), 0 elsewhere"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1680"
section = "2.27 Expander / Disclosure"
property = "border.color"
text = "**(Adwaita CSS)** the boxed list's card outline, `0 0 0 1px RGB(0 0 6 / 3%)`, the first of its box shadows ([_misc.scss:202-208](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/widgets/_misc.scss#L202-L208)); between rows `border-bottom: 1px solid var(--card-shade-color)` ([_lists.scss:346](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/widgets/_lists.scss#L346)), which the expander row itself drops (`border: none`, :529-531)"
rows = []
targets = []
