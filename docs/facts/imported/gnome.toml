property = "focus_border_color"
text = "**(Adwaita CSS)** `$focus_border_color` = `color-mix(in srgb, var(--accent-color) 50%, transparent)` ([_colors.scss:260, :307](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/_colors.scss#L260)): no border line but the focus ring, a 2px outline the entry draws inside its edge on `:focus-within` (`focus-ring($focus-state: ':focus-within')`, [_entries.scss:17](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/widgets/_entries.scss#L17); `outline-offset: -$width`, [_drawing.scss:12-27](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/_drawing.scss#L12-L27)) — `--accent-color` is the accent background #3584e4 with its OKLab lightness capped at 0.5 in light and raised to 0.85 in dark ([_colors.scss:146](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/stylesheet/_colors.scss#L146), :151, :168-170; libadwaita's own `adw_rgba_to_standalone`, [adw-accent-color.c:130-157](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/src/adw-accent-color.c#L130-L157)), #0461be / #81d0ff as libadwaita states them for the default blue ([doc/css-variables.md:137-140](https://gitlab.gnome.org/GNOME/libadwaita/-/blob/1.10.0/doc/css-variables.md#L137-L140); the dark blue channel clipped to the sRGB gamut, :97-99), here at 50 %: L #0461be80, D #81d0ff80"
