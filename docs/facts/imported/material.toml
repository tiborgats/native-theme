text = "`scale_fade` **(impl)** — material-components-android's M3 dialog theme overlays set `android:windowAnimationStyle` to `MaterialAlertDialog.Material3.Animation` ([mdc/themes_overlay.xml:73, :119](https://github.com/material-components/material-components-android/blob/66c334b7946dabf33adfe1a2b7cad6bcaa4ea3ad/lib/java/com/google/android/material/dialog/res/values/themes_overlay.xml#L73)), whose enter animation is `m3_motion_fade_enter` ([mdc/styles.xml:113-116](https://github.com/material-components/material-components-android/blob/66c334b7946dabf33adfe1a2b7cad6bcaa4ea3ad/lib/java/com/google/android/material/dialog/res/values/styles.xml#L113-L116)): alpha 0 → 1 with scale 0.8 → 1 about the centre ([mdc/m3_motion_fade_enter.xml:17-31](https://github.com/material-components/material-components-android/blob/66c334b7946dabf33adfe1a2b7cad6bcaa4ea3ad/lib/java/com/google/android/material/motion/res/anim/m3_motion_fade_enter.xml#L17-L31)), 400 ms (`m3_sys_motion_duration_medium4`, [mdc/tokens.xml:129](https://github.com/material-components/material-components-android/blob/66c334b7946dabf33adfe1a2b7cad6bcaa4ea3ad/lib/java/com/google/android/material/motion/res/values/tokens.xml#L129)). Compose's `AlertDialog.kt` defines none: `BasicAlertDialog` opens a plain `Dialog` ([compose/AlertDialog.kt:136-142](https://github.com/androidx/androidx/blob/1e6776853023ebe4266aca2b308305723e3a2d57/compose/material3/material3/src/commonMain/kotlin/androidx/compose/material3/AlertDialog.kt#L136-L142)). Note: material-web's dialog slides down instead (`translateY(-50px)` → 0, 500 ms; [mw/dialog/internal/animations.ts:52-104](https://github.com/material-components/material-web/blob/cbd34a8921915af94d5ef65c2a69eece41d5b4f3/dialog/internal/animations.ts#L52-L104)), not taken as the value"
