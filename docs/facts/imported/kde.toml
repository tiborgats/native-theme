text = "⚙ `kdeglobals [Icons] Theme` (§1.3.6); **(KF6 src)** `KIconTheme::current()` reads the application's own `[Icons] Theme`, then Qt's theme name, then kdeglobals', `breeze` where it is unset ([kicontheme.cpp:676-687](https://invent.kde.org/frameworks/kiconthemes/-/blob/v6.31.0/src/kicontheme.cpp#L676-L687), KF 6.31.0); an override comes first (:667-669), which `KIconTheme::initTheme()`, called by an application outside the `kde` platform theme, sets from the same `[Icons] Theme`, `breeze` where it is unset (:105, :113), and `hicolor` last, where every step names none or `hicolor` (:688-690). The Breeze global theme sets `breeze`, Breeze Dark `breeze-dark` ([org.kde.breeze defaults:7-8](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/lookandfeel/org.kde.breeze/contents/defaults#L7-L8); [org.kde.breezedark defaults:7-8](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/lookandfeel/org.kde.breezedark/contents/defaults#L7-L8), plasma-workspace v6.7.5)"
rows = []
targets = []
note = "no gap-map row names this cell"

