[[row]]
line = "platform-facts.md@fc6109d1:1213"
section = "2.4 Text Input"
property = "border.padding_horizontal"
text = "**(Breeze src)** 7 inside the frame line: Breeze insets a line edit's contents `LineEdit_FrameWidth` = 6 from its outer edge (`lineEditContentsRect`, [breezestyle.cpp:2228-2251](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L2228-L2251); [breezemetrics.h:50](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezemetrics.h#L50)), its 1px frame line the outermost of those 6, and QLineEdit starts the text `horizontalMargin` = 2 further in ([qlineedit_p.cpp:35-36](https://github.com/qt/qtbase/blob/ef55f427f2c8b410d34f8a7681020a3000cf6866/src/widgets/widgets/qlineedit_p.cpp#L35-L36); `lineRect`, [qlineedit.cpp:2013-2014](https://github.com/qt/qtbase/blob/ef55f427f2c8b410d34f8a7681020a3000cf6866/src/widgets/widgets/qlineedit.cpp#L2013-L2014)): 6 + 2 − 1. **(measured)** 2026-09-28, a Breeze QLineEdit (`kdialog --inputbox`, KWin, scale 1.0, Noto Sans 10pt): the text starts 8px from the frame's outer left edge, 7 inside its line"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1214"
section = "2.4 Text Input"
property = "border.padding_vertical"
text = "**(Breeze src)** 6 inside the frame line: the same `LineEdit_FrameWidth` = 6 inset, and QLineEdit's `verticalMargin` = 1 (qlineedit_p.cpp:35-36), which its size hint adds above and below the font's height ([qlineedit.cpp:668-670](https://github.com/qt/qtbase/blob/ef55f427f2c8b410d34f8a7681020a3000cf6866/src/widgets/widgets/qlineedit.cpp#L668-L670)) and its paint centres the line in (:2010): 6 + 1 − 1. **(measured)** the same field: 32px tall, its 18px line box 7px below the frame's outer top edge, 6 inside its line"
rows = []
targets = []
note = "no gap-map row names this cell"

