text = "Plasma 6.7: `~/.config/kcmfonts` `[General] forceFontDPI`, UInt, default 0 = unset, \"Force font DPI on X11\" ([fontsaasettingsbase.kcfg:8-11](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/fontsaasettingsbase.kcfg#L8-L11)); the fonts KCM shows it on X11 only (`visible: Qt.platform.pluginName === \"xcb\"`, [main.qml:424-426](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/ui/main.qml#L424-L426)), and krdb hands it to X11 as `Xft.dpi` only off Wayland ([krdb.cpp:328-341, :423-425](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/krdb/krdb.cpp#L328-L341)); the `plasma6.0-remove-dpi-settings` migration deletes `forceFontDPIWayland` ([kcms/fonts/kconf_update/plasma6.0-remove-dpi-settings.cpp:25](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/kconf_update/plasma6.0-remove-dpi-settings.cpp#L25)); the key is `kcmfonts`' alone, a file name without `rc`, since KConfig joins a name it is given to the config directory as it stands and adds `rc` only to an empty one ([kconfig.cpp:649, :652-678](https://invent.kde.org/frameworks/kconfig/-/blob/v6.31.0/src/core/kconfig.cpp#L652-L678), KConfig v6.31.0): the KCM binds its DPI setting to that file (`<kcfgfile name=\"kcmfonts\" />`, [fontsaasettingsbase.kcfg:6](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/fontsaasettingsbase.kcfg#L6)) and krdb reads it there ([krdb.cpp:330, :339-340](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/krdb/krdb.cpp#L330-L340)), while the KCM's kdeglobals settings ([fontssettings.kcfg:6](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/fontssettings.kcfg#L6)) hold the fonts, not the DPI; no plasma-workspace or plasma-integration v6.7.5 source reads `forceFontDPI` from kdeglobals · Plasma 6.8: no `forceFontDPI` — the KCM's DPI setting and its kcfg entry are gone ([c675077b](https://invent.kde.org/plasma/plasma-workspace/-/commit/c675077b8f7371eb65bfa73c20d86a50828b13fc), first in v6.7.90), and so is krdb, its only reader ([fe367323](https://invent.kde.org/plasma/plasma-workspace/-/commit/fe367323b30bfa239243b2164d75faacb1be15e7)); `Xft.dpi` is `kwinrc [Xwayland] Scale` × 96 ([plasma-setup-xwayland/main.cpp:47-58](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.8.1/startkde/plasma-setup-xwayland/main.cpp#L47-L58)) | ✅ Plasma 6.7.5 (plasma-workspace `cc1ab796`); ✅ Plasma 6.8.1 (`fb9b679a`)"
columns = "Source | "
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:718"
section = "1.3.7 Accessibility"
property = "Scale factor"
text = "Plasma 6.7 on X11: `forceFontDPI / 96` (from `kcmfonts`; 0 = unset) · Plasma 6.7 on Wayland: **(none)** — the KCM hides the DPI setting (\"they should always be using the global scaling system instead\", [main.qml:424-426](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/fonts/ui/main.qml#L424-L426)); krdb's `Xft.dpi` there is `kwinrc [Xwayland] Scale` × 96 ([krdb.cpp:333-337](https://invent.kde.org/plasma/plasma-workspace/-/blob/v6.7.5/kcms/krdb/krdb.cpp#L333-L337)), the Xwayland scale, not a text scale · Plasma 6.8: **(none)** — no `forceFontDPI` (Font DPI override above) | ✅ Plasma 6.7.5; ✅ Plasma 6.8.1"
