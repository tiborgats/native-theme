line = "platform-facts.md@fc6109d1:1659"
section = "2.26 Card / Container"
property = "border.line_width"
text = "**(KF6 src)** 1 — `borderWidth: 1` ([DefaultCardBackground.qml:65, :86-89](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/controls/private/DefaultCardBackground.qml#L65))"
