line = "platform-facts.md@fc6109d1:1657"
section = "2.26 Card / Container"
property = "background_color"
text = "**(KF6 src)** Kirigami's `Card`: `Kirigami.Theme.backgroundColor` of the View set, which the card selects ([templates/AbstractCard.qml:92-93](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/templates/AbstractCard.qml#L92-L93); [DefaultCardBackground.qml:42, :74-82](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/controls/private/DefaultCardBackground.qml#L42)) — `[Colors:View] BackgroundNormal`, #ffffff / #141618 ([BreezeLight.colors:115](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/colors/BreezeLight.colors#L115); BreezeDark.colors:116); hovered or pressed it tints toward `highlightColor` by 0.1 or 0.3 (:48-58)"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1658"
section = "2.26 Card / Container"
property = "border.color"
text = "**(KF6 src)** `linearInterpolation(backgroundColor, textColor, frameContrast)` of the View set ([DefaultCardBackground.qml:70, :86-89](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/controls/private/DefaultCardBackground.qml#L70); HSV, [colorutils.cpp:61-80](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/platform/colorutils.cpp#L61-L80); `frameContrast` = `KColorScheme::frameContrast()`, default 0.2, [kcolorscheme.cpp:529-538](https://invent.kde.org/frameworks/kcolorscheme/-/blob/27066d471c93629efee8459d9f69490caa92b7c4/src/kcolorscheme.cpp#L529-L538), which PlasmaDesktopTheme passes on, [plasmadesktoptheme.cpp:313](https://invent.kde.org/frameworks/qqc2-desktop-style/-/blob/v6.31.0/kirigami-plasmadesktop-integration/plasmadesktoptheme.cpp#L313)) — Breeze #ced1d4, Breeze Dark #3c4146 (computed with Qt 6.11.2 `QColor`)"
rows = []
targets = []
note = "no gap-map row names this cell"

