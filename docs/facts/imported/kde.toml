text = "**(KF6 src)** `pressedColor` = `Qt.darker(normalColor)`, \"200% darker\" ([templates/LinkButton.qml:61-66](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/templates/LinkButton.qml#L61-L66)): the HSV value halved, factor 2.0 ([qqmlbuiltinfunctions.cpp:660-682](https://github.com/qt/qtdeclarative/blob/v6.11.2/src/qml/qml/qqmlbuiltinfunctions.cpp#L660-L682)) — Breeze #14405c, Breeze Dark #0e4d79 (`ForegroundLink` #2980b9, #1d99f3; computed with Qt 6.11.2 `QColor::darker(200)`)"
