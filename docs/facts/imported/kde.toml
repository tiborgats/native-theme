[[row]]
line = "platform-facts.md@fc6109d1:1119"
section = "2.1.6 Global Geometry"
property = "disabled_opacity"
text = "**(Breeze src)** 1.0 — no disabled opacity: Breeze paints a disabled control from the palette's `Disabled` group, `enabled` gating only hover ([breezestyle.cpp:4900-4940](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L4900-L4940)); KColorScheme derives that group by `[ColorEffects:Disabled]` ([kcolorscheme.cpp:36-101](https://invent.kde.org/frameworks/kcolorscheme/-/blob/27066d471c93629efee8459d9f69490caa92b7c4/src/kcolorscheme.cpp#L36-L101)): Breeze states Fade 0.65 and Darken 0.1 ([BreezeLight.colors:9-16](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/colors/BreezeLight.colors#L9-L16)), so a foreground is `mix(fg, bg, 0.65)` darkened and a background darkened. Computed with KColorScheme 6.31.0 on BreezeLight / BreezeDark.colors, Disabled: Button bg #f0f0f0 / #272a2e, fg #a8a9aa / #6d6f72; Window fg #a0a1a3 / #686a6c; View bg #f3f3f3 / #131517, fg #aaabac / #606263, `ForegroundLink` #a3cae2 / #164160"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1120"
section = "2.1.6 Global Geometry"
property = "border.opacity"
text = "**(Breeze src)** 0.2 — `frameIntensityBias()` = `KColorScheme::frameContrast()` (see §2.11 `border.color`), the share of the foreground in every line: `mix(Window, WindowText, 0.2)` for frames and separators ([breezehelper.cpp:142-144](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L142-L144)), `mix(Button, ButtonText, 0.2)` for buttons (:250), the text colour at alpha 0.2 for progress bar and slider outlines (:1215)"
rows = []
targets = []
note = "no gap-map row names this cell"

