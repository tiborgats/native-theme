[[row]]
line = "platform-facts.md@fc6109d1:1662"
section = "2.26 Card / Container"
property = "border.padding_horizontal"
text = "**(KF6 src)** 7 inside the border line: Kirigami's `Card` sets `padding: Units.largeSpacing`, 8 ([templates/AbstractCard.qml:96](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/templates/AbstractCard.qml#L96); [units.cpp:39](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/platform/units.cpp#L39)), laid out from the card's outer edge (`KirigamiLayouts.Padding { anchors.fill: parent }`, AbstractCard.qml:100-108), and its 1px border (`DefaultCardBackground.qml:65`) is drawn inside that edge ([shadowedrectangle.frag:57-60](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/primitives/shaders/shadowedrectangle.frag#L57-L60)), the outermost of those 8: 8 − 1"
