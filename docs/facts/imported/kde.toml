text = "**(Breeze src)** `KColorUtils::mix(Button, Highlight, Metrics::Blend_Value)`, Blend 0.3: a pressed, enabled, non-flat button's fill, in place of `palette.button()` ([breezehelper.cpp:693-694, :704](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L693-L704); [breezemetrics.h:176](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezemetrics.h#L176)), whose animation the style drives by `down && enabled` alone ([breezestyle.cpp:4547](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L4547)) — Breeze #c3e5f6, Breeze Dark #2f5368 (Button #fcfcfc, #292c30; Selection #3daee9; computed with KF 6.30.0 `KColorUtils::mix`)"
