text = "`ToolBar_ItemMargin` = 6 — Qt sets the toolbar layout's margin on all four sides, `PM_ToolBarItemMargin` + `PM_ToolBarFrameWidth` ([qtoolbarlayout.cpp:87-89](https://github.com/qt/qtbase/blob/cb18a8e32caf93b3cd2373921ba1a4a41be90323/src/widgets/widgets/qtoolbarlayout.cpp#L87-L89)); Breeze returns `ToolBar_ItemMargin` = 6 and `ToolBar_FrameWidth` = 0 ([breezestyle.cpp:732-733, :807-808](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L732-L733); [breezemetrics.h:105, :110](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezemetrics.h#L105))"
