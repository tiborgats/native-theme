[[row]]
line = "platform-facts.md@fc6109d1:1661"
section = "2.26 Card / Container"
property = "border.shadow_enabled"
text = "**(KF6 src)** yes — a `gridUnit`-sized shadow in `rgba(0, 0, 0, 0.05)`, offset 2 down ([DefaultCardBackground.qml:90-94](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/controls/private/DefaultCardBackground.qml#L90-L94)), and a darker rectangle 1 below the card (:96-109)"
