[[row]]
line = "platform-facts.md@fc6109d1:1714"
section = "2.29 Text Area (multi-line)"
property = "border.padding_horizontal"
text = "**(Breeze src)** 5 inside the frame line — a QTextEdit is a scroll area, which Breeze frames `Frame_FrameWidth` = 2 wide when it shares a layout with spacing (`PM_DefaultFrameWidth`, [breezestyle.cpp:659-720](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L659-L720); [breezemetrics.h:41](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezemetrics.h#L41)), its 1px line the outermost, and its document sets the text `documentMargin` = 4 in ([qtextdocument_p.cpp:180](https://github.com/qt/qtbase/blob/ef55f427f2c8b410d34f8a7681020a3000cf6866/src/gui/text/qtextdocument_p.cpp#L180)): 2 + 4 − 1. **(measured)** 2026-09-28, a Breeze QTextEdit (`kdialog --textinputbox`, KWin, scale 1.0, Noto Sans 10pt): the text starts 6px from the frame's outer left edge"
rows = []
targets = []
note = "no gap-map row names this cell"

