text = "**(KF6 src)** 12: the indicator is `Kirigami.Units.gridUnit` tall ([SwitchIndicator.qml:15](https://invent.kde.org/frameworks/qqc2-desktop-style/-/blob/v6.31.0/org.kde.desktop/private/SwitchIndicator.qml#L15)), 18 — Kirigami's fixed default ([units.cpp:36](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/platform/units.cpp#L36)), which the Plasma integration does not change: it sets only the durations ([plasmadesktopunits.cpp:23-55](https://invent.kde.org/frameworks/qqc2-desktop-style/-/blob/v6.31.0/kirigami-plasmadesktop-integration/plasmadesktopunits.cpp#L23-L55)) — and the track fills it less `Math.floor(height / 6)` = 3 above and below (SwitchIndicator.qml:41-46)"
