text = "**(Breeze src)** `hoverColor()` = `[Colors:View] DecorationHover`: `frameOutlineColor` returns it for a hovered frame ([breezehelper.cpp:142-168](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L142-L168); the View set's hover decoration, :90, [breezehelper.h:64-67](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.h#L64-L67)), which a line edit's frame strokes ([breezestyle.cpp:4077-4080](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L4077-L4080)) — 61,174,233 #3daee9 in Breeze and Breeze Dark ([BreezeLight.colors:117](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/colors/BreezeLight.colors#L117); BreezeDark.colors:118)"
