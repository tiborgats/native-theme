text = "**(Breeze src)** the bottom edge only, in the Header set's `separatorColor()` = `KColorUtils::mix(Header bg, Header fg, frameContrast)`: Breeze draws no toolbar frame (a QToolBar's `CE_ToolBar` is `emptyControl`, [breezestyle.cpp:1466-1467](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L1466-L1467); [breezestyle.h:297-300](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.h#L297-L300)), but it strokes a line along the bottom of a `QMainWindow`'s tools area, its menu bar and top toolbars (`drawWidgetPrimitive`, breezestyle.cpp:1349-1350), in the tools area's palette, the Header set ([breezetoolsareamanager.cpp:201-215](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezetoolsareamanager.cpp#L201-L215)) — Breeze #b9bbbd, Breeze Dark #535659 (Header #dee0e2 / #232629, #292c30 / #fcfcfc, [BreezeLight.colors:59, :67](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/colors/BreezeLight.colors#L59); BreezeDark.colors:60, :68; computed with KF 6.30.0 `KColorUtils::mix`). This column follows Breeze's Qt Widgets style, as its other §2.13 cells do; qqc2-desktop-style's QML `ToolBar` draws a `Kirigami.Separator` there instead"
