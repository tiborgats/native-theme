section = "2.12 Sidebar"
property = "background_color"
text = "`[Colors:View] BackgroundNormal`: the KDE HIG's sidebar is the non-modal `GlobalDrawer` (\"It looks like a standard sidebar\", [content/hig/layout_and_nav.md:75](https://invent.kde.org/documentation/develop-kde-org/-/blob/cc5482a3522a353c11bcdbdbe69c731804c498a0/content/hig/layout_and_nav.md#L75), develop-kde-org `cc5482a3`), which KF 6.31.0 docks in the `View` set ([controls/GlobalDrawer.qml:337](https://invent.kde.org/frameworks/kirigami/-/blob/v6.31.0/src/controls/GlobalDrawer.qml#L337)), and System Settings' sidebar sets `colorSet: View`, `inherit: false` ([app/qml/CategoriesPage.qml:19-20](https://invent.kde.org/plasma/systemsettings/-/blob/v6.8.1/app/qml/CategoriesPage.qml#L19-L20), systemsettings v6.8.1): Breeze #ffffff, Breeze Dark #141618 ([BreezeLight.colors:115](https://invent.kde.org/plasma/breeze/-/blob/v6.7.5/colors/BreezeLight.colors#L115), [BreezeDark.colors:116](https://invent.kde.org/plasma/breeze/-/blob/v6.7.5/colors/BreezeDark.colors#L116), v6.7.5). Not every KDE side panel is one: a non-modal plain `OverlayDrawer` docks in the `Window` set ([templates/OverlayDrawer.qml:244](https://invent.kde.org/frameworks/kirigami/-/blob/v6.31.0/src/templates/OverlayDrawer.qml#L244)), and KIO's places panel (`KFilePlacesView`: Dolphin, the file dialog) clears its viewport to transparent over the window, text `WindowText` ([kfileplacesview.cpp:863-866](https://invent.kde.org/frameworks/kio/-/blob/v6.31.0/src/filewidgets/kfileplacesview.cpp#L863-L866)). None uses `[Colors:Complementary]`"
