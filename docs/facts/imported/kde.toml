text = "**(KF6 src)** leading — KDE's expander is KWidgetsAddons' `KCollapsibleGroupBox`, which paints its arrow in the style's `SE_CheckBoxIndicator` rect and its title in `SE_CheckBoxContents` ([kcollapsiblegroupbox.cpp:153-182](https://invent.kde.org/frameworks/kwidgetsaddons/-/blob/v6.30.0/src/kcollapsiblegroupbox.cpp#L153-L182)): Breeze's `renderArrow` chevron, `ArrowSize` 10 centred in the 20px indicator ([breezehelper.cpp:1511-1578](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L1511-L1578))"
