text = "**(Breeze src)** the Header set's `[Colors:Header] BackgroundNormal` — Breeze #dee0e2, Breeze Dark #292c30 ([BreezeLight.colors:59](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/colors/BreezeLight.colors#L59); BreezeDark.colors:60): Breeze fills a `QMainWindow`'s tools area, its menu bar and top toolbars, with the tools-area palette's `Window`, the Header set ([breezestyle.cpp:1322, :1341-1347](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L1341-L1347); [breezetoolsareamanager.cpp:201-215](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezetoolsareamanager.cpp#L201-L215)), where the scheme has Header colours (:232; both Breeze schemes do, BreezeLight.colors:57) and the window decoration's border size is automatic, None or NoSides ([breezehelper.cpp:1904-1941](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L1904-L1941)); an inactive window takes `[Colors:Header][Inactive]` (BreezeLight.colors:73, BreezeDark.colors:74). Otherwise the toolbar draws no fill of its own (`border.color` below) and shows the window's, ← `defaults.background_color`"
