[[row]]
line = "platform-facts.md@fc6109d1:1569"
section = "2.22 Dialog"
property = "entrance"
text = "`fade_rise` **(impl)** — KDE's in-window dialog, `Kirigami.Dialog`, fades in (opacity 0 → 1 in `Units.longDuration` 200 ms) while rising 2 grid units into place (`y: … + Platform.Units.gridUnit * 2 * (1 - opacity)`, [dialogs/Dialog.qml:303](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/dialogs/Dialog.qml#L303), the fade at [:306-311](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/dialogs/Dialog.qml#L306-L311); [platform/units.cpp:41](https://invent.kde.org/frameworks/kirigami/-/blob/8319acc7dd1149664147ec1e22c39ae6143ed752/src/platform/units.cpp#L41)). Note: KWin's default-on Scale effect (0.8 → 1, 200 ms; [scale/package/contents/code/main.js:35-80](https://invent.kde.org/plasma/kwin/-/blob/v6.7.5/src/plugins/scale/package/contents/code/main.js#L35-L80), [metadata.json:93](https://invent.kde.org/plasma/kwin/-/blob/v6.7.5/src/plugins/scale/package/metadata.json#L93)) animates toplevel windows such as a `QDialog`, not an in-window dialog, and Qt's [qdialog.cpp](https://github.com/qt/qtbase/blob/d865bf9d4877fa09e1fc02e2ad14fb9fd43ef430/src/widgets/dialogs/qdialog.cpp) animates nothing"
rows = []
targets = []
note = "no gap-map row names this cell"

