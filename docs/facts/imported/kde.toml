[[row]]
line = "platform-facts.md@fc6109d1:1414"
section = "2.14 Status Bar"
property = "border.padding_horizontal"
text = "✅ 2 left / 14 right — Qt `QStatusBar::reformat()`: layout margins `QMargins()` (all 0), `addSpacing(2)` before the items, nothing after them ([qstatusbar.cpp:418-474](https://github.com/qt/qtbase/blob/d865bf9d4877fa09e1fc02e2ad14fb9fd43ef430/src/widgets/widgets/qstatusbar.cpp#L418-L474)); then the size grip, enabled by default (:200-201; KXmlGui leaves it so), 1px after the items (:466-467) and 13px wide: its size hint is `QSize(13, 13)` through `CT_SizeGrip` ([qsizegrip.cpp:198-202](https://github.com/qt/qtbase/blob/d865bf9d4877fa09e1fc02e2ad14fb9fd43ef430/src/widgets/widgets/qsizegrip.cpp#L198-L202)), horizontal policy `Minimum` (:183), and neither Breeze (`sizeFromContents` → parent, [breezestyle.cpp:1155-1156](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L1155-L1156)) nor `KStyle` ([kstyle.cpp](https://invent.kde.org/frameworks/frameworkintegration/-/blob/178c522c70c0c1295f59d4776596c8a361dec872/src/kstyle/kstyle.cpp), no `sizeFromContents`) changes it, `QCommonStyle` returning it as given ([qcommonstyle.cpp:5032-5035](https://github.com/qt/qtbase/blob/d865bf9d4877fa09e1fc02e2ad14fb9fd43ef430/src/widgets/styles/qcommonstyle.cpp#L5032-L5035)). Breeze paints the grip as nothing (`CE_SizeGrip` → `emptyControl`, [breezestyle.cpp:1505-1506](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezestyle.cpp#L1505-L1506)), so the items end 1 + 13 = 14px of empty bar before the right edge. Context: a window that is neither maximized nor full screen; in those two states the grip is hidden (qsizegrip.cpp:76-89, :450-463) and the right is 0. `showMessage()` text: 6 left / 12 right (`messageRect()`, :97-98). Breeze has no status-bar metric (`breezemetrics.h`)"
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:1415"
section = "2.14 Status Bar"
property = "border.padding_vertical"
text = "✅ 3 top / 2 bottom — Qt `QStatusBar::reformat()`: `addSpacing(3)` above the items row, `addSpacing(2)` below it (qstatusbar.cpp:437, :472). Breeze's 1px top separator is painted inside the bar, not laid out (`drawPanelStatusBarPrimitive`)"
