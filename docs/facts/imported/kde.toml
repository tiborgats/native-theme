text = "**(Breeze src)** selected tab only: `KColorUtils::mix(Window, WindowText, frameIntensityBias())` ([breezehelper.cpp:1463-1468](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L1463-L1468)); the bias is `KColorScheme::frameContrast()` ([breezehelper.cpp:105](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezehelper.cpp#L105)), kdeglobals `[KDE] frameContrast`, default 0.2 ([kcolorscheme.cpp:529-538](https://invent.kde.org/frameworks/kcolorscheme/-/blob/27066d471c93629efee8459d9f69490caa92b7c4/src/kcolorscheme.cpp#L529-L538)), which neither Breeze colour scheme sets; `mix` interpolates the sRGB channels linearly ([kcolorutils.cpp:144-165](https://invent.kde.org/frameworks/kguiaddons/-/blob/7c766f6f99238c13acb8c50d8391600e964f3b8a/src/colors/kcolorutils.cpp#L144-L165)) — Breeze #c6c8c9, Breeze Dark #4c4e51. Unselected tabs draw no outline (`Qt::NoPen`, breezehelper.cpp:1504). Breeze also fills a 3px `QPalette::Highlight` strip along the selected North tab's top edge, rounded 5 (`TabBar_ActiveEffectSize` = 3, [breezemetrics.h:137](https://github.com/KDE/breeze/blob/f0b1d7534aa2356d7336241d0c7051522e8a6b68/kstyle/breezemetrics.h#L137); breezehelper.cpp:1471-1487), which no `tab` field models"
