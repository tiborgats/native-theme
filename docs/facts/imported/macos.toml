[[row]]
line = "platform-facts.md@fc6109d1:1198"
section = "2.3 Button"
property = "disabled_background"
text = "**(measured)** AppKit publishes no disabled bezel fill. A disabled push button draws its bezel at half its alpha, its label in `disabledControlTextColor` (`disabled_text_color`). macOS 14–15: #ffffff80 / #ffffff20, where the enabled bezel is #ffffff / #ffffff40 ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/aqua/push_button-regular-disabled@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/darkAqua/push_button-regular-disabled@2x.png); the bezel's shadow fades with it) · macOS 26: #0000000a / #ffffff0a, where the enabled one is #00000014 / #ffffff14 ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/aqua/push_button-regular-disabled@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/darkAqua/push_button-regular-disabled@2x.png)); macOS 27 the same. The renders are not key: in the probe's key and not-key windows every neutral part draws the same (the unselected segment, the switch's off track and knob, the slider's track and knob, enabled and disabled), and only the accent parts differ, so a neutral disabled fill from the renders is taken as the key window's; no key-window sample has this control"
