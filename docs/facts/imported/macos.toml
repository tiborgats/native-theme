text = "**(measured)** AppKit publishes no disabled slider colours. macOS 14–15: a disabled slider draws no value fill, the bar is the disabled track's colour on both sides of the knob: black (L) / white (D) at alpha 7/255 / 13/255, #00000007 / #ffffff0d ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/aqua/slider-regular-disabled@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/darkAqua/slider-regular-disabled@2x.png)); in a key window #efefef / #333333 over the window's #f6f6f6 / #282828 ([probe 14 :3660, :3854](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/probe.toml#L3660); macOS 15 the same), grey under a red accent too ([accent-red :3660, :3854](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/accent-red/probe.toml#L3660)) · macOS 26: no accent either, but the bar left of the knob is a denser grey than the track, darker in light and lighter in dark: #dfdfdf / #393939 in a key window, the track #e3e3e3 / #343434, over #ffffff / #1e1e1e ([probe 26 :3660, :3854](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/probe.toml#L3660)), black / white at alpha 32/255 / 31/255, #00000020 / #ffffff1f; the render, not key, gives #0000002a / #ffffff2a ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/aqua/slider-regular-disabled@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/darkAqua/slider-regular-disabled@2x.png)), and a window that is not key draws #d3d3d3 / #424242 ([not-key :3671, :3867](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/not-key/probe.toml#L3671)); macOS 27 #d9d9d9 / #3d3d3d in a key window"
