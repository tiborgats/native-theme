[[row]]
line = "platform-facts.md@fc6109d1:1529"
section = "2.21 Switch / Toggle"
property = "disabled_checked_background"
text = "**(measured)** AppKit publishes no disabled switch colours. A disabled on switch draws the enabled on track, in the accent, at a lower alpha over the window. macOS 14–15: alpha 0.50 — a key window draws #84befb / #1f4e81 where the enabled track is #1485ff / #1674d9, over #f6f6f6 / #282828 ([probe 14 :3620, :3640, :3814, :3834](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/probe.toml#L3620); macOS 15 #84befb / #1f4681 beside #1485fe / #1664d9), and with a red accent (`AppleAccentColor` 0) #eb9093 / #853234 beside #de2a30 / #e23d41 ([accent-red :3620, :3640, :3814, :3834](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/accent-red/probe.toml#L3620)), where `controlAccentColor` reads #007aff and #e0383e / #ff5257 ([probe 14 :362, :436](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/probe.toml#L362); [accent-red :362, :436](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/accent-red/probe.toml#L362)) · macOS 26: alpha about 0.45 (0.44–0.47 per channel) — #8ec0f9 / #164880 beside #0076f7 / #077cfd over #ffffff / #1e1e1e ([probe 26 :3620, :3640, :3814, :3834](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/probe.toml#L3620)), red #eba4a7 / #80383a beside #d9373b / #fd565a ([accent-red :3620, :3640, :3814, :3834](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/accent-red/probe.toml#L3620)); macOS 27 about 0.71 (#4b9df5 / #1162ba). The enabled on track it fades is itself not `controlAccentColor` exactly (`checked_background`). The probe's renders are not key and draw the track grey"
