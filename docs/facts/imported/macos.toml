section = "2.5 Checkbox / Radio Button"
property = "disabled_background"
text = "**(measured)** for the unchecked box, ❓ for the checked one. macOS 14–15: a disabled unchecked box, fill and edge, is the enabled one at half its alpha, #ffffff80 / #ffffff1b where the enabled box is #ffffff / #ffffff37 ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/aqua/checkbox-regular-disabled-off@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/darkAqua/checkbox-regular-disabled-off@2x.png); the radio's the same, [L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/aqua/radio-regular-disabled-off@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-14/renders/darkAqua/radio-regular-disabled-off@2x.png)) · macOS 26: #0000000d / #ffffff0d, where the enabled box is `systemFillColor`'s #00000019 / #ffffff19, the checkbox's and the radio's ([L](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/aqua/checkbox-regular-disabled-off@2x.png), [D](evidence/os-probe/2026-10-26-run-40348854007/os-probe-macos-26/renders/darkAqua/checkbox-regular-disabled-off@2x.png)); macOS 27 the same. A checked box is the accent in a key window; the renders are not key and draw it neutral (white with a dark mark on 14–15, #00000024 on 26), so the disabled checked box is unmeasured, and this one field, which stands for both states, cannot carry both. The label is `disabledControlTextColor` (`disabled_text_color`). The not-key caveat of §2.3 `disabled_background` holds"
