[[row]]
line = "platform-facts.md@fc6109d1:177"
section = "1.1.3 Geometry"
property = "Window corner radius"
text = "macOS window manager **(measured)** | 10px | ✅ multiple sources confirm through Sequoia; macOS Tahoe (26) uses variable radii per window style — 16pt (title-bar-only) confirmed by [macos-corner-fix](https://github.com/m4rkw/macos-corner-fix); toolbar window radii: sources disagree on exact values — [Zed discussion #38233](https://github.com/zed-industries/zed/discussions/38233) reports ~26pt (from WWDC25 Session 310 screenshot), [Podfeet/Steve Harris measurement](https://www.podfeet.com/blog/2025/10/rounded-screenshots-shell-script/) measured 50px at 2× = 25pt, [VS Code PR #270236](https://github.com/microsoft/vscode/pull/270236) suggests 20pt (compact toolbar) and 24pt (standard toolbar); [lapcatsoftware](https://lapcatsoftware.com/articles/2026/3/1.html) describes variable radii qualitatively (toolbar > titlebar-only) without exact values; [alt-tab-macos #4985](https://github.com/lwouis/alt-tab-macos/issues/4985) notes \"4 or 5\" distinct radii — system may have more tiers than documented here; no public API exists (WebKit reads them dynamically via private `_cornerConfiguration` SPI) · macOS 26: ❓ — the Tahoe figures above are third-party measurements, not a primary source"
columns = "Source | Value | "
rows = []
targets = []
note = "no gap-map row names this cell"

[[row]]
line = "platform-facts.md@fc6109d1:178"
section = "1.1.3 Geometry"
property = "Control corner radius"
text = "AppKit intrinsic rendering **(measured)** | 5px | ❓ no AppKit source: WebKit's `baseBorderRadius = 5` ([`RenderThemeMac.mm:1351`](https://github.com/WebKit/WebKit/blob/de320ba3ff90229f983988d42d4b0f83315459da/Source/WebCore/rendering/mac/RenderThemeMac.mm#L1351), used at :1460) is the radius of a CSS-styled `<select>` only; the OS probe (macOS 14.8.9) reads no radius, and its push-button render's corner, whose edge blends into a soft shadow, gives none to measure ([render](evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-14/renders/aqua/push_button-regular@2x.png)) · macOS 26: 6 **(WebKit)** for the push button and the pop-up, 5 for the text field ([`RenderThemeCocoa.mm:1821`](https://github.com/WebKit/WebKit/blob/de320ba3ff90229f983988d42d4b0f83315459da/Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm#L1821), [:1949](https://github.com/WebKit/WebKit/blob/de320ba3ff90229f983988d42d4b0f83315459da/Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm#L1949)), WebKit's own vector drawing, compiled for macOS ≥ 26 only; the 26.6.2 probe's push-button and text-field renders are consistent with it ([push button](evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-26/renders/aqua/push_button-regular@2x.png), [text field](evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-26/renders/aqua/text_field-regular@2x.png))"
columns = "Source | Value | "
evidence = [
    "docs/evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-14/renders/aqua/push_button-regular@2x.png",
    "docs/evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-26/renders/aqua/push_button-regular@2x.png",
    "docs/evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-26/renders/aqua/text_field-regular@2x.png",
]
