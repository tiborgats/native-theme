[[row]]
line = "platform-facts.md@fc6109d1:199"
section = "1.1.4 Widget Metrics"
property = "NSButton"
text = "horizontal padding | 8px | ❓ The legacy HIG 12px is inter-button *spacing*, not internal padding. Gecko [`nsNativeThemeCocoa.mm`](https://searchfox.org/mozilla-central/source/widget/cocoa/nsNativeThemeCocoa.mm) `pushButtonSettings` margins `IntMargin{0,5,2,5}` are *external* drawing-rect inflation (for focus rings/chrome), not content padding; Gecko's actual CSS content padding for `<button>` is `padding-inline: 4px` ([`forms.css`](https://searchfox.org/mozilla-central/source/layout/style/res/forms.css)). WebKit [`RenderThemeMac.mm`](https://github.com/WebKit/WebKit/blob/main/Source/WebCore/rendering/mac/RenderThemeMac.mm) `controlPadding(PushButton)` = **8px** horizontal (comment: \"Just use 8px. AppKit wants to use 11px for mini buttons, but that padding is just too large for real-world Web sites\"); WebKit `cellOutsets` `{5,7,7,7}` are also *external* outsets. Native NSButton bezel internal padding is not directly queryable; best browser-engine evidence points to **~8px** (WebKit) as the closest approximation of the native value · macOS 14–15: 8 **(API)**, `titleRectForBounds:` x 15 against the alignment rect's x 7 ([probe 14 :1062](evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-14/probe.toml#L1062), :1071) · macOS 26: 12 **(API)** left and right, `titleRectForBounds:` [12, 4, 41, 16] in the 65 × 24 bezel, which is the frame ([probe 26 :1061-1071](evidence/os-probe/2026-10-11-run-38129819806/os-probe-macos-26/probe.toml#L1061-L1071)); WebKit's vector button pads 6 ([`RenderThemeCocoa.mm:3357-3358`](https://github.com/WebKit/WebKit/blob/de320ba3ff90229f983988d42d4b0f83315459da/Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm#L3357-L3358)), its own HTML button"
