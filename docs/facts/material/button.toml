# the indicator is the menu button's trailing icon (its tokens' "Trailing icon"); neither Compose nor material-web has
# a menu-button component, and material-web's button draws a trailing icon in its inline-flex row after the label
# (button.ts's render, _shared.scss's row), its gap the row's: so `Inline` (the catalogue's rule for every indicator
# not overlaid, ADD-A122) and the row's gap
