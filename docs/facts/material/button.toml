# material-3 button (generated part 1-2)

# material-3's `button` (the catalogue's entry, S5), written by the Material facts lane.
# Reference order (R1.6): material-web 2.5.0's token set `tokens/versions/latest/` (the non-deprecated
# `md.comp.button.*` sets), then Compose Material 3 1.5.0-beta02 where the tokens are silent. The base (no variant)
# is the `md.comp.button` set, whose colours are the filled button's (`primary`); the styles follow as variants, then
# the toggles, the Expressive sizes and the menu button; the icon buttons and the FABs are appended after these.
# Compose draws a button as a Surface whose LocalContentColor is the button's content colour (the label's and the
# icon's), so `body.bindings` binds `surface.foreground` to it. The pressed state's fill is Android's own ripple
# (spike A): it is not stated from the 0.1 token and waits for the Android host's measurement (the lane report).
# dp is px (S17's units).

