# the menu buttons' transitions (MAT-N8, MAT-X9): material-web's buttons' motion, as their indicator's placement is
# (button.ts:166-168). md-ripple fades its hover layer by `opacity 15ms linear`, both ways (_ripple.scss:64-68,
# :82-85); it draws no focus layer (material-web shows focus with md-focus-ring), so nothing times the tokens' focus
# state layer (U74); the filled form's md-elevation moves in 280ms on `map.get($_md-sys-motion, 'emphasized-easing')`,
# a key the motion map does not hold (_elevation.scss:14-21; tokens/versions/v0_192/_md-sys-motion.scss:33-34 names it
# `easing-emphasized`), so its curve is not stated (U75), and none at all when disabled (:23-25).

