# Material 3 Expressive's five sizes (flavour expressive; `regular` is M3E's medium): md.comp.button.<size>.*;
# the vertical padding, which the tokens leave out, is Compose's (ButtonDefaults' content paddings). The FABs state
# their own sizes (appended below), so these facts leave `@fab` and `@extended_fab` out. Corners: round is the base
# (full); `@square` the size's square shape; a checked toggle the selected shape; pressed wins over checked
# (Compose's shapeByInteraction).

[[fact]]
