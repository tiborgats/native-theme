# transitions (S2.7, ADD-A124): the state layer's fades and the shadow's, Compose's (MAT-X7, MAT-X9, MAT-B13).
# The rest style states the state layer's outgoing fade (15 ms linear from hover or focus, material3-ripple
# Ripple.kt:313-322, :472-483) and the elevation's outgoing specs, 150 ms from press or focus and then 120 ms from
# hover, on Elevation.kt's OutgoingSpecEasing (Elevation.kt:96-113, the state left named by the elevation it showed,
# Button.kt:1758-1764), stated in that order (the catalogue's Material recency sets). Each state-layer rule states its
# incoming fade (15 ms to hover, 45 ms to focus, :463-470); each elevation rule Compose's incoming spec, 120 ms on
# animation-core's FastOutSlowInEasing (Easing.kt:50): those lists close the group. The disabled rule snaps the
# shadow (Button.kt:1754-1756), a zero duration. Compose's text, outlined
# and icon buttons have no elevation (`elevation = null`): the state layer alone. The press ripple is no transition
# (S2.12). The menu buttons' forms are drawn as material-web's buttons (their facts at the group's end).
# Expressive (flavor:expressive) adds the corner morph: the buttons' and icon buttons' DefaultEffects spring
# (Button.kt:253-258, IconButton.kt:1579-1584), the toggle buttons' FastSpatial one (ToggleButton.kt:176-181), and
# the outlined toggle's border colour by DefaultEffects and width by FastSpatial (ToggleButton.kt:1722-1741).

