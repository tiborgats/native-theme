# the menu buttons (MAT-N8): md.comp.{standard,filled,outlined}-menu-button.* — standard is `menu` alone (no
# container), filled `{menu, primary}`, outlined `{menu, @outlined}`; the trailing icon is the menu indicator. Compose
# has no menu button and material-web no menu-button component: material-web draws these forms as its text, filled and
# outlined buttons with a trailing icon, so the indicator's placement and gap and the forms' motion (md-ripple,
# md-elevation; the transitions at the file's end) are those buttons'; what the tokens leave out (the indicator's
# glyph) is listed in the lane report, not stated.

[[fact]]
key = "button.body.bindings"
when = { variants = ["menu"] }
value = [{ role = { role = { surface = "foreground" }, value = "= role.@on_surface_variant" } }]
rows = ["MAT-N8"]

