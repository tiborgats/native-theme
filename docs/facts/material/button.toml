# interaction (S2.12, ADD-A124): Compose's ripple node on the container, drawn over the fill and the content and
# beneath the outline (material3-ripple Ripple.kt:373-377, Surface.kt:562-564, Border.kt:212-214). Its colours are the
# content colour, `surface.foreground`, which body.bindings binds per style and state (LocalContentColor,
# material3 Ripple.kt:768-781), restated only where the tokens give another (the branded FABs). The state layer is at
# zero alpha at rest; each state-layer rule sets its alpha (latest state_layer:<flag>, the catalogue's Material
# recency sets). The press ripple is Android's patterned RippleDrawable (Ripple.android.kt:35-46,
# RippleDrawable.java:161), started by the press (S2.12), at the pressed opacity Compose passes as its colour's
# alpha (material3 Ripple.kt:827-832), bounded, its radius half the box's diagonal plus 10dp (Compose's
# radius unspecified, RippleAnimation.kt:168-178): spike A's pixels are the effect's, which the Android host's
# capture measures (U70), so no pressed fill is stated: the pressed container is the rest one.

