# the states, in the tokens' order (hovered, focused, pressed, disabled). The state layer is the `interaction`
# block's (S2.12, MAT-X8): its alpha, the token's state-layer opacity, under `latest state_layer:<flag>`, as Compose's
# ripple node shows the state layer of the most recent of hover and focus (material3-ripple Ripple.kt:250-280; the
# state model's recency set `state_layer`), its colour the base's content colour, which each token set's state-layer
# colour equals (R1.6). The shadow follows the set `elevation` (`latest elevation:<flag>`, Button.kt:1703-1747); every
# other field (the label's, icon's and outline's colours) follows plain flags. The container is the rest one: the state
# layer and the press ripple are drawn over it and the content and beneath the outline (Ripple.kt:373-377,
# Surface.kt:562-564), so the label's and icon's colours are the tokens' (ADD-A121's composite gone, ADD-A124).
# The base's (the filled set's) shadow rules leave out the text, outlined and menu forms, which have no elevation
# (TextButton's and OutlinedButton's `elevation = null`, Button.kt:642, :870; their own facts state `absent`).

