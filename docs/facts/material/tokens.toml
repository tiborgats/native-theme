# S4.1 motion: the motion scheme's springs (MAT-X13), each a Compose `spring(dampingRatio, stiffness)` stated by its
# damping ratio (S2.7, ADD-A121): the standard scheme in the base (material-web's md.sys.motion.spring tokens, Compose's
# StandardMotionTokens), the expressive scheme under flavour expressive (MaterialExpressiveTheme's MotionScheme.expressive(),
# ExpressiveMotionTokens). Every field of the spring is stated (queue #115), from animation-core at the pin: the mass 1
# (Compose's spring equation has no mass, its leading coefficient the constant 1.0, SpringEstimation.kt:66-69,
# SpringSimulation.kt:85-92); the initial velocity 0, the velocity of an Animatable at rest (an ended run resets it,
# Animatable.kt:354-358), which the Compose engines replace by the running motion's (S2.7); the rest threshold
# animation-core's default displacement threshold, 0.01 per component, as the scheme's springs pass no
# `visibilityThreshold` (MotionScheme.kt, VectorizedAnimationSpec.kt:909-914, FloatAnimationSpec.kt:133-137); no clamp
# (the spring's value is returned as computed, FloatAnimationSpec.kt:145-155); the time scale 1, as the Compose
# engines divide the play time by the animator duration scale instead (SuspendAnimation.kt:333-338; S2.7).
# Keys by S4.1's rule (ADD-A122): the tokens' shared name less `Spring`, `SpringDefaultSpatialDamping` and
# `…Stiffness` `default_spatial`.

