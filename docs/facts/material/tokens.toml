# ----------------------------------------------------------------------------------------------------
# window size classes (MAT-LA1): Compose Material 3's WindowWidthSizeClass and WindowHeightSizeClass breakpoints, each
# a class's inclusive lower bound (a window takes the largest class whose bound its size reaches, fromWidth,
# fromHeight)
[[fact]]
key = "token.size_classes"
value = { compact = { horizontal_px = 0, vertical_px = 0 }, medium = { horizontal_px = 600, vertical_px = 480 }, expanded = { horizontal_px = 840, vertical_px = 900 } }
rows = ["MAT-LA1"]

[[fact.cite]]
kind = "published"
source = "androidx@e4d933c9 compose/material3/material3-window-size-class/src/commonMain/kotlin/androidx/compose/material3/windowsizeclass/WindowSizeClass.kt:165-172"
quote = "private fun WindowWidthSizeClass.breakpoint(): Dp { return when { this == Expanded -> 840.dp this == Medium -> 600.dp else -> 0.dp } }"

[[fact.cite]]
kind = "published"
source = "androidx@e4d933c9 compose/material3/material3-window-size-class/src/commonMain/kotlin/androidx/compose/material3/windowsizeclass/WindowSizeClass.kt:266-273"
quote = "private fun WindowHeightSizeClass.breakpoint(): Dp { return when { this == Expanded -> 900.dp this == Medium -> 480.dp else -> 0.dp } }"

[[fact.cite]]
kind = "published"
source = "androidx@e4d933c9 compose/material3/material3-window-size-class/src/commonMain/kotlin/androidx/compose/material3/windowsizeclass/WindowSizeClass.kt:177-194"
quote = "if (width >= it.breakpoint()) { return it }"
