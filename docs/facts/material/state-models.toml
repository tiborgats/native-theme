# material-3 state models

# material-3's state models (S17), written by the Material facts lane: what Compose Material 3 1.5.0-beta02
# and material-web 2.5.0's token sets draw. No exclusive group: Compose's hover, focus and press combine, and two
# of its drawings show the latest of a set (S7.2's recency, R3, ADD-A124; the catalogue's Material recency sets).
# `state_layer` = [focus_visible, hover]: the ripple node shows one state layer, of the most recent hover or focus
# (material3-ripple Ripple.kt:250-280), the order a connector that reports none gets being focus before hover, as
# Material's View library ranks them (an Android ColorStateList takes its first matching item, and the button's
# ripple colours put focused before hovered, material-components-android m3_button_ripple_color.xml:20-21); the
# button draws no dragged layer (MAT-X29). `elevation` = [pressed, focus_visible, hover]: the elevated, filled and
# tonal buttons, the toggle buttons and the FABs take the elevation of the latest of hover, focus and press
# (Button.kt:1703-1747, ToggleButton.kt:1589-1633, FloatingActionButton.kt:1300-1347), press first, as a press
# begins on an element the pointer already hovers or the key's focus already holds, focus before hover as in
# `state_layer`. Only the state layer (`body.interaction.state_layer`) and the shadow follow the sets; every other
# field a state changes (a label's or icon's colour, a stroke, a shape) follows plain flags. The press ripple is
# drawn beneath the state layer (Ripple.kt:375-376: drawRipples(), then drawStateLayers()) and is the block's
# effect, started by the press (S2.12), so `pressed` is in no `state_layer` set. A disabled button takes
# no hover, focus or press (Clickable.kt); FABs have no disabled state.
# Variants (ADD-A121): one colour style per element (a style is its own composable and token set: filled, tonal,
# elevated, outlined, text; the FAB's colour styles), one content form (an icon button or a button with a leading
# icon), one FAB form, one Expressive icon-button width. `variant_sets` and `variant_products` (ADD-A122) give the
# sets the facts state (each drawn by Compose or the tokens), the products the icon buttons' and the FABs' independent
# choices, the extended FAB with a leading icon among them (its own start padding, FloatingActionButton.kt:898-899,
# MAT-N2); the platform draws more (a style with a leading icon, the other FAB colours lowered, the Expressive shapes
# and widths across the icon-button styles), which no fact states yet (the lane report).
# `default_size_by_variant` (flavour expressive; S10 states it only where it differs from `default_size`): Compose's
# FloatingActionButton and ExtendedFloatingActionButton are the unsized composables, `regular`, where Expressive's
# buttons default to `small` (ToggleButton.kt:111, Button.kt:1064). The extended FAB's sizes (ADD-A123): `regular`
# the unsized one in both flavours (FloatingActionButton.kt:601-629, :1472-1482), and under flavour expressive
# `small`, `large` and `extra_large` Expressive's small, medium and large extended FABs (:400, :467, :534).
# Flavour baseline: no Expressive sizes (the FAB's three baseline sizes only), icon toggles only (IconToggleButton);
# flavour expressive: the five button sizes (default small: Compose's ToggleButton and Button use the small design),
# the text toggles, `@square`, `@narrow`, `@wide`, the container and branded FAB styles; `@primary_container`
# (Compose's default FAB container colour, FloatingActionButtonDefaults.containerColor) in both.

[[model]]
widget = "button"
available = true
variants = ["primary", "tinted", "flat", "toggle", "menu", "icon_only", "with_icon", "@elevated", "@outlined", "@fab", "@extended_fab", "@lowered", "@secondary", "@tertiary", "@surface", "@primary_container"]
sizes = ["small", "regular", "extra_large"]
default_size = "regular"
densities = []
axes = { states = ["hover", "focus_visible", "pressed", "disabled", "checked"], conditions = ["scheme:light", "scheme:dark", "contrast_increased", "contrast_high"], contexts = [{ scope = "any", widget = "toolbar", variants = ["floating"] }, { scope = "any", widget = "toolbar", variants = ["floating", "@vibrant"] }, { scope = "any", widget = "toolbar", variants = ["floating", "@collapsed"] }] }
exclusive = []
recency = { state_layer = ["focus_visible", "hover"], elevation = ["pressed", "focus_visible", "hover"] }
not_drawn = [{ states = ["disabled", "hover"] }, { states = ["disabled", "focus_visible"] }, { states = ["disabled", "pressed"] }, { states = ["checked"], not_variants = ["toggle"] }, { variants = ["toggle", "flat"] }, { variants = ["@fab"], states = ["disabled"] }, { variants = ["@extended_fab"], states = ["disabled"] }, { variants = ["@lowered"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@secondary"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@tertiary"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@surface"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@primary_container"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["toggle"], not_variants = ["icon_only"] }]
sizes_by_variant = [{ variant = "@fab", sizes = ["small", "regular", "extra_large"] }, { variant = "@extended_fab", sizes = ["regular"] }]
exclusive_variants = [["primary", "tinted", "flat", "@elevated", "@outlined", "@secondary", "@tertiary", "@surface", "@primary_container"], ["icon_only", "with_icon"], ["@fab", "@extended_fab"]]
variant_sets = [["menu", "primary"], ["menu", "@outlined"]]
variant_products = [
  [{ one = ["icon_only"] }, { any = ["primary", "tinted", "@outlined"] }, { any = ["toggle"] }],              # the icon buttons
  [{ one = ["@fab", "@extended_fab"] }, { one = ["primary", "@secondary", "@tertiary", "@primary_container", "@surface"] }],  # the FAB colours
  [{ one = ["@fab", "@extended_fab"] }, { any = ["@surface"] }, { one = ["@lowered"] }],                     # the lowered FABs
  [{ one = ["@extended_fab"] }, { one = ["with_icon"] }, { any = ["primary", "@secondary", "@tertiary", "@primary_container", "@surface"] }],  # the extended FABs with an icon
  [{ one = ["@extended_fab"] }, { one = ["with_icon"] }, { any = ["@surface"] }, { one = ["@lowered"] }],    # lowered, with an icon
]
rows = ["MAT-B1", "MAT-B12", "MAT-N1", "MAT-N2", "MAT-N4", "MAT-N8", "MAT-X22"]

