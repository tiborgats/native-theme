# material-3 state models

# material-3's state models (S17), written by the Material facts lane: what Compose Material 3 1.5.0-beta02
# and material-web 2.5.0's token sets draw. exclusive = []: Compose draws the press ripple and the hover/focus state
# layer together (material3-ripple Ripple.kt draws both), and between hover and focus it shows the most recent
# interaction, which no fixed precedence expresses (the lane report's spec finding); the button facts order hover
# before focus. A disabled button takes no hover, focus or press (Clickable.kt); FABs have no disabled state.
# Flavour baseline: no Expressive sizes (the FAB's three baseline sizes only), icon toggles only (IconToggleButton);
# flavour expressive: the five button sizes (default small: Compose's ToggleButton and Button use the small design),
# the text toggles, `@square`, `@narrow`, `@wide`, the container and branded FAB styles.

[[model]]
widget = "button"
available = true
variants = ["primary", "tinted", "flat", "toggle", "menu", "icon_only", "with_icon", "@elevated", "@outlined", "@fab", "@extended_fab", "@lowered", "@secondary", "@tertiary", "@surface"]
sizes = ["small", "regular", "extra_large"]
default_size = "regular"
densities = []
axes = { states = ["hover", "focus_visible", "pressed", "disabled", "checked"], conditions = ["scheme:light", "scheme:dark", "contrast_increased", "contrast_high"], contexts = [{ scope = "any", widget = "toolbar", variants = ["floating"] }, { scope = "any", widget = "toolbar", variants = ["floating", "@vibrant"] }, { scope = "any", widget = "toolbar", variants = ["floating", "@collapsed"] }] }
exclusive = []
not_drawn = [{ states = ["disabled", "hover"] }, { states = ["disabled", "focus_visible"] }, { states = ["disabled", "pressed"] }, { states = ["checked"], not_variants = ["toggle"] }, { variants = ["toggle", "flat"] }, { variants = ["@fab"], states = ["disabled"] }, { variants = ["@extended_fab"], states = ["disabled"] }, { variants = ["@lowered"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@secondary"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@tertiary"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["@surface"], not_variants = ["@fab", "@extended_fab"] }, { variants = ["toggle"], not_variants = ["icon_only"] }]
sizes_by_variant = [{ variant = "@fab", sizes = ["small", "regular", "extra_large"] }, { variant = "@extended_fab", sizes = ["regular"] }]
rows = ["MAT-B1", "MAT-B12", "MAT-N1", "MAT-N2", "MAT-N4", "MAT-N8", "MAT-X22"]

