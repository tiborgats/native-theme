# =============================================================================================
# The Basic page (v5): five columns, each a stack of groups; a group is its heading over its rows.
# Column 1: Buttons, Checkboxes, Radio buttons, Drop-down. Column 2: Text inputs, Text area, Slider.
# Column 3: Switches, Number input, Spinner, Segmented control, Card. Column 4: Typography,
# Separator, Progress bar, List. Column 5: Icons, Tabs, Expander, Table.
# A heading is measured against the element above it in its column (the column for the
# first); a control against its heading or the control before it.
# =============================================================================================

[[element]]
