# The elements the three showcases share.
#
# connectors/native-theme-gpui/examples/showcase-gpui, connectors/native-theme-iced/examples/
# showcase-iced.rs and connectors/native-theme-egui/examples/showcase-egui draw the same chrome
# and the same Basic page. This list is the one place those shared elements are named: each
# showcase reads it for its Widget Info panel and for its layout dump, and
# scripts/check_showcase_parity.py compares the three dumps and captures element by element.
# Written once; a showcase never keeps a list of its own.
#
# ---------------------------------------------------------------------------------------------
# One entry
# ---------------------------------------------------------------------------------------------
#
#   [[element]]
#   id     = "basic.checkboxes.checked"        stable, dotted, lower case; the dump's key
#   name   = "Checkbox"                         what Widget Info shows as its title
#   parent = "basic.checkboxes.unchecked"       the element its position is measured against;
#                                               "window" for the content area's origin
#   leaves = ["checkbox.font", ...]             docs/property-registry.toml paths, spelled as the
#                                               registry spells them, in Widget Info order
#   states = ["Checked"]                        the state or variant the page shows
#   part   = true                               (optional) a part of a control: dumped and
#                                               compared, never a Widget Info target of its own
#   when   = "a widget is hovered"              (optional) on screen only while this holds
#   sample = { fill = [0.5, 0.0, 0.0, 2.5] }    (optional) colour sample points, see below
#
# `leaves` is every leaf the element draws, the inherited defaults it draws included
# (`defaults.line_height` for a line of text, `defaults.font` for text no widget font covers).
# A structure-typed leaf is named whole where the element draws it whole (`button.font`: family,
# size, weight, style), and its colour on its own line (`button.font.color`); a border is named
# by the sub-fields the element draws (`button.border.corner_radius_px`, the four
# `padding_*_px` sides). Order: the element's own table first, in registry order, then every
# other table it reads, in registry order. A control's leaves are the union of its parts'.
#
# The rectangle of an element is what it paints: a line's is the line, a label's is its text
# box, a control's is its frame without the label unless the control's hit area holds both
# (a checkbox, a radio button, a switch: the indicator plus its label).
#
# A part (`part = true`) is hovered as its control: the pointer over a check mark shows the
# checkbox's Widget Info. An element with `when` is on screen only under that condition (an
# open menu, a hover); a dump holds it only when it is drawn, and the comparator skips it when
# no showcase drew it.
#
# Sample points, for the comparator (all relative to the element's rectangle):
#   name = [fx, fy]            the pixel at fraction (fx, fy) of the rectangle
#   name = [fx, fy, dx, dy]    the same, moved (dx, dy) logical px; an edge is sampled half a
#                              pixel inside, e.g. the left border at [0.0, 0.5, 0.5, 0.0]
#   name = "glyph"             the text colour: the pixel of the rectangle farthest in colour
#                              from the rectangle's most frequent colour (its ground)
#   name = { glyph = [x0, y0, x1, y1] }   the same over a sub-box, fractions of the rectangle
# A sample name is free (`fill`, `border`, `text`, `line`, `mark`, ...) except `present`, `x`,
# `y`, `w`, `h`.
#
# ---------------------------------------------------------------------------------------------
# The Widget Info format (the maintainer's round-11 brief, section B, verbatim)
# ---------------------------------------------------------------------------------------------
#
# ## B. One Widget Info format (the three panels must be identical in structure, text and typography)
# For the hovered element E:
# - Title row: E.name, then " · " + the state/variant shown (e.g. "Button · Normal"), flush left; "Copy" flush right.
# - Section "Theme": one row per E.leaves entry: a swatch (colours) or nothing (sizes/fonts), then
#   `<leaf path> <value>` (value as the resolved theme holds it: #rrggbb[aa], `12 px`, `Noto Sans 10 pt 400`);
#   under it, one muted line: how THIS toolkit applies it (short, concrete, the connector route, e.g. "gpui:
#   widgets::Checkbox paints the box" / "egui: Role::Checkbox scope, visuals.widgets.inactive.bg_fill"), or
#   "not reachable: <reason>" where it is not.
# - Section "Not themeable" (optional): what the toolkit draws that the theme states nothing for.
# - Typography: every Widget Info text in `sidebar.font` (size, family); the title and section names at weight
#   600 (the approved semibold, R2); muted lines in `defaults.muted_color`; spacing `layout.widget_gap` between
#   rows, `layout.section_gap` before a section. The same in all three showcases.
# The per-toolkit "how" lines may differ; everything else must be identical for the same element and theme.
#
# The `<leaf path>` a row shows is the entry of `leaves` as written here.
#
# ---------------------------------------------------------------------------------------------
# How a showcase reads the list
# ---------------------------------------------------------------------------------------------
#
# With `include_str!` and the `toml` crate, parsed into an untyped `toml::Table` and walked by
# hand, as the egui showcase already reads its mapping.toml (showcase-egui/info.rs). The egui
# connector has `toml = { workspace = true }` in its [dev-dependencies]; the gpui and iced
# connectors add the same line. That adds no crate to Cargo.lock: `toml` 1.1.5 is already
# there as a dependency of native-theme (native-theme/Cargo.toml, `toml.workspace = true`),
# which re-exports none of it, so the examples cannot reach it without naming it. The path is
# relative to the file holding the `include_str!`:
#   gpui: examples/showcase-gpui/<file>.rs -> "../../../../docs/showcase-elements.toml"
#   iced: examples/showcase-iced.rs        -> "../../../docs/showcase-elements.toml"
#   egui: examples/showcase-egui/<file>.rs -> "../../../../docs/showcase-elements.toml"
#
#   /// One element of `docs/showcase-elements.toml`.
#   #[derive(Debug, Clone)]
#   pub struct ShowcaseElement {
#       pub id: String,
#       pub name: String,
#       pub parent: String,
#       pub leaves: Vec<String>,
#       pub states: Vec<String>,
#       pub part: bool,
#       pub when: Option<String>,
#   }
#
#   const SHOWCASE_ELEMENTS: &str = include_str!("../../../../docs/showcase-elements.toml");
#
#   pub fn showcase_elements() -> Result<Vec<ShowcaseElement>, String> {
#       let table: toml::Table = toml::from_str(SHOWCASE_ELEMENTS).map_err(|e| e.to_string())?;
#       let rows = table
#           .get("element")
#           .and_then(toml::Value::as_array)
#           .ok_or("docs/showcase-elements.toml: no [[element]] entries")?;
#       rows.iter()
#           .map(|row| {
#               let text = |key: &str| {
#                   row.get(key)
#                       .and_then(toml::Value::as_str)
#                       .map(str::to_owned)
#                       .ok_or_else(|| format!("an element has no `{key}`"))
#               };
#               let list = |key: &str| {
#                   row.get(key)
#                       .and_then(toml::Value::as_array)
#                       .ok_or_else(|| format!("an element has no `{key}`"))?
#                       .iter()
#                       .map(|v| {
#                           v.as_str()
#                               .map(str::to_owned)
#                               .ok_or_else(|| format!("`{key}` holds a value that is not a string"))
#                       })
#                       .collect::<Result<Vec<_>, _>>()
#               };
#               Ok(ShowcaseElement {
#                   id: text("id")?,
#                   name: text("name")?,
#                   parent: text("parent")?,
#                   leaves: list("leaves")?,
#                   states: list("states")?,
#                   part: row.get("part").and_then(toml::Value::as_bool).unwrap_or(false),
#                   when: row.get("when").and_then(toml::Value::as_str).map(str::to_owned),
#               })
#           })
#           .collect()
#   }
#
# The sample points are the comparator's alone; a showcase ignores them. A showcase's own test
# checks that every id it records is in this list and that it records every element it draws.
#
# ---------------------------------------------------------------------------------------------
# The layout dump
# ---------------------------------------------------------------------------------------------
#
# `--dump-layout <file.json>` (with `--capture`): after the first settled frame the showcase
# writes one JSON object, then exits, or keeps running for the capture:
#
#   {"kind": "gpui|iced|egui", "preset": "kde-breeze", "variant": "light|dark", "scale": 1.0,
#    "elements": {"<id>": {"x": .., "y": .., "w": .., "h": ..}, ...}}
#
# Rectangles in logical px, in window-content coordinates ((0, 0) is the top-left of the
# window's content area); `scale` is physical px per logical px; one entry per element of this
# list the showcase draws, and none for anything else. The gpui and egui connectors have
# `serde_json` in their [dev-dependencies] (`serde_json::json!` builds the object); the iced
# connector adds `serde_json = "1.0.151"`, the version Cargo.lock already holds for native-theme's
# own [dev-dependencies]. The comparator reads `<kind>-<preset>-<variant>.json` and, beside it,
# the capture `<kind>-<preset>-<variant>.png`; see scripts/check_showcase_parity.py.
#
# Shared elements only: a page tab, a menu or a menu row the three do not all have is not here.
# The chrome's page tabs share Basic and Buttons (first and second in all three); the Theme menu
# is the one menu whose rows the three share.

# =============================================================================================
# Chrome
# =============================================================================================

[[element]]
id = "chrome.window"
name = "Window"
parent = "window"
leaves = ["window.background_color"]
states = ["Normal"]

