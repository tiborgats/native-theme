# =============================================================================================
# The Basic page (v6): columns, each a stack of groups; a group is its heading over its rows.
# The column count n is the largest of 5 down to 1 whose column, (page width - (n - 1) *
# layout.section_gap) / n, holds the widest fixed-width control the theme states on the page,
# max(combo_box.min_width, 2 * tab.min_width + tab.item_gap + 2 * tab.active_outward_corner_radius,
# BASIC_WIDE, BASIC_WIDTH), and the Segmented control at the width each toolkit measures it,
# its segments on one row: it may reach into the section gap after its column but keeps
# layout.widget_gap from the next column, and in the last column ends inside the page (M9-166);
# the page width is the content area's less twice layout.window_margin and, where
# scrollbar.overlay_mode is false, scrollbar.groove_width. The page scrolls vertically where it
# is taller than its area (at rest at the top), never sideways.
# n = 5: Column 1: Buttons, Checkboxes, Radio buttons, Drop-down. Column 2: Text inputs, Text
# area, Slider. Column 3: Switches, Number input, Spinner, Segmented control, Card. Column 4:
# Typography, Separator, Progress bar, List. Column 5: Icons, Tabs, Expander, Table.
# n = 4: column 5's groups join the other four: Column 1: Buttons, Checkboxes, Radio buttons,
# Drop-down, Expander. Column 2: Text inputs, Text area, Slider, Icons. Column 3: Switches,
# Number input, Spinner, Segmented control, Card, Tabs. Column 4: Typography, Separator, Progress
# bar, List, Table.
# n = 3: column 4's groups join the other three: Column 1: Buttons, Checkboxes, Radio buttons,
# Drop-down, List, Expander. Column 2: Text inputs, Text area, Slider, Separator, Progress bar,
# Icons, Table. Column 3: Switches, Number input, Spinner, Segmented control, Card, Typography,
# Tabs.
# n = 2: column 3's groups join the other two: Column 1: Buttons, Checkboxes, Radio buttons,
# Drop-down, Switches, Typography, List, Tabs, Expander. Column 2: Text inputs, Text area,
# Slider, Number input, Spinner, Segmented control, Card, Separator, Progress bar, Icons, Table.
# n = 1: every group in reading order.
# Each column's groups are in reading order; fewer columns are balanced by the groups' heights
# under material-3, the tallest. The three showcases' tables and this list agree (the iced
# showcase's `the_basic_arrangements_agree_across_the_showcases`).
# A heading is measured against the element above it in its five-column column (the column for
# the first), wherever fewer columns put it; a control against its heading or the control
# before it.
# =============================================================================================

[[element]]
id = "basic.page"
name = "Basic page"
parent = "chrome.content"
leaves = ["layout.window_margin_px", "layout.section_gap_px", "scrollbar.groove_width_px", "scrollbar.overlay_mode", "tab.min_width_px", "tab.item_gap_px", "tab.active_outward_corner_radius_px", "combo_box.min_width_px"]
# homes: scrollbar.groove_width_px: orientation=Vertical, the page scrolls vertically.
homes = ["layout.window_margin", "layout.section_gap", "scrollbar.track(NONE; orientation=Vertical).min_size[0]", "scrollbar.track(NONE; orientation=Vertical).max_size[0]", "scrollbar.overlay_mode", "tab.tab(NONE).min_size[0]", "tab.item_gap", "tab.active_outward_corner_radius", "combo_box.field(NONE).min_size[0]"]
states = ["Normal"]

[[element]]
id = "basic.column_1"
name = "Column"
parent = "basic.page"
leaves = ["layout.widget_gap_px", "layout.section_gap_px"]
homes = ["layout.widget_gap", "layout.section_gap"]
states = ["Normal"]

[[element]]
id = "basic.column_2"
name = "Column"
parent = "basic.column_1"
leaves = ["layout.widget_gap_px", "layout.section_gap_px"]
homes = ["layout.widget_gap", "layout.section_gap"]
states = ["Normal"]
when = "the page has two columns or more"

[[element]]
