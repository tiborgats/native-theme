# The elements the three showcases share.
#
# connectors/native-theme-gpui/examples/showcase-gpui, connectors/native-theme-iced/examples/
# showcase-iced.rs and connectors/native-theme-egui/examples/showcase-egui draw the same chrome
# and the same Basic page. This list is the one place those shared elements are named: each
# showcase reads it for its Widget Info panel and for its layout dump, and
# scripts/check_showcase_parity.py compares the three dumps and captures element by element.
# Written once; a showcase never keeps a list of its own.
#
# ---------------------------------------------------------------------------------------------
# One entry
# ---------------------------------------------------------------------------------------------
#
#   [[element]]
#   id     = "basic.checkboxes.checked"        stable, dotted, lower case; the dump's key
#   name   = "Checkbox"                         what Widget Info shows as its title
#   parent = "basic.checkboxes.unchecked"       the element its position is measured against;
#                                               "window" for the content area's origin
#   leaves = ["checkbox.font", ...]             docs/property-registry.toml paths, spelled as the
#                                               registry spells them, in Widget Info order
#   homes  = ["checkbox.label(NONE)", ...]      where those leaves live in the 0.8.0 model: homes
#                                               in the grammar below, in the order of `leaves`
#   states = ["Checked"]                        the state or variant the page shows
#   part   = true                               (optional) a part of a control: dumped and
#                                               compared, never a Widget Info target of its own
#   when   = "a widget is hovered"              (optional) on screen only while this holds
#   clip   = true                               (optional) shows its descendants only inside its
#                                               own rectangle (a panel a page scrolls in): the
#                                               comparator samples none of theirs outside it
#   sample = { fill = [0.5, 0.0, 0.0, 2.5] }    (optional) colour sample points, see below
#
# `leaves` is every leaf the element draws, the inherited defaults it draws included
# (`defaults.line_height` for a line of text, `defaults.font` for text no widget font covers).
# A structure-typed leaf is named whole where the element draws it whole (`button.font`: family,
# size, weight, style), and its colour on its own line (`button.font.color`); a border is named
# by the sub-fields the element draws (`button.border.corner_radius_px`, the four
# `padding_*_px` sides). Order: the element's own table first, in registry order, then every
# other table it reads, in registry order. A control's leaves are the union of its parts'.
#
# `homes` is `leaves` on the 0.8.0 model (`native_theme::next::ResolvedTheme`): for each leaf, the
# homes its row of native-theme/tests/next_homes.toml gives it, in the order of `leaves`, each home
# once. A whole font is its text part or global text style named whole (`button.font` is
# `button.label(NONE)`, `defaults.font` is `typography.body`), a `text_scale` entry its typography
# role named whole (`text_scale.section_heading` is `typography.headline`); `theme_variant.icon_set`
# and `defaults.icon_theme` are `icons.set` and `icons.theme`. Where a row gives several homes, the
# entry lists all of them where they are one part under one query (a size's `min_size` and
# `max_size`, a padding's two sides) and where the row names homes for a preset of its own
# (`homes_by_preset`: kde-breeze's list highlight margins, kde-breeze's thumb of a view without the
# focus, material-3's menu panel corners); else the ones the element draws, by its widget (a check
# box's `checkbox.*`, a radio button's `radio.*`), its state (an unchecked indicator's `HOVER`, a
# checked one's `HOVER|CHECKED`; every state the element enters where the one leaf colours each)
# or its axis, said in a `# homes:` comment above the entry's `homes`.
#
# A home the 0.8.0 model has where 0.7.2 had no field (a variant's outline, a metric 0.7.2 lacked)
# has no leaf and no row of native-theme/tests/next_homes.toml. An element that draws one lists it
# in `homes` with no leaf for it, and `model_only_homes` (below the header) names it once with the
# reason 0.7.2 had no field there. Scaffolding of the 0.8.0 work, as `leaves` is: the cut deletes
# both with that table.
#
# A home is one of:
#
#   <global>                         a field of the resolved theme outside the widgets, by its path in
#                                    docs/v0.8.0-spec.md, §§4-5: `colors.view.background`,
#                                    `typography.body.size_px`, `icons.set`, `layout.widget_gap`,
#                                    `timings.tooltip_show_ms`, `focus_ring.stroke.color`,
#                                    `context.scheme` (the resolved theme's context: the level used)
#   <widget>.<metric>                a direct metric of a widget (docs/v0.8.0-spec.md §5's table):
#                                    `button.icon_text_gap`
#   <widget>.<part>.<property>       a part of a static widget: `tooltip.panel.fill`
#   <widget>.<part>(<query>).<property>
#                                    a part of a ruled widget as its query returns it. <query> is the
#                                    state, `NONE` for the rest state or `WidgetState` bits joined by
#                                    `|` (`HOVER|CHECKED`), then optionally `; ` and axis values joined
#                                    by `, `: `variant=Primary`, `shape=Pill`, `alternate=true`,
#                                    `orientation=Vertical`, `size=Small`, `surface=View`,
#                                    `position=First`
#   window.<getter>(normal).<property>
#                                    `WindowChrome`'s `frame`, `title_bar` or `title` (docs/v0.8.0-spec.md §4) at
#                                    `WindowState::default()`: `window.title_bar(normal).fill`
#   <text part> or <global text style>, named whole
#                                    a text part (`button.label(NONE)`) or a global text style
#                                    (`typography.body`) whole: its family, size, weight and style,
#                                    as a whole font leaf shows them
#
# A part's property is a field of `PartStyle` (`fill`, `stroke.color`, `stroke.width`, `corners`,
# `shadows`, `opacity`, `padding.top` .. `padding.left`, `margin.top` .. `margin.left`,
# `min_size[0]` (width), `min_size[1]` (height), `max_size[0]`, `max_size[1]`, `focus`, `ripple`,
# `transition`, `cursor`, `transform`), of `TextStyle` (`family`, `color`, `size_px`,
# `defined_size`, `weight`, `style`, `width`, `line_height`, `letter_spacing`, `optical_size`,
# `decoration`, `blend_mode`) or of `IconStyle` (`size`, `color`, `opacity`, `weight`,
# `rendering_mode`, `stroke_width`, `blend_mode`), by the part's kind. `stroke.color` and
# `stroke.width` are the two fields of the part's `Stroke::Uniform`. `input.*` and `text_area.*`
# are the two input widgets, `checkbox.*` and `radio.*` the check box and the radio button.
#
# The rectangle of an element is what it paints: a line's is the line, a label's is its text
# box, a control's is its frame without the label unless the control's hit area holds both
# (a checkbox, a radio button, a switch: the indicator plus its label).
#
# A part (`part = true`) is hovered as its control: the pointer over a check mark shows the
# checkbox's Widget Info. An element with `when` is on screen only under that condition (an
# open menu, a hover); a dump holds it only when it is drawn, and the comparator skips it when
# no showcase drew it.
#
# Sample points, for the comparator (all relative to the element's rectangle):
#   name = [fx, fy]            the pixel at fraction (fx, fy) of the rectangle; for a `fill` or
#                              `track` sample, where that lies on a text part the element holds
#                              (a descendant whose name is a text run, inside its rectangle),
#                              the nearest pixel of its row beside the text parts
#   name = [fx, fy, dx, dy]    the same, moved (dx, dy) logical px; an edge is sampled half a
#                              pixel inside, e.g. the left border at [0.0, 0.5, 0.5, 0.0]
#   name = "glyph"             the text colour: the pixel of the rectangle farthest in colour
#                              from the rectangle's most frequent colour (its ground)
#   name = { glyph = [x0, y0, x1, y1] }   the same over a sub-box, fractions of the rectangle
# A sample name is free (`fill`, `border`, `text`, `line`, `mark`, ...) except `present`, `x`,
# `y`, `w`, `h`.
#
# ---------------------------------------------------------------------------------------------
# The Widget Info format (the maintainer's round-11 brief, section B, verbatim)
# ---------------------------------------------------------------------------------------------
#
# ## B. One Widget Info format (the three panels must be identical in structure, text and typography)
# For the hovered element E:
# - Title row: E.name, then " · " + the state/variant shown (e.g. "Button · Normal"), flush left; "Copy" flush right.
# - Section "Theme": one row per E.leaves entry: a swatch (colours) or nothing (sizes/fonts), then
#   `<leaf path> <value>` (value as the resolved theme holds it: #rrggbb[aa], `12 px`, `Noto Sans 10 pt 400`);
#   under it, one muted line: how THIS toolkit applies it (short, concrete, the connector route, e.g. "gpui:
#   widgets::Checkbox paints the box" / "egui: Role::Checkbox scope, visuals.widgets.inactive.bg_fill"), or
#   "not reachable: <reason>" where it is not.
# - Section "Not themeable" (optional): what the toolkit draws that the theme states nothing for.
# - Typography: every Widget Info text in `sidebar.font` (size, family); the title and section names at weight
#   600 (the approved semibold, R2); muted lines in `defaults.muted_color`; spacing `layout.widget_gap` between
#   rows, `layout.section_gap` before a section. The same in all three showcases.
# The per-toolkit "how" lines may differ; everything else must be identical for the same element and theme.
#
# The `<leaf path>` a row shows is the entry of `leaves` as written here. A `_px` leaf's value is
# its number and ` px` (`12 px`), a `_ms` leaf's its number and ` ms` (`700 ms`).
#
# On the 0.8.0 model a row is an entry of `homes`, `<home> <value>`, the home evaluated by a typed
# query on `native_theme::next::ResolvedTheme`. A row shows: the value where stated; "not stated"
# where the `stated` bit is clear or the global is `null` (the theme does not state it at all);
# where the query has a state and the property is stated but its `from_state` bit is clear (the
# value comes from the part's base or a rule requiring no state, not a rule for that state,
# docs/v0.8.0-spec.md §2), the query's value marked as stated at rest, `<value> (stated at rest)`
# (a statement about the theme; what a toolkit draws there is the route line's business);
# the stated form's text where the property is stated in a shape the path does not address
# (`stroke` "none", a per-side stroke that does not reduce), never "not stated" there; rounded
# corners whose curve is continuous as their radius marked `<value> (drawn circular)`, the three
# toolkits' corner being circular (docs/v0.8.0-spec.md §10, rule 2); a per-side stroke that
# `Stroke::prevailing` reduces (four sides of one width and solid colours, at least three of them
# one colour) as the uniform stroke the toolkits draw (docs/v0.8.0-spec.md §10, rule 2), on a
# ruled or window part and a static part (`tooltip.panel`), not a focus indicator (`focus_ring.*`,
# a part's `focus`): its `stroke.color` that colour, with its swatch, marked `<colour> (<side> side
# <colour> not drawn)` where the fourth side's colour is another, its `stroke.width` the width,
# unmarked; the marker before `(stated at rest)`, as `4 px (drawn circular) (stated at rest)`
# stacks; the 0.7.2 comparison strips both. An error for an unknown name.
# Units from the property's kind (a small table for globals and metrics).
#
# ---------------------------------------------------------------------------------------------
# How a showcase reads the list
# ---------------------------------------------------------------------------------------------
#
# Through native-theme-showcase-support (tools/showcase-support, never published), the crate
# the three showcases share, which is the list's reader: `elements::showcase_elements()` parses
# it into `ShowcaseElement`s (every field above but `clip` and `sample`), `elements::elements()`
# parses it once for a running showcase, and `values::leaf_value` gives a leaf's value in the
# Widget Info format above. The crate holds the list through
# `include_str!("../../../docs/showcase-elements.toml")` (in tools/showcase-support/src/) and reads
# it with the `toml` crate into an untyped `toml::Table`, walked by hand, as the egui showcase
# also reads its mapping.toml (showcase-egui/info.rs). That adds no crate to Cargo.lock: `toml`
# 1.1.5 is already there as a dependency of native-theme (native-theme/Cargo.toml,
# `toml.workspace = true`), which re-exports none of it.
#
# The sample points are the comparator's alone; a showcase ignores them. A showcase's own test
# checks that every id it records is in this list and that it records every element it draws.
#
# ---------------------------------------------------------------------------------------------
# The layout dump
# ---------------------------------------------------------------------------------------------
#
# `--dump-layout <file.json>` (with `--capture`): after the first settled frame the showcase
# writes one JSON object, then exits, or keeps running for the capture:
#
#   {"kind": "gpui|iced|egui", "preset": "kde-breeze", "variant": "light|dark", "scale": 1.0,
#    "elements": {"<id>": {"x": .., "y": .., "w": .., "h": ..}, ...}}
#
# Rectangles in logical px, in window-content coordinates ((0, 0) is the top-left of the
# window's content area); `scale` is physical px per logical px; one entry per element of this
# list the showcase draws, and none for anything else. A dump records the chrome at rest
# wherever the desktop's pointer is: each showcase keeps the window's own pointer off its
# widgets under `--dump-layout`, as under `--capture`, so the Widget Info rows hold their
# hint (`chrome.info.hint`) and `chrome.status_bar.shown` is not drawn; a dump of the
# hovered state holds a pointer of its own (`--pointer X,Y`). All three connectors have
# `serde_json = "1.0.151"` in their [dev-dependencies] (`serde_json::json!` builds the object),
# the version Cargo.lock already holds for native-theme's own [dev-dependencies]. The comparator reads `<kind>-<preset>-<variant>.json` and, beside it,
# the capture `<kind>-<preset>-<variant>.png`; see scripts/check_showcase_parity.py.
#
# Shared elements only: a page tab, a menu or a menu row the three do not all have is not here.
# The chrome's page tabs share Basic and Buttons (first and second in all three); the Theme menu
# is the one menu whose rows the three share.
#
# The pages' counterparts. The three showcases list their pages in one order, gpui's, with a
# page gpui has no counterpart for after its nearest counterpart and a toolkit's own pages
# before Icons. A row is one counterpart: the tab label each showcase gives it, `-` where it has
# none. A row's pages are the ones whose content is nearest; each page's content follows its
# toolkit's widget catalogue, so they differ (iced's Display holds tooltips, cards and the
# spacing demo besides its text, which is why it keeps its name). A page's `--tab` key is its
# label in lower case with each space a `-`, but iced's Extra widgets page's, `extra`. Each
# showcase's own test reads this table against its page list, through `elements::page_order`.
#
#   | Counterpart | gpui       | iced                    | egui       |
#   |-------------|------------|-------------------------|------------|
#   | Basic       | Basic      | Basic                   | Basic      |
#   | Buttons     | Buttons    | Buttons                 | Buttons    |
#   | Inputs      | Inputs     | Inputs                  | Inputs     |
#   | Selection   | -          | Selection               | Selection  |
#   | Range       | -          | Range                   | Range      |
#   | Data        | Data       | -                       | Data       |
#   | Feedback    | Feedback   | -                       | -          |
#   | Typography  | Typography | Display                 | Text       |
#   | Layout      | Layout     | Layout                  | Containers |
#   | Overlays    | Overlays   | -                       | Overlays   |
#   | Charts      | Charts     | Graphics                | -          |
#   | egui's own  | -          | -                       | Colour     |
#   | iced's own  | -          | Extra widgets (iced_aw) | -          |
#   | Icons       | Icons      | Icons                   | Icons      |
#   | Theme Map   | Theme Map  | Theme Map               | Theme Map  |
#
# iced's Extra widgets page is in a build with the iced connector's `iced_aw` feature only.

