# The last row's fill is rounded at its bottom corners by the frame's inner radius
# (`list.border.corner_radius_px` less `list.border.line_width_px`, 11 at most on the bundled
# presets, material-3's 12 less 1, inherited from `defaults.border`), so its text sample starts a
# tenth of the row in (16.8 px of a 168 px row), past the corner: a box from the row's left edge
# holds the frame's line and the ground beyond the corner's arc, and the glyph sampler, which
# takes the pixel farthest from the row's fill for the text, read that pixel instead (kde-breeze
# dark: #31363a in egui and #363b40 in gpui, the corner's bottom-left pixel, where iced's
# #f9fbfc is the text).
[[element]]
