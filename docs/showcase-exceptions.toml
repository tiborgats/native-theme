# Where the three showcases may differ for an element of docs/showcase-elements.toml.
#
# `scripts/check_showcase_parity.py` compares the three showcases' layout dumps and captures
# element by element, preset by preset, and fails on every difference not listed here. Each
# `[[parity.group]]` states its `reason` once for its `keys`. A key is
# `[<run>@][<preset>[/<variant>]:]<element id>.<property>`: the property is `present`, `x`,
# `y`, `w`, `h` or one of the element's sample names. The reason is a toolkit limit with its
# upstream citation (file and line, at the version Cargo.lock holds), or a detail the theme
# leaves unstated; ` | ` joins the reasons of keys that have several. `<preset>:` or
# `<preset>/<variant>:` scopes a key to that preset (a theme's silence is per preset, so its
# key is too); `<run>@` (`rest`, `hover`, `menu`) to that run of the showcases. An unscoped key
# holds for every preset, variant and run: it is for a toolkit limit that holds under every
# theme. Two keys for one property may not overlap, in one group or in two.
# `check_showcase_parity.py --merge OUT --write` computes the minimal scoped groups from
# proposals and rewrites this section, from the `[parity]` line down; this file's last.
[parity]
# Generated by `python3 scripts/check_showcase_parity.py --merge OUT --write --proposal FILE...
# [RUN=]DUMP_DIR...` against the runs rest, hover, menu under
# adwaita/dark, adwaita/light, catppuccin-mocha/dark, catppuccin-mocha/light, kde-breeze/dark, kde-breeze/light, material/dark, material/light.
# Everything from the [parity] line down is rewritten by the next such run; the groups here are
# one more proposal to it, so a group a difference still needs is kept.

