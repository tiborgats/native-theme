# Windows 11 live preset - geometry/metrics only (no colors, fonts, or icons)
# Used by the OS-first pipeline as merge base; OS reader provides colors/fonts.
#
# icon_theme is supplied at the Theme level so the live merge base carries
# the same default as the full `windows-11` preset (see docs/archive/v0.5.7_gaps.md G4).
name = "Windows 11"
icon_theme = "segoe-fluent"

# === Light variant ===

[light.defaults]
disabled_opacity = 0.3
line_height = 1.43
focus_ring_width_px = 2.0
focus_ring_offset_px = 0.0


[light.defaults.border]
corner_radius_px = 4.0
corner_radius_lg_px = 8.0
line_width_px = 1.0
opacity = 0.14
shadow_enabled = true
[light.defaults.icon_sizes]
toolbar_px = 20.0
small_px = 16.0
large_px = 32.0
dialog_px = 22.0
panel_px = 20.0

[light.text_scale.caption]
size_pt =9.0

[light.text_scale.section_heading]
size_pt =15.0
weight = 600

[light.text_scale.dialog_title]
size_pt =21.0
weight = 600

[light.text_scale.display]
size_pt =51.0
weight = 600

[light.button]
min_width_px = 64.0
min_height_px = 32.0
icon_text_gap_px = 8.0


[light.button.border]
# platform-facts.md:1171-1172 (§2.3): WinUI3 ButtonPadding=11,5,11,6
padding_horizontal_px = 11.0
padding_top_px = 5.0
padding_bottom_px = 6.0
[light.input]
min_height_px = 32.0


[light.input.border]
# platform-facts.md:1196-1197 (§2.4): WinUI3 TextControlThemePadding=10,5,6,6
padding_right_px = 6.0
padding_left_px = 10.0
padding_top_px = 5.0
padding_bottom_px = 6.0
[light.checkbox]
indicator_width_px = 20.0
label_gap_px = 8.0

[light.tooltip]
max_width_px = 320.0


[light.tooltip.border]
# platform-facts.md:1257-1258 (§2.7): WinUI3 ToolTipBorderPadding=9,6,9,8
padding_horizontal_px = 9.0
padding_top_px = 6.0
padding_bottom_px = 8.0
[light.scrollbar]
groove_width_px = 17.0
min_thumb_length_px = 17.0
thumb_width_px = 6.0
overlay_mode = false

[light.slider]
track_height_px = 4.0
thumb_diameter_px = 18.0
tick_mark_length_px = 4.0

[light.progress_bar]
track_height_px = 3.0
min_width_px = 100.0

[light.tab]
min_width_px = 64.0
min_height_px = 32.0


[light.tab.border]
# platform-facts.md:1318-1319 (§2.11): WinUI3 without-close-button context, TabViewItemHeaderPaddingWithoutCloseButton=8,3,8,3
padding_horizontal_px = 8.0
padding_vertical_px = 3.0
[light.menu]
# platform-facts.md:1234 (§2.6): WinUI3 mouse (Narrow) context, 14 text + 4 + 5
row_height_px = 23.0
icon_text_gap_px = 12.0


[light.menu.border]
# platform-facts.md:1235-1236 (§2.6): WinUI3 11; mouse context 4 top / 5 bottom
padding_horizontal_px = 11.0
padding_top_px = 4.0
padding_bottom_px = 5.0
[light.list]
row_height_px = 40.0


[light.list.border]
# platform-facts.md:1390-1391 (§2.15): WinUI3 12; 0
padding_horizontal_px = 12.0
padding_vertical_px = 0.0
[light.toolbar]
# platform-facts.md:1351 (§2.13): WinUI3 CommandBar compact (default) mode, AppBarThemeCompactHeight = 48
bar_height_px = 48.0
# platform-facts.md:1352 (§2.13): WinUI3 0
item_gap_px = 0.0


[light.toolbar.border]
# platform-facts.md:1353-1354 (§2.13): WinUI3 CommandBar Padding=4,0,0,0
padding_right_px = 0.0
padding_left_px = 4.0
padding_vertical_px = 0.0


[light.popover.border]
# platform-facts.md:1412-1413 (§2.16): WinUI3 FlyoutContentPadding=16,15,16,17
padding_horizontal_px = 16.0
padding_top_px = 15.0
padding_bottom_px = 17.0

[light.splitter]
divider_width_px = 1.0

[light.switch]
track_width_px = 40.0
track_height_px = 20.0
thumb_diameter_px = 12.0
track_radius_px = 10.0

[light.dialog]
# button_order: provided by platform reader via resolve_platform_defaults
min_width_px = 320.0
max_width_px = 548.0
min_height_px = 184.0
max_height_px = 756.0
button_gap_px = 8.0
icon_size_px =32.0


[light.dialog.border]
# platform-facts.md:1491-1492 (§2.22): WinUI3 ContentDialogPadding=24
padding_horizontal_px = 24.0
padding_vertical_px = 24.0

[light.link]
underline_enabled = true

[light.spinner]
diameter_px = 32.0
min_diameter_px = 16.0
stroke_width_px = 4.0

[light.combo_box]
min_height_px = 32.0
min_width_px = 64.0
arrow_icon_size_px =12.0
arrow_area_width_px = 38.0


[light.combo_box.border]
# platform-facts.md:1552, :1557 (§2.24): WinUI3 ComboBoxPadding=12,5,0,7; 0 right, where the text column meets the 38px arrow column
padding_left_px = 12.0
padding_right_px = 0.0
padding_top_px = 5.0
padding_bottom_px = 7.0
[light.segmented_control]
segment_height_px = 28.0
separator_width_px = 1.0


[light.card]


[light.card.border]
# platform-facts.md:1592-1593 (§2.26): 12 (convention)
padding_horizontal_px = 12.0
padding_vertical_px = 12.0

[light.expander]
header_height_px = 48.0
arrow_icon_size_px =12.0


[light.expander.border]
# platform-facts.md:1607-1608 (§2.27): WinUI3 header context, ExpanderHeaderPadding=16,0,0,0
padding_right_px = 0.0
padding_left_px = 16.0
padding_vertical_px = 0.0

