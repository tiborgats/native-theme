hover_text_color = "#007aff"
active_text_color = "#0056b3"
disabled_text_color = "#c7c7cc"

[light.spinner]
diameter_px = 24.0
min_diameter_px = 16.0
stroke_width_px = 2.0

[light.combo_box]
# the HIG's minimum hit target, 44 x 44 pt (HIG accessibility 2024-11-14), used as the drawn min_height
min_height_px = 44.0
min_width_px = 120.0
arrow_icon_size_px =12.0
hover_background = "#d1d1d6"
disabled_background = "#e5e5ea80"
# (WebKit) tertiaryLabel, a disabled select's text (html.css:996-1003; ios-18 expected.txt:181)
disabled_text_color = "#3c3c434c"
# (WebKit) opaqueSecondaryFill, an iOS select's fill (html.css:1106; ios-18 expected.txt:85)
background_color = "#e9e9ea"

[light.combo_box.font]
# (WebKit) systemBlue, an iOS select's text (html.css:1099; ios-18 expected.txt:13)
color = "#007aff"

[light.combo_box.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false


[light.segmented_control]
segment_height_px = 32.0
separator_width_px = 1.0
hover_background = "#d1d1d6"
active_background = "#007aff"
active_text_color = "#ffffff"

[light.segmented_control.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false


[light.card]

[light.expander]
header_height_px = 44.0
arrow_icon_size_px =12.0
hover_background = "#e5e5ea"
arrow_color = "#8e8e93"

[light.expander.border]
