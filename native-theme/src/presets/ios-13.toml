hover_background = "#3a3a3c"
active_background = "#0a84ff"
active_text_color = "#ffffff"

[dark.segmented_control.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false


[dark.card]

[dark.expander]
