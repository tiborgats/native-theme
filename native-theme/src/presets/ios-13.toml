# the default layout margins of most views, 8 pt (UIKit https://developer.apple.com/tutorials/data/documentation/uikit/uiview/directionallayoutmargins.json, read 2026-10-11)
container_margin_px = 8.0
window_margin_px = 20.0
section_gap_px = 20.0
