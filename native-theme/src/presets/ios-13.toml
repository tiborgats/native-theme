[dark.progress_bar.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false

[dark.tab]
min_width_px = 64.0
min_height_px = 49.0
hover_background = "#2c2c2e"
hover_text_color = "#ffffff"
active_background = "#000000"
active_text_color = "#0a84ff"


[dark.menu]
icon_text_gap_px = 8.0
hover_background = "#0a84ff"
hover_text_color = "#ffffff"
disabled_text_color = "#3a3a3c"


[dark.list]
alternate_row_background = "#1c1c1e"
hover_background = "#2c2c2e"
hover_text_color = "#ffffff"
disabled_text_color = "#3a3a3c"


[dark.toolbar]

[dark.sidebar]
background_color = "#1c1c1e"
hover_background = "#2c2c2e"


[dark.sidebar.font]
# label (ios-18 expected.txt:75)
color = "#ffffff"
[dark.popover]
background_color = "#1c1c1e"


[dark.popover.font]
# label (ios-18 expected.txt:75)
color = "#ffffff"
[dark.separator]
line_color = "#38383a"

[dark.splitter]
divider_width_px = 1.0
hover_color = "#0a84ff"

[dark.switch]
# (WebKit) the on track is systemGreen on iOS (RenderThemeCocoa.mm:271-275, :333; ios-18 expected.txt:45)
checked_background = "#30d158"
# (WebKit) the off track, rgba(120,120,128,82/255) (RenderThemeCocoa.mm:279); #272729 over black
unchecked_background = "#78788052"
hover_checked_background = "#25813c"
hover_unchecked_background = "#48484a"
# (WebKit) a disabled switch's track is its track colour with the alpha multiplied by 0.4
# (RenderThemeCocoa.mm:816-817, the painter of :271-279): on 255 x 0.4 = 102 (0x66), #135423 over
# black; off 82 x 0.4 = 32.8, rounded to 33 (0x21), #101011 over black
disabled_checked_background = "#30d15866"
disabled_unchecked_background = "#78788021"
# (WebKit) the thumb is white, disabled too (RenderThemeCocoa.mm:763)
disabled_thumb_color = "#ffffff"
# (WebKit) white (RenderThemeCocoa.mm:763)
thumb_background = "#ffffff"
# (WebKit) 51 x 31 (RenderThemeIOS.mm:668-669; RenderThemeCocoa.mm:216-218)
track_width_px = 51.0
track_height_px = 31.0
# (WebKit) the track height less a 2 pt margin on each side (RenderThemeCocoa.mm:770-771)
thumb_diameter_px = 27.0
track_radius_px = 15.5

[dark.dialog]
# "Always place the default button on the trailing side" (HIG https://developer.apple.com/tutorials/data/design/human-interface-guidelines/alerts.json, read 2026-10-11)
button_order = "primary_right"
min_width_px = 270.0
max_width_px = 560.0
min_height_px = 140.0
max_height_px = 600.0
button_gap_px = 8.0
icon_size_px =32.0

[dark.link]
underline_enabled = false
background_color = "#00000000"
hover_background = "#0a84ff18"
hover_text_color = "#0a84ff"
active_text_color = "#409cff"
disabled_text_color = "#3a3a3c"

[dark.spinner]
diameter_px = 24.0
min_diameter_px = 16.0
stroke_width_px = 2.0

[dark.combo_box]
# the HIG's minimum hit target, 44 x 44 pt (HIG accessibility 2024-11-14), used as the drawn min_height
min_height_px = 44.0
min_width_px = 120.0
arrow_icon_size_px =12.0
hover_background = "#3a3a3c"
disabled_background = "#2c2c2e80"
# (WebKit) tertiaryLabel, a disabled select's text (html.css:996-1003; ios-18 expected.txt:183)
disabled_text_color = "#ebebf54c"
# (WebKit) opaqueSecondaryFill, an iOS select's fill (html.css:1106; ios-18 expected.txt:87)
background_color = "#262629"

[dark.combo_box.font]
# (WebKit) systemBlue, an iOS select's text (html.css:1099; ios-18 expected.txt:15)
color = "#0a84ff"

[dark.combo_box.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false


[dark.segmented_control]
