# iOS theme: the flat look of iOS 13-18, light and dark
# Covers: iOS 13-18. Verified on: iOS 18 (code review M2c, 2026-10-11). iOS 26 (Liquid Glass)
# changed the system colours, the separator and WebKit's switch and progress bar; this preset
# keeps the iOS 13-18 values.
# Sources, by the short names the comments below use:
#   HIG color 2025-06-07: https://web.archive.org/web/20250607225442/https://developer.apple.com/tutorials/data/design/human-interface-guidelines/color.json
#     (the iOS system colours before the June 2025 update)
#   HIG typography 2025-05-23: https://web.archive.org/web/20250523115548/https://developer.apple.com/tutorials/data/design/human-interface-guidelines/typography.json
#     ("iOS, iPadOS Dynamic Type sizes", Large (default); the copy read 2026-10-11 gives the same values)
#   HIG accessibility 2024-11-14: https://web.archive.org/web/20241114144601/https://developer.apple.com/tutorials/data/design/human-interface-guidelines/accessibility.json
#   ios-18 expected.txt: WebKit de320ba3ff90229f983988d42d4b0f83315459da
#     LayoutTests/platform/ios-18/fast/css/ios/system-color-for-css-value-expected.txt (UIKit's iOS 18 colours)
#   html.css, RenderThemeIOS.mm: WebKit 31adf9d1605fad1fb548e86d36384161a2a060b4 (tag WebKit-7621.2.5.14.9,
#     before the iOS 26 form-control refresh), Source/WebCore/css/html.css and Source/WebCore/rendering/ios/RenderThemeIOS.mm
#   RenderThemeCocoa.mm: WebKit de320ba3ff90229f983988d42d4b0f83315459da Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm
# (WebKit) marks a value read from WebKit's drawing of iOS controls (docs/platform-facts.md:20), not from UIKit.
# A value with no comment has no primary source (M2c Step 2 found none: Apple publishes no UIKit
# metric or state colour for it) and is kept as it was.
# docs/inheritance-rules.toml:422-427 asks a preset to state the colours it would otherwise inherit
# wrongly. No iOS source gives window.title_bar_background, list.header_background,
# menu.background_color, menu.font.color, list.item_font.color, list.header_font.color or
# scrollbar.thumb_color (the HIG's scroll indicator is "translucent", with no colour), so they
# are not stated and inherit.
name = "iOS"
# SF Symbols, the system symbol set (HIG https://developer.apple.com/tutorials/data/design/human-interface-guidelines/sf-symbols.json, read 2026-10-11)
icon_set = "sf-symbols"
icon_theme = "sf-symbols"

# === Light variant ===

[light.defaults]
# systemBlue (HIG color 2025-06-07, Blue; ios-18 expected.txt:13)
accent_color = "#007aff"
# systemBackground (ios-18 expected.txt:7)
background_color = "#ffffff"
# label (ios-18 expected.txt:73)
text_color = "#000000"
# secondarySystemBackground (ios-18 expected.txt:133)
surface_color = "#f2f2f7"
# secondaryLabel rgba(60,60,67,0.6) (ios-18 expected.txt:145), the macOS column's muted_color
# role (docs/platform-facts.md:1052); #8a8a8e over white
muted_color = "#3c3c4399"
shadow_color = "#00000018"

# systemRed (HIG color 2025-06-07, Red; ios-18 expected.txt:127)
danger_color = "#ff3b30"
danger_text_color = "#ffffff"
# systemOrange (HIG color 2025-06-07, Orange; ios-18 expected.txt:97)
warning_color = "#ff9500"
warning_text_color = "#000000"
# systemGreen (HIG color 2025-06-07, Green; ios-18 expected.txt:43)
success_color = "#34c759"
success_text_color = "#ffffff"
# systemBlue, the macOS column's info_color role (docs/platform-facts.md:1086)
info_color = "#007aff"
info_text_color = "#ffffff"

selection_background = "#007aff"
selection_text_color = "#ffffff"
link_color = "#007aff"
# (WebKit) systemBlue, WebKit's iOS focus ring (RenderThemeIOS.mm:936-943; ios-18 expected.txt:13)
focus_ring_color = "#007aff"
# (WebKit) tertiaryLabel rgba(60,60,67,0.298), the text of a disabled button or select
# (html.css:996-1003; ios-18 expected.txt:181); #c5c5c7 over white
disabled_text_color = "#3c3c434c"
accent_text_color = "#ffffff"

disabled_opacity = 0.3
# docs/platform-facts.md:1030 (§2.1.1): 1.19, SF Pro's font metrics, (1950+494+0)/2048, as
# macos-monterey.toml states it; SF Pro is the system font in iOS and iPadOS (HIG typography 2025-05-23)
line_height = 1.19
focus_ring_width_px = 2.0
focus_ring_offset_px = 1.0


[light.defaults.border]
# separator rgba(60,60,67,0.29) over white (ios-18 expected.txt:157)
color = "#c6c6c8"
corner_radius_px = 10.0
corner_radius_lg_px = 13.0
line_width_px = 0.5
# the text colour's share that gives color over the background (docs/platform-facts.md:946, :997):
# black over white at 57/255 = 0.224 (red, green) and 55/255 = 0.216 (blue)
opacity = 0.22
shadow_enabled = true
[light.defaults.font]
# SF Pro, Body: Regular 17 pt (HIG typography 2025-05-23)
family = "SF Pro"
size_pt =17.0
weight = 400

[light.defaults.mono_font]
family = "SF Mono"
size_pt =17.0
weight = 400

[light.defaults.icon_sizes]
toolbar_px = 24.0
small_px = 16.0
large_px = 32.0
dialog_px = 22.0
panel_px = 20.0

[light.text_scale.caption]
# Caption 1: Regular 12 pt, leading 16 (HIG typography 2025-05-23)
size_pt =12.0
weight = 400
line_height_pt = 16.0

[light.text_scale.section_heading]
# Headline: Semibold 17 pt, leading 22 (HIG typography 2025-05-23); the macOS column's role,
# .headline (docs/platform-facts.md:1473)
size_pt =17.0
weight = 600
line_height_pt = 22.0

[light.text_scale.dialog_title]
# Title 1: Regular 28 pt, leading 34 (HIG typography 2025-05-23); the macOS column's role,
# .title1 (docs/platform-facts.md:1474)
size_pt =28.0
weight = 400
line_height_pt = 34.0

[light.text_scale.display]
# Large Title: Regular 34 pt, leading 41 (HIG typography 2025-05-23); the macOS column's role,
# .largeTitle (docs/platform-facts.md:1475)
size_pt =34.0
weight = 400
line_height_pt = 41.0

[light.button]
# (WebKit) opaqueSecondaryFill, an iOS button's fill (html.css:895; ios-18 expected.txt:85)
background_color = "#e9e9ea"
min_width_px = 64.0
# the HIG's minimum hit target, 44 x 44 pt (HIG accessibility 2024-11-14), used as the drawn min_height
min_height_px = 44.0
icon_text_gap_px = 6.0
hover_background = "#d1d1d6"
# hover_text_color is not stated: iOS has no hover state and WebKit's iOS html.css gives a button no
# :hover rule, so it inherits button.font.color (docs/inheritance-rules.toml:160)
active_background = "#c7c7cc"
# (WebKit) systemBlue, a pressed iOS button keeps its blue text (html.css:901-906; ios-18 expected.txt:13)
active_text_color = "#007aff"
disabled_background = "#e5e5ea80"
# (WebKit) tertiaryLabel, a disabled button's text (html.css:996-1003; ios-18 expected.txt:181)
disabled_text_color = "#3c3c434c"


[light.button.font]
# (WebKit) systemBlue, an iOS button's text (html.css:891; ios-18 expected.txt:13)
color = "#007aff"
[light.input]
# (WebKit) Canvas = systemBackground (html.css:463; RenderThemeIOS.mm:1024; ios-18 expected.txt:7)
background_color = "#ffffff"
# the HIG's minimum hit target, 44 x 44 pt (HIG accessibility 2024-11-14), used as the drawn min_height
min_height_px = 44.0
hover_border_color = "#007aff"
focus_border_color = "#007aff"
disabled_background = "#f2f2f7"
disabled_text_color = "#c7c7cc"
# placeholderText, "The color for placeholder text in controls or text views" (UIKit
# https://developer.apple.com/tutorials/data/documentation/uikit/uicolor/placeholdertext.json, read 2026-10-11),
# rgba(60,60,67,0.298) (ios-18 expected.txt:109); #c5c5c7 over white
placeholder_color = "#3c3c434c"


[light.input.font]
# label (ios-18 expected.txt:73)
color = "#000000"

[light.input.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false
[light.checkbox]
indicator_width_px = 22.0
label_gap_px = 8.0
hover_background = "#d1d1d6"
disabled_background = "#e5e5ea80"
disabled_text_color = "#c7c7cc"
unchecked_background = "#ffffff"
unchecked_border_color = "#c6c6c8"

[light.checkbox.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false

[light.tooltip]
background_color = "#2c2c2e"
max_width_px = 300.0
# show_delay_ms unset: UIToolTipInteraction, iOS 15+, states no delay (UIKit
# https://developer.apple.com/documentation/uikit/uitooltipinteraction, read 2026-10-14)


[light.tooltip.font]
color = "#ffffff"
[light.scrollbar]
groove_width_px = 6.0
thumb_width_px = 3.0
# a translucent scroll indicator shown while scrolling (HIG https://developer.apple.com/tutorials/data/design/human-interface-guidelines/scroll-views.json, read 2026-10-11)
overlay_mode = true
min_thumb_length_px = 30.0
thumb_hover_color = "#a0a0a5"
thumb_active_color = "#8e8e93"

[light.slider]
# (WebKit) kTrackThickness, the track of WebKit's HTML range control (RenderThemeIOS.mm:560)
track_height_px = 4.0
# (WebKit) opaqueFill, the range control's track (RenderThemeIOS.mm:623; ios-18 expected.txt:79)
track_color = "#e4e4e5"
# no UIKit source. The same range control's thumb is 16 (kDefaultSliderThumbSize, RenderThemeIOS.mm:562,
# :657-661), which M2c Step 6 did not take as UISlider's (M2c-21)
thumb_diameter_px = 28.0
# no UIKit source. The same range control's ticks are 1 x 3, under a FIXME that says the values need
# correcting (RenderThemeIOS.mm:796-800)
tick_mark_length_px = 4.0
thumb_hover_color = "#f0f0f0"
disabled_fill_color = "#007aff80"
disabled_track_color = "#c7c7cc"
disabled_thumb_color = "#e5e5ea"

[light.progress_bar]
# (WebKit) barBlockSize (RenderThemeIOS.mm:718)
track_height_px = 4.0
min_width_px = 100.0
# (WebKit) opaqueFill, the progress bar's track (RenderThemeIOS.mm:752; ios-18 expected.txt:79)
track_color = "#e4e4e5"

[light.progress_bar.border]
# docs/inheritance-rules.toml:79-83: no platform draws a shadow under this control, and the preset must say so
shadow_enabled = false

[light.tab]
min_width_px = 64.0
min_height_px = 49.0
hover_background = "#e5e5ea"
hover_text_color = "#000000"
active_background = "#ffffff"
active_text_color = "#007aff"


[light.menu]
icon_text_gap_px = 8.0
hover_background = "#007aff"
hover_text_color = "#ffffff"
disabled_text_color = "#c7c7cc"


[light.list]
alternate_row_background = "#f2f2f7"
hover_background = "#e5e5ea"
hover_text_color = "#000000"
disabled_text_color = "#c7c7cc"


[light.toolbar]

[light.sidebar]
background_color = "#f2f2f7"
hover_background = "#e5e5ea"


[light.sidebar.font]
# label (ios-18 expected.txt:73)
color = "#000000"
[light.popover]
background_color = "#ffffff"


[light.popover.font]
# label (ios-18 expected.txt:73)
color = "#000000"
[light.separator]
# separator rgba(60,60,67,0.29) over white (ios-18 expected.txt:157)
line_color = "#c6c6c8"

[light.splitter]
divider_width_px = 1.0
hover_color = "#007aff"

[light.switch]
# (WebKit) the on track is systemGreen on iOS (RenderThemeCocoa.mm:271-275, :333; ios-18 expected.txt:43)
checked_background = "#34c759"
# (WebKit) the off track, rgba(120,120,128,41/255) (RenderThemeCocoa.mm:277); #e9e9eb over white
unchecked_background = "#78788029"
hover_checked_background = "#2d8a47"
hover_unchecked_background = "#b0b0b5"
# (WebKit) a disabled switch's track is its track colour with the alpha multiplied by 0.4
# (RenderThemeCocoa.mm:816-817, the painter of :271-279): on 255 x 0.4 = 102 (0x66), #aee9bd over
# white; off 41 x 0.4 = 16.4, rounded to 16 (0x10), #f7f7f7 over white
disabled_checked_background = "#34c75966"
disabled_unchecked_background = "#78788010"
# (WebKit) the thumb is white, disabled too (RenderThemeCocoa.mm:763)
disabled_thumb_color = "#ffffff"
# (WebKit) white (RenderThemeCocoa.mm:763)
thumb_background = "#ffffff"
# (WebKit) 51 x 31 (RenderThemeIOS.mm:668-669; RenderThemeCocoa.mm:216-218)
track_width_px = 51.0
track_height_px = 31.0
# (WebKit) the track height less a 2 pt margin on each side (RenderThemeCocoa.mm:770-771)
thumb_diameter_px = 27.0
track_radius_px = 15.5

[light.dialog]
# "Always place the default button on the trailing side" (HIG https://developer.apple.com/tutorials/data/design/human-interface-guidelines/alerts.json, read 2026-10-11)
button_order = "primary_right"
