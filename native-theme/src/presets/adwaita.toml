[rules.set]
# docs/facts/gnome/button.toml:2239
fill = { layers = [{ kind = { color = "= role.global.accent" }, blend = "normal" }, { kind = { color = "srgb(0, 0, 0.0235294, 0.3)" }, blend = "normal" }] }

[[rules]]
when = { variants = ["with_icon"] }
target = "button.values"

[rules.set]
# docs/facts/gnome/button.toml:3860
icon_text_gap_px = 6

[[rules]]
when = { variants = ["with_icon"] }
target = "button.label"

[rules.set]
# docs/facts/gnome/button.toml:3872
padding = { top_px = 0, right_px = 2, bottom_px = 0, left_px = 0 }

[[rules]]
when = { conditions = ["contrast_high"] }
target = "colors"

[rules.set]
# docs/facts/gnome/roles.toml:1940
surfaces.sidebar.border = "= alpha(role.sidebar.foreground, token.params.opacity.border)"
# docs/facts/gnome/roles.toml:1956
surfaces.secondary_sidebar.border = "= alpha(role.secondary_sidebar.foreground, token.params.opacity.border)"

[[rules]]
when = { conditions = ["animations_off"] }
target = "tokens"

[rules.set]
# docs/facts/gnome/tokens.toml:674
motion.speed_factor = 0

[[rules]]
when = { conditions = ["contrast_high"] }
target = "tokens"

[rules.set]
# docs/facts/gnome/tokens.toml:1323
params.opacity.focus_border = 0.8
# docs/facts/gnome/tokens.toml:1401
params.opacity.border = 0.5
# docs/facts/gnome/tokens.toml:1418
params.opacity.dim = 0.9
# docs/facts/gnome/tokens.toml:1430
params.opacity.disabled = 0.4
# docs/facts/gnome/tokens.toml:1487
focus.paint = "= alpha(role.global.accent_standalone, token.params.opacity.focus_border)"
