# platform-facts.md §2.1.5 focus_ring_color: $focus_border_color, the standalone accent #0461be at 50 % (libadwaita 1.10.0
# _drawing.scss:20, _colors.scss:260, :307, :146; adw-accent-color.c:130-157)
