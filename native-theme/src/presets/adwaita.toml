# GNOME Adwaita theme - sourced from libadwaita CSS variables
# Alpha/opacity colors pre-computed to solid hex values
name = "Adwaita"
icon_set = "freedesktop"
icon_theme = "Adwaita"

# === Light variant ===

[light.defaults]
accent_color = "#3584e4"
background_color = "#fafafb"
text_color = "#2e3436"
surface_color = "#ffffff"
muted_color = "#929292"
shadow_color = "#00000018"

danger_color = "#e01b24"
danger_text_color = "#ffffff"
warning_color = "#e5a50a"
warning_text_color = "#2e3436"
success_color = "#2ec27e"
success_text_color = "#ffffff"
info_color = "#3584e4"
info_text_color = "#ffffff"

selection_background = "#3584e4"
selection_text_color = "#ffffff"
link_color = "#1b6acb"
focus_ring_color = "#3584e4"
# platform-facts.md:1060 (§2.1.3): the normal text colour; libadwaita dims a disabled widget by opacity alone
disabled_text_color = "#2e3436"
accent_text_color = "#ffffff"

# platform-facts.md:1115 (§2.1.6): --disabled-opacity 50%, the only disabled mechanism
disabled_opacity = 0.5
line_height = 1.21
focus_ring_width_px = 2.0
focus_ring_offset_px = -2.0


[light.defaults.border]
color = "#d5d5d5"
corner_radius_px = 9.0
corner_radius_lg_px = 15.0
line_width_px = 1.0
opacity = 0.15
shadow_enabled = true
[light.defaults.font]
family = "Adwaita Sans"
size_pt =11.0
weight = 400

[light.defaults.mono_font]
family = "Adwaita Mono"
size_pt =11.0
weight = 400

[light.defaults.icon_sizes]
toolbar_px = 16.0
small_px = 16.0
large_px = 32.0
dialog_px = 22.0
panel_px = 20.0

[light.text_scale.caption]
size_pt =9.0

[light.text_scale.section_heading]
weight = 700

[light.text_scale.dialog_title]
size_pt =15.0
weight = 800

[light.text_scale.display]
size_pt =20.0
weight = 800

[light.window]
inactive_title_bar_background = "#ffffff"
inactive_title_bar_text_color = "#2e3436"

[light.window.title_bar_font]
color = "#2e3436"
weight = 700

[light.button]
background_color = "#e8e8e8"
min_width_px = 64.0
min_height_px = 34.0
icon_text_gap_px = 8.0
hover_background = "#d5d5d5"
hover_text_color = "#2e3436"
active_background = "#c8c8c8"
active_text_color = "#2e3436"
# no disabled_background / disabled_text_color: platform-facts.md:1115 (§2.1.6), a disabled button is its enabled self at disabled_opacity


[light.button.border]
# platform-facts.md:1171-1172 (§2.3): Adwaita CSS, a label-only button (.text-button, _buttons.scss:72-75) 17; 5
padding_horizontal_px = 17.0
padding_vertical_px = 5.0

[light.button.font]
color = "#2e3436"
[light.input]
background_color = "#ffffff"
placeholder_color = "#929595"
min_height_px = 34.0
caret_color = "#3584e4"
hover_border_color = "#3584e4"
focus_border_color = "#3584e4"
# no disabled_background / disabled_text_color: platform-facts.md:1115 (§2.1.6), a disabled entry is its enabled self at disabled_opacity


[light.input.border]
# platform-facts.md:1196-1197 (§2.4): Adwaita CSS 9; 0 (CSS sets no vertical padding)
padding_horizontal_px = 9.0
padding_vertical_px = 0.0

[light.text_area.border]
# platform-facts.md:1639-1640 (§2.29): textview sets no padding, GtkTextView's margins default to 0
padding_horizontal_px = 0.0
padding_vertical_px = 0.0

[light.input.font]
color = "#2e3436"
[light.checkbox]
# platform-facts.md:1212 (§2.5): min-width 14 plus padding 3 on each side
indicator_width_px = 20.0
# platform-facts.md:1220 (§2.5): bullet.svg, a circle of radius 4
radio_dot_diameter_px = 8.0
# platform-facts.md:1221 (§2.5): check.svg (libadwaita 1.10.0), a stroke 2 wide
check_mark_stroke_width_px = 2.0
label_gap_px = 8.0
hover_background = "#d5d5d5"
# no disabled_background / disabled_text_color: platform-facts.md:1115 (§2.1.6), a disabled check is its enabled self at disabled_opacity
unchecked_background = "#ffffff"
unchecked_border_color = "#d5d5d5"


[light.checkbox.border]
# platform-facts.md:1216-1217 (§2.5): Adwaita CSS check { padding: 3px }
padding_horizontal_px = 3.0
padding_vertical_px = 3.0

[light.tooltip]
background_color = "#2e3436"
max_width_px = 360.0


[light.tooltip.border]
# platform-facts.md:1257-1258 (§2.7): Adwaita CSS 10; 6
padding_horizontal_px = 10.0
padding_vertical_px = 6.0

[light.tooltip.font]
color = "#ffffff"
[light.scrollbar]
groove_width_px = 12.0
thumb_width_px = 8.0
overlay_mode = false
min_thumb_length_px = 40.0
thumb_hover_color = "#6e6e6e"
thumb_active_color = "#4e4e4e"

[light.slider]
track_height_px = 10.0
thumb_diameter_px = 20.0
tick_mark_length_px = 4.0
thumb_hover_color = "#ebebeb"
# no disabled_*_color: platform-facts.md:1115 (§2.1.6), a disabled scale is its enabled self at disabled_opacity

[light.progress_bar]
track_height_px = 8.0
min_width_px = 80.0

[light.progress_bar.border]
# platform-facts.md:1308 (§2.10): no border (an inset 1px shadow only under prefers-contrast: more)
line_width_px = 0.0

[light.tab]
min_width_px = 64.0
min_height_px = 30.0
# platform-facts.md:1326 (§2.11): GtkNotebook places each tab at the previous one's end (gtknotebook.c:5294)
item_gap_px = 0.0
active_background = "#fafafb"
active_text_color = "#2e3436"
hover_background = "#e8e8e8"
hover_text_color = "#2e3436"


[light.tab.border]
# platform-facts.md:1318-1319 (§2.11): Adwaita CSS 12; 3
padding_horizontal_px = 12.0
padding_vertical_px = 3.0
[light.menu]
row_height_px = 32.0
icon_text_gap_px = 8.0
hover_background = "#e8e8e8"
hover_text_color = "#2e3436"
# no disabled_text_color: platform-facts.md:1115 (§2.1.6), the enabled text at disabled_opacity


[light.menu.border]
# platform-facts.md:1235-1236 (§2.6): Adwaita CSS 12 ($menu_padding); 0
padding_horizontal_px = 12.0
padding_vertical_px = 0.0
[light.list]
alternate_row_background = "#f5f5f5"
# row_height not stated: platform-facts.md:1389 (§2.15), plain list context, no min-height
hover_background = "#ebebed"
hover_text_color = "#2e3436"
# no disabled_text_color: platform-facts.md:1115 (§2.1.6), the enabled text at disabled_opacity


[light.list.border]
# platform-facts.md:1390-1391 (§2.15): Adwaita CSS plain list context, 2
padding_horizontal_px = 2.0
padding_vertical_px = 2.0
[light.toolbar]
# bar_height not stated: platform-facts.md:1351 (§2.13), .toolbar sets no min-height
# platform-facts.md:1352 (§2.13): Adwaita CSS .toolbar border-spacing 6
item_gap_px = 6.0


[light.toolbar.border]
# platform-facts.md:1353-1354 (§2.13): Adwaita CSS .toolbar { padding: 6px }
padding_horizontal_px = 6.0
padding_vertical_px = 6.0


[light.status_bar.border]
# platform-facts.md:1372-1373 (§2.14): Adwaita CSS statusbar { padding: 6px 10px }
padding_horizontal_px = 10.0
padding_vertical_px = 6.0

[light.sidebar]
background_color = "#ebebed"
hover_background = "#e0e0e2"


[light.sidebar.font]
color = "#2e3436"
[light.popover]
background_color = "#ffffff"


[light.popover.font]
color = "#2e3436"


[light.popover.border]
# platform-facts.md:1412-1413 (§2.16): Adwaita CSS popover > contents { padding: 8px }
padding_horizontal_px = 8.0
padding_vertical_px = 8.0
[light.separator]
line_color = "#d5d5d5"

[light.splitter]
divider_width_px = 1.0
hover_color = "#d5d5d5"

[light.switch]
unchecked_background = "#d5d5d5"
thumb_background = "#ffffff"
track_width_px = 46.0
track_height_px = 26.0
thumb_diameter_px = 20.0
track_radius_px = 14.0
hover_checked_background = "#2e78cc"
hover_unchecked_background = "#c8c8c8"
# no disabled_*: platform-facts.md:1115 (§2.1.6), a disabled switch is its enabled self at disabled_opacity

[light.dialog]
button_order = "primary_right"
min_width_px = 300.0
max_width_px = 372.0
min_height_px = 140.0
max_height_px = 600.0
button_gap_px = 12.0
icon_size_px =32.0


[light.dialog.title_font]
# platform-facts.md:1496-1497 (§2.22): .title-2, ≈15pt ExtraBold
size_pt =15.0
weight = 800


[light.dialog.border]
corner_radius_px = 18.0
# platform-facts.md:1491-1492 (§2.22): 24; 32 top / 24 bottom
padding_horizontal_px = 24.0
padding_top_px = 32.0
padding_bottom_px = 24.0
[light.link]
underline_enabled = true
background_color = "#00000000"
# platform-facts.md:1626 (§2.28): GNOME hover_background **(none)**, transparent as background_color
hover_background = "#00000000"
hover_text_color = "#1b6acb"
active_text_color = "#1b6acb"
# platform-facts.md:1115 (§2.1.6): the enabled link colour, at disabled_opacity
disabled_text_color = "#1b6acb"

[light.spinner]
diameter_px = 16.0
min_diameter_px = 16.0
stroke_width_px = 2.0

[light.combo_box]
min_height_px = 34.0
min_width_px = 120.0
arrow_icon_size_px =16.0
# arrow_area_width not stated: platform-facts.md:1554 (§2.24), (none), inline icon
hover_background = "#d5d5d5"
# no disabled_background / disabled_text_color: platform-facts.md:1115 (§2.1.6), a disabled drop-down is its enabled self at disabled_opacity


[light.combo_box.border]
# platform-facts.md:1552, :1557 (§2.24): Adwaita CSS base button rule, as the dropdown's button has a box child: 10; 5
padding_horizontal_px = 10.0
padding_vertical_px = 5.0
[light.segmented_control]
segment_height_px = 28.0
separator_width_px = 1.0
active_background = "#3584e4"
active_text_color = "#ffffff"
hover_background = "#d5d5d5"


[light.segmented_control.border]
# platform-facts.md:1571, :1576 (§2.25): AdwToggleGroup text toggle, Adwaita CSS 11 − 3 = 8; 0 (no rule pads a toggle vertically)
padding_horizontal_px = 8.0
padding_vertical_px = 0.0

[light.card]


[light.card.border]
corner_radius_px = 12.0
[light.expander]
header_height_px = 50.0
arrow_icon_size_px =16.0
# platform-facts.md:1613-1616 (§2.27): AdwExpanderRow, the arrow at the row's end, 3 + 6 from
# the content before it, the nested list unindented, the whole a boxed-list card
arrow_side = "trailing"
arrow_gap_px = 9.0
content_indent_px = 0.0
frame_enabled = true
hover_background = "#ebebed"
arrow_color = "#2e3436"

