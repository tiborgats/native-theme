[light.defaults.border]
color = "#bcc0bf"
corner_radius_px = 5.0
corner_radius_lg_px = 8.0
line_width_px = 1.0
opacity = 0.2
shadow_enabled = true
[light.defaults.font]
# platform-facts.md:571 (§1.3.1): [General] font, Breeze default Noto Sans, 10pt, 400 (kfontsettingsdata.cpp)
family = "Noto Sans"
size_pt =10.0
weight = 400

[light.defaults.mono_font]
# platform-facts.md:572 (§1.3.1): [General] fixed, Breeze default Hack, 10pt, 400 (kfontsettingsdata.cpp)
