arrow_area_width_px = 20.0
hover_background = "#93cee9"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:Button] BackgroundNormal / ForegroundNormal, KColorScheme 6.30.0
disabled_background = "#f0f0f0"
disabled_text_color = "#a8a9aa"


[light.combo_box.border]
# platform-facts.md:1552, :1557 (§2.24): ComboBox_FrameWidth = 6 left, top and bottom; 0 right, where the edit field meets the 20px arrow column
padding_left_px = 6.0
padding_right_px = 0.0
padding_vertical_px = 6.0
[light.segmented_control]
segment_height_px = 30.0
separator_width_px = 1.0
active_background = "#3daee9"
active_text_color = "#fcfcfc"
hover_background = "#dee0e2"


[light.card]

[light.expander]
header_height_px = 40.0
arrow_icon_size_px =10.0
hover_background = "#dee0e2"
arrow_color = "#232629"

