# KDE Breeze theme - sourced from KDE/breeze repository
# BreezeLight.colors and BreezeDark.colors
name = "KDE Breeze"
icon_set = "freedesktop"

# === Light variant (BreezeLight.colors) ===

[light.defaults]
icon_theme = "breeze"
accent_color = "#3daee9"
background_color = "#eff0f1"
text_color = "#232629"
surface_color = "#ffffff"
muted_color = "#707d8a"
shadow_color = "#00000040"

danger_color = "#da4453"
danger_text_color = "#fcfcfc"
warning_color = "#f67400"
warning_text_color = "#232629"
success_color = "#27ae60"
success_text_color = "#fcfcfc"
info_color = "#3daee9"
info_text_color = "#fcfcfc"

selection_background = "#3daee9"
selection_text_color = "#fcfcfc"
link_color = "#2980b9"
focus_ring_color = "#3daee9"
# platform-facts.md:1060 (§2.1.3): Disabled [Colors:Window] ForegroundNormal, KColorScheme 6.30.0 [ColorEffects:Disabled]
disabled_text_color = "#a0a1a3"
accent_text_color = "#fcfcfc"

# platform-facts.md:1115 (§2.1.6): 1.0, Breeze dims a disabled control by its colours alone
disabled_opacity = 1.0
line_height = 1.36
focus_ring_width_px = 1.0
focus_ring_offset_px = 2.0


[light.defaults.border]
color = "#bcc0bf"
corner_radius_px = 5.0
corner_radius_lg_px = 8.0
line_width_px = 1.0
opacity = 0.2
shadow_enabled = true
[light.defaults.font]
family = "Noto Sans"
size_pt =10.0
weight = 400

[light.defaults.mono_font]
family = "Hack"
size_pt =10.0
weight = 400

[light.defaults.icon_sizes]
toolbar_px = 22.0
small_px = 16.0
large_px = 48.0
dialog_px = 32.0
panel_px = 48.0

[light.text_scale.caption]
# platform-facts.md:1435 (§2.19): smallestReadableFont, default 8pt, 400 (:573)
size_pt =8.0
weight = 400

[light.text_scale.section_heading]
# platform-facts.md:1436 (§2.19): Kirigami Heading level 2, the 10pt body
# (:571) × 1.20, Font.Normal (kirigami 8319acc, controls/Heading.qml:20-21,35)
size_pt =12.0
weight = 400

[light.text_scale.dialog_title]
# platform-facts.md:1437 (§2.19): Kirigami Heading level 1, the 10pt body
# (:571) × 1.35, Font.Normal (kirigami 8319acc, controls/Heading.qml:17-18,35)
size_pt =13.5
weight = 400

# No display: platform-facts.md:1438 (§2.19) gives KDE none; it resolves
# from the body font.

[light.window]
inactive_title_bar_background = "#eff0f1"
inactive_title_bar_text_color = "#232629"

[light.button]
background_color = "#fcfcfc"
min_width_px = 80.0
min_height_px = 32.0
icon_text_gap_px = 4.0
hover_background = "#93cee9"
hover_text_color = "#232629"
active_background = "#3daee9"
active_text_color = "#fcfcfc"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:Button] BackgroundNormal / ForegroundNormal, KColorScheme 6.30.0
disabled_background = "#f0f0f0"
disabled_text_color = "#a8a9aa"


[light.button.border]
color = "#d1d1d2"
# platform-facts.md:1171-1172 (§2.3): Button_MarginWidth = 6, both axes
padding_horizontal_px = 6.0
padding_vertical_px = 6.0

[light.button.font]
color = "#232629"
[light.input]
background_color = "#ffffff"
min_height_px = 32.0
hover_border_color = "#3daee9"
focus_border_color = "#3daee9"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:View] BackgroundNormal / ForegroundNormal, KColorScheme 6.30.0
disabled_background = "#f3f3f3"
disabled_text_color = "#aaabac"


[light.input.border]
# platform-facts.md:1196-1197 (§2.4): inside the frame line, LineEdit_FrameWidth 6 + QLineEdit's
# margins 2 / 1 − the 1px line (measured 2026-09-28: 8 / 7 from the outer edge)
padding_horizontal_px = 7.0
padding_vertical_px = 6.0

[light.input.font]
color = "#232629"
[light.checkbox]
indicator_width_px = 20.0
# platform-facts.md:1220 (§2.5): Breeze's dot, radius (18 - 12) / 2 = 3
radio_dot_diameter_px = 6.0
label_gap_px = 4.0
# platform-facts.md:1218 (§2.5): Button #fcfcfc under Selection #3daee9 at alpha 0.3
checked_background = "#c2e4f6"
# platform-facts.md:1211 (§2.5): palette.text(), [Colors:View] ForegroundNormal
indicator_color = "#232629"
hover_background = "#93cee9"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:Button] BackgroundNormal (the box) / [Colors:Window] ForegroundNormal (the label), KColorScheme 6.30.0
disabled_background = "#f0f0f0"
disabled_text_color = "#a0a1a3"
# platform-facts.md:1206 (§2.5): [Colors:Button] BackgroundNormal 252,252,252
unchecked_background = "#fcfcfc"
# platform-facts.md:1209 (§2.5): separatorColor(), mix(Window, WindowText, 0.2)
unchecked_border_color = "#c6c8c9"

[light.checkbox.border]
# platform-facts.md:1209 (§2.5): checked, palette.highlight(), [Colors:Selection] BackgroundNormal
color = "#3daee9"

[light.tooltip]
background_color = "#f7f7f7"
max_width_px = 300.0


[light.tooltip.border]
# platform-facts.md:1257-1258 (§2.7): ToolTip_FrameWidth = 3
padding_horizontal_px = 3.0
padding_vertical_px = 3.0

[light.tooltip.font]
color = "#232629"
[light.scrollbar]
groove_width_px = 21.0
min_thumb_length_px = 20.0
thumb_width_px = 8.0
overlay_mode = false
thumb_hover_color = "#93cee9"
thumb_active_color = "#3daee9"

[light.slider]
track_height_px = 6.0
thumb_diameter_px = 20.0
tick_mark_length_px = 8.0
thumb_hover_color = "#93cee9"
disabled_fill_color = "#bcc0bf"
disabled_track_color = "#dee0e2"
disabled_thumb_color = "#dee0e2"

[light.progress_bar]
track_height_px = 6.0
min_width_px = 6.0
# platform-facts.md:1301 (§2.10): Accent at alpha 0.7 over Window, KColorUtils::overlayColors(#eff0f1, #3daee9b3)
fill_color = "#72c2eb"

[light.progress_bar.border]
# platform-facts.md:1307-1308 (§2.10): WindowText #232629 at alpha frameContrast 0.2; PenWidth::Frame 1.001, rounded as defaults.border.line_width_px is
color = "#23262933"
line_width_px = 1.0

[light.tab]
min_width_px = 80.0
min_height_px = 30.0
# platform-facts.md:1326 (§2.11): QTabBar lays the tabs edge to edge (qtabbar.cpp:459-468)
item_gap_px = 0.0
# platform-facts.md:1312 (§2.11): an unselected tab is Window.darker(120), #eff0f1 → #c7c8c9 (breezehelper.cpp:1495-1496)
background_color = "#c7c8c9"
active_background = "#eff0f1"
active_text_color = "#232629"
# platform-facts.md:1312 (§2.11): hovered, [Colors:View] DecorationHover 61,174,233 (BreezeLight.colors:117) at alpha 0.2 replaces the fill (breezehelper.cpp:1497-1502)
hover_background = "#3daee933"
hover_text_color = "#232629"


[light.tab.border]
# platform-facts.md:1320 (§2.11): selected tab only, mix(Window #eff0f1, WindowText #232629, frameContrast 0.2)
color = "#c6c8c9"
# platform-facts.md:1321 (§2.11): PenWidth::Frame = 1.001, rounded as defaults.border.line_width_px is
line_width_px = 1.0
# platform-facts.md:1322 (§2.11): Frame_FrameRadius 5 − 0.5 × int(PenWidth::Frame), top corners
corner_radius_px = 4.5
# platform-facts.md:1323 (§2.11): no shadow
shadow_enabled = false
# platform-facts.md:1318-1319 (§2.11): TabBar_TabMarginWidth = 8; TabBar_TabMarginHeight = 4
padding_horizontal_px = 8.0
padding_vertical_px = 4.0
[light.menu]
# row_height not stated: platform-facts.md:1234 (§2.6), (none), sizes to font
icon_text_gap_px = 8.0
hover_background = "#3daee9"
hover_text_color = "#fcfcfc"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:Window] ForegroundNormal, KColorScheme 6.30.0
disabled_text_color = "#a0a1a3"


[light.menu.border]
# platform-facts.md:1235-1236 (§2.6): MenuItem_MarginWidth = 4; MenuItem_MarginHeight = 4
padding_horizontal_px = 4.0
padding_vertical_px = 4.0
[light.list]
alternate_row_background = "#f5f6f7"
# row_height not stated: platform-facts.md:1389 (§2.15), (none), sizes to content
hover_background = "#93cee9"
hover_text_color = "#232629"
# platform-facts.md:1115 (§2.1.6): Disabled [Colors:View] ForegroundNormal, KColorScheme 6.30.0
disabled_text_color = "#aaabac"


[light.list.border]
# platform-facts.md:1390-1391 (§2.15): 2; 1
padding_horizontal_px = 2.0
padding_vertical_px = 1.0
[light.toolbar]
# bar_height not stated: platform-facts.md:1351 (§2.13), (none), sizes to content
# platform-facts.md:1352 (§2.13): ToolBar_ItemSpacing = 0
item_gap_px = 0.0


[light.toolbar.border]
# platform-facts.md:1353-1354 (§2.13): ToolBar_ItemMargin = 6 on all four sides
padding_horizontal_px = 6.0
padding_vertical_px = 6.0


[light.status_bar.border]
# platform-facts.md:1372-1373 (§2.14): QStatusBar, 2 left, 3 top / 2 bottom; 14 right, the size grip's 1 + 13px (qstatusbar.cpp:466-467, qsizegrip.cpp:198-202), which Breeze paints as nothing (breezestyle.cpp:1505-1506), in a window that is not maximized
padding_right_px = 14.0
padding_left_px = 2.0
padding_top_px = 3.0
padding_bottom_px = 2.0

[light.sidebar]
background_color = "#dee0e2"
hover_background = "#93cee9"


[light.sidebar.font]
color = "#232629"
[light.popover]
background_color = "#ffffff"


[light.popover.font]
