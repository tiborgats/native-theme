# KDE Breeze theme - sourced from KDE/breeze repository
# BreezeLight.colors and BreezeDark.colors
# Style: Breeze v6.7.5 (ca217f12, Plasma 6.7), with KDE Frameworks 6.31.0.
# Covers: Plasma 6.7; the kstyle sources and colour values are unchanged in
# Plasma 6.8 Beta 2 (v6.7.91). Plasma 6.6 LTS differs (one item-view margin of 3,
# breezemetrics.h v6.6.6:156; a checked box's highlight alpha 0.33,
# breezehelper.cpp v6.6.6:39).
# Verified on: Breeze v6.7.5 and KF 6.31.0, 2026-10-11 (code review M2e), for
# every value that cites docs/platform-facts.md; an uncited value is unchecked.
name = "KDE Breeze"
icon_set = "freedesktop"

# === Light variant (BreezeLight.colors) ===

[light.defaults]
icon_theme = "breeze"
# platform-facts.md:1048 (§2.1.3): BreezeLight.colors has no [General] AccentColor, so [Colors:View] DecorationFocus 61,174,233 (BreezeLight.colors:116, breeze v6.7.5)
accent_color = "#3daee9"
# platform-facts.md:1046 (§2.1.3): [Colors:Window] BackgroundNormal 239,240,241 (BreezeLight.colors:129, breeze v6.7.5)
background_color = "#eff0f1"
# platform-facts.md:1047 (§2.1.3): [Colors:Window] ForegroundNormal 35,38,41 (BreezeLight.colors:137, breeze v6.7.5)
text_color = "#232629"
# platform-facts.md:1050 (§2.1.3): [Colors:View] BackgroundNormal 255,255,255 (BreezeLight.colors:115, breeze v6.7.5)
surface_color = "#ffffff"
# platform-facts.md:1052 (§2.1.3): [Colors:Window] ForegroundInactive 112,125,138 (BreezeLight.colors:133, breeze v6.7.5)
muted_color = "#707d8a"
# platform-facts.md:1053 (§2.1.3): (none) in Breeze, the preset's own #00000040
shadow_color = "#00000040"

# platform-facts.md:1080 (§2.1.4): [Colors:View] ForegroundNegative 218,68,83 (BreezeLight.colors:121, breeze v6.7.5)
danger_color = "#da4453"
# platform-facts.md:1081 (§2.1.4): [Colors:Window] ForegroundNormal 35,38,41 (BreezeLight.colors:137, breeze v6.7.5)
danger_text_color = "#232629"
# platform-facts.md:1082 (§2.1.4): [Colors:View] ForegroundNeutral 246,116,0 (BreezeLight.colors:122, breeze v6.7.5)
warning_color = "#f67400"
