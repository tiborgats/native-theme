[[rules]]
when = { conditions = ["animations_off"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:26
motion.speed_factor = 0

[[rules]]
when = { conditions = ["flavor:kirigami"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:60
motion.color_space = "straight_srgb8"
# docs/facts/kde/tokens.toml:1963
behavior.hide_pointer_while_typing = false
# docs/facts/kde/tokens.toml:1990
behavior.hide_pointer_delay_ms = "absent"
# docs/facts/kde/tokens.toml:2019
behavior.hide_pointer_fade_ms = "absent"
# docs/facts/kde/tokens.toml:2095
behavior.mnemonic_when_disabled = false

[[rules]]
when = { conditions = ["window_inactive"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:1133
elevation.window_small = [{ x_px = 0, y_px = "= add(4px, 0px)", blur_px = 16, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(1, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = "= add(4px, -2px)", blur_px = 8, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.4, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }]
# docs/facts/kde/tokens.toml:1180
elevation.window_medium = [{ x_px = 0, y_px = "= add(8px, 0px)", blur_px = 32, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.9, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = "= add(8px, -4px)", blur_px = 16, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.3, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }]
# docs/facts/kde/tokens.toml:1227
elevation.window_large = [{ x_px = 0, y_px = "= add(12px, 0px)", blur_px = 48, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.8, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = "= add(12px, -6px)", blur_px = 24, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.2, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }]
# docs/facts/kde/tokens.toml:1274
elevation.window_very_large = [{ x_px = 0, y_px = "= add(16px, 0px)", blur_px = 64, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.7, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }, { x_px = 0, y_px = "= add(16px, -8px)", blur_px = 32, spread_px = -3, color = "= with_alpha(role.global.shadow_reference, mul(0.1, mul(div(token.params.shadow.strength, 255), 0.5)))", inset = false, falloff = "gaussian" }]

[[rules]]
when = { conditions = ["system_setting:single_click"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:1855
behavior.single_click_activates = true

[[rules]]
when = { conditions = ["flavor:kirigami", "unit_scale"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:8061
text.rendering.engine = "native"

[[rules]]
when = { conditions = ["flavor:kirigami"], not_conditions = ["unit_scale"] }
target = "tokens"

[rules.set]
# docs/facts/kde/tokens.toml:8072
text.rendering.engine = "qt"
