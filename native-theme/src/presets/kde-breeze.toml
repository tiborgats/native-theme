success_text_color = "#232629"
# platform-facts.md:1086 (§2.1.4): [Colors:View] ForegroundActive 61,174,233 (BreezeLight.colors:118, breeze v6.7.5)
info_color = "#3daee9"
# platform-facts.md:1087 (§2.1.4): [Colors:Window] ForegroundNormal 35,38,41 (BreezeLight.colors:137, breeze v6.7.5)
