weight = 400

[light.defaults.icon_sizes]
# platform-facts.md:1132-1136 (§2.1.8): KIconLoader's MainToolbar 22, Small 16,
# Desktop 48, Dialog 32 and Panel 48, Breeze's sizes
toolbar_px = 22.0
small_px = 16.0
large_px = 48.0
dialog_px = 32.0
panel_px = 48.0

[light.text_scale.caption]
# platform-facts.md:1472 (§2.19): smallestReadableFont, default 8pt, 400 (:573)
size_pt =8.0
weight = 400

[light.text_scale.section_heading]
# platform-facts.md:1473 (§2.19): Kirigami Heading level 2, the 10pt body
# (:571) × 1.20, Font.Normal (kirigami 8319acc, controls/Heading.qml:20-21,35)
size_pt =12.0
weight = 400

[light.text_scale.dialog_title]
# platform-facts.md:1474 (§2.19): Kirigami Heading level 1, the 10pt body
# (:571) × 1.35, Font.Normal (kirigami 8319acc, controls/Heading.qml:17-18,35)
size_pt =13.5
weight = 400

# No display: platform-facts.md:1475 (§2.19) gives KDE none; it resolves
# from the body font.

[light.window]
