# hand-written: end rule role.global.accent { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }

[[rules]]
when = { conditions = ["scheme:light"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:21426
icons.sizes.toolbar.fill = "#0088ff"

[[rules]]
when = { conditions = ["scheme:dark"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:21447
icons.sizes.toolbar.fill = "#0091ff"
