# docs/facts/ios/roles.toml:2116
keyed.system_background = "#242426"
# docs/facts/ios/roles.toml:2182
keyed.system_background_secondary = "#363638"
# docs/facts/ios/roles.toml:2237
keyed.system_background_tertiary = "#444446"
# docs/facts/ios/roles.toml:2292
keyed.system_grouped_background = "#242426"
# docs/facts/ios/roles.toml:2347
keyed.system_grouped_background_secondary = "#363638"
# docs/facts/ios/roles.toml:2413
keyed.system_grouped_background_tertiary = "#444446"

[[rules]]
when = { not_conditions = ["tint_dimmed", "window_inactive"] }
target = "colors"

[rules.set]
# hand-written: begin rule role.global.accent { not_conditions = ["tint_dimmed", "window_inactive"] }
# docs/facts/ios/roles.toml:3846
global.accent = "= input.accent"
# hand-written: end rule role.global.accent { not_conditions = ["tint_dimmed", "window_inactive"] }

[[rules]]
when = { conditions = ["scheme:light", "tint_dimmed"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/ios/roles.toml:3897
global.accent = "#868686cc"

[[rules]]
when = { conditions = ["scheme:dark", "tint_dimmed"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/ios/roles.toml:3913
global.accent = "#8c8c8ccc"

[[rules]]
when = { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }
target = "colors"

[rules.set]
# hand-written: begin rule role.global.accent { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }
# hand-written: end rule role.global.accent { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }

[[rules]]
when = { conditions = ["scheme:light"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:5839
icons.sizes.toolbar.fill = "#0088ff"

[[rules]]
when = { conditions = ["scheme:dark"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:5860
icons.sizes.toolbar.fill = "#0091ff"
