# docs/facts/ios/button.toml:233365
text.font.family = ".AppleSystemUIFont"
# docs/facts/ios/button.toml:242243
text.font.weight = 400
# docs/facts/ios/button.toml:286408
text.font.style = "normal"
# docs/facts/ios/button.toml:287926
text.font.axes = { opsz = "follows_size" }
# docs/facts/ios/button.toml:289438
text.font.features = {}
# docs/facts/ios/button.toml:290968
text.line_height = "auto"
# docs/facts/ios/button.toml:293944
text.mnemonic_decoration = "absent"
# docs/facts/ios/button.toml:293981
text.case = "mixed"
# docs/facts/ios/button.toml:295493
text.elision = "none"
# docs/facts/ios/button.toml:297005
text.wrap = "word_char"
# docs/facts/ios/button.toml:298517
text.max_lines = "none"
# docs/facts/ios/button.toml:238127
text.font.size_px = 17

[widgets.button.values]
# docs/facts/ios/button.toml:263477
icon_placement = "leading"
# docs/facts/ios/button.toml:266394
icon_text_gap_px = 0
# docs/facts/ios/button.toml:270551
subtitle_gap_px = 1
# docs/facts/ios/button.toml:318048
back_title_fallback = true
# docs/facts/ios/button.toml:318064
back_display_mode = "default"
# docs/facts/ios/button.toml:318095
focus_visible_when = "= token.behavior.focus_visible_when"
# docs/facts/ios/button.toml:318111
help_tooltip_on_click = false
# docs/facts/ios/button.toml:318291
hit_extension = { top_px = "absent", right_px = "absent", bottom_px = "absent", left_px = "absent" }
# docs/facts/ios/button.toml:318467
repeat_delay_ms = "absent"
# docs/facts/ios/button.toml:318558
repeat_interval_ms = "absent"

[widgets.button.subtitle]
# docs/facts/ios/button.toml:307329
text.mnemonic_decoration = "absent"

