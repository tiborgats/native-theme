[[rules]]
when = { conditions = ["scheme:light", "tint_dimmed"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/ios/roles.toml:3897
global.accent = "#868686cc"

[[rules]]
when = { conditions = ["scheme:dark", "tint_dimmed"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/ios/roles.toml:3913
global.accent = "#8c8c8ccc"

[[rules]]
when = { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }
target = "colors"

[rules.set]
# hand-written: begin rule role.global.accent { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }
# hand-written: end rule role.global.accent { conditions = ["window_inactive"], not_conditions = ["tint_dimmed", "idiom:pad"] }

[[rules]]
when = { conditions = ["scheme:light"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:21436
icons.sizes.toolbar.fill = "#0088ff"

[[rules]]
when = { conditions = ["scheme:dark"], not_conditions = ["contrast_increased"] }
target = "tokens"

[rules.set]
# docs/facts/ios/tokens.toml:21457
icons.sizes.toolbar.fill = "#0091ff"
