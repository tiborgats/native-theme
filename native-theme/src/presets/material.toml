# Material Design 3 baseline theme
# Source: the material-web token set v0_192 at material-web cbd34a8921915af94d5ef65c2a69eece41d5b4f3
# (tokens/versions/v0_192/), the one its components use; docs/platform-facts.md's Material column.
# A role's hex is md.sys.color (_md-sys-color.scss:19-76 dark, :78-135 light) through
# md.ref.palette (_md-ref-palette.scss:15-109). A state layer is its colour at the md.sys.state
# opacity (_md-sys-state.scss:17-20: hover 0.08, focus and pressed 0.12, dragged 0.16) over the
# container, composited as round(container · (1 − a) + layer · a) per 8-bit channel.
name = "Material"
icon_set = "material"
icon_theme = "material"

# === Light variant ===

[light.defaults]
