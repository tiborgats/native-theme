# macOS Tahoe theme: AppKit's Liquid Glass look, from macOS 26 Tahoe.
# Covers: macOS 26. macOS 27 Golden Gate refines Liquid Glass and has no preset of its own until
# GitHub offers a macOS 27 runner image to verify one on (docs/todo.md); on 27 the reader merges
# over this preset and reports VersionMatch::PresetOlder.
# Verified on: macOS 26.6.2 by the OS probe, docs/evidence/os-probe/2026-10-11-run-38129819806/
# os-probe-macos-26/probe.toml, for the values whose comment cites it: "probe :N" is line N of that
# file. os-probe-xcode-27 (macOS 27.0.1) reports the same colour or size on every line cited here.
# The probe resolves each NSColor per appearance (performAsCurrentDrawingAppearance:, probe :305),
# with Reduce Transparency on (probe :465), and draws its renders (renders/aqua, renders/darkAqua)
# in a window that is never shown or key. A colour with alpha is stated as the API gives it, and
# its comment gives the composite over the colour it sits on.
# Not verified on macOS 26: a value whose comment says "no macOS 26 source" is one no source gives
# for 26 (docs/platform-facts.md's "macOS 26: ❓" cells), in a field the model requires or one whose
# inherited value would be the wrong kind; it carries macos-monterey's value.
# Source: docs/platform-facts.md's macOS column, its "macOS 26:" values (AppKit documentation, the
# HIG, WebKit, the OS probe).
name = "macOS Tahoe"
icon_set = "sf-symbols"
icon_theme = "sf-symbols"

