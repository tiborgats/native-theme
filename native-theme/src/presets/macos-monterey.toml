# docs/facts/macos/roles.toml:14505
surfaces.view.background_alternate = "#ffffff19"

[[rules]]
when = { conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/macos/roles.toml:5625
surfaces.selection.background = "= role.@selected_control_secondary"
# docs/facts/macos/roles.toml:8291
global.selection_text_background = "= role.global.selection_text_background_unfocused"
# docs/facts/macos/roles.toml:8302
global.selection_text_foreground = "= role.global.selection_text_foreground_unfocused"
# docs/facts/macos/roles.toml:14807
surfaces.selection.foreground_inactive = "= role.window.foreground_inactive"
# docs/facts/macos/roles.toml:14903
surfaces.selection.disabled.foreground = "= role.window.disabled.foreground"

[[rules]]
when = { conditions = ["contrast_increased", "scheme:light"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/macos/roles.toml:14825
surfaces.selection.foreground_inactive = "#ffffffcd"
# docs/facts/macos/roles.toml:14921
surfaces.selection.disabled.foreground = "#ffffff80"

[[rules]]
when = { conditions = ["contrast_increased", "scheme:dark"], not_conditions = ["window_inactive"] }
target = "colors"

[rules.set]
# docs/facts/macos/roles.toml:14836
surfaces.selection.foreground_inactive = "#ffffffb3"
# docs/facts/macos/roles.toml:14932
surfaces.selection.disabled.foreground = "#ffffff80"

[[rules]]
when = { conditions = ["scheme:light"] }
target = "tokens"

[rules.set]
# docs/facts/macos/tokens.toml:4873
caret.color = "= input.accent"
# docs/facts/macos/tokens.toml:47607
behavior.hide_pointer_while_typing = true

[[rules]]
when = { conditions = ["scheme:dark"] }
target = "tokens"

[rules.set]
# docs/facts/macos/tokens.toml:4890
caret.color = "= input.accent"
