# platform-facts.md:1057: NSShadow.shadowColor's default, black at 1/3 (85/255, the nearest 8-bit alpha)
shadow_color = "#00000055"

# platform-facts.md:1084-1091 (§2.1.4): systemRedColor, systemOrangeColor, systemGreenColor and
# systemBlueColor, probe :344, :347, :345, :346; each text colour is labelColor (probe :308), the
# body text beside a status mark, not text on the status fill (footnote 1, :1093-1102)
danger_color = "#ff3b30"
danger_text_color = "#000000d8"
warning_color = "#ff9500"
