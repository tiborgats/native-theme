# platform-facts.md:1053: NSShadow.shadowColor's default, black at 1/3 (85/255, the nearest 8-bit alpha)
shadow_color = "#00000055"

# platform-facts.md:1080-1087 (§2.1.4): systemRedColor, systemOrangeColor, systemGreenColor and
# systemBlueColor, probe :344, :347, :345, :346; each text colour is labelColor (probe :308), the
# body text beside a status mark, not text on the status fill (footnote 1, :1089-1098)
