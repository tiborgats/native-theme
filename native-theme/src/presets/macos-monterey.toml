# macOS Monterey theme: AppKit's Big Sur-era look as it stands from macOS 12 Monterey, whose AppKit
# release notes end the accent-colour highlight of a clicked push button.
# Covers: macOS 12 Monterey to 15 Sequoia. No AppKit release note for 13 or 14 changes a value this
# preset carries, and Apple published none for 15.
# Verified on: macOS 14.8.9 and 15.7.9 by the OS probe, docs/evidence/os-probe/
# 2026-10-11-run-38129819806/os-probe-macos-14/probe.toml and os-probe-macos-15/probe.toml, for the
# values whose comment cites it: "probe :N" is line N of both files, which report the same value
# there. The probe resolves each NSColor per appearance (performAsCurrentDrawingAppearance:,
# probe :305), with Reduce Transparency on (probe :465). A colour with alpha is stated as the API
# gives it, and its comment gives the composite over the colour it sits on.
# Source: docs/platform-facts.md's macOS column (AppKit documentation, the HIG, WebKit,
# measurements) and the probe.
name = "macOS Sonoma"
icon_set = "sf-symbols"
icon_theme = "sf-symbols"

# === Light variant ===

[light.defaults]
# platform-facts.md:1052 (§2.1.3): controlAccentColor, probe :362 (the same in darkAqua, :436)
accent_color = "#007aff"
# platform-facts.md:1050: windowBackgroundColor, probe :321
background_color = "#ececec"
# platform-facts.md:1051: labelColor, probe :308; over background_color #242424
text_color = "#000000d8"
# platform-facts.md:1054: controlBackgroundColor, probe :323
