# Windows 11 Fluent Design theme
# Covers: Windows 11, 21H2 (build 22000) to 26H2 (26300), the Fluent / WinUI 3 generation
#   (docs/todo_code-review-findings.md, M2b Step 1). The Windows reader merges over it on
#   Windows 10 too, which has no preset of its own: on Windows Server 2022 (20348, the Windows 10
#   era) the OS reported what Server 2025 did, except the default accent, #0078d7 against #0078d4;
#   no Windows 10 client was measured.
# Verified on: the WinUI 3 values at microsoft-ui-xaml 8463f45 (the same files in WinAppSDK 2.5.1
#   and 1.8.12); the OS-reported values on Windows 11 25H2 (26200) and Windows Server 2025 (26100),
#   docs/evidence/os-probe/2026-10-11-run-38129819806.
# Colours: what WinUI 3 draws. A brush with alpha is stated as the resource gives it (ARGB #E4000000
#   is "#000000e4"); the defaults' comments give the composite over background_color. A hover fill
#   that replaces the rest fill (button, segmented control) is stated flattened over
#   background_color, because the connectors composite hover_background over the rest fill.
# Source: WinUI3 XAML theme resources, Fluent Design System
name = "Windows 11"
icon_set = "segoe-fluent"
icon_theme = "segoe-fluent"

# === Light variant ===

[light.defaults]
accent_color = "#0078d4"
# platform-facts.md:1046 (§2.1.3): Mica's solid fallback, SolidBackgroundFillColorBase #F3F3F3
background_color = "#f3f3f3"
# platform-facts.md:1047: TextFillColorPrimary #E4000000; over background_color #1a1a1a
text_color = "#000000e4"
# platform-facts.md:1050: CardBackgroundFillColorDefault #B3FFFFFF; over background_color #fbfbfb
surface_color = "#ffffffb3"
# platform-facts.md:1052: TextFillColorSecondary #9E000000; over background_color #5c5c5c
muted_color = "#0000009e"
# no source ❓: platform-facts.md:1053 gives Windows the ambient layer alone, 14% (#00000024) on
# Fluent 2's low ramp (command dropdowns, tooltips) and 20% (#00000033) on the high one (dialogs); the
# connectors draw popup and window shadows in this one colour, so no layer is the source
shadow_color = "#00000018"

danger_color = "#c42b1c"
# platform-facts.md:1081-1087 (§2.1.4): InfoBar *SeverityIconForeground = TextFillColorInverse #FFFFFF
danger_text_color = "#ffffff"
warning_color = "#9d5d00"
warning_text_color = "#ffffff"
success_color = "#0f7b0f"
success_text_color = "#ffffff"
info_color = "#0078d4"
info_text_color = "#ffffff"

selection_background = "#0078d4"
selection_text_color = "#ffffff"
# platform-facts.md:1054: HyperlinkForeground = SystemAccentColorDark2, UISettings AccentDark2 for
# the accent above (OS probe, Windows 11 25H2)
link_color = "#003e92"
# platform-facts.md:1104 (§2.1.5): SystemControlFocusVisualPrimaryBrush = FocusStrokeColorOuter #E4000000
focus_ring_color = "#000000e4"
# platform-facts.md:1060: TextFillColorDisabled #5C000000; over background_color #9b9b9b
disabled_text_color = "#0000005c"
accent_text_color = "#ffffff"

# platform-facts.md:1115 (§2.1.6): 1.0, WinUI 3 dims a disabled control by its *Disabled brushes alone
disabled_opacity = 1.0
line_height = 1.43
focus_ring_width_px = 2.0
# platform-facts.md:1106 (§2.1.5): Button FocusVisualMargin -3 around a 2px outer and a 1px inner ring
focus_ring_offset_px = 1.0


[light.defaults.border]
color = "#e5e5e5"
corner_radius_px = 4.0
corner_radius_lg_px = 8.0
line_width_px = 1.0
opacity = 0.14
shadow_enabled = true
[light.defaults.font]
family = "Segoe UI"
# platform-facts.md:1026 (§2.1.1): WinUI3 ControlContentThemeFontSize 14px; lfMessageFont is 9pt
size_pt =10.5
weight = 400

[light.defaults.mono_font]
family = "Cascadia Mono"
size_pt =10.5
weight = 400

[light.defaults.icon_sizes]
