# A part's table: at most one presence (`absent = true`, `absent = false` or
# a `drawn_as` with its target) beside only the fields the catalogue lists for
# the part (S2.11, S6.1, S6.3, S11; ADD-A131).
# problem: rules[0].set.drawn_as: states the field absent states too
# problem: widgets.button.icon.drawn_as.part: states `part` without `widget`
# problem: widgets.button.label.fill: a field `button.label` does not have
# problem: widgets.button.label.shadow: a field `button.label` does not have
# problem: widgets.button.menu_indicator.absent: expected `true`, the whole part not drawn, or `false`, drawn again
# problem: widgets.button.subtitle.drawn_as.variants: missing

[widgets.button.label]
fill = "#000000"
shadow = "absent"

[widgets.button.icon]
drawn_as = { part = "label", variants = [] }

[widgets.button.menu_indicator]
absent = "false"

[widgets.button.subtitle]
drawn_as = { widget = "button" }

[[rules]]
target = "button.subtitle"
set = { absent = true, text = { case = "upper" }, drawn_as = { widget = "button", variants = [] } }
