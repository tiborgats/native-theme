[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

# The focus ring the token's, absent on a flat button.
[[rules]]
target = "button.body"
set = { focus = "= token.focus" }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { focus = "absent" }
