# The focus ring stated whole by a reference, and its width per leaf after it where the button is not focused
# (S17 *Which fact applies*: the last fact in file order whose `when` holds; the leaf's fact stands after the
# block's, so it applies to the leaf there, the block's to the rest).
[[fact]]
key = "button.body.focus"
value = "= token.focus"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.focus.width"
when = { not_states = ["focused"] }
value = "0px"
rows = []

