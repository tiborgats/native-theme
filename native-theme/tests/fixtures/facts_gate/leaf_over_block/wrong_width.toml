# preset.toml's twin whose ring stays the token's where the button is not focused: the leaf's fact,
# which applies there after the block's, fails it.
[declare.widget.button]
variants = ["tool"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
target = "button.body"
set = { focus = "= token.focus" }
