# Synthetic token facts (S17, ADD-A128): the focus indicator's width pending with nothing beneath but under high
# contrast, where the preset's rule states it; its offset's top reads it.

# Pending: the preset lists the path and states it under high contrast alone.
[[fact]]
key = "token.focus.width"
when = { not_conditions = ["contrast_high"] }
pending = "U5"
rows = []

[[fact]]
key = "token.focus.width"
when = { conditions = ["contrast_high"] }
value = "3px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Reads the listed path: skipped where it reaches the synthetic value.
[[fact]]
key = "token.focus.offset.top"
value = "= token.focus.width"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"
