# A synthetic preset (S17, ADD-A128): its touch delay listed under another id than its fact's.
# base without: delay_ms = "absent"
[pending]
"tokens.behavior.touch.delay_ms" = "U7"

[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { conditions = ["contrast_high"] }
target = "tokens"
set = { behavior.touch.delay_ms = 100 }

[[rules]]
target = "tokens"
set = { behavior.long_press_ms = "= token.behavior.touch.delay" }
