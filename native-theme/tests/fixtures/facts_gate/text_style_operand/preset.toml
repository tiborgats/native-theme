[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

# The body style's line height its own font size's multiple, as the fact states it.
[[rules]]
target = "tokens"
set = { text.keyed.body.line_height = "= mul(font_size, 1.4)" }
