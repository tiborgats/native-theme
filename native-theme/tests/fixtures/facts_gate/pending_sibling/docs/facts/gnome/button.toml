# Synthetic facts (S17, ADD-A128): the minimum width pending with nothing beneath but where the button
# is pressed; the opacity other than the preset's, wherever no preset rule on the part applies too.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.fill"
when = { variants = ["tool"] }
value = "#00000000"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.min_width"
when = { not_states = ["pressed"] }
pending = "U8"
rows = []

[[fact]]
key = "button.body.min_width"
when = { states = ["pressed"] }
value = "44px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.opacity"
value = 0.5
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.icon"
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.menu_indicator"
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
