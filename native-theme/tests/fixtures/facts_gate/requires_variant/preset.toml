[declare.widget.button]
variants = ["tool", "primary"]
requires_variants = ["tool", "primary"]
exclusive_variants = [["tool", "primary"]]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }
