# A synthetic preset (S17, ADD-A144): a whole map listed, its synthetic value stated whole, and a
# preset rule creating an entry of it at the dark scheme, where the preset states the map.
# base without: size_classes = {}
[pending]
"tokens.size_classes" = "U150"

[declare.widget.button]
variants = ["tool"]

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { conditions = ["scheme:dark"] }
target = "tokens"
set = { size_classes = { compact = { horizontal_px = 0, vertical_px = 0 } } }
