# A synthetic state model (S17): a button with one variant, two flags and two sizes, the small one its
# default and the regular one the tool style's own (`sizes_by_variant`), each the size in force while the sizes
# unit is not enabled (S10); the small one named by a `not_drawn` entry. The preset declares the regular size
# alone, so the small one's combinations are not available.
[[model]]
widget = "button"
available = true
variants = ["tool"]
sizes = ["small", "regular"]
default_size = "small"
sizes_by_variant = [{ variant = "tool", sizes = ["regular"], default_size = "regular" }]
densities = []
axes = { states = ["hover", "pressed"], conditions = ["scheme:light", "scheme:dark"], contexts = [] }
exclusive = []
not_drawn = [{ sizes = ["small"] }]
rows = []
