# base without: [declare]
# base without: text_styles = ["body"]
# base without: inputs = ["accent"]
# base without: surface_sets = ["window"]
[declare]
text_styles = ["body"]
inputs = ["accent"]
surface_sets = ["window"]
flavors = ["main", "alt"]

[declare.widget.button]
variants = ["flat", "@main_only"]

[declare.flavor.alt.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { not_conditions = ["flavor:alt"], variants = ["@main_only"] }
target = "button.body"
set = { fill = "#112233" }
