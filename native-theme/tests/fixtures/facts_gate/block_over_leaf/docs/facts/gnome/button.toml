# The focus ring's width per leaf where the button is not focused, and the ring stated whole by a reference
# after it (S17 *Which fact applies*: the last fact in file order whose `when` holds; the block's fact stands after
# the leaf's and always holds, so it applies to the leaf too: the width is the token's everywhere).
[[fact]]
key = "button.body.focus.width"
when = { not_states = ["focused"] }
value = "0px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.focus"
value = "= token.focus"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"
