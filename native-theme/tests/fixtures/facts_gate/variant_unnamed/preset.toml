[declare.widget.button]
variants = ["flat", "@raised"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

# S12 refuses a declared keyed variant no rule selects on: a rule stating what the base states.
[[rules]]
when = { variants = ["@raised"] }
target = "button.body"
set = { opacity = 1 }
