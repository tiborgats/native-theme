[declare.widget.button]
variants = ["tool", "@probe_arrow"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { not_variants = ["tool"] }
target = "button.subtitle"
set = { absent = true }

[[rules]]
when = { variants = ["tool"], not_variants = ["@probe_arrow"] }
target = "button.subtitle"
set = { absent = true }
