# Synthetic facts (S17): libadwaita's menu indicator pattern (ADD-A130) on the subtitle: the part's own
# facts state where it is absent, its field's fact holds without a `when`.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.fill"
when = { variants = ["flat"] }
value = "#00000000"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.min_width"
value = "40px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.min_width"
when = { states = ["pressed"] }
value = "44px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.opacity"
value = 1
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.opacity"
when = { states = ["hover"] }
pending = "U1"
rows = []

[[fact]]
key = "button.values.icon_text_gap"
value = "4px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.icon"
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.menu_indicator"
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Absent but on a flat button with an arrow, as GNOME's `button.menu_indicator` is.
[[fact]]
key = "button.subtitle"
when = { not_variants = ["flat"] }
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.subtitle"
when = { variants = ["flat"], not_variants = ["@with_arrow"] }
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Its field's look wherever it is drawn.
[[fact]]
key = "button.subtitle.text"
value = "= token.text.roles.body"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"
