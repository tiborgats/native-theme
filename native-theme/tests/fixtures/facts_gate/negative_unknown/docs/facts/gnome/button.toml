# Synthetic facts (S17): the pressed fact's negative lists name what the model does not hold, which
# no element holds, so the fact holds where it is pressed.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

