quote = "synthetic"

# Inside the chain, where a hovered button is an ancestor and the nearest button ancestor is the tool
# one, the inner.
[[fact]]
key = "button.body.min_width"
when = { context = [{ widget = "button", states = ["hover"] }, { scope = { nearest = ["button"] }, widget = "button", variants = ["tool"] }] }
value = "60px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"


