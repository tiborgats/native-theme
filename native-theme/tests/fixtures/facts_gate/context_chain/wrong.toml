[declare.widget.button]
variants = ["flat"]

# Wrong where both ancestors of the chain hold.
[[rules]]
when = { context = [{ widget = "button", states = ["hover"] }, { widget = "button", variants = ["flat"] }] }
target = "button.body"
set = { min_width_px = 99 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }
