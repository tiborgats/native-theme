# Synthetic token facts (S17, ADD-A128): two listed paths, each read through functions that map many
# values to one, so no two values of the listed path tell a fact reading it apart.

[[fact]]
key = "token.focus.width"
value = "2px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "token.caret.blink_on"
pending = "U5"
rows = []

# Reads the listed blink time through max: skipped, as its evaluation reaches the synthetic value.
[[fact]]
key = "token.behavior.long_press"
value = "= max(token.caret.blink_on, 100ms)"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Reads the listed blink time through min: skipped.
[[fact]]
key = "token.behavior.hover_open_delay"
value = "= min(token.caret.blink_on, 0ms)"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "token.motion.speed_factor"
pending = "U6"
rows = []

# Reads the listed factor through floor: skipped.
[[fact]]
key = "token.text.rendering.gamma"
value = "= floor(token.motion.speed_factor)"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Reads the listed factor through round: skipped.
[[fact]]
key = "token.text.rendering.contrast"
value = "= round(token.motion.speed_factor)"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"
