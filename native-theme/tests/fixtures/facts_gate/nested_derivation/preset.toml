[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

# The literal the accent gives, inside a paint's layer, where the platform derives it.
[[rules]]
target = "button.body"
set = { fill = { layers = [{ kind = { color = "#3366cc" }, blend = "normal" }] } }
