# A synthetic preset (S17, ADD-A128): the ripple's indication box, set whole, listed with its leaves' two ids, the
# body's interaction stated without it.
# base without: interaction = "absent"
[pending]
"widgets.button.body.interaction.ripple.indication_box" = ["U3", "U4"]

[declare.widget.button]
variants = ["tool"]

[widgets.button.body.interaction]
state_layer = { color = "#000000", alpha = 0.1 }
ripple = { effect = "absent", color = "absent", alpha = "absent", bounded = true, max_radius_px = "absent", padding_px = "absent" }

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }
