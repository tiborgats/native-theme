# A synthetic preset (S17, ADD-A128): the key repeat, set whole, listed with its leaves' two ids.
# base without: key_repeat = "none"
[pending]
"tokens.behavior.key_repeat" = ["U3", "U4"]

[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }
