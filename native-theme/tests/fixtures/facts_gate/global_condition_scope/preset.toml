# The speed factor under `reduced_motion`, as its fact states it.
[declare.widget.button]
variants = ["tool"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { conditions = ["reduced_motion"] }
target = "tokens"
set = { motion.speed_factor = 0.5 }
