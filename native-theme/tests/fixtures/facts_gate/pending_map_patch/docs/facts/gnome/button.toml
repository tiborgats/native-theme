# The label's font axes (ADD-A128): pending with nothing beneath but on hover, where the preset's
# rule states them; a later pending fact on hover of the tool button has that rule beneath it, so
# it leaves the path listed nowhere.
[[fact]]
key = "button.label.text.font.axes"
when = { states = ["hover"] }
value = { GRAD = { fixed = 1 } }
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Pending with nothing beneath: the preset lists the path with this id alone.
[[fact]]
key = "button.label.text.font.axes"
when = { not_states = ["hover"] }
pending = "U3"
rows = []

# Pending over the rule above: no listed path.
[[fact]]
key = "button.label.text.font.axes"
when = { states = ["hover"], variants = ["tool"] }
pending = "U4"
rows = []
