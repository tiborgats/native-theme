# Synthetic facts (S17, ADD-A144): the body's opacity pending everywhere, the hover fact U70 shadowed by
# U71 on the tool button and by U72 on the others: U70 applies nowhere and lists nothing.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.fill"
when = { variants = ["tool"] }
