quote = "synthetic"

# Reads the listed minimum width through max: skipped.
[[fact]]
key = "button.body.max_width"
value = "= max(part.min_width, 1px)"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

