# Synthetic facts (S17, ADD-A128): a part's field and a widget value pending with nothing beneath, each
# read by another through a function that maps many values to one.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.fill"
when = { variants = ["tool"] }
value = "#00000000"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Pending: the preset lists the path, and states it where the button is pressed.
[[fact]]
key = "button.body.min_width"
when = { not_states = ["pressed"] }
pending = "U8"
rows = []

[[fact]]
key = "button.body.min_width"
when = { states = ["pressed"] }
value = "44px"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.opacity"
value = 1
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.body.opacity"
when = { states = ["hover"] }
pending = "U1"
rows = []

[[fact]]
key = "button.icon"
