# The declarations whole but for `flat`, which has no spelling, `@raised` under `later` (S10 *Later names*).
[declare.widget.button]
variants = ["tool", "@raised"]
later = { variants = ["@raised"] }

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }
