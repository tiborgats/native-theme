# A synthetic state model (S17): `@raised`, a variant the styles unit holds, not enabled (its one fact names a
# toolbar too); `flat`, a typed variant the model does not hold, which has no spelling.
[[model]]
widget = "button"
available = true
variants = ["tool", "flat", "@raised"]
sizes = []
densities = []
axes = { states = ["hover", "pressed"], conditions = ["scheme:light", "scheme:dark"], contexts = [] }
exclusive = []
rows = []
