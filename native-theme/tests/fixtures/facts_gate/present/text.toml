# The twin (S6.3, ADD-A126): the flat button draws the subtitle again with a text other than its fact's, which
# the gate compares there.
[declare.widget.button]
variants = ["flat"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
target = "button.subtitle"
set = { absent = true }

[[rules]]
when = { variants = ["flat"] }
target = "button.subtitle"
set = { absent = false }

[[rules]]
when = { variants = ["flat"] }
target = "button.subtitle"
set = { text.max_lines = 3 }
