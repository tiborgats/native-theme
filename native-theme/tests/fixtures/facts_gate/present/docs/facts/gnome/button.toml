# Absent but on a tool button, drawn there over the absence (S6.3's `absent = false`, S17's `present`).
[[fact]]
key = "button.subtitle"
value = "absent"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

[[fact]]
key = "button.subtitle"
when = { variants = ["tool"] }
value = "present"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
quote = "synthetic"

# Its field's look wherever it is drawn.
