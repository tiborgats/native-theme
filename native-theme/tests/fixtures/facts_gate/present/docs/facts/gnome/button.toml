# Synthetic facts (S17, ADD-A126): the subtitle absent but on a tool button, where a later fact draws it again
# (`present`); its field's fact holds without a `when`.

[[fact]]
key = "button.body.fill"
value = "#e0e0e0"
rows = []

[[fact.cite]]
kind = "published"
source = "probe@1 probe.css:1"
