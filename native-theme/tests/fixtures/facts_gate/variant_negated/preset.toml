[declare.widget.button]
variants = ["flat", "@raised"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { variants = ["@raised"] }
target = "button.body"
set = { fill = "#ffffff" }
