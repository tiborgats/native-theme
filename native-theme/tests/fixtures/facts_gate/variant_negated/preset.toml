[declare.widget.button]
variants = ["tool", "@probe_lifted"]

[[rules]]
when = { states = ["pressed"] }
target = "button.body"
set = { min_width_px = 44 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }

[[rules]]
when = { variants = ["@probe_lifted"] }
target = "button.body"
set = { fill = "#ffffff" }
