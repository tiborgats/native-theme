[declare.widget.button]
variants = ["tool"]

# Wrong only inside a tool button, where the state model draws nothing.
[[rules]]
when = { context = [{ widget = "button" }] }
target = "button.body"
set = { min_width_px = 99 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }
