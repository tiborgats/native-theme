# A synthetic preset (S17): a button whose small size only its two styles take, as `sizes_by_variant`
# declares, a rule stating its small size's value with no style.
[declare.widget.button]
variants = ["tool", "primary"]
sizes = ["regular"]
default_size = "regular"
exclusive_variants = [["tool", "primary"]]
# The primary style drawn in no combination at depth (its size in force, small, not drawn), so under `later` (S10).
later = { variants = ["primary"] }
sizes_by_variant = [
  { variant = "tool", sizes = ["small", "regular"], default_size = "small" },
  { variant = "primary", sizes = ["small", "regular"], default_size = "small" },
]

[[rules]]
when = { sizes = ["small"] }
target = "button.body"
set = { min_width_px = 41 }

[[rules]]
when = { variants = ["tool"] }
target = "button.body"
set = { fill = "#00000000" }
