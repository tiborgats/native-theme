# A synthetic preset (S17): a button whose small size only its two styles take, as `sizes_by_variant`
# declares, a rule stating its small size's value with no style.
[declare.widget.button]
variants = ["flat", "primary"]
sizes = ["regular"]
default_size = "regular"
exclusive_variants = [["flat", "primary"]]
sizes_by_variant = [
  { variant = "flat", sizes = ["small", "regular"], default_size = "regular" },
  { variant = "primary", sizes = ["small", "regular"], default_size = "regular" },
]

[[rules]]
when = { sizes = ["small"] }
target = "button.body"
set = { min_width_px = 41 }

[[rules]]
when = { variants = ["flat"] }
target = "button.body"
set = { fill = "#00000000" }
