difference_presets = ["adwaita", "windows-11", "macos-monterey", "macos-tahoe", "material-3", "ios-13"]
difference_reason = "0.7.2 leaves it unset (the rest outline by inheritance, no rule); 0.8.0 states the outline for the state (spec §2, from_state): adwaita the rest outline for HOVER and PRESSED, where libadwaita keeps it; windows-11 the rest outline for HOVER, where WinUI keeps it, and for PRESSED WinUI's flat ControlStrokeColorDefault; macos-monterey the rest outline for HOVER, where hover draws nothing, and the rest outline pressed, which no rule changes; macos-tahoe no stroke for HOVER and PRESSED, as at rest; material-3 no stroke for HOVER and PRESSED, the filled tonal button having no outline (0.7.2: the default outline colour at width 0); ios-13 WebKit's rest border, 1px of systemBackground, for HOVER and PRESSED, which no :hover or :active rule and no adjustButtonLikeControlStyle change"
