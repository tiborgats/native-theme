difference_reason = "0.7.2 leaves it unset (no rule); 0.8.0 states the header's look under the pointer: on kde-breeze no fill (transparent), on windows-11 the header's rest fill CardBackgroundFillColorDefault, which 0.8.0 states at rest too; on material-3, where 0.7.2 states #1c1b1f14 / #e6e1e514 (uncited, not v0_192's on-surface), on-surface at the hover opacity 0.08, a full-width row's hover layer, Material 3 having no expander; macos-monterey: 0.7.2's uncited #e0e0e5 / #444446; macos-tahoe: 0.7.2 leaves it unset; 0.8.0 states no fill (transparent) at rest and for HOVER and PRESSED, as SwiftUI's DisclosureGroup draws none behind its title"
difference_citation = "kde-breeze: docs/platform-facts.md §2.27 (hover_background), KCollapsibleGroupBox paints the arrow and the title only (kcollapsiblegroupbox.cpp:153-182 at kwidgetsaddons v6.30.0); windows-11: ExpanderHeaderBackground = CardBackgroundFillColorDefault, which no PointerOver or Pressed state sets (Expander.xaml:111; Expander_themeresources.xaml:29, :5, :122-165 at microsoft-ui-xaml 8463f45); material-3: docs/platform-facts.md §2.27 (no expander); list-item-hover-state-layer-color on-surface at hover-state-layer-opacity 0.08 (_md-comp-list.scss:85-88, v0_192 at material-web cbd34a8); os-probe run 45214606115 (macOS 15, macOS 26; docs/evidence/os-probe/2026-11-23-run-45214606115/ on m2-fs4d), `switch-label-macos-{15,26}/measure.toml` `*.normal.disclosure` `label_ink`, `*.hovered_disclosure_*` and `*.pressed_disclosure_*` `label_changed_from_rest_px` 0"
difference_values = { "kde-breeze" = "#00000000", "windows-11" = { light = "#ffffffb3", dark = "#ffffff0d" }, "material-3" = { light = "#1d1b2014", dark = "#e6e0e914" }, "macos-monterey" = "#00000000", "macos-tahoe" = "#00000000" }

