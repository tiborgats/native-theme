# The table of homes of the 0.8.0 work (docs/v0.8.0-plan.md, section 1, rule 2): for each field of 0.7.2's
# resolved theme, where its value lives in the 0.8.0 model. src/next/parity.rs checks the rows against 0.7.2's serialisation and the
# spec's vocabulary; the same rows place a preset's constants and port a consumer's reads. Scaffolding of the
# 0.8.0 work: deleted at the 0.8.0 cut.
#
# One row per 0.7.2 field, every row of the same form, an array of tables `[[row]]` with these keys:
#
#   key                  required. The old field as `serde_json` serialises 0.7.2's `ResolvedTheme`: the dotted
#                        path of its leaf (`button.font.size`); an enum value such as a font's `defined_size` is
#                        one leaf. A row with `hand = true` names a field that does not serialise: the `Resolved`
#                        wrapper's (`Resolved.mode`) and 0.7.2's `Theme.layout` and `SystemTheme.accessibility`.
#   homes                required, one or more. Where the value lives in the 0.8.0 model; each home is compared.
#   homes_by_preset      optional. `{ "<preset>" = [homes] }`: the homes for that preset in place of `homes`, where
#                        the field means something else there.
#   if_null              optional. An old key: where `key` is null, the homes hold that key's value (0.7.2's
#                        fallback, e.g. `radio_indicator_width` unset means `indicator_width`). Where that key is
#                        null too, its own row's `if_null` is followed; where the chain ends in a null key, the
#                        row is compared as a null key.
#   only_if_null         optional. An old key: the row is compared only where that key is null.
#   home_fallback        optional, with one home. Where the `Option` slot of that home is `None` (a `Typography`
#                        slot the platform does not define), this home is compared instead.
#   null_reference       optional. States joined by `|` (`CHECKED`): where `key` is null, a home whose state holds
#                        these states and more is compared with the same property at these states, not at `NONE`
#                        (a `HOVER|CHECKED` home whose reference is `CHECKED`); see the paragraph below the homes.
#   context              optional. `{ window_active = false }`: the homes of the row are read from the theme resolved
#                        with these `ThemeContext` values in place of the defaults (spec §3, `window_active`); `key`
#                        is read from 0.7.2's one resolved theme.
#   unstated_if_unset    optional, default false. 0.7.2's resolver gives this field a value of its own where the
#                        theme states none (`validate_border`: transparent, 0, `false`; a hover fill taken from the
#                        container). Where the unresolved 0.7.2 theme that was resolved (the preset's scheme; in
#                        reader parity the preset merged with the reader's output) leaves the field `None`, the row
#                        is compared as if `key` were null; where it states a value, as any other row. The field's
#                        path there is the key's, a border's leaf by its serde name (`corner_radius_px`,
#                        `line_width_px`), another leaf by its name or by its serde name with a unit suffix
#                        (`thumb_diameter_px`, `show_delay_ms`).
#   null_means           optional. `"none"`: where `key` is null, the theme states that the home has no outline: the
#                        home's `stroke` is `Stroke::None` with the `STROKE` bit set (0.7.2: "`None` draws no
#                        outline"), whatever the reference state holds.
#   hand                optional, default false. The row is written by hand: its key is not in the serialisation.
#   difference_presets   optional, with the three keys below. The presets on which the row is a listed difference
#   difference_reason      (plan, rule 2): what differs and why,
#   difference_citation    and the source of the corrected value,
#   difference_values      and `{ "<preset>" = <value> }` for each of those presets: the value 0.8.0 has at every
#                          home of the row on that preset, which the test compares in place of the old value. The
#                          string "unstated" is a part property's `stated` bit clear or an `Option` slot's `None`
#                          (a `min_size[1]` of `None`); any other value is the home's value in the old field's
#                          serialised form (a number, a bool, a colour as its hex string). Where the two schemes
#                          differ, the value is `{ light = <value>, dark = <value> }`, each scheme's.
#   note                 optional. How a value converts where the home's type is not the old field's.
#
# A home is one of:
#
#   <global>                         a field of the resolved theme outside the widgets, by its path in spec §§4-5:
#                                    `colors.view.background`, `typography.body.size_px`, `icons.sizes.toolbar`,
#                                    `layout.border_width`, `timings.tooltip_show_ms`, `focus_ring.stroke.color`,
#                                    `context.scheme` (the resolved theme's context: the level actually used).
#   snapshot.context.<field>         a field of the reader's context, `SystemSnapshot::context` (spec §8), which
#                                    holds what the system states and can differ from the resolved theme's
#                                    `context` (spec §3): `snapshot.context.motion`.
#   <widget>.<metric>                a direct metric of a widget (spec §5's table): `button.icon_text_gap`.
#   <widget>.<part>.<property>       a part of a static widget: `tooltip.panel.fill`.
#   <widget>.<part>(<query>).<property>
#                                    a part of a ruled widget as its query returns it. <query> is the state, `NONE`
#                                    for the rest state or `WidgetState` bits joined by `|` (`HOVER|CHECKED`),
#                                    then optionally `; ` and axis values joined by `, `: `variant=Primary`,
#                                    `shape=Pill`, `alternate=true`, `orientation=Vertical`, `size=Small`,
#                                    `surface=View`, `position=First`.
#   window.<getter>(normal).<property>
#                                    `WindowChrome`'s `frame`, `title_bar` or `title` (spec §4) at
#                                    `WindowState::default()`: `window.title_bar(normal).fill`.
#
# A part's property is a field of `PartStyle` (`fill`, `stroke.color`, `stroke.width`, `corners`, `shadows`,
# `opacity`, `padding.top` .. `padding.left`, `margin.top` .. `margin.left`, `min_size[0]` (width), `min_size[1]`
# (height), `max_size[0]`, `max_size[1]`, `focus`, `ripple`, `transition`, `cursor`, `transform`), of `TextStyle`
# (`family`, `color`, `size_px`, `defined_size`, `weight`, `style`, `width`, `line_height`, `letter_spacing`,
# `optical_size`, `decoration`, `blend_mode`) or of `IconStyle` (`size`, `color`, `opacity`, `weight`,
# `rendering_mode`, `stroke_width`, `blend_mode`), by the part's kind. `stroke.color` and `stroke.width` are the two
# fields of the home's `Stroke::Uniform`; both share the one `STROKE` bit. `<widget>.<part>` may be
# `text_area.<part>`: `input.*` serves `input` and `text_area` as `checkbox.*` serves `checkbox` and `radio`. A 0.7.2
# `None` at a part's property is the
# property's `stated` bit clear; for a state, no rule, so the query returns what it returns without that state
# (spec §5, notes to the table): the test compares the property at the home's state, value and `stated` bit,
# with the same property at the reference state, `NONE` unless `null_reference` names another. A value the
# unresolved 0.7.2 theme states (its preset, or in reader parity the preset merged with the reader's output) at a
# part's property under a state other than `NONE` and the row's `null_reference` is a rule for that state, even
# where it equals the rest value: the property's `from_state` bit is set there (spec §2); a value only 0.7.2's
# resolver fills in is compared by its value alone. `checkbox.*` serves `checkbox` and `radio`: such a row names a home on each.

