name: OS probe

# Runs tools/os-probe (native-theme-os-probe, never published) on each macOS
# and Windows runner image and uploads what the OS reported: probe.toml and,
# on macOS, the control renders; and the GNOME jobs, in the GNOME container
# (tools/linux-containers/gnome): its build, the harness (tools/gnome-host) and
# the vector generator (tools/gnome-vectors); and the KDE jobs, in the KDE
# container (tools/linux-containers/kde): its build, the accent run
# (scripts/measure_kde_accent.sh) and the render host (tools/kde-host); the
# Android host (tools/android-host) on the emulator; the WinUI host
# (tools/winui-host) on the Windows images; and the iOS host (tools/ios-host) in
# each macOS image's iOS simulator.
# Evidence for the platform-fidelity review
# (docs/archive/todo_v0.7.0_code-review-plan.md, M2 Step 3), and the measurement
# jobs of the 0.8.0 plan (docs/todo_v0.7.1_model-completeness-plan.md, D2 and D3).
# Dispatched by hand only; `workflow_dispatch` needs this file on `main`, and
# `gh workflow run os-probe.yml --ref <branch>` runs the branch's version:
#
#     gh workflow run os-probe.yml --ref v0.8.0-tools -f jobs=probe -f images='["macos-26"]'
#
# `-f passes=symbols` runs the probe job's symbols pass alone (the input lists
# the pass names).

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "The jobs to run, comma-separated without spaces (probe, gnome-container, gnome-harness, gnome-vectors, kde-container, kde-accent, kde-render, android-host, winui-host, ios-host); empty runs every job"
        required: false
        default: ""
      passes:
        description: "The probe job's passes, comma-separated without spaces (probe, button, symbols, sdk-headers, button-focus, focus-transition, button-contrast, button-accent, button-not-key, button-inactive, button-key-not-main, button-main-not-key, button-inactive-contrast, probe-rt-off, probe-contrast, probe-tinting-off, probe-rt-tinting-off, probe-accent, probe-contrast-accent, button-focus-accent, reads, reads-accent, reads-rtl, probe-not-key, app-bundle); empty runs every pass. The image's settings and wallpaper are recorded always"
        required: false
        default: ""
      images:
        description: "The probe, winui-host and ios-host jobs' runner images, a JSON list (winui-host does nothing on macOS, ios-host nothing on Windows); the default is the 0.8.0 release set's"
        required: false
        default: '["macos-15", "macos-26", "windows-11-arm"]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: OS probe (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',probe,')
    runs-on: ${{ matrix.os }}
    # xcode-27 is the macOS 27 preview image: its failure does not fail the run.
    continue-on-error: ${{ matrix.os == 'xcode-27' }}
    strategy:
      fail-fast: false
      # The default set is the 0.8.0 release set's (D3): macos-14, xcode-27
      # (macOS 27, outside the release set, D12), windows-2022 and windows-2025
      # (Windows Server) left it; each can still be named in `images`.
      matrix:
        os: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: os-probe
      # The probe's window section captures its window with `screencapture -l`,
      # which needs kTCCServiceScreenCapture on macOS 14+, and the extra passes
      # below write com.apple.universalaccess, which needs Full Disk Access
      # (kTCCServiceSystemPolicyAllFiles), and the button pass posts mouse
      # events, which needs Accessibility and PostEvent access: all granted to
      # the shells that run the steps, as screenshots.yml grants the first.
      # Each insert reports its own failure and the step fails nothing, so a
      # TCC schema an image does not share leaves the probe to record what it
      # then cannot do.
      - name: Grant screen recording and Full Disk Access (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          for service in kTCCServiceScreenCapture kTCCServiceSystemPolicyAllFiles \
                         kTCCServiceAccessibility kTCCServicePostEvent; do
            for client in /bin/bash /bin/zsh; do
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
                 VALUES ('$service', '$client', 1, 2, 4, 1);" \
                || echo "::warning::granting $service to $client failed"
            done
          done
      - name: Run the probe
        if: (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe,'))
        run: cargo run -p native-theme-os-probe --release -- --out os-probe-out
      # The button pass (spike M of the 0.8.0 plan, extended for the macOS
      # facts lane), with the image's own settings, into button-pass/: the
      # buttons of every bezel style, border shape and tint, in a key window,
      # per state, control size and appearance, each state also over black,
      # white and grey backdrops (the buttons' own layer solved from them),
      # with a toolbar, a text view's caret and the buttons' geometry and
      # fonts; probe.toml's [macos.button_pass] method keys describe it. It
      # moves the cursor and clicks
      # with posted CGEvents, so Accessibility and PostEvent access are also
      # granted to the built probe's path. environment.txt records the OS, the
      # selected Xcode and its SDK, the SDK the probe was built against
      # (vtool), the Rust toolchain and the display adapter.
      - name: Run the button pass (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass
          probe="$PWD/target/release/native-theme-os-probe"
          mkdir -p "$out"
          {
            sw_vers; echo "sw_vers: exit $?"
            xcode-select -p; echo "xcode-select -p: exit $?"
            xcodebuild -version; echo "xcodebuild -version: exit $?"
            echo "xcrun SDK: $(xcrun --show-sdk-version) build $(xcrun --show-sdk-build-version)"
            vtool -show-build "$probe"; echo "vtool -show-build: exit $?"
            rustc -V
            system_profiler SPDisplaysDataType; echo "system_profiler SPDisplaysDataType: exit $?"
            for service in kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
                 VALUES ('$service', '$probe', 1, 2, 4, 1);"
              echo "grant $service to $probe: exit $?"
            done
          } > "$out/environment.txt" 2>&1
          cat "$out/environment.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass
      # The symbols pass (pass MP-symbols of the 0.8.0 measurement plan; U102,
      # U324, U613): the SF Symbol configuration and image size AppKit gives
      # each place (image view, buttons and segmented controls per control
      # size and state, sidebar and list tables per row size style, toolbars,
      # a status item, an alert's icon), read where AppKit has a getter and
      # matched against a reference grid of rendered configurations
      # elsewhere, into symbols/; probe.toml's [macos.symbols] method says how.
      - name: Run the symbols pass (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',symbols,'))
        continue-on-error: true
        run: cargo run -p native-theme-os-probe --release -- --out os-probe-out/symbols --symbols
      # The SDK headers the Apple facts quote, from the selected Xcode
      # (xcode-select -p), each framework's whole Headers/ folder (so no
      # header a fact needs is left behind) into sdk-headers/<framework>/:
      # AppKit, AVKit (AVRoutePickerView.h, the route button) and QuartzCore
      # (Core Animation's timing) from the macOS SDK, UIKit from the
      # iPhoneSimulator SDK (the SDK the iOS facts cite and tools/ios-host
      # builds against). For the lanes to read and quote exactly, and for the
      # source cache (they are not committed); xcode.txt records the OS, the
      # Xcode and each SDK's version and build, each copy's exit status and
      # size, whether each header the facts and the ledger name is there, and
      # every copied file's SHA-256 (paths relative to sdk-headers/, so
      # `shasum -a 256 -c` checks them).
      - name: Copy the SDK headers (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',sdk-headers,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/sdk-headers
          mkdir -p "$out"
          developer="$(xcode-select -p)"
          macosx="$developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          simulator="$developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
          {
            sw_vers; echo "sw_vers: exit $?"
            echo "xcode-select -p: $developer"
            xcodebuild -version; echo "xcodebuild -version: exit $?"
            echo "xcrun SDK: $(xcrun --sdk macosx --show-sdk-version) build $(xcrun --sdk macosx --show-sdk-build-version) at $(xcrun --sdk macosx --show-sdk-path)"
            echo "xcrun iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version) build $(xcrun --sdk iphonesimulator --show-sdk-build-version) at $(xcrun --sdk iphonesimulator --show-sdk-path)"
            ls -l "$developer/Platforms/MacOSX.platform/Developer/SDKs/" "$developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/"
            for copy in "AppKit $macosx" "AVKit $macosx" "QuartzCore $macosx" "UIKit $simulator"; do
              framework="${copy%% *}"
              headers="${copy#* }/System/Library/Frameworks/$framework.framework/Headers"
              echo "$framework headers: $headers"
              mkdir -p "$out/$framework"
              cp -RL "$headers/." "$out/$framework"
              echo "copy $framework: exit $?"
              echo "$framework: $(find "$out/$framework" -type f | wc -l | tr -d ' ') files, $(du -sk "$out/$framework" | cut -f1) KB"
            done
            for h in AppKit/NSApplication.h AppKit/NSAnimationContext.h AppKit/NSAttributedString.h \
                     AppKit/NSButton.h AppKit/NSButtonCell.h AppKit/NSCell.h AppKit/NSColor.h \
                     AppKit/NSComboButton.h AppKit/NSControl.h AppKit/NSCursor.h AppKit/NSEvent.h \
                     AppKit/NSFont.h AppKit/NSFontDescriptor.h AppKit/NSImage.h AppKit/NSLayoutManager.h \
                     AppKit/NSMenuItem.h AppKit/NSPopUpButtonCell.h AppKit/NSPressGestureRecognizer.h \
                     AppKit/NSScrollView.h AppKit/NSShadow.h AppKit/NSTableCellView.h \
                     AppKit/NSTableRowView.h AppKit/NSTableView.h AppKit/NSText.h AppKit/NSTextField.h \
                     AppKit/NSTextInsertionIndicator.h AppKit/NSTextView.h AppKit/NSToolbar.h \
                     AppKit/NSToolbarItem.h AppKit/NSTouch.h AppKit/NSView.h AppKit/NSWindow.h \
                     AVKit/AVRoutePickerView.h QuartzCore/CAAnimation.h QuartzCore/CAMediaTiming.h \
                     UIKit/UIBarButtonItem.h UIKit/UIButton.h UIKit/UIButtonConfiguration.h \
                     UIKit/UIColor.h UIKit/UIFont.h UIKit/UIFontDescriptor.h; do
              if [ -f "$out/$h" ]; then echo "named $h: present"; else echo "named $h: MISSING"; fi
            done
            echo "SHA-256 of every copied file:"
            (cd "$out" && find AppKit AVKit QuartzCore UIKit -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256)
            echo "shasum: exit $?"
          } > "$RUNNER_TEMP/xcode.txt" 2>&1
          mv "$RUNNER_TEMP/xcode.txt" "$out/xcode.txt"
          grep -v -E '^[0-9a-f]{64}  ' "$out/xcode.txt"
          echo "$(grep -c -E '^[0-9a-f]{64}  ' "$out/xcode.txt") SHA-256 lines in xcode.txt"
      # The image's own accessibility settings, wallpaper tinting and accent,
      # read before any pass changes them: a value, `absent` where the image sets none (macOS 14-26 say the
      # pair "does not exist", xcode-27 "Could not find key"), or what the read
      # said where it failed otherwise (and a pass then restores nothing).
      - name: Record the image's accessibility settings (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/universalaccess"
          for setting in "com.apple.universalaccess reduceTransparency" \
                         "com.apple.universalaccess increaseContrast" \
                         "com.apple.universalaccess reduceMotion" \
                         "-g AppleReduceDesktopTinting" \
                         "-g AppleAccentColor" \
                         "-g AppleKeyboardUIMode"; do
            set -- $setting
            value="$(defaults read "$1" "$2" 2>&1)"
            if [ $? -ne 0 ]; then
              case "$value" in
                *"does not exist"*|*"Could not find key"*) value=absent ;;
                *) value="unreadable: $value" ;;
              esac
            fi
            echo "$value" > "$RUNNER_TEMP/universalaccess/$2"
            echo "$1 $2: $value"
          done
      # The desktop picture, which the materials and, with wallpaper tinting on,
      # the window backgrounds show through: as System Events names it (which
      # may need an Automation grant the image lacks, so it is given 20 s) and
      # as the wallpaper store records it, for the README to name.
      - name: Record the wallpaper (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/environment
          mkdir -p "$out"
          {
            osascript -e 'tell application "System Events" to get picture of current desktop' &
            pid=$!
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "osascript: killed after 20 s"; else wait "$pid"; echo "osascript: exit $?"; fi
            store="$HOME/Library/Application Support/com.apple.wallpaper/Store/Index.plist"
            if [ -f "$store" ]; then plutil -p "$store"; echo "plutil: exit $?"; else echo "no $store"; fi
          } > "$out/wallpaper.txt" 2>&1
          cat "$out/wallpaper.txt"
      # The button pass in its conditions, each into its own folder, whatever
      # fails, with the image's settings but the one each sets, which it
      # restores after: with keyboard navigation on (AppleKeyboardUIMode 2,
      # System Settings' "Keyboard navigation", which buttons need to become
      # first responder) each button focused in turn (--focus); with Increase
      # Contrast on; with the accent set to red (AppleAccentColor 0, the
      # highlight colour left); and, with no setting changed, with a second
      # window of the probe key (--not-key) and with another application
      # active (--inactive). Each folder's settings.txt records the image's
      # value, the write's exit status, the value read back and the restore.
      - name: Run the button pass focusing each button (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-focus,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-focus
          mkdir -p "$out"
          image="$(cat "$RUNNER_TEMP/universalaccess/AppleKeyboardUIMode" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's AppleKeyboardUIMode: $image"
            defaults write -g AppleKeyboardUIMode -int 2
            echo "write AppleKeyboardUIMode 2: exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --focus
          {
            case "$image" in
              absent) defaults delete -g AppleKeyboardUIMode ;;
              -[0-9]*|[0-9]*) defaults write -g AppleKeyboardUIMode -int "$image" ;;
              *) false ;;
            esac
            echo "restore AppleKeyboardUIMode to the image's ($image): exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      # The focus ring's transition (--focus-transition): with keyboard
      # navigation on, the push sheet's regular plain and default buttons
      # focused and unfocused per appearance while `screencapture -v` records
      # the screen, once with the image's Reduce Motion (on) and once with it
      # off, each into its own folder, and after the buttons a text view's
      # caret the same way (transition-caret, U316); then each recording cut by ffmpeg
      # (installed with brew where the image has none) to the button's
      # <stem>.crop, frame by frame, into <stem>-frames/ with the frames'
      # times in <stem>-frames.csv (ffprobe). settings.txt records each
      # write, read-back and restore, ffmpeg.txt the tool and each cut.
      - name: Record the focus ring's transition (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',focus-transition,'))
        continue-on-error: true
        run: |
          set +e
          restore() {
            image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
            case "$image" in
              1) defaults write "$1" "$2" -bool true ;;
              0) defaults write "$1" "$2" -bool false ;;
              absent) defaults delete "$1" "$2" ;;
              -[0-9]*|[0-9]*) defaults write "$1" "$2" -int "$image" ;;
              *) false ;;
            esac
            echo "restore $2 to the image's ($image): exit $?"
            echo "read back: $(defaults read "$1" "$2" 2>&1)"
          }
          for motion in image off; do
            if [ "$motion" = image ]; then
              out=os-probe-out/button-pass-focus-transition
            else
              out=os-probe-out/button-pass-focus-transition-reduce-motion-off
            fi
            mkdir -p "$out"
            {
              echo "image's AppleKeyboardUIMode: $(cat "$RUNNER_TEMP/universalaccess/AppleKeyboardUIMode" 2>/dev/null || echo 'not recorded')"
              defaults write -g AppleKeyboardUIMode -int 2
              echo "write AppleKeyboardUIMode 2: exit $?"
              echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
              echo "image's reduceMotion: $(cat "$RUNNER_TEMP/universalaccess/reduceMotion" 2>/dev/null || echo 'not recorded')"
              if [ "$motion" = off ]; then
                defaults write com.apple.universalaccess reduceMotion -bool false
                echo "write reduceMotion false: exit $?"
              fi
              echo "read back: $(defaults read com.apple.universalaccess reduceMotion 2>&1)"
            } > "$out/settings.txt" 2>&1
            cat "$out/settings.txt"
            cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --focus-transition
            {
              restore -g AppleKeyboardUIMode
              restore com.apple.universalaccess reduceMotion
            } >> "$out/settings.txt" 2>&1
            tail -n 4 "$out/settings.txt"
          done
          log=os-probe-out/button-pass-focus-transition/ffmpeg.txt
          {
            if ! command -v ffmpeg >/dev/null; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_COLOR=1 HOMEBREW_NO_EMOJI=1 brew install ffmpeg
              echo "brew install ffmpeg: exit $?"
            fi
            ffmpeg -hide_banner -version | head -n 1
            for mov in os-probe-out/button-pass-focus-transition*/*/transition-*.mov; do
              stem="${mov%.mov}"
              if [ ! -f "$stem.crop" ]; then echo "$mov: no $stem.crop"; continue; fi
              mkdir -p "$stem-frames"
              ffmpeg -hide_banner -nostdin -loglevel error -i "$mov" -vf "crop=$(cat "$stem.crop")" \
                -fps_mode passthrough "$stem-frames/%05d.png"
              echo "ffmpeg $mov crop=$(cat "$stem.crop"): exit $?, $(ls "$stem-frames" | wc -l) frames"
              ffprobe -v error -select_streams v:0 -show_entries frame=pts_time -of csv=p=0 "$mov" > "$stem-frames.csv"
              echo "ffprobe $mov: exit $?"
            done
          } > "$log" 2>&1
          cat "$log"
      - name: Run the button pass with Increase Contrast on (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-contrast,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-increase-contrast-on
          mkdir -p "$out"
          image="$(cat "$RUNNER_TEMP/universalaccess/increaseContrast" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's increaseContrast: $image"
            defaults write com.apple.universalaccess increaseContrast -bool true
            echo "write increaseContrast true: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass
          {
            case "$image" in
              1) defaults write com.apple.universalaccess increaseContrast -bool true ;;
              0) defaults write com.apple.universalaccess increaseContrast -bool false ;;
              absent) defaults delete com.apple.universalaccess increaseContrast ;;
              *) false ;;
            esac
            echo "restore increaseContrast to the image's ($image): exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      - name: Run the button pass with a red accent (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-accent,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-accent-red
          mkdir -p "$out"
          image="$(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's AppleAccentColor: $image"
            defaults write -g AppleAccentColor -int 0
            echo "write AppleAccentColor 0: exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass
          {
            case "$image" in
              absent) defaults delete -g AppleAccentColor ;;
              -[0-9]*|[0-9]*) defaults write -g AppleAccentColor -int "$image" ;;
              *) false ;;
            esac
            echo "restore AppleAccentColor to the image's ($image): exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      - name: Run the button pass with a second window key (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-not-key,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-not-key
          mkdir -p "$out"
          echo "no setting changed: the image's" > "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --not-key
      - name: Run the button pass with another application active (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-inactive,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-inactive
          mkdir -p "$out"
          echo "no setting changed: the image's" > "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --inactive
      # The window states of U93 and U133 (MP-windows of the 0.8.0
      # measurement plan): each sheet a panel, key while another window of
      # the probe is main (--key-not-main), and each sheet's window main
      # while a panel of the probe is key (--main-not-key), with the image's
      # settings; and the inactive pass with Increase Contrast on, restored
      # after.
      - name: Run the button pass key but not main (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-key-not-main,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-key-not-main
          mkdir -p "$out"
          echo "no setting changed: the image's" > "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --key-not-main
      - name: Run the button pass main but not key (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-main-not-key,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-main-not-key
          mkdir -p "$out"
          echo "no setting changed: the image's" > "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --main-not-key
      - name: Run the button pass with another application active and Increase Contrast on (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-inactive-contrast,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-inactive-increase-contrast-on
          mkdir -p "$out"
          contrast="$(cat "$RUNNER_TEMP/universalaccess/increaseContrast" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's increaseContrast: $contrast"
            defaults write com.apple.universalaccess increaseContrast -bool true
            echo "write increaseContrast true: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --inactive
          {
            case "$contrast" in
              1) defaults write com.apple.universalaccess increaseContrast -bool true ;;
              0) defaults write com.apple.universalaccess increaseContrast -bool false ;;
              absent) defaults delete com.apple.universalaccess increaseContrast ;;
              *) false ;;
            esac
            echo "restore increaseContrast to the image's ($contrast): exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      # Two more passes, each into its own folder, whatever fails: with Reduce
      # Transparency off, which the runner images turn on (probe.toml's
      # accessibilityDisplayShouldReduceTransparency), so the window section
      # also renders the materials translucent; and with Increase Contrast on,
      # which they leave off, to see whether the colours the probe reads under
      # the named Aqua and DarkAqua appearances follow it. Each folder's
      # settings.txt records the image's value, the write's exit status and
      # the value read back, and its probe.toml whether the setting took.
      - name: Run the probe with Reduce Transparency off (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-rt-off,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/reduce-transparency-off
          mkdir -p "$out"
          {
            echo "image's reduceTransparency: $(cat "$RUNNER_TEMP/universalaccess/reduceTransparency" 2>/dev/null || echo 'not recorded')"
            defaults write com.apple.universalaccess reduceTransparency -bool false
            echo "write reduceTransparency false: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
      - name: Run the probe with Increase Contrast on (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-contrast,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/increase-contrast-on
          mkdir -p "$out"
          {
            image="$(cat "$RUNNER_TEMP/universalaccess/reduceTransparency" 2>/dev/null || echo 'not recorded')"
            case "$image" in
              1) defaults write com.apple.universalaccess reduceTransparency -bool true ;;
              0) defaults write com.apple.universalaccess reduceTransparency -bool false ;;
              absent) defaults delete com.apple.universalaccess reduceTransparency ;;
              *) false ;;
            esac
            echo "restore reduceTransparency to the image's ($image): exit $?"
            echo "read back: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)"
            echo "image's increaseContrast: $(cat "$RUNNER_TEMP/universalaccess/increaseContrast" 2>/dev/null || echo 'not recorded')"
            defaults write com.apple.universalaccess increaseContrast -bool true
            echo "write increaseContrast true: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
      # A pass with wallpaper tinting off ("Allow wallpaper tinting in windows",
      # the global default AppleReduceDesktopTinting), to tell the window
      # colours that follow the desktop picture from those that do not; the
      # accessibility settings are the image's. settings.txt records each
      # restore, the image's tinting value, the write's exit status and the
      # value read back.
      - name: Run the probe with wallpaper tinting off (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-tinting-off,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/tinting-off
          mkdir -p "$out"
          {
            restore() {
              image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
              case "$image" in
                1) defaults write "$1" "$2" -bool true ;;
                0) defaults write "$1" "$2" -bool false ;;
                absent) defaults delete "$1" "$2" ;;
                *) false ;;
              esac
              echo "restore $2 to the image's ($image): exit $?"
              echo "read back: $(defaults read "$1" "$2" 2>&1)"
            }
            restore com.apple.universalaccess reduceTransparency
            restore com.apple.universalaccess increaseContrast
            echo "image's AppleReduceDesktopTinting: $(cat "$RUNNER_TEMP/universalaccess/AppleReduceDesktopTinting" 2>/dev/null || echo 'not recorded')"
            defaults write -g AppleReduceDesktopTinting -bool true
            echo "write AppleReduceDesktopTinting true: exit $?"
            echo "read back: $(defaults read -g AppleReduceDesktopTinting 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
      # A pass with Reduce Transparency off and wallpaper tinting off, Increase
      # Contrast the image's: the pair of reduce-transparency-off, which keeps
      # the image's tinting, so the colours that differ between the two are
      # those wallpaper tinting changes (under the image's Reduce Transparency,
      # on, tinting changes nothing). After the probe the image's tinting and
      # Reduce Transparency are restored, so the passes below keep the image's
      # settings; settings.txt records each restore, write and read-back.
      - name: Run the probe with Reduce Transparency and wallpaper tinting off (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-rt-tinting-off,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/reduce-transparency-off-tinting-off
          mkdir -p "$out"
          restore() {
            image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
            case "$image" in
              1) defaults write "$1" "$2" -bool true ;;
              0) defaults write "$1" "$2" -bool false ;;
              absent) defaults delete "$1" "$2" ;;
              *) false ;;
            esac
            echo "restore $2 to the image's ($image): exit $?"
            echo "read back: $(defaults read "$1" "$2" 2>&1)"
          }
          {
            restore com.apple.universalaccess increaseContrast
            echo "image's reduceTransparency: $(cat "$RUNNER_TEMP/universalaccess/reduceTransparency" 2>/dev/null || echo 'not recorded')"
            defaults write com.apple.universalaccess reduceTransparency -bool false
            echo "write reduceTransparency false: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)"
            echo "image's AppleReduceDesktopTinting: $(cat "$RUNNER_TEMP/universalaccess/AppleReduceDesktopTinting" 2>/dev/null || echo 'not recorded')"
            defaults write -g AppleReduceDesktopTinting -bool true
            echo "write AppleReduceDesktopTinting true: exit $?"
            echo "read back: $(defaults read -g AppleReduceDesktopTinting 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
          {
            restore -g AppleReduceDesktopTinting
            restore com.apple.universalaccess reduceTransparency
          } >> "$out/settings.txt" 2>&1
          tail -n 4 "$out/settings.txt"
      # A pass with the accent set to red (`AppleAccentColor` 0; the image's
      # is recorded above, `absent` being the default blue), the other settings
      # the image's, to see which colours follow the user's accent: the
      # selected segment, the caret (`textInsertionPointColor`), the selection
      # and the disabled controls. Only the accent is set, not the highlight
      # colour (`AppleHighlightColor`), which System Settings pairs with it.
      # After the probe the image's accent is restored, so the passes below
      # keep it; settings.txt records each write, restore and read-back.
      - name: Run the probe with a red accent (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-accent,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/accent-red
          mkdir -p "$out"
          {
            restore() {
              image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
              case "$image" in
                1) defaults write "$1" "$2" -bool true ;;
                0) defaults write "$1" "$2" -bool false ;;
                absent) defaults delete "$1" "$2" ;;
                *) false ;;
              esac
              echo "restore $2 to the image's ($image): exit $?"
              echo "read back: $(defaults read "$1" "$2" 2>&1)"
            }
            restore com.apple.universalaccess reduceTransparency
            restore com.apple.universalaccess increaseContrast
            restore -g AppleReduceDesktopTinting
            echo "image's AppleAccentColor: $(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
            defaults write -g AppleAccentColor -int 0
            echo "write AppleAccentColor 0: exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
          {
            image="$(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
            case "$image" in
              absent) defaults delete -g AppleAccentColor ;;
              -[0-9]*|[0-9]*) defaults write -g AppleAccentColor -int "$image" ;;
              *) false ;;
            esac
            echo "restore AppleAccentColor to the image's ($image): exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      # Increase Contrast on under the red accent (U235 of the 0.8.0
      # measurement plan, MP-accent): the selected row's colours over a
      # second selection colour, as the main pass's red accent gives the
      # image's settings. settings.txt records each write and read-back.
      - name: Run the probe with Increase Contrast on and a red accent (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-contrast-accent,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/increase-contrast-on-accent-red
          mkdir -p "$out"
          accent="$(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
          contrast="$(cat "$RUNNER_TEMP/universalaccess/increaseContrast" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's increaseContrast: $contrast"
            defaults write com.apple.universalaccess increaseContrast -bool true
            echo "write increaseContrast true: exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
            echo "image's AppleAccentColor: $accent"
            defaults write -g AppleAccentColor -int 0
            echo "write AppleAccentColor 0: exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out"
          {
            case "$accent" in
              absent) defaults delete -g AppleAccentColor ;;
              -[0-9]*|[0-9]*) defaults write -g AppleAccentColor -int "$accent" ;;
              *) false ;;
            esac
            echo "restore AppleAccentColor to the image's ($accent): exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } >> "$out/settings.txt" 2>&1
          {
            case "$contrast" in
              1) defaults write com.apple.universalaccess increaseContrast -bool true ;;
              0) defaults write com.apple.universalaccess increaseContrast -bool false ;;
              absent) defaults delete com.apple.universalaccess increaseContrast ;;
              *) false ;;
            esac
            echo "restore increaseContrast to the image's ($contrast): exit $?"
            echo "read back: $(defaults read com.apple.universalaccess increaseContrast 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 4 "$out/settings.txt"
      # The focus pass under the red accent (U104, MP-accent): whether the
      # buttons' focus ring follows the accent. Keyboard navigation on, as in
      # the focus pass; both restored after.
      - name: Run the button pass focusing each button with a red accent (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',button-focus-accent,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/button-pass-focus-accent-red
          mkdir -p "$out"
          accent="$(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
          keyboard="$(cat "$RUNNER_TEMP/universalaccess/AppleKeyboardUIMode" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's AppleKeyboardUIMode: $keyboard"
            defaults write -g AppleKeyboardUIMode -int 2
            echo "write AppleKeyboardUIMode 2: exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
            echo "image's AppleAccentColor: $accent"
            defaults write -g AppleAccentColor -int 0
            echo "write AppleAccentColor 0: exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --button-pass --focus
          {
            case "$accent" in
              absent) defaults delete -g AppleAccentColor ;;
              -[0-9]*|[0-9]*) defaults write -g AppleAccentColor -int "$accent" ;;
              *) false ;;
            esac
            echo "restore AppleAccentColor to the image's ($accent): exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } >> "$out/settings.txt" 2>&1
          {
            case "$keyboard" in
              absent) defaults delete -g AppleKeyboardUIMode ;;
              -[0-9]*|[0-9]*) defaults write -g AppleKeyboardUIMode -int "$keyboard" ;;
              *) false ;;
            esac
            echo "restore AppleKeyboardUIMode to the image's ($keyboard): exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 4 "$out/settings.txt"
      # The reads pass (MP-timing U301, MP-route U323, MP-accent U104's plain
      # view, MP-text U317 and U319; `--reads`): Core Animation's named timing
      # functions and the animation context's defaults, the output route
      # button's colours and renders, the ring round a plain focusable view,
      # the font-smoothing defaults and text renders, and Core Text's
      # substitute fonts and cascade lists, and the pop-up, pull-down, combo
      # box, mixed checkbox and checked radio per size (MP-controls); keyboard
      # navigation on
      # (AppleKeyboardUIMode 2, as the focus pass sets it), restored after;
      # once with the
      # image's settings, once under the red accent.
      - name: Run the reads pass (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',reads,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/reads
          mkdir -p "$out"
          keyboard="$(cat "$RUNNER_TEMP/universalaccess/AppleKeyboardUIMode" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's AppleKeyboardUIMode: $keyboard"
            defaults write -g AppleKeyboardUIMode -int 2
            echo "write AppleKeyboardUIMode 2: exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --reads
          {
            case "$keyboard" in
              absent) defaults delete -g AppleKeyboardUIMode ;;
              -[0-9]*|[0-9]*) defaults write -g AppleKeyboardUIMode -int "$keyboard" ;;
              *) false ;;
            esac
            echo "restore AppleKeyboardUIMode to the image's ($keyboard): exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 2 "$out/settings.txt"
      - name: Run the reads pass with a red accent (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',reads-accent,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/reads-accent-red
          mkdir -p "$out"
          accent="$(cat "$RUNNER_TEMP/universalaccess/AppleAccentColor" 2>/dev/null || echo 'not recorded')"
          keyboard="$(cat "$RUNNER_TEMP/universalaccess/AppleKeyboardUIMode" 2>/dev/null || echo 'not recorded')"
          {
            echo "image's AppleKeyboardUIMode: $keyboard"
            defaults write -g AppleKeyboardUIMode -int 2
            echo "write AppleKeyboardUIMode 2: exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
            echo "image's AppleAccentColor: $accent"
            defaults write -g AppleAccentColor -int 0
            echo "write AppleAccentColor 0: exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --reads
          {
            case "$accent" in
              absent) defaults delete -g AppleAccentColor ;;
              -[0-9]*|[0-9]*) defaults write -g AppleAccentColor -int "$accent" ;;
              *) false ;;
            esac
            echo "restore AppleAccentColor to the image's ($accent): exit $?"
            echo "read back: $(defaults read -g AppleAccentColor 2>&1)"
          } >> "$out/settings.txt" 2>&1
          {
            case "$keyboard" in
              absent) defaults delete -g AppleKeyboardUIMode ;;
              -[0-9]*|[0-9]*) defaults write -g AppleKeyboardUIMode -int "$keyboard" ;;
              *) false ;;
            esac
            echo "restore AppleKeyboardUIMode to the image's ($keyboard): exit $?"
            echo "read back: $(defaults read -g AppleKeyboardUIMode 2>&1)"
          } >> "$out/settings.txt" 2>&1
          tail -n 4 "$out/settings.txt"
      # The reads pass under a right-to-left language (MP-text's U318): the
      # process given -AppleLanguages "(he)" and the right-to-left direction
      # defaults in its arguments (the argument domain; no setting written:
      # run 42272240639 showed the language alone leaves an unlocalised
      # process left to right), so its mirroring section draws the
      # directional symbols as AppKit lays them out right to left.
      - name: Run the reads pass under a right-to-left language (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',reads-rtl,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/reads-rtl
          mkdir -p "$out"
          echo "no setting changed; the probe's arguments: -AppleLanguages (he) -AppleTextDirection YES -NSForceRightToLeftWritingDirection YES" > "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --reads -AppleLanguages "(he)" -AppleTextDirection YES -NSForceRightToLeftWritingDirection YES
      # A pass with the image's own settings in which the probe's window is
      # captured while a second window of the probe is key (`--not-key`), for
      # what macOS draws in a window that is not key.
      - name: Run the probe with its window not key (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',probe-not-key,'))
        continue-on-error: true
        run: |
          set +e
          out=os-probe-out/not-key
          mkdir -p "$out"
          {
            restore() {
              image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
              case "$image" in
                1) defaults write "$1" "$2" -bool true ;;
                0) defaults write "$1" "$2" -bool false ;;
                absent) defaults delete "$1" "$2" ;;
                *) false ;;
              esac
              echo "restore $2 to the image's ($image): exit $?"
              echo "read back: $(defaults read "$1" "$2" 2>&1)"
            }
            restore com.apple.universalaccess reduceTransparency
            restore com.apple.universalaccess increaseContrast
            restore -g AppleReduceDesktopTinting
          } > "$out/settings.txt" 2>&1
          cat "$out/settings.txt"
          cargo run -p native-theme-os-probe --release -- --out "$out" --not-key
      # A last pass, whatever fails: the built probe wrapped in a minimal .app
      # and started by LaunchServices (`open`), which an unbundled process
      # started from a shell is not, to see whether that gives it a key
      # window where activation alone does not (macOS 15 and later). The
      # accessibility settings are the image's again first, so the pass
      # compares with the main one; the app is ad-hoc signed and granted
      # screen recording under its bundle id and its executable's path, as it,
      # not the shell, starts screencapture. run.txt records each step's exit
      # status and whether a probe.toml was written; the app's own output is
      # in stdout.txt and stderr.txt.
      - name: Run the probe as an app bundle (macOS)
        if: runner.os == 'macOS' && (inputs.passes == '' || contains(format(',{0},', inputs.passes), ',app-bundle,'))
        continue-on-error: true
        run: |
          set +e
          out="$PWD/os-probe-out/app-bundle"
          app="$RUNNER_TEMP/NativeThemeOsProbe.app"
          id=org.native-theme.os-probe
          mkdir -p "$out" "$app/Contents/MacOS"
          {
            for setting in "com.apple.universalaccess reduceTransparency" \
                           "com.apple.universalaccess increaseContrast" \
                           "-g AppleReduceDesktopTinting"; do
              set -- $setting
              image="$(cat "$RUNNER_TEMP/universalaccess/$2" 2>/dev/null || echo 'not recorded')"
              case "$image" in
                1) defaults write "$1" "$2" -bool true ;;
                0) defaults write "$1" "$2" -bool false ;;
                absent) defaults delete "$1" "$2" ;;
                *) false ;;
              esac
              echo "restore $2 to the image's ($image): exit $?"
            done
            cp target/release/native-theme-os-probe "$app/Contents/MacOS/native-theme-os-probe"
            echo "copy the probe: exit $?"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '<key>CFBundleExecutable</key><string>native-theme-os-probe</string>' \
              "<key>CFBundleIdentifier</key><string>$id</string>" \
              '<key>CFBundleName</key><string>NativeThemeOsProbe</string>' \
              '<key>CFBundlePackageType</key><string>APPL</string>' \
              '</dict></plist>' > "$app/Contents/Info.plist"
            echo "write Info.plist: exit $?"
            codesign --force --sign - "$app"
            echo "codesign: exit $?"
            for grant in "'$id', 0" "'$app/Contents/MacOS/native-theme-os-probe', 1"; do
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
                 VALUES ('kTCCServiceScreenCapture', $grant, 2, 4, 1);"
              echo "grant screen recording to $grant: exit $?"
            done
            open -W -n --stdout "$out/stdout.txt" --stderr "$out/stderr.txt" "$app" --args --out "$out"
            echo "open -W -n: exit $?"
            if [ -f "$out/probe.toml" ]; then echo "probe.toml written"; else echo "no probe.toml"; fi
          } > "$out/run.txt" 2>&1
          cat "$out/run.txt"
      - name: Upload the probe's output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: os-probe-${{ matrix.os }}
          path: os-probe-out

  # The GNOME container (D2, spike G): tools/linux-containers/gnome/Containerfile
  # built from the Arch Linux Archive snapshot of the release set, checked to
  # carry the release set's libadwaita, GTK and gsettings-desktop-schemas, and
  # pushed to ghcr.io for the GNOME jobs to pull. packages.txt lists every
  # package the image holds.
  gnome-container:
    name: GNOME container
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',gnome-container,')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-gnome:2026-10-29
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=native-theme's GNOME measurement container (Arch Linux Archive 2026/10/29)" \
            -t "$IMAGE" -f tools/linux-containers/gnome/Containerfile tools/linux-containers/gnome
      - name: Check the release set
        run: |
          mkdir -p gnome-container
          docker run --rm "$IMAGE" cat /usr/share/native-theme/packages.txt > gnome-container/packages.txt
          docker image inspect "$IMAGE" > gnome-container/inspect.json
          printf '%s\n' 'libadwaita 1:1.10.0-1' 'gtk4 1:4.24.1-1' 'gsettings-desktop-schemas 51.0-1' \
            | sort > gnome-container/expected.txt
          grep -Fx -f gnome-container/expected.txt gnome-container/packages.txt | sort > gnome-container/found.txt
          cat gnome-container/found.txt
          cmp gnome-container/expected.txt gnome-container/found.txt
      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE" | tee gnome-container/push.txt
          docker logout ghcr.io
      - name: Upload the image's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-container
          path: gnome-container

  # The GNOME harness (D2, D4, spike G): tools/gnome-host on a headless display
  # in the GNOME container, run twice and compared (tools/gnome-host/run.sh).
  # The display is mutter's headless mode (spike G): GNOME's own compositor,
  # GTK's Wayland backend as a GNOME session runs it, byte-identical renders
  # across runs and runner CPUs. Xvfb rendered byte-identically too, but
  # through GTK's X11 backend, whose font settings (hinting, DPI) and window
  # frame are not a GNOME session's; run.sh still takes `xvfb` for a re-check.
  # The renderer is GTK's GL renderer (GSK_RENDERER=gl, on Mesa's llvmpipe):
  # the GPU renderers' code path; the cairo fallback's 8-bit values differ from
  # it by one step in some fills (each renderer byte-identical across runs).
  # The pull is tried without credentials first, to check that the package is
  # public; pull.txt records the result, and the job's token pulls it where
  # that fails.
  gnome-harness:
    name: GNOME harness (${{ matrix.display }})
    needs: gnome-container
    if: >-
      !cancelled() && needs.gnome-container.result != 'failure'
      && (inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',gnome-harness,'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        display: [mutter]
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-gnome:2026-10-29
      OUT: gnome-harness-out
    steps:
      - uses: actions/checkout@v6
      - name: Pull the image
        run: |
          mkdir -p "$OUT"
          docker logout ghcr.io > /dev/null 2>&1 || true
          if docker pull "$IMAGE" > "$OUT/pull.txt" 2>&1; then
            echo "pull without credentials: succeeded" | tee -a "$OUT/pull.txt"
          else
            echo "pull without credentials: failed" | tee -a "$OUT/pull.txt"
            echo "::warning::$IMAGE does not pull without credentials"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
          fi
          cat "$OUT/pull.txt"
      - name: Render
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            dbus-run-session -- bash tools/gnome-host/run.sh "${{ matrix.display }}" "$OUT"
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-harness-${{ matrix.display }}
          path: gnome-harness-out

  # The vector table of libadwaita's public colour functions (the plan's route
  # 1; spike G): tools/gnome-vectors in the GNOME container, no display.
  gnome-vectors:
    name: GNOME vectors
    needs: gnome-container
    if: >-
      !cancelled() && needs.gnome-container.result != 'failure'
      && (inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',gnome-vectors,'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-gnome:2026-10-29
      OUT: gnome-vectors-out
    steps:
      - uses: actions/checkout@v6
      - name: Pull the image
        run: |
          mkdir -p "$OUT"
          docker logout ghcr.io > /dev/null 2>&1 || true
          if docker pull "$IMAGE" > "$OUT/pull.txt" 2>&1; then
            echo "pull without credentials: succeeded" | tee -a "$OUT/pull.txt"
          else
            echo "pull without credentials: failed" | tee -a "$OUT/pull.txt"
            echo "::warning::$IMAGE does not pull without credentials"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
          fi
          cat "$OUT/pull.txt"
      - name: Generate the vectors
        run: docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash tools/gnome-vectors/run.sh "$OUT"
      - name: Upload the vectors
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnome-vectors
          path: gnome-vectors-out

  # The KDE container (D2, spike K): tools/linux-containers/kde/Containerfile
  # built from the Arch Linux Archive snapshot of the release set, checked to
  # carry the release set's Plasma, KDE Frameworks, Qt, PySide6 and
  # kirigami-addons, and pushed to ghcr.io for the KDE jobs to pull.
  # packages.txt lists every package the image holds; color-schemes.txt the
  # installed colour schemes and which of them state a tint, the
  # accent-coloured title bar or a Colors:Header group.
  kde-container:
    name: KDE container
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',kde-container,')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-kde:2026-10-29
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=native-theme's KDE measurement container (Arch Linux Archive 2026/10/29)" \
            -t "$IMAGE" -f tools/linux-containers/kde/Containerfile tools/linux-containers/kde
      - name: Check the release set
        run: |
          mkdir -p kde-container
          docker run --rm "$IMAGE" cat /usr/share/native-theme/packages.txt > kde-container/packages.txt
          docker image inspect "$IMAGE" > kde-container/inspect.json
          printf '%s\n' 'plasma-workspace 6.8.2-1' 'plasma-integration 6.8.2-1' 'breeze 6.8.2-1' \
            'kcolorscheme 6.31.0-1' 'kconfig 6.31.0-1' 'kirigami 6.31.0-1' 'qqc2-desktop-style 6.31.0-1' \
            'kirigami-addons 1.15.0-1' 'qt6-base 6.12.0-3' 'qt6-declarative 6.12.0-3' 'pyside6 6.12.0-3' \
            | sort > kde-container/expected.txt
          grep -Fx -f kde-container/expected.txt kde-container/packages.txt | sort > kde-container/found.txt
          cat kde-container/found.txt
          cmp kde-container/expected.txt kde-container/found.txt
      - name: Record the colour schemes
        run: |
          docker run --rm "$IMAGE" sh -c '
            cd /usr/share/color-schemes && sha256sum *.colors
            for key in TintFactor TitlebarIsAccentColored accentActiveTitlebar "\[Colors:Header\]"; do
              echo "$key: $(grep -l "^$key" *.colors | tr "\n" " ")"
            done' | tee kde-container/color-schemes.txt
      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE" | tee kde-container/push.txt
          docker logout ghcr.io
      - name: Upload the image's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kde-container
          path: kde-container

  # The accent run (D2, spike K): scripts/measure_kde_accent.sh in the KDE
  # container on the pairs of tools/kde-host/accent-pairs-spike.tsv, each pair
  # in a fresh configuration; the script fails the job when a step fails, does
  # not change kdeglobals, or finds an AccentColor stored before a scheme's
  # apply. The pull is tried without credentials first, to check that the
  # package is public; pull.txt records the result.
  kde-accent:
    name: KDE accent run
    needs: kde-container
    if: >-
      !cancelled() && needs.kde-container.result != 'failure'
      && (inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',kde-accent,'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-kde:2026-10-29
      OUT: kde-accent-out
    steps:
      - uses: actions/checkout@v6
      - name: Pull the image
        run: |
          mkdir -p "$OUT"
          docker logout ghcr.io > /dev/null 2>&1 || true
          if docker pull "$IMAGE" > "$OUT/pull.txt" 2>&1; then
            echo "pull without credentials: succeeded" | tee -a "$OUT/pull.txt"
          else
            echo "pull without credentials: failed" | tee -a "$OUT/pull.txt"
            echo "::warning::$IMAGE does not pull without credentials"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
          fi
          cat "$OUT/pull.txt"
      - name: Measure
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            dbus-run-session -- bash scripts/measure_kde_accent.sh "$OUT" tools/kde-host/accent-pairs-spike.tsv
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kde-accent
          path: kde-accent-out

  # The KDE render host (D4, spike K): tools/kde-host's QML host (the `qml`
  # runtime, qqc2-desktop-style and Kirigami) and Qt Widgets host (PySide6,
  # Breeze) in the KDE container, offscreen, under BreezeLight and BreezeDark,
  # run twice and compared (tools/kde-host/run.sh).
  kde-render:
    name: KDE render host
    needs: kde-container
    if: >-
      !cancelled() && needs.kde-container.result != 'failure'
      && (inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',kde-render,'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/tiborgats/native-theme-kde:2026-10-29
      OUT: kde-render-out
    steps:
      - uses: actions/checkout@v6
      - name: Pull the image
        run: |
          mkdir -p "$OUT"
          docker logout ghcr.io > /dev/null 2>&1 || true
          if docker pull "$IMAGE" > "$OUT/pull.txt" 2>&1; then
            echo "pull without credentials: succeeded" | tee -a "$OUT/pull.txt"
          else
            echo "pull without credentials: failed" | tee -a "$OUT/pull.txt"
            echo "::warning::$IMAGE does not pull without credentials"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
          fi
          cat "$OUT/pull.txt"
      - name: Render
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            dbus-run-session -- bash tools/kde-host/run.sh "$OUT"
      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kde-render
          path: kde-render-out

  # The Android host (D2, D4, spike A): tools/android-host, a Kotlin Compose
  # app on the release set's Compose Material 3, built with its pinned Gradle
  # wrapper and run by tools/android-host/run.sh on the emulator under KVM
  # (the udev rule GitHub documents for hardware acceleration), at the system
  # image IMAGE names, twice from a cold boot: the PNGs of CaptureTest and an
  # index of the versions; the two runs are compared.
  android-host:
    name: Android host
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',android-host,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: "37.1"
      OUT: android-host-out
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, boot and capture
        run: bash tools/android-host/run.sh "$IMAGE" "$OUT"
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-host
          path: android-host-out

  # The WinUI host (D4, spike W): tools/winui-host, a C# WinUI 3 app on the
  # release set's Windows App SDK (2.5.1, unpackaged and self-contained), built
  # with the pinned .NET SDK and run twice by tools/winui-host/run.ps1: the
  # window's, a Button's, a MenuFlyout's and a ToolTip's frames (frames.toml)
  # and PNGs. Its steps run on the Windows images only.
  winui-host:
    name: WinUI host (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',winui-host,')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v6
        if: runner.os == 'Windows'
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: 10.0.403
      - name: Build and run the host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/winui-host/run.ps1 -Out winui-host-out
      - name: Upload the host's output
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: winui-host-${{ matrix.os }}
          path: winui-host-out

  # The iOS host (D3, D4, spike I): tools/ios-host, a Swift app built by the
  # image's default Xcode, run in a simulator of the image's newest iOS runtime
  # (iOS 18 on macos-15, iOS 26 on macos-26), twice, and compared
  # (tools/ios-host/run.sh). Its matrix is the probe's images; an image
  # without a simulator (Windows) runs no step, since an `if:` cannot read the
  # matrix.
  ios-host:
    name: iOS host (${{ matrix.os }})
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',ios-host,')
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v6
        if: runner.os == 'macOS'
      - name: Build and run
        if: runner.os == 'macOS'
        run: bash tools/ios-host/run.sh ios-host-out
      - name: Upload the renders
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ios-host-${{ matrix.os }}
          path: ios-host-out
