name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macos
            toolkit: iced
            # The showcase's iced_aw pages, as scripts/generate_screenshots_iced.sh builds it.
            features: --features iced_aw
          - os: macos-latest
            os_name: macos
            toolkit: gpui
            features: ""
          - os: windows-latest
            os_name: windows
            toolkit: iced
            # The showcase's iced_aw pages, as scripts/generate_screenshots_iced.sh builds it.
            features: --features iced_aw
          - os: windows-latest
            os_name: windows
            toolkit: gpui
            features: ""
          - os: macos-latest
            os_name: macos
            toolkit: egui
            # Every connector feature, as the capture scripts build it.
            features: --all-features
          - os: windows-latest
            os_name: windows
            toolkit: egui
            features: --all-features

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolkit }}

      - name: Set display resolution (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # The showcases open at 1280 x 720, and the macOS runner's display is
      # 1024 x 768, which clamps the window: every macOS capture before this
      # step was 1024px wide. displayplacer (Homebrew core) switches the
      # display to 1920 x 1080, a mode its virtual display lists. Seen working
      # on a GitHub-hosted arm64 macOS runner (macos-26), where the switch took
      # and a window then kept its requested size, which the 1024 x 768 display
      # had clamped: https://github.com/JaminZhou/codex-ui-kit/actions/runs/34041357514
      # (step "Configure hosted display for native capture", commit e86516c).
      # The step fails when the mode is not listed or does not take; the
      # showcases' own capture check fails a capture of a window that did not
      # open at 1280 x 720.
      - name: Set display resolution (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install displayplacer
          modes="$(displayplacer list)"
          echo "$modes"
          screens="$(grep -c '^Persistent screen id:' <<< "$modes" || true)"
          if [ "$screens" -ne 1 ]; then
            echo "::error::displayplacer lists $screens displays, not one"
            exit 1
          fi
          if ! grep -q 'res:1920x1080 ' <<< "$modes"; then
            echo "::error::the runner's display offers no 1920x1080 mode, so a 1280x720 window cannot open unclamped"
            exit 1
          fi
          id="$(awk '/^Persistent screen id:/ { print $4 }' <<< "$modes")"
          displayplacer "id:${id} res:1920x1080 scaling:off origin:(0,0) degree:0"
          sleep 2
          after="$(displayplacer list)"
          if ! grep -qx 'Resolution: 1920x1080' <<< "$after"; then
            echo "$after"
            echo "::error::the runner's display did not switch to 1920x1080"
            exit 1
          fi

      - name: Grant screen recording permission (macOS)
        if: runner.os == 'macOS'
        run: |
          # screencapture -l needs kTCCServiceScreenCapture on macOS 14+
          # Grant to the shell process so the showcase can invoke screencapture
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
             VALUES ('kTCCServiceScreenCapture', '/bin/bash', 1, 2, 4, 1);"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
             VALUES ('kTCCServiceScreenCapture', '/bin/zsh', 1, 2, 4, 1);"

      - name: Build showcase
        run: cargo build -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }}

      # The connector spec's runner checks: its two #[ignore]d tests behind
      # `system-fonts` (`system_faces_resolve`, `system_line_spacing`) run only
      # here, on the platforms whose fonts they resolve. `--lib`: they live in
      # src/fonts.rs's test module. The name filter keeps the crate's other
      # ignored test, `regenerate_mapping_md`, which rewrites src/mapping.md,
      # out of the run. `--nocapture`: the lines they print are the evidence
      # the spec's open verification items record.
      - name: Runner checks (egui)
        if: matrix.toolkit == 'egui'
        run: cargo test -p native-theme-egui --all-features --lib -- --ignored --nocapture fonts::tests::system_

      # The iced connector's macOS font checks: the showcase's two #[ignore]d
      # runner tests, which no Linux run reaches.
      - name: Runner checks (iced, macOS)
        if: matrix.toolkit == 'iced' && runner.os == 'macOS'
        run: cargo test -p native-theme-iced --example showcase-iced --features iced_aw -- --ignored --nocapture

      - name: Create output directory
        run: mkdir -p connectors/native-theme-${{ matrix.toolkit }}/docs/assets
        shell: bash

      # `--screenshot` opens the window at the showcases' default 1280 x 720
      # and exits non-zero, with the measured and the expected size, unless
      # the capture is of that window: each showcase's OS capture is the
      # window with its frame and title bar, the content 1280 x 720 times the
      # display's scale factor (egui's through xcap: `screencapture -l` of the
      # window it lists on macOS, a BitBlt of its frame on Windows).
      - name: Capture screenshots (macOS)
        if: runner.os == 'macOS'
        run: |
          themes=(
            "macos-sonoma:light:system"
            "macos-sonoma:dark:system"
          )
          for entry in "${themes[@]}"; do
            IFS=':' read -r theme variant icon_set <<< "$entry"
            echo "Capturing ${{ matrix.toolkit }}: $theme $variant (icons: $icon_set)"
            cargo run -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }} -- \
              --theme "$theme" --variant "$variant" --icon-set "$icon_set" \
              --tab buttons \
              --screenshot "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-${theme}-${variant}.png"
          done

      - name: Capture screenshots (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          themes=(
            "windows-11:light:system"
            "windows-11:dark:system"
          )
          for entry in "${themes[@]}"; do
            IFS=':' read -r theme variant icon_set <<< "$entry"
            echo "Capturing ${{ matrix.toolkit }}: $theme $variant (icons: $icon_set)"
            cargo run -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }} -- \
              --theme "$theme" --variant "$variant" --icon-set "$icon_set" \
              --tab buttons \
              --screenshot "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-${theme}-${variant}.png"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.toolkit }}-${{ matrix.os_name }}
          path: connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-*.png
