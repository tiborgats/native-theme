name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    strategy:
      fail-fast: false
      # The macOS entries name macos-26, the image `macos-latest` resolves to in
      # GitHub's runner-images list (README, read 2026-10-11:
      # https://github.com/actions/runner-images/blob/main/README.md), so a move
      # of `macos-latest` cannot change the captures unnoticed. It is not
      # macOS 14: `macos-14` is fully unsupported from 2026-11-02, with brownouts
      # in October (https://github.com/actions/runner-images/issues/13518, read
      # 2026-10-11). The `macos-monterey` captures show that preset (its header says
      # which macOS versions it covers, 12 to 15) drawn on the runner's macOS 26, and the
      # `macos-tahoe` captures macOS 26's own generation; each job records the runner's
      # macOS version beside its captures (below).
      # The Windows entries name windows-2025 (Windows Server 2025, build 26100),
      # the image `windows-latest` resolves to; GitHub's one Windows 11 image is
      # arm64 (`windows-11-arm`). The `windows-11` captures claim the preset drawn
      # on Windows Server 2025, whose metrics, fonts and system colours the OS
      # probe found equal to Windows 11 25H2's, the animation and drop-shadow
      # settings aside (docs/evidence/os-probe/2026-10-11-run-38129819806; M2b,
      # docs/todo_code-review-findings.md). Each job records its runner's OS
      # version beside its captures (below).
      matrix:
        include:
          - os: macos-26
            os_name: macos
            toolkit: iced
            # The showcase's iced_aw pages, as scripts/generate_screenshots_iced.sh builds it.
            features: --features iced_aw
          - os: macos-26
            os_name: macos
            toolkit: gpui
            features: ""
          - os: windows-2025
            os_name: windows
            toolkit: iced
            # The showcase's iced_aw pages, as scripts/generate_screenshots_iced.sh builds it.
            features: --features iced_aw
          - os: windows-2025
            os_name: windows
            toolkit: gpui
            features: ""
          - os: macos-26
            os_name: macos
            toolkit: egui
            # Every connector feature, as the capture scripts build it.
            features: --all-features
          - os: windows-2025
            os_name: windows
            toolkit: egui
            features: --all-features

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolkit }}

      - name: Set display resolution (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # The showcases open at 1280 x 720, and the macOS runner's display is
      # 1024 x 768, which clamps the window: every macOS capture before this
      # step was 1024px wide. displayplacer (Homebrew core) switches the
      # display to 1920 x 1080, a mode its virtual display lists. Seen working
      # on a GitHub-hosted arm64 macOS runner (macos-26), where the switch took
      # and a window then kept its requested size, which the 1024 x 768 display
      # had clamped: https://github.com/JaminZhou/codex-ui-kit/actions/runs/34041357514
      # (step "Configure hosted display for native capture", commit e86516c).
      # The step fails when the mode is not listed or does not take; the
      # showcases' own capture check fails a capture of a window that did not
      # open at 1280 x 720.
      - name: Set display resolution (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install displayplacer
          modes="$(displayplacer list)"
          echo "$modes"
          screens="$(grep -c '^Persistent screen id:' <<< "$modes" || true)"
          if [ "$screens" -ne 1 ]; then
            echo "::error::displayplacer lists $screens displays, not one"
            exit 1
          fi
          if ! grep -q 'res:1920x1080 ' <<< "$modes"; then
            echo "::error::the runner's display offers no 1920x1080 mode, so a 1280x720 window cannot open unclamped"
            exit 1
          fi
          id="$(awk '/^Persistent screen id:/ { print $4 }' <<< "$modes")"
          displayplacer "id:${id} res:1920x1080 scaling:off origin:(0,0) degree:0"
          sleep 2
          after="$(displayplacer list)"
          if ! grep -qx 'Resolution: 1920x1080' <<< "$after"; then
            echo "$after"
            echo "::error::the runner's display did not switch to 1920x1080"
            exit 1
          fi

      - name: Grant screen recording permission (macOS)
        if: runner.os == 'macOS'
        run: |
          # screencapture -l needs kTCCServiceScreenCapture on macOS 14+
          # Grant to the shell process so the showcase can invoke screencapture
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
             VALUES ('kTCCServiceScreenCapture', '/bin/bash', 1, 2, 4, 1);"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) \
             VALUES ('kTCCServiceScreenCapture', '/bin/zsh', 1, 2, 4, 1);"

      - name: Build showcase
        run: cargo build -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }}

      # The connector spec's runner checks: its two #[ignore]d tests behind
      # `system-fonts` (`system_faces_resolve`, `system_line_spacing`) run only
      # here, on the platforms whose fonts they resolve. `--lib`: they live in
      # src/fonts.rs's test module. The name filter keeps the crate's other
      # ignored test, `regenerate_mapping_md`, which rewrites src/mapping.md,
      # out of the run. `--nocapture`: the lines they print are the evidence
      # the spec's open verification items record.
      - name: Runner checks (egui)
        if: matrix.toolkit == 'egui'
        run: cargo test -p native-theme-egui --all-features --lib -- --ignored --nocapture fonts::tests::system_

      # The iced connector's macOS font checks: the showcase's two #[ignore]d
      # runner tests, which no Linux run reaches.
      - name: Runner checks (iced, macOS)
        if: matrix.toolkit == 'iced' && runner.os == 'macOS'
        run: cargo test -p native-theme-iced --example showcase-iced --features iced_aw -- --ignored --nocapture

      - name: Create output directory
        run: mkdir -p connectors/native-theme-${{ matrix.toolkit }}/docs/assets
        shell: bash

      # The runner's OS version, uploaded with the captures as
      # `<os_name>-os-version.txt`; scripts/generate_assets_release.sh copies it
      # out of the run and scripts/update_provenance.sh writes it into
      # docs/assets/PROVENANCE.toml (`macos_version`, `windows_version`).
      - name: Record the OS version (macOS)
        if: runner.os == 'macOS'
        run: |
          version="$(sw_vers -productVersion)"
          echo "macOS $version"
          printf '%s\n' "$version" > "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-os-version.txt"

      - name: Record the OS version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = [System.Environment]::OSVersion.Version.ToString()
          Write-Output "Windows $version"
          Set-Content -Path "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-os-version.txt" -Value $version

      # `--screenshot` opens the window at the showcases' default 1280 x 720
      # and exits non-zero, with the measured and the expected size, unless
      # the capture is of that window: each showcase's OS capture is the
      # window with its frame and title bar, the content 1280 x 720 times the
      # display's scale factor (the three showcases' through the shared
      # crate's capture, xcap: `screencapture -l` of the window it lists on
      # macOS, a BitBlt of its frame on Windows).
      - name: Capture screenshots (macOS)
        if: runner.os == 'macOS'
        run: |
          themes=(
            "macos-monterey:light:system"
            "macos-monterey:dark:system"
            "macos-tahoe:light:system"
            "macos-tahoe:dark:system"
          )
          for entry in "${themes[@]}"; do
            IFS=':' read -r theme variant icon_set <<< "$entry"
            echo "Capturing ${{ matrix.toolkit }}: $theme $variant (icons: $icon_set)"
            cargo run -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }} -- \
              --theme "$theme" --variant "$variant" --icon-set "$icon_set" \
              --tab basic \
              --screenshot "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-${theme}-${variant}.png"
          done

      - name: Capture screenshots (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          themes=(
            "windows-11:light:system"
            "windows-11:dark:system"
          )
          for entry in "${themes[@]}"; do
            IFS=':' read -r theme variant icon_set <<< "$entry"
            echo "Capturing ${{ matrix.toolkit }}: $theme $variant (icons: $icon_set)"
            cargo run -p native-theme-${{ matrix.toolkit }} --example showcase-${{ matrix.toolkit }} --release ${{ matrix.features }} -- \
              --theme "$theme" --variant "$variant" --icon-set "$icon_set" \
              --tab basic \
              --screenshot "connectors/native-theme-${{ matrix.toolkit }}/docs/assets/${{ matrix.os_name }}-${theme}-${variant}.png"
          done

      # Only the files the capture step above writes, named one by one, so a
      # committed asset the run did not overwrite (an older release's
      # screenshot in docs/assets) cannot slip into the artifact beside the
      # fresh captures. Keep these lists in step with the `themes` lists.
      - name: Upload screenshots (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.toolkit }}-${{ matrix.os_name }}
          if-no-files-found: error
          path: |
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/macos-macos-monterey-light.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/macos-macos-monterey-dark.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/macos-macos-tahoe-light.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/macos-macos-tahoe-dark.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/macos-os-version.txt

      - name: Upload screenshots (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.toolkit }}-${{ matrix.os_name }}
          if-no-files-found: error
          path: |
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/windows-windows-11-light.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/windows-windows-11-dark.png
            connectors/native-theme-${{ matrix.toolkit }}/docs/assets/windows-os-version.txt
