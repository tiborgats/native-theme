name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run full CI checks before publishing
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Refuse to publish assets captured from other sources, or a tag whose
      # name differs from the workspace version. Both checks need no history:
      # scripts/asset-stamp.sh hashes HEAD's git object ids.
      - name: Visual assets and tag match this version
        run: |
          if ! msg=$(bash scripts/asset-stamp.sh check); then
            echo "::error::$msg"
            exit 1
          fi
          echo "$msg"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ "v$v" != "${{ github.ref_name }}" ]; then
              echo "::error::tag ${{ github.ref_name }} does not match the workspace version $v"
              exit 1
            fi
          fi

      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (core crates)
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo clippy -p native-theme-derive --all-targets
          cargo clippy -p native-theme-build --all-targets
          cargo clippy -p native-theme --all-targets
          cargo clippy -p native-theme-iced --all-targets
          cargo clippy -p native-theme-iced --all-targets --features iced_aw

      - name: Clippy native-theme-gpui
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy -p native-theme-gpui --all-targets

      - name: Test native-theme-derive
        run: cargo test -p native-theme-derive

      - name: Test native-theme-build
        run: cargo test -p native-theme-build

      - name: Test native-theme
        run: cargo test -p native-theme --features material-icons,lucide-icons,system-icons,svg-rasterize

      - name: Test native-theme-iced
        run: |
          cargo test -p native-theme-iced
          cargo test -p native-theme-iced --no-default-features
          cargo test -p native-theme-iced --features iced_aw

      - name: Test native-theme-gpui
        run: |
          cargo test -p native-theme-gpui
          cargo test -p native-theme-gpui --lib --no-default-features

      # Fails when an upstream release adds a widget that neither showcase
      # renders nor docs/showcase-exceptions.toml excepts. ubuntu-latest ships
      # Python 3.12, above the 3.11 the script's `tomllib` import requires.
      - name: Widget coverage
        run: |
          python3 --version
          python3 scripts/check-widget-coverage.py

      - name: Documentation (core)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo doc -p native-theme-derive --no-deps
          cargo doc -p native-theme-build --no-deps
          cargo doc -p native-theme --no-deps
          cargo doc -p native-theme-iced --no-deps
          # docs.rs builds native-theme-iced with every feature.
          cargo doc -p native-theme-iced --no-deps --all-features

      - name: Documentation native-theme-gpui
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc -p native-theme-gpui --no-deps

  # Both connectors enable `system-icons` by default, and its icon code
  # imports the platform crates, so it must build alone on each platform.
  system-icons:
    name: system-icons (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p native-theme --no-default-features --features system-icons
      # The platform readers and icon loaders compile only on their own
      # target, so their dead code and unchecked results show only here.
      - name: Check all features, warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check -p native-theme --all-features

  # Every crate's library with no default features, each feature alone and
  # all features, as CI and pre-release-check.sh run it.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-features.sh

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ci, system-icons, features]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies each tarball by compiling it on this runner,
      # so the gpui connector needs the same system libraries as the CI gate
      # (v0.5.8's first run failed here on fontconfig.pc after four uploads).
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev

      # Publish order is dictated by the workspace dependency graph:
      #   native-theme-derive  (proc-macro, no workspace deps)
      #   native-theme-build   (depends on derive)
      #   native-theme         (depends on derive + build)
      #   native-theme-iced    (depends on native-theme)
      #   native-theme-gpui    (depends on native-theme)
      #
      # Waits between publishes let the crates.io sparse index settle so the
      # next `cargo publish` can resolve the prior crate from the registry.

      - name: Publish native-theme-derive
        run: |
          OUTPUT=$(cargo publish -p native-theme-derive 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-derive already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (derive)
        run: sleep 45

      - name: Publish native-theme-build
        run: |
          OUTPUT=$(cargo publish -p native-theme-build 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-build already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (build)
        run: sleep 45

      - name: Publish native-theme
        run: |
          OUTPUT=$(cargo publish -p native-theme 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (native-theme)
        run: sleep 45

      - name: Publish native-theme-iced
        run: |
          OUTPUT=$(cargo publish -p native-theme-iced 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-iced already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish native-theme-gpui
        run: |
          OUTPUT=$(cargo publish -p native-theme-gpui 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-gpui already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
