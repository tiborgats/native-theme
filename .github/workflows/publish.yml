name: Publish to crates.io

# A `workflow_dispatch` re-runs the upload of a tag, and must name that tag as
# its ref: the release gate refuses any other.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# `bash -eo pipefail` (GitHub's `shell: bash`) instead of the default
# `bash -e`, so a failing command piped into another fails its step.
defaults:
  run:
    shell: bash

jobs:
  # Refuses a ref that is not a tag naming the workspace version, visual
  # assets captured from other sources, and a connector changed since it was
  # verified against its upstream set. The checks need no history:
  # scripts/update_provenance.sh and scripts/update_compatibility.sh hash
  # HEAD's git object ids.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: A tag of this version, with current assets and compatibility claims
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::publishing needs a v* tag as its ref; this run's ref is the $REF_TYPE $REF_NAME"
            exit 1
          fi
          v=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$v" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match the workspace version $v"
            exit 1
          fi
          for script in update_provenance.sh update_compatibility.sh; do
            if ! msg=$(bash "scripts/$script" check); then
              echo "::error::$msg"
              exit 1
            fi
            echo "$msg"
          done

  # Every CI job on the tag's commit, MSRV and the macOS and Windows legs
  # among them. ci.yml has no tag trigger of its own: this is its tag run, and
  # nothing is uploaded unless it passed.
  ci-full:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yml

  # Every publishable crate's tarball, built and compiled as crates.io will
  # serve it, before anything is uploaded: the upload job verifies a crate
  # only as it uploads it, so v0.5.8's first run failed on the gpui connector
  # after four crates were on crates.io (4dcc39e9). One invocation, so each
  # tarball resolves the workspace crates it depends on from the tarballs
  # built beside it, not from the registry; the crates in publish order.
  package:
    name: Package
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p native-theme-derive -p native-theme -p native-theme-build -p native-theme-iced -p native-theme-gpui -p native-theme-egui -p native-theme-egui-widgets

  # docs.rs documents a crate only after it is published, so its build is
  # emulated here first: nightly rustdoc with each crate's
  # `[package.metadata.docs.rs]` features and targets, DOCS_RS=1,
  # --cfg docsrs and -D warnings (scripts/check_docsrs.py, which
  # scripts/check_release.sh runs too).
  docsrs:
    name: docs.rs emulation
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # The crate list is collected first, so a listing that fails or lists
      # nothing fails the step instead of documenting no crate.
      - name: Document every crate as docs.rs will
        run: |
          python3 --version
          crates=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
          if [ -z "$crates" ]; then
            echo "::error::cargo metadata listed no workspace crate"
            exit 1
          fi
          for crate in $crates; do
            python3 -I scripts/check_docsrs.py "$crate"
          done

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [gate, ci-full, package, docsrs]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies each tarball by compiling it on this runner,
      # so the gpui connector needs the same system libraries as the package job
      # (v0.5.8's first run failed here on fontconfig.pc after four uploads).
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev

      # Publish order is dictated by the workspace dependency graph:
      #   native-theme-derive  (proc-macro, no workspace deps)
      #   native-theme         (depends on derive)
      #   native-theme-build   (no workspace deps; dev-depends on native-theme,
      #                         which must be on crates.io first)
      #   native-theme-iced    (depends on native-theme)
      #   native-theme-gpui    (depends on native-theme)
      #   native-theme-egui    (depends on native-theme)
      #   native-theme-egui-widgets (depends on native-theme-egui)
      #
      # Waits between publishes let the crates.io sparse index settle so the
      # next `cargo publish` can resolve the prior crate from the registry.

      - name: Publish native-theme-derive
        run: |
          OUTPUT=$(cargo publish -p native-theme-derive 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-derive already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (derive)
        run: sleep 45

      - name: Publish native-theme
        run: |
          OUTPUT=$(cargo publish -p native-theme 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (native-theme)
        run: sleep 45

      - name: Publish native-theme-build
        run: |
          OUTPUT=$(cargo publish -p native-theme-build 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-build already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (build)
        run: sleep 45

      - name: Publish native-theme-iced
        run: |
          OUTPUT=$(cargo publish -p native-theme-iced 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-iced already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish native-theme-gpui
        run: |
          OUTPUT=$(cargo publish -p native-theme-gpui 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-gpui already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish native-theme-egui
        run: |
          OUTPUT=$(cargo publish -p native-theme-egui 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-egui already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index (native-theme-egui)
        run: sleep 45

      - name: Publish native-theme-egui-widgets
        run: |
          OUTPUT=$(cargo publish -p native-theme-egui-widgets 2>&1) || {
            if echo "$OUTPUT" | grep -qiE "already exists on crates.io index|already.*uploaded|already.*published"; then
              echo "::notice::native-theme-egui-widgets already published, skipping"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
