  #     # With `native` and `watch`, so `on_theme_change` and the showcase's
  #     # `watch` code build on macOS and Windows too.
  #     - run: cargo build -p native-theme-gpui --example showcase-gpui --features gpui-fast,native,watch

  # The showcase-parity comparator's static modes, as scripts/check_release.sh
  # runs them: --check-list validates docs/showcase-elements.toml and the
  # [parity] exceptions, --self-test runs the comparator's scenarios on
  # synthetic dumps and captures. Neither needs a display or a build.
  # ubuntu-latest ships Python 3.12 (>= the 3.11 tomllib needs); the self-test
  # needs Pillow, installed from the distribution.
  parity:
    name: Showcase parity (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # check_function_vectors.py reads the evidence at its pin.
      - uses: ./.github/actions/evidence
      # The widget coverage's `cargo metadata` resolves the workspace with
      # the toolchain every other job uses.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: python3 --version
      # PLAN_EXCLUDED: showcase parity: element list and exceptions
      # - run: python3 scripts/check_showcase_parity.py --check-list
      - run: python3 scripts/check_showcase_parity.py --self-test
      # Reads the toolkits' sources through `cargo metadata` and fails when an
      # upstream release adds a widget that no showcase renders or
      # docs/showcase-exceptions.toml excepts. It builds nothing, so it runs
      # here while the iced connector's leg of `test-connectors` waits for
      # M2.1; `cargo metadata` needs only the runner's cargo.
      - name: Widget coverage
        run: |
          python3 scripts/check_widget_coverage.py
          python3 scripts/check_widget_coverage.py --self-test
      # The connector parity's comparator on its own scenarios; the check of
      # the connectors waits in `test-connectors` for M2.1.
      - run: python3 scripts/check_connector_parity.py --self-test
      # The data documents' checks, as scripts/check_release.sh runs them: a
      # registry field without a platform-facts row, a § reference to no
      # platform-facts section, a docs/todo.md preset citation that does not
      # hold, a bundled preset's definition comment that does not say how the
      # value below it was defined. The first three wait for M2.6.
      # PLAN_EXCLUDED: data documents: every registry field has a platform-facts row
      # - run: python3 scripts/check_platform_facts_rows.py
      - run: python3 scripts/check_platform_facts_rows.py --self-test
      # PLAN_EXCLUDED: data documents: § references name platform-facts sections
      # - run: python3 scripts/check_section_refs.py
      - run: python3 scripts/check_section_refs.py --self-test
      # PLAN_EXCLUDED: data documents: docs/todo.md cites preset values by key path
      # - run: python3 scripts/check_todo_citations.py
      - run: python3 scripts/check_todo_citations.py --self-test
      - run: python3 scripts/check_preset_citations.py
      - run: python3 scripts/check_preset_citations.py --self-test
      # The 0.8.0 model's facts checks that need nothing beyond the repository:
      # the platform functions' vector tables, and the enabled units' trace lines
      # each carried by a fact.
      - run: python3 scripts/check_function_vectors.py
      - run: python3 scripts/check_function_vectors.py --self-test
      - run: python3 scripts/check_facts_trace.py --enabled
      - run: python3 scripts/check_facts_trace.py --self-test
      # The verifiers' tooling on its fixtures (a temporary git repository).
      - run: python3 scripts/verify_facts.py --self-test
      # The line citations of today's platform-facts.md and the deleted
      # inheritance-rules.toml name the commit they read (`@fc6109d1`).
      - run: python3 scripts/check_pinned_citations.py
      - run: python3 scripts/check_pinned_citations.py --self-test
      # The facts gate runs on Linux alone (the facts-gate jobs): no `cfg` on
      # its path, found from the sources' `use` and `mod` graph, may depend on
      # the target or the features.
      - run: python3 scripts/check_gate_cfg.py
      - run: python3 scripts/check_gate_cfg.py --self-test
      # The evidence lives in native-theme-evidence, pinned by
      # docs/facts/sources.toml: no file under docs/evidence/ is tracked here,
      # as scripts/check_release.sh checks too.
      - name: No evidence in this repository
        run: |
          tracked=$(git ls-files -- docs/evidence)
          if [ -n "$tracked" ]; then
            printf "tracked here, belongs in native-theme-evidence: %s\n" $tracked | head -20
            exit 1
          fi

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails on a `native-theme*` dependency a README's `toml` block states
      # at another `major.minor` than the workspace version's, and on a crate
      # a README's Rust code, or a doc example under that crate's src/, names
      # that the README states no dependency on.
      # Reads files only; ubuntu-latest's Python 3.12 has the `tomllib` it needs.
      - name: README versions and crates
        run: |
          python3 --version
          python3 scripts/check_readme_versions.py
          python3 scripts/check_readme_versions.py --self-test
      # The crates the 0.8.0 plan's transition breaks are left out, one line
      # each.
      - run: |
          excluded=()
          excluded+=(--exclude native-theme-gpui)  # PLAN_EXCLUDED: docs, private items (native-theme-gpui)
          excluded+=(--exclude native-theme-iced)  # PLAN_EXCLUDED: docs, private items (native-theme-iced)
          excluded+=(--exclude native-theme-egui)  # PLAN_EXCLUDED: docs, private items (native-theme-egui)
          excluded+=(--exclude native-theme-egui-widgets)  # PLAN_EXCLUDED: docs, private items (native-theme-egui-widgets)
          excluded+=(--exclude native-theme-showcase-support)  # PLAN_EXCLUDED: docs, private items (native-theme-showcase-support)
          cargo doc --workspace "${excluded[@]}" --no-deps
      # `--workspace` unifies the members' features, so native-theme is
      # documented there with the features the connectors turn on; each
      # published crate is documented alone too, as a dependent builds it.
      # The connectors' docs, their docs.rs builds, packages and semver checks
      # (publish.yml's, scripts/check_release.sh's full run) wait for M2.1.
      # PLAN_EXCLUDED: docs, private items (native-theme-iced)
      # PLAN_EXCLUDED: docs, private items (native-theme-gpui)
      # PLAN_EXCLUDED: docs, private items (native-theme-egui)
      # PLAN_EXCLUDED: docs, private items (native-theme-egui-widgets)
      # PLAN_EXCLUDED: docs.rs (native-theme-gpui)
      # PLAN_EXCLUDED: docs.rs (native-theme-iced)
      # PLAN_EXCLUDED: docs.rs (native-theme-egui)
      # PLAN_EXCLUDED: docs.rs (native-theme-egui-widgets)
      # PLAN_EXCLUDED: package (native-theme-iced)
      # PLAN_EXCLUDED: package (native-theme-gpui)
      # PLAN_EXCLUDED: package (native-theme-egui)
      # PLAN_EXCLUDED: package (native-theme-egui-widgets)
      # PLAN_EXCLUDED: semver-checks (native-theme-iced)
      # PLAN_EXCLUDED: semver-checks (native-theme-gpui)
      # PLAN_EXCLUDED: semver-checks (native-theme-egui)
      # PLAN_EXCLUDED: semver-checks (native-theme-egui-widgets)
      - name: Documentation, each published crate alone
        run: |
          for crate in native-theme-derive native-theme native-theme-build; do
            cargo doc -p "$crate" --no-deps
          done
      # docs.rs builds native-theme-iced with every feature, and a doc item
      # behind a feature gate can only break in that configuration.
      # PLAN_EXCLUDED: docs (native-theme-iced, all features)
      # - run: cargo doc -p native-theme-iced --no-deps --all-features
      # docs.rs builds native-theme-egui with every feature too (its
      # `[package.metadata.docs.rs]` says `all-features = true`).
      # PLAN_EXCLUDED: docs (native-theme-egui, all features)
      # - run: cargo doc -p native-theme-egui --no-deps --all-features
      # PLAN_EXCLUDED: docs (native-theme-egui-widgets, all features)
      # - run: cargo doc -p native-theme-egui-widgets --no-deps --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit
      - run: cargo audit
