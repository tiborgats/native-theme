  # The gpui connector on GPUI Fast is built for Windows and macOS too: no
  # other job on push builds it there, and linking the showcase catches what
  # a check cannot (one Windows manifest per binary, which GPUI Kit 0.7.3
  # fixed; gpui-base and gpui-component enable
  # `windows-manifest-provided-by-host` on gpui-fast). The showcase builds
  # again at M5 (the 0.8.0 plan's transition), so the job waits for it.
  # PLAN_EXCLUDED: strict-panic (showcase-gpui, gpui-fast, native, watch)
  # gpui-fast-build:
  #   name: Build gpui showcase on GPUI Fast (${{ matrix.os }})
  #   needs: fmt
  #   runs-on: ${{ matrix.os }}
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       os: [windows-latest, macos-latest]
  #   steps:
