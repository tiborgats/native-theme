  # PLAN_EXCLUDED: test (native-theme-gpui, no features)
  # PLAN_EXCLUDED: test (native-theme-gpui, gpui-fast, native, watch)
  # PLAN_EXCLUDED: examples (native-theme-gpui)
  # PLAN_EXCLUDED: examples (native-theme-iced)
  # PLAN_EXCLUDED: examples (native-theme-egui)
  # PLAN_EXCLUDED: connector parity: names and signatures (iced · gpui · egui)
  # PLAN_EXCLUDED: test (egui showcase, runner environment)
  # PLAN_EXCLUDED: test (egui showcase, no features, runner environment)
  # PLAN_EXCLUDED: test (egui showcase, all features, runner environment)
  # PLAN_EXCLUDED: test (iced showcase, runner environment)
  # PLAN_EXCLUDED: test (iced showcase, iced_aw, watch, native, runner environment)
  # PLAN_EXCLUDED: test (gpui showcase, runner environment)
