name: CI

# A `v*` tag runs this workflow inside publish.yml, which calls it
# (`workflow_call`) and uploads only when every job here passed on the tag's
# commit; a tag trigger here would run it a second time beside that run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "native-theme", package: "native-theme" }
          - { name: "native-theme-derive", package: "native-theme-derive" }
          - { name: "native-theme-build", package: "native-theme-build" }
          - { name: "gpui connector", package: "native-theme-gpui" }
          - { name: "iced connector", package: "native-theme-iced" }
          - { name: "egui connector", package: "native-theme-egui" }
          - { name: "egui widgets", package: "native-theme-egui-widgets" }
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        if: matrix.package == 'native-theme-gpui'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ${{ matrix.package }} --all-targets
      - name: Clippy (gpui connector, gpui-fast, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: cargo clippy -p native-theme-gpui --all-targets --features gpui-fast,native,watch
      - name: Clippy (iced connector, iced_aw, watch, native)
        if: matrix.package == 'native-theme-iced'
        run: cargo clippy -p native-theme-iced --all-targets --features iced_aw,watch,native
      - name: Clippy (egui connector, all features)
        if: matrix.package == 'native-theme-egui'
        run: cargo clippy -p native-theme-egui --all-targets --all-features
      - name: Clippy (egui widgets, all features)
        if: matrix.package == 'native-theme-egui-widgets'
        run: cargo clippy -p native-theme-egui-widgets --all-targets --all-features
      # The strict panic lints on library code, as scripts/check_release.sh
      # runs them: native-theme and the connectors deny unwrap_used and
      # expect_used in their crate roots, and scripts/check_strict_panic.sh
      # holds the rest of the list (indexing_slicing, arithmetic_side_effects,
      # panic, ...). native-theme with check_release.sh's NT_FEATURES and with
      # none; native-theme-derive and the test fixtures (tools/test-fixtures),
      # which have no leg of their own, here too.
      - name: Strict panic lints (native-theme)
        if: matrix.package == 'native-theme'
        run: |
          bash scripts/check_strict_panic.sh -p native-theme --lib --features kde,portal,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh -p native-theme --lib --no-default-features
          bash scripts/check_strict_panic.sh -p native-theme-derive --lib
          bash scripts/check_strict_panic.sh -p native-theme-test-fixtures --lib
      # The same lints on the macOS and Windows code, which a Linux run never
      # compiles. Clippy builds no binary, so each target needs only its
      # standard library, no linker or SDK.
      - name: Strict panic lints (native-theme, macOS and Windows targets)
        if: matrix.package == 'native-theme'
        run: |
          rustup target add x86_64-apple-darwin x86_64-pc-windows-msvc
          bash scripts/check_strict_panic.sh --target x86_64-apple-darwin -p native-theme --lib --features macos,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh --target x86_64-apple-darwin -p native-theme --lib --no-default-features
          bash scripts/check_strict_panic.sh --target x86_64-pc-windows-msvc -p native-theme --lib --features windows,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh --target x86_64-pc-windows-msvc -p native-theme --lib --no-default-features
      # Every lint on that code, its tests and examples included, as
      # scripts/check_release.sh runs it; the OS probe (tools/os-probe, never
      # published) is all platform code. The targets are the step's above.
      - name: Clippy (native-theme and the OS probe, macOS and Windows targets)
        if: matrix.package == 'native-theme'
        run: |
          for target in x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo clippy --target "$target" -p native-theme --all-targets --all-features
            cargo clippy --target "$target" -p native-theme --all-targets --no-default-features
            cargo clippy --target "$target" -p native-theme-os-probe --all-targets
          done
      - name: Strict panic lints (native-theme-build)
        if: matrix.package == 'native-theme-build'
        run: bash scripts/check_strict_panic.sh -p native-theme-build --lib
      - name: Strict panic lints (iced connector)
        if: matrix.package == 'native-theme-iced'
        run: bash scripts/check_strict_panic.sh -p native-theme-iced --lib --features iced_aw,watch,native
      # One step per core, so a gpui-pre failure does not hide the GPUI Fast run.
      - name: Strict panic lints (gpui connector, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --lib --features native,watch
      - name: Strict panic lints (gpui connector, gpui-fast, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --lib --features gpui-fast,native,watch
      - name: Strict panic lints (egui connector)
        if: matrix.package == 'native-theme-egui'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui --lib --all-features
      # The connector's and its showcase's macOS code (the showcase's menus in
      # the system menu bar and its macOS-only dev-dependencies), which no Linux
      # run compiles, as scripts/check_release.sh checks it.
      - name: Check egui connector (macOS target, all targets, all features)
        if: matrix.package == 'native-theme-egui'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin -p native-theme-egui --all-targets --all-features
      - name: Strict panic lints (egui widgets)
        if: matrix.package == 'native-theme-egui-widgets'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui-widgets --lib --all-features

  test:
    name: Test ${{ matrix.name }}
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux (no features)", os: ubuntu-latest, flags: "--no-default-features" }
          - { name: "Linux (kde)", os: ubuntu-latest, flags: "--features kde" }
          - { name: "Linux (portal)", os: ubuntu-latest, flags: "--features portal" }
          - { name: "Linux (linux-kde)", os: ubuntu-latest, flags: "--features linux-kde" }
          - { name: "Linux (linux-portal)", os: ubuntu-latest, flags: "--features linux-portal" }
          - { name: "Linux (linux)", os: ubuntu-latest, flags: "--features linux" }
          - { name: "Linux (linux, watch)", os: ubuntu-latest, flags: "--features linux,watch" }
          - { name: "Linux (native)", os: ubuntu-latest, flags: "--features native" }
          - { name: "Linux (icons)", os: ubuntu-latest, flags: "--features material-icons,lucide-icons,system-icons,svg-rasterize" }
          - { name: "Linux (icons, system-fonts)", os: ubuntu-latest, flags: "--features material-icons,lucide-icons,system-icons,svg-rasterize,system-fonts" }
          - { name: "Windows (no features)", os: windows-latest, flags: "--no-default-features" }
          - { name: "Windows (windows)", os: windows-latest, flags: "--features windows" }
          - { name: "Windows (windows, watch, system-icons)", os: windows-latest, flags: "--features windows,watch,system-icons" }
          - { name: "macOS (no features)", os: macos-latest, flags: "--no-default-features" }
          - { name: "macOS (macos)", os: macos-latest, flags: "--features macos" }
          - { name: "macOS (macos, watch, system-icons)", os: macos-latest, flags: "--features macos,watch,system-icons" }
          - { name: "Linux (system-fonts)", os: ubuntu-latest, flags: "--features system-fonts" }
          - { name: "Windows (system-fonts)", os: windows-latest, flags: "--features system-fonts" }
          - { name: "macOS (system-fonts)", os: macos-latest, flags: "--features system-fonts" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p native-theme ${{ matrix.flags }}
      # Both connectors enable `system-icons` by default, and its icon code
      # imports the platform crates, so it must build alone on each platform.
      - name: Check system-icons alone
        if: runner.os != 'Linux' && matrix.flags == '--no-default-features'
        run: cargo check -p native-theme --no-default-features --features system-icons
      # The platform readers and icon loaders compile only on their own
      # target, so their dead code and unchecked results show only here.
      - name: Check all features, warnings denied
        if: runner.os != 'Linux' && matrix.flags == '--no-default-features'
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check -p native-theme --all-features

  features:
    name: Feature combinations
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every crate's library with no default features, each feature alone and
      # all features; scripts/check_release.sh runs the same script.
      - run: bash scripts/check_features.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --exclude native-theme-gpui --exclude native-theme-egui --exclude native-theme-egui-widgets --all-features --locked
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check -p native-theme-egui -p native-theme-egui-widgets --all-features --locked
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      # `--all-features` would turn on `gpui-fast`, which changes the GPUI
      # core: the default core and GPUI Fast are checked one at a time.
      - run: cargo check -p native-theme-gpui --locked
      - run: cargo check -p native-theme-gpui --features native,watch --locked
      - run: cargo check -p native-theme-gpui --features gpui-fast,native,watch --locked

  test-build-crate:
    name: Test native-theme-build and native-theme-derive
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p native-theme-build
      - run: cargo test -p native-theme-derive
      - run: cargo test -p native-theme-test-fixtures

  test-connectors:
    name: Test ${{ matrix.name }}
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "iced connector", package: "native-theme-iced" }
          - { name: "gpui connector", package: "native-theme-gpui" }
          - { name: "egui connector", package: "native-theme-egui" }
          - { name: "egui widgets", package: "native-theme-egui-widgets" }
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        if: matrix.package == 'native-theme-gpui'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ${{ matrix.package }}
      # The connector's other two supported configurations, gated by
      # scripts/check_release.sh as well so a release cannot pass on one CI never ran.
      - name: Test the iced connector's other configurations
        if: matrix.package == 'native-theme-iced'
        run: |
          cargo test -p native-theme-iced --no-default-features
          cargo test -p native-theme-iced --features iced_aw,watch,native
      # The connector's other two supported configurations (spec §11), gated by
      # scripts/check_release.sh as well so a release cannot pass on one CI never ran.
      - name: Test the egui connector's other configurations
        if: matrix.package == 'native-theme-egui'
        run: |
          cargo test -p native-theme-egui --no-default-features
          cargo test -p native-theme-egui --all-features
      # The companion widget crate forwards the connector's features one to one.
      - name: Test the egui widgets' other configurations
        if: matrix.package == 'native-theme-egui-widgets'
        run: |
          cargo test -p native-theme-egui-widgets --no-default-features
          cargo test -p native-theme-egui-widgets --all-features
      # Without `svg-rasterize` the gpui connector hands gpui the SVG itself;
      # the tests for that path compile only without the default features.
      - name: Test the gpui connector without default features
        if: matrix.package == 'native-theme-gpui'
        run: cargo test -p native-theme-gpui --lib --no-default-features
      # `on_theme_change`'s tests and the showcase's `watch` code; the tests
      # start no OS watcher.
      - name: Test the gpui connector with native and watch
        if: matrix.package == 'native-theme-gpui'
        run: cargo test -p native-theme-gpui --features native,watch
      # On GPUI Fast, with native and watch. Doctests excluded: each is a
      # crate of its own that names gpui-pre as `gpui`, not GPUI through gpui-kit.
      - name: Test the gpui connector on GPUI Fast
        if: matrix.package == 'native-theme-gpui'
        run: cargo test -p native-theme-gpui --features gpui-fast,native,watch --all-targets
      # Reads the toolkits' sources through `cargo metadata` and fails when an
      # upstream release adds a widget that no showcase renders or
      # docs/showcase-exceptions.toml excepts. Runs here because this leg already
      # resolves the iced connector with `iced_aw`; ubuntu-latest ships Python
      # 3.12, above the 3.11 the script's `tomllib` import requires.
      - name: Widget coverage
        if: matrix.package == 'native-theme-iced'
        run: |
          python3 --version
          python3 scripts/check_widget_coverage.py
          python3 scripts/check_widget_coverage.py --self-test
      # Fails on a connector accessor named unlike the `ResolvedTheme` leaf it
      # reads, or a function absent from a sibling connector or present there
      # under another signature, unless
      # scripts/connector_parity_exceptions.toml lists it. Reads sources only.
      - name: Connector parity
        if: matrix.package == 'native-theme-iced'
        run: |
          python3 --version
          python3 scripts/check_connector_parity.py
          python3 scripts/check_connector_parity.py --self-test

  # The gpui connector on GPUI Fast is built for Windows and macOS too: no
  # other job on push builds it there, and linking the showcase catches what
  # a check cannot (one Windows manifest per binary, which GPUI Kit 0.7.3
  # fixed; gpui-base and gpui-component enable
  # `windows-manifest-provided-by-host` on gpui-fast).
  gpui-fast-build:
    name: Build gpui showcase on GPUI Fast (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With `native` and `watch`, so `on_theme_change` and the showcase's
      # `watch` code build on macOS and Windows too.
      - run: cargo build -p native-theme-gpui --example showcase-gpui --features gpui-fast,native,watch

  # The showcase-parity comparator's static modes, as scripts/check_release.sh
  # runs them: --check-list validates docs/showcase-elements.toml and the
  # [parity] exceptions, --self-test runs the comparator's scenarios on
  # synthetic dumps and captures. Neither needs a display or a build.
  # ubuntu-latest ships Python 3.12 (>= the 3.11 tomllib needs); the self-test
  # needs Pillow, installed from the distribution.
  parity:
    name: Showcase parity (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: python3 --version
      - run: python3 scripts/check_showcase_parity.py --check-list
      - run: python3 scripts/check_showcase_parity.py --self-test

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails on a `native-theme*` dependency a README's `toml` block states
      # at another `major.minor` than the workspace version's, and on a crate
      # a README's Rust code, or a doc example under that crate's src/, names
      # that the README states no dependency on.
      # Reads files only; ubuntu-latest's Python 3.12 has the `tomllib` it needs.
      - name: README versions and crates
        run: |
          python3 --version
          python3 scripts/check_readme_versions.py
          python3 scripts/check_readme_versions.py --self-test
      - run: cargo doc --workspace --no-deps
      # `--workspace` unifies the members' features, so native-theme is
      # documented there with the features the connectors turn on; each
      # published crate is documented alone too, as a dependent builds it.
      - name: Documentation, each published crate alone
        run: |
          for crate in native-theme-derive native-theme native-theme-build native-theme-iced native-theme-gpui native-theme-egui native-theme-egui-widgets; do
            cargo doc -p "$crate" --no-deps
          done
      # docs.rs builds native-theme-iced with every feature, and a doc item
      # behind a feature gate can only break in that configuration.
      - run: cargo doc -p native-theme-iced --no-deps --all-features
      # docs.rs builds native-theme-egui with every feature too (its
      # `[package.metadata.docs.rs]` says `all-features = true`).
      - run: cargo doc -p native-theme-egui --no-deps --all-features
      - run: cargo doc -p native-theme-egui-widgets --no-deps --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit
      - run: cargo audit
