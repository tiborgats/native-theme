      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p native-theme-build
      - run: cargo test -p native-theme-derive
      - run: cargo test -p native-theme-test-fixtures
      - run: cargo test -p native-theme-preset-check
      # PLAN_EXCLUDED: test (native-theme-showcase-support)
      # - run: cargo test -p native-theme-showcase-support

  # The connectors' tests, which build again at M2.1 (the 0.8.0 plan's
