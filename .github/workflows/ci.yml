name: CI

# A `v*` tag runs this workflow inside publish.yml, which calls it
# (`workflow_call`) and uploads only when every job here passed on the tag's
# commit; a tag trigger here would run it a second time beside that run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "native-theme", package: "native-theme" }
          - { name: "native-theme-derive", package: "native-theme-derive" }
          - { name: "native-theme-build", package: "native-theme-build" }
          # The connectors build again at M2.1 (the 0.8.0 plan's transition);
          # their legs' steps below are idle until then. CI has no `cargo
          # check` leg, so their `check (<crate>)` keys are marked here.
          # PLAN_EXCLUDED: clippy (native-theme-gpui, native, watch)
          # PLAN_EXCLUDED: check (native-theme-gpui)
          # - { name: "gpui connector", package: "native-theme-gpui" }
          # PLAN_EXCLUDED: clippy (native-theme-iced)
          # PLAN_EXCLUDED: check (native-theme-iced)
          # - { name: "iced connector", package: "native-theme-iced" }
          # PLAN_EXCLUDED: clippy (native-theme-egui)
          # PLAN_EXCLUDED: check (native-theme-egui)
          # - { name: "egui connector", package: "native-theme-egui" }
          # PLAN_EXCLUDED: clippy (native-theme-egui-widgets)
          # PLAN_EXCLUDED: check (native-theme-egui-widgets)
          # - { name: "egui widgets", package: "native-theme-egui-widgets" }
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        if: matrix.package == 'native-theme-gpui'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ${{ matrix.package }} --all-targets
      - name: Clippy (gpui connector, gpui-fast, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: cargo clippy -p native-theme-gpui --all-targets --features gpui-fast,native,watch  # PLAN_EXCLUDED: clippy (native-theme-gpui, gpui-fast, native, watch)
      - name: Clippy (gpui connector, no features)
        if: matrix.package == 'native-theme-gpui'
        run: cargo clippy -p native-theme-gpui --all-targets --no-default-features  # PLAN_EXCLUDED: clippy (native-theme-gpui, no features)
      - name: Clippy (iced connector, iced_aw, watch, native)
        if: matrix.package == 'native-theme-iced'
        run: cargo clippy -p native-theme-iced --all-targets --features iced_aw,watch,native  # PLAN_EXCLUDED: clippy (native-theme-iced, iced_aw, watch, native)
      - name: Clippy (iced connector, the showcase's required features)
        if: matrix.package == 'native-theme-iced'
        run: cargo clippy -p native-theme-iced --all-targets --no-default-features --features widgets,spinner,system-fonts,advanced-shaping  # PLAN_EXCLUDED: clippy (native-theme-iced, the showcase's required features)
      - name: Clippy (egui connector, all features)
        if: matrix.package == 'native-theme-egui'
        run: cargo clippy -p native-theme-egui --all-targets --all-features  # PLAN_EXCLUDED: clippy (native-theme-egui, all features)
      - name: Clippy (egui widgets, all features)
        if: matrix.package == 'native-theme-egui-widgets'
        run: cargo clippy -p native-theme-egui-widgets --all-targets --all-features  # PLAN_EXCLUDED: clippy (native-theme-egui-widgets, all features)
      # The test fixtures (tools/test-fixtures), the preset check
      # (tools/preset-check) and the showcases' shared crate
      # (tools/showcase-support), never published and with no leg of their
      # own: their tests and Linux-only code, as scripts/check_release.sh
      # lints every workspace crate.
      - name: Clippy (the test fixtures, the preset check and the showcase support)
        if: matrix.package == 'native-theme'
        run: |
          cargo clippy -p native-theme-test-fixtures --all-targets
          cargo clippy -p native-theme-preset-check --all-targets
          # The showcase support builds again at M5.
          # PLAN_EXCLUDED: clippy (native-theme-showcase-support)
          # PLAN_EXCLUDED: check (native-theme-showcase-support)
          # cargo clippy -p native-theme-showcase-support --all-targets
      # The strict panic lints on library code, as scripts/check_release.sh
      # runs them: native-theme and the connectors deny unwrap_used and
      # expect_used in their crate roots, and scripts/check_strict_panic.sh
      # holds the rest of the list (indexing_slicing, arithmetic_side_effects,
      # panic, ...). native-theme with check_release.sh's NT_FEATURES and with
      # none; native-theme-derive, the test fixtures (tools/test-fixtures),
      # the preset check (tools/preset-check, a binary) and the showcases'
      # shared crate (tools/showcase-support), which have no leg of their own,
      # here too.
      - name: Strict panic lints (native-theme)
        if: matrix.package == 'native-theme'
        run: |
          bash scripts/check_strict_panic.sh -p native-theme --lib --features kde,portal,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh -p native-theme --lib --no-default-features
          bash scripts/check_strict_panic.sh -p native-theme-derive --lib
          bash scripts/check_strict_panic.sh -p native-theme-test-fixtures --lib
          bash scripts/check_strict_panic.sh -p native-theme-preset-check --bins
          # PLAN_EXCLUDED: strict-panic (native-theme-showcase-support)
          # bash scripts/check_strict_panic.sh -p native-theme-showcase-support --lib
      # The same lints on the macOS and Windows code, which a Linux run never
      # compiles, the showcases' shared crate's window capture with it. Clippy
      # builds no binary, so each target needs only its standard library, no
      # linker or SDK.
      - name: Strict panic lints (native-theme and the showcase support, macOS and Windows targets)
        if: matrix.package == 'native-theme'
        run: |
          rustup target add x86_64-apple-darwin x86_64-pc-windows-msvc
          bash scripts/check_strict_panic.sh --target x86_64-apple-darwin -p native-theme --lib --features macos,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh --target x86_64-apple-darwin -p native-theme --lib --no-default-features
          bash scripts/check_strict_panic.sh --target x86_64-pc-windows-msvc -p native-theme --lib --features windows,system-icons,material-icons,lucide-icons,watch,svg-rasterize,system-fonts
          bash scripts/check_strict_panic.sh --target x86_64-pc-windows-msvc -p native-theme --lib --no-default-features
          # PLAN_EXCLUDED: strict-panic (native-theme-showcase-support, x86_64-apple-darwin)
          # bash scripts/check_strict_panic.sh --target x86_64-apple-darwin -p native-theme-showcase-support --lib
          # PLAN_EXCLUDED: strict-panic (native-theme-showcase-support, x86_64-pc-windows-msvc)
          # bash scripts/check_strict_panic.sh --target x86_64-pc-windows-msvc -p native-theme-showcase-support --lib
      # Every lint on that code, its tests and examples included, as
      # scripts/check_release.sh runs it; the OS probe (tools/os-probe, never
      # published) is all platform code, and the showcases' shared crate
      # (tools/showcase-support, never published) holds their macOS and
      # Windows capture. The targets are the step's above.
      - name: Clippy (native-theme, the OS probe and the showcase support, macOS and Windows targets)
        if: matrix.package == 'native-theme'
        run: |
          for target in x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo clippy --target "$target" -p native-theme --all-targets --all-features
            cargo clippy --target "$target" -p native-theme --all-targets --no-default-features
            cargo clippy --target "$target" -p native-theme-os-probe --all-targets
            # PLAN_EXCLUDED: clippy, showcase-support (x86_64-apple-darwin)
            # PLAN_EXCLUDED: clippy, showcase-support (x86_64-pc-windows-msvc)
            # cargo clippy --target "$target" -p native-theme-showcase-support --all-targets
          done
      - name: Strict panic lints (native-theme-build)
        if: matrix.package == 'native-theme-build'
        run: bash scripts/check_strict_panic.sh -p native-theme-build --lib
      # A connector's library and its showcase example are steps of their
      # own, so a library failure does not hide the showcase's run; the
      # showcase examples are applications the repo ships, so the lints hold
      # them as they hold the libraries.
      - name: Strict panic lints (iced connector)
        if: matrix.package == 'native-theme-iced'
        run: bash scripts/check_strict_panic.sh -p native-theme-iced --lib --features iced_aw,watch,native  # PLAN_EXCLUDED: strict-panic (native-theme-iced, iced_aw, watch, native)
      - name: Strict panic lints (iced showcase)
        if: matrix.package == 'native-theme-iced'
        run: bash scripts/check_strict_panic.sh -p native-theme-iced --example showcase-iced --features iced_aw,watch,native  # PLAN_EXCLUDED: strict-panic (showcase-iced, iced_aw, watch, native)
      # The showcase's default build, whose code without iced_aw (the Basic
      # page's tab strip and number field drawn of iced's own widgets) the
      # run above never compiles.
      - name: Strict panic lints (iced showcase, default features)
        if: matrix.package == 'native-theme-iced'
        run: bash scripts/check_strict_panic.sh -p native-theme-iced --example showcase-iced  # PLAN_EXCLUDED: strict-panic (showcase-iced, default features)
      # The showcase's macOS and Windows code (its window capture through the
      # shared crate, the system icon sets, and on macOS the system menu bar),
      # which a Linux run never compiles, under the strict panic lints; with
      # iced_aw, as the screenshot workflow builds it. Clippy builds no
      # binary, so each target needs only its standard library. The two
      # cross-target clippy keys have no CI step of their own.
      # PLAN_EXCLUDED: strict-panic (showcase-iced, iced_aw, x86_64-apple-darwin)
      # PLAN_EXCLUDED: strict-panic (showcase-iced, iced_aw, x86_64-pc-windows-msvc)
      # PLAN_EXCLUDED: clippy, iced showcase (x86_64-apple-darwin)
      # PLAN_EXCLUDED: clippy, iced showcase (x86_64-pc-windows-msvc)
      - name: Strict panic lints (iced showcase, iced_aw, macOS and Windows targets)
        if: matrix.package == 'native-theme-iced'
        run: |
          rustup target add x86_64-apple-darwin x86_64-pc-windows-msvc
          for target in x86_64-apple-darwin x86_64-pc-windows-msvc; do
            bash scripts/check_strict_panic.sh --target "$target" -p native-theme-iced --example showcase-iced --features iced_aw
          done
      # One step per core, so a gpui-pre failure does not hide the GPUI Fast run.
      - name: Strict panic lints (gpui connector, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --lib --features native,watch  # PLAN_EXCLUDED: strict-panic (native-theme-gpui, native, watch)
      - name: Strict panic lints (gpui showcase, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --example showcase-gpui --features native,watch  # PLAN_EXCLUDED: strict-panic (showcase-gpui, native, watch)
      - name: Strict panic lints (gpui connector, gpui-fast, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --lib --features gpui-fast,native,watch  # PLAN_EXCLUDED: strict-panic (native-theme-gpui, gpui-fast, native, watch)
      - name: Strict panic lints (gpui showcase, gpui-fast, native, watch)
        if: matrix.package == 'native-theme-gpui'
        run: bash scripts/check_strict_panic.sh -p native-theme-gpui --example showcase-gpui --features gpui-fast,native,watch  # PLAN_EXCLUDED: strict-panic (showcase-gpui, gpui-fast, native, watch)
      - name: Strict panic lints (egui connector)
        if: matrix.package == 'native-theme-egui'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui --lib --all-features  # PLAN_EXCLUDED: strict-panic (native-theme-egui)
      - name: Strict panic lints (egui showcase)
        if: matrix.package == 'native-theme-egui'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui --example showcase-egui --all-features  # PLAN_EXCLUDED: strict-panic (showcase-egui, all features)
      # The showcase without features, whose code without system-fonts the
      # run above never compiles.
      - name: Strict panic lints (egui showcase, no features)
        if: matrix.package == 'native-theme-egui'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui --example showcase-egui --no-default-features  # PLAN_EXCLUDED: strict-panic (showcase-egui, no features)
      # The showcase's macOS code (its menus in the system menu bar), which a
      # Linux run never compiles, and its Windows build, as the iced
      # showcase's, under the strict panic lints, with every feature, as
      # scripts/generate_screenshots_egui.sh builds it. Clippy builds no
      # binary, so each target needs only its standard library.
      # PLAN_EXCLUDED: strict-panic (showcase-egui, all features, x86_64-apple-darwin)
      # PLAN_EXCLUDED: strict-panic (showcase-egui, all features, x86_64-pc-windows-msvc)
      - name: Strict panic lints (egui showcase, all features, macOS and Windows targets)
        if: matrix.package == 'native-theme-egui'
        run: |
          rustup target add x86_64-apple-darwin x86_64-pc-windows-msvc
          for target in x86_64-apple-darwin x86_64-pc-windows-msvc; do
            bash scripts/check_strict_panic.sh --target "$target" -p native-theme-egui --example showcase-egui --all-features
          done
      # The connector's and its showcase's macOS code (the showcase's menus in
      # the system menu bar and its macOS-only dev-dependencies), which no Linux
      # run compiles, as scripts/check_release.sh checks it.
      - name: Check egui connector (macOS target, all targets, all features)
        if: matrix.package == 'native-theme-egui'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin -p native-theme-egui --all-targets --all-features  # PLAN_EXCLUDED: native-theme-egui, all targets (x86_64-apple-darwin)
      - name: Strict panic lints (egui widgets)
        if: matrix.package == 'native-theme-egui-widgets'
        run: bash scripts/check_strict_panic.sh -p native-theme-egui-widgets --lib --all-features  # PLAN_EXCLUDED: strict-panic (native-theme-egui-widgets)

  test:
    name: Test ${{ matrix.name }}
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux (no features)", os: ubuntu-latest, flags: "--no-default-features" }
          - { name: "Linux (kde)", os: ubuntu-latest, flags: "--features kde" }
          - { name: "Linux (portal)", os: ubuntu-latest, flags: "--features portal" }
          - { name: "Linux (linux-kde)", os: ubuntu-latest, flags: "--features linux-kde" }
          - { name: "Linux (linux-portal)", os: ubuntu-latest, flags: "--features linux-portal" }
          - { name: "Linux (linux)", os: ubuntu-latest, flags: "--features linux" }
          - { name: "Linux (linux, watch)", os: ubuntu-latest, flags: "--features linux,watch" }
          - { name: "Linux (native)", os: ubuntu-latest, flags: "--features native" }
          - { name: "Linux (icons)", os: ubuntu-latest, flags: "--features material-icons,lucide-icons,system-icons,svg-rasterize" }
          - { name: "Linux (icons, system-fonts)", os: ubuntu-latest, flags: "--features material-icons,lucide-icons,system-icons,svg-rasterize,system-fonts" }
          - { name: "Windows (no features)", os: windows-latest, flags: "--no-default-features" }
          - { name: "Windows (windows)", os: windows-latest, flags: "--features windows" }
          - { name: "Windows (windows, watch, system-icons)", os: windows-latest, flags: "--features windows,watch,system-icons" }
          - { name: "macOS (no features)", os: macos-latest, flags: "--no-default-features" }
          - { name: "macOS (macos)", os: macos-latest, flags: "--features macos" }
          - { name: "macOS (macos, watch, system-icons)", os: macos-latest, flags: "--features macos,watch,system-icons" }
          - { name: "Linux (system-fonts)", os: ubuntu-latest, flags: "--features system-fonts" }
          - { name: "Windows (system-fonts)", os: windows-latest, flags: "--features system-fonts" }
          - { name: "macOS (system-fonts)", os: macos-latest, flags: "--features system-fonts" }
    steps:
      - uses: actions/checkout@v6
      # The facts gate's fixtures read the evidence at its pin.
      - uses: ./.github/actions/evidence
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every test but the facts gate itself, which the facts-gate jobs run:
      # no `cfg` reaches it (its code, the gate module, resolution and the
      # presets hold none; the platform readers, icon loaders, font lookup
      # and watchers that do are not on its path), so its outcome is one
      # for every target and feature set. Its fixtures' tests run here.
      # The two tests of `from_port` over Breeze's files read them from the
      # source cache (breeze@6.8.2), which these jobs do not fetch: skipped
      # by name too.
      - run: >-
          cargo test -p native-theme ${{ matrix.flags }} -- --exact
          --skip facts_gate
          --skip palette::tests::from_port_of_breeze_light_is_kde_breezes_own_at_light
          --skip palette::tests::from_port_of_breeze_dark_is_kde_breezes_own_at_dark
      # Both connectors enable `system-icons` by default, and its icon code
      # imports the platform crates, so it must build alone on each platform.
      - name: Check system-icons alone
        if: runner.os != 'Linux' && matrix.flags == '--no-default-features'
        run: cargo check -p native-theme --no-default-features --features system-icons
      # The platform readers and icon loaders compile only on their own
      # target, so their dead code and unchecked results show only here.
      - name: Check all features, warnings denied
        if: runner.os != 'Linux' && matrix.flags == '--no-default-features'
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check -p native-theme --all-features

  # The facts gate (native-theme/tests/facts_gate.rs's `facts_gate`), once,
  # on Linux with the default features: its outcome depends on no target and
  # no feature (the test jobs' comment says why). Its work is split into as
  # many shards as the matrix has jobs (NT_FACTS_GATE_SHARD, each condition
  # vector checked by one shard alone, the rest recorded by the first),
  # each job one shard. Each job takes its shard from its place in the
  # matrix, so every shard runs once. A preset's
  # listed paths are found over all its vectors, so each shard writes those
  # it found (NT_FACTS_GATE_LISTED) and the facts-gate-listed job checks the
  # presets' `[pending]` tables against them all (NT_FACTS_GATE_MERGE);
  # `gate_shards_add_up` shows that the shards and that check together find
  # what the whole run finds.
  facts-gate:
    name: Facts gate ${{ matrix.shard }}
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/evidence
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The job's shard
        env:
          SHARD: ${{ matrix.shard }}
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          if [ "$SHARD" != "$((INDEX + 1))" ]; then
            echo "the matrix's shard $SHARD is not the job's place $((INDEX + 1)) of $TOTAL"
            exit 1
          fi
          echo "NT_FACTS_GATE_SHARD=$SHARD/$TOTAL" >>"$GITHUB_ENV"
          echo "NT_FACTS_GATE_LISTED=$RUNNER_TEMP/listed" >>"$GITHUB_ENV"
      - run: cargo test -p native-theme --test facts_gate -- --exact facts_gate
      # Written before the gate's verdict, so a failing shard's too.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: facts-gate-listed-${{ matrix.shard }}
          path: ${{ runner.temp }}/listed/
          if-no-files-found: error

  facts-gate-listed:
    name: Facts gate, the listed paths
    needs: facts-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: facts-gate-listed-*
          path: ${{ runner.temp }}/listed
          merge-multiple: true
      - run: cargo test -p native-theme --test facts_gate -- --exact facts_gate
        env:
          NT_FACTS_GATE_MERGE: ${{ runner.temp }}/listed

  features:
    name: Feature combinations
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (gpui)
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every crate's library with no default features, each feature alone and
      # all features; scripts/check_release.sh runs the same script. A crate
      # the 0.8.0 plan's transition breaks is skipped, one line each.
      - run: |
          skip=()
          skip+=(--skip native-theme-gpui)  # PLAN_EXCLUDED: feature combinations (native-theme-gpui)
          skip+=(--skip native-theme-iced)  # PLAN_EXCLUDED: feature combinations (native-theme-iced)
          skip+=(--skip native-theme-egui)  # PLAN_EXCLUDED: feature combinations (native-theme-egui)
          skip+=(--skip native-theme-egui-widgets)  # PLAN_EXCLUDED: feature combinations (native-theme-egui-widgets)
          skip+=(--skip native-theme-showcase-support)  # PLAN_EXCLUDED: feature combinations (native-theme-showcase-support)
          bash scripts/check_features.sh "${skip[@]}"

  # A lint can fire at an MSRV and not on stable (native-theme without its
  # Linux readers once warned of an unused binding at 1.95.0 alone), so the
  # whole job denies warnings, and native-theme is checked without its
  # readers, its default features, at its own MSRV too.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      # The crates the 0.8.0 plan's transition breaks leave the workspace
      # check, one line each, as scripts/check_release.sh's msrv_checks
      # takes them out.
      - run: |
          excluded=(--exclude native-theme-gpui --exclude native-theme-egui --exclude native-theme-egui-widgets)
          excluded+=(--exclude native-theme-iced)  # PLAN_EXCLUDED: check (native-theme-iced)
          excluded+=(--exclude native-theme-showcase-support)  # PLAN_EXCLUDED: check (native-theme-showcase-support)
          cargo check --workspace "${excluded[@]}" --all-features --locked
      - run: cargo check -p native-theme --locked
      # The connectors' toolchain: scripts/check_release.sh reads it from this
      # line, so it stays while their checks wait for M2.1.
      - uses: dtolnay/rust-toolchain@1.95.0
      # PLAN_EXCLUDED: MSRV +1.95.0, -D warnings (the egui crates, all features)
      # - run: cargo check -p native-theme-egui -p native-theme-egui-widgets --all-features --locked
      # - name: Install system dependencies (gpui)
      #   run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      # `--all-features` would turn on `gpui-fast`, which changes the GPUI
      # core: the default core and GPUI Fast are checked one at a time.
      # PLAN_EXCLUDED: MSRV +1.95.0, -D warnings (native-theme-gpui)
      # - run: cargo check -p native-theme-gpui --locked
      # PLAN_EXCLUDED: MSRV +1.95.0, -D warnings (native-theme-gpui, native, watch)
