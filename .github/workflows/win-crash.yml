name: win-crash diagnostics

on:
  push:
    branches: [win-crash]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    name: Diag ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "repro sta", mode: plain5, args: "winicons::tests::stock_icons_load_while_another_thread_uninitializes_an_sta --exact" }
          - { name: "repro mta", mode: plain5, args: "winicons::tests::stock_icons_load_while_another_thread_uninitializes_the_mta --exact" }
          - { name: "repro mta cdb", mode: cdb, args: "winicons::tests::stock_icons_load_while_another_thread_uninitializes_the_mta --exact" }
          - { name: "drop+stock", mode: plain5, args: "watch::tests::windows_subscribe_and_drop_returns winicons::tests::stock winicons::tests::load_by_name_stock_icon winicons::tests::rgba_dimensions_correct" }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/evidence
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the lib tests
        shell: bash
        run: |
          set -euo pipefail
          exe=$(cargo test -p native-theme --features windows,watch,system-icons --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' | tail -n1)
          echo "exe=$exe"
          echo "TEST_EXE=$exe" >> "$GITHUB_ENV"
      - name: Run (plain)
        if: matrix.mode == 'plain'
        shell: bash
        run: |
          "$TEST_EXE" ${{ matrix.args }}
      - name: Run (plain, five times)
        if: matrix.mode == 'plain5'
        shell: bash
        run: |
          set +e
          fails=0
          for i in 1 2 3 4 5; do
            "$TEST_EXE" ${{ matrix.args }} --nocapture
            st=$?
            echo "=== round $i status $st ==="
            [ "$st" = 0 ] || fails=$((fails + 1))
          done
          echo "=== failed rounds: $fails ==="
          [ "$fails" = 0 ]
      - name: Run (under cdb)
        if: matrix.mode == 'cdb'
        shell: bash
        env:
          _NT_SYMBOL_PATH: srv*C:\symbols*https://msdl.microsoft.com/download/symbols
        run: |
          set -uo pipefail
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          ls -la "$cdb"
          for i in 1 2 3; do
            echo "=== round $i ==="
            "$cdb" -G -lines -c 'sxd -c2 ".echo SECONDCHANCE_AV; .lastevent; r; kn 80; ~*kn 60; q" av; sxd -c2 ".echo SECONDCHANCE_SO; .lastevent; kn 80; q" sov; g' "$(cygpath -w "$TEST_EXE")" ${{ matrix.args }} </dev/null 2>&1 | grep -v '^ModLoad' | tail -n 4000
            st=${PIPESTATUS[0]}
            echo "=== round $i status $st ==="
          done
